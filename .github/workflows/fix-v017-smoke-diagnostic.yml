name: Fix v0.1.7 smoke diagnostic

on:
  push:
    branches:
      - agent/v0.1.7-minimap-floor-transform

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch smoke
        shell: bash
        run: |
          echo '' | base64 -d > /tmp/fix.py
          sed -i 's/p\.Read_text/p.read_text/' /tmp/fix.py
          python /tmp/fix.py
      - name: Commit and remove workflow
        shell: bash
        run: |
          rm .github/workflows/fix-v017-smoke-diagnostic.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Make MiniMap floor smoke deterministic"
          git push
