name: Release v0.1.1

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-v0.1.1.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      RELEASE_TAG: v0.1.1
      RELEASE_SHA: fc9d098c1312e837a205b5d08ba44ba6d516e779
      RELEASE_ASSET: Junhyun-Helper-v0.1.1-win-x64.zip

    steps:
      - name: Checkout exact release code
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_SHA }}
          submodules: recursive

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build desktop
        run: dotnet build src/JunhyunHelper.Desktop/JunhyunHelper.Desktop.csproj --configuration Release

      - name: Test core
        run: dotnet test tests/JunhyunHelper.Tests/JunhyunHelper.Tests.csproj --configuration Release

      - name: Publish and validate Windows x64 package
        shell: pwsh
        run: |
          dotnet publish src/JunhyunHelper.Desktop/JunhyunHelper.Desktop.csproj `
            --configuration Release `
            --runtime win-x64 `
            --self-contained true `
            --output artifacts/publish `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true `
            -p:PublishTrimmed=false `
            -p:PublishReadyToRun=false `
            -p:DebugType=None `
            -p:DebugSymbols=false

          Copy-Item packaging/FIRST_RUN_KO.txt artifacts/publish/FIRST_RUN_KO.txt

          $exe = 'artifacts/publish/준현 헬퍼.exe'
          foreach ($required in @($exe, 'artifacts/publish/FIRST_RUN_KO.txt', 'artifacts/publish/Assets/tarkov_data.db')) {
            if (-not (Test-Path $required)) { throw "Missing release file: $required" }
          }

          $productVersion = (Get-Item $exe).VersionInfo.ProductVersion
          Write-Host "ProductVersion=$productVersion"
          if (-not $productVersion.StartsWith('0.1.1', [StringComparison]::Ordinal)) {
            throw "Expected executable ProductVersion 0.1.1, got '$productVersion'."
          }

          $rootFiles = @(Get-ChildItem artifacts/publish -File)
          $unexpectedFiles = @($rootFiles | Where-Object { $_.Name -notin @('준현 헬퍼.exe', 'FIRST_RUN_KO.txt') })
          if ($unexpectedFiles.Count -gt 0) { throw "Unexpected root files: $($unexpectedFiles.Name -join ', ')" }
          $rootDirs = @(Get-ChildItem artifacts/publish -Directory)
          $unexpectedDirs = @($rootDirs | Where-Object { $_.Name -ne 'Assets' })
          if ($unexpectedDirs.Count -gt 0) { throw "Unexpected root directories: $($unexpectedDirs.Name -join ', ')" }
          if (Get-ChildItem artifacts/publish -Recurse -File -Filter *.pdb) { throw 'PDB leaked into release.' }

          foreach ($forbidden in @(
            'AutoUpdater.NET.dll',
            'Microsoft.Web.WebView2.Core.dll',
            'Microsoft.Web.WebView2.WinForms.dll',
            'Microsoft.Web.WebView2.Wpf.dll',
            'WebView2Loader.dll',
            'Westermo.GraphX.Controls.dll',
            'Westermo.GraphX.Common.dll',
            'QuikGraph.dll')) {
            if (Get-ChildItem artifacts/publish -Recurse -File -Filter $forbidden) {
              throw "Forbidden legacy dependency leaked into release: $forbidden"
            }
          }

      - name: Startup + Map + graceful shutdown smoke
        shell: pwsh
        env:
          JUNHYUNHELPER_MAP_SMOKE: '1'
        run: |
          $exe = (Resolve-Path 'artifacts/publish/준현 헬퍼.exe').Path
          $process = Start-Process -FilePath $exe -WorkingDirectory artifacts/publish -PassThru
          try {
            Start-Sleep -Seconds 12
            $process.Refresh()
            if ($process.HasExited) { throw "준현 헬퍼 exited during startup smoke: $($process.ExitCode)" }
            if (-not $process.CloseMainWindow()) { throw 'Could not request normal Main Window close.' }
            if (-not $process.WaitForExit(7000)) { throw 'Process did not exit after Main Window close.' }
            if (Test-Path 'artifacts/publish/Logs') { throw 'Runtime Logs folder was created beside EXE.' }
          }
          finally {
            $process.Refresh()
            if (-not $process.HasExited) { Stop-Process -Id $process.Id -Force }
          }

      - name: Package public asset
        shell: pwsh
        run: |
          if (Test-Path $env:RELEASE_ASSET) { Remove-Item $env:RELEASE_ASSET -Force }
          Compress-Archive -Path 'artifacts/publish/*' -DestinationPath $env:RELEASE_ASSET -CompressionLevel Optimal
          $hash = (Get-FileHash $env:RELEASE_ASSET -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $($env:RELEASE_ASSET)" | Set-Content SHA256SUMS.txt -Encoding ascii
          "RELEASE_ASSET_SHA256=$hash" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Public release SHA-256: $hash"

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          @'
          # 준현 헬퍼 v0.1.1

          최신 Escape from Tarkov 퀘스트 데이터에 맞춰 **선행/해금 조건 정확도**를 다시 점검한 패치 릴리즈입니다.

          ## 중요 — 기존 사용자
          v0.1.1로 교체한 뒤 프로그램 상단의 **`데이터 업데이트`를 한 번 실행해 주세요.**
          그러면 최신 온라인 데이터로 v5 Game Content를 다시 만들고 새 퀘스트 판정 규칙을 적용합니다.
          기존 프로필, 퀘스트 완료 기록, 인벤토리 등 `user.db`의 사용자 진행 데이터는 유지됩니다.

          ## 주요 수정
          - 현재 `taskRequirements`의 active / complete / failed 선행 조건을 최신 데이터로 재검증
          - Lightkeeper / BTR Driver / Ref 상인 접근 이후에만 가능한 후속 퀘스트가 너무 일찍 열리던 경우 수정
          - 최신 데이터의 `globalVariable` / `dialogue`처럼 프로그램이 확정할 수 없는 조건은 조용히 정확한 판정처럼 숨기지 않고 `판정 문제`에 표시
          - 시간 지연 퀘스트의 min/max delay 정보를 보존하되, 실제 게임 완료 시각을 알 수 없으므로 잘못된 가짜 카운트다운은 만들지 않음
          - Content snapshot schema v5

          ## 최신 데이터 전체 점검
          2026-08-15 기준 실제 온라인 데이터로 Quest뿐 아니라 Item / Trader / Map reference / Hideout / Ammo까지 전체 importer/validator를 통과했습니다.
          - regular: 517 quests
          - PvE: 513 quests
          - PvP-season: 490 quests
          - validation errors: 0
          - importer warnings: 0

          ## 실행
          `Junhyun-Helper-v0.1.1-win-x64.zip`을 압축 해제한 뒤 `준현 헬퍼.exe`를 실행하세요.
          Windows x64 portable / self-contained 빌드이며 별도 .NET 설치는 필요하지 않습니다.

          코드 서명은 아직 적용하지 않아 Windows SmartScreen 경고가 표시될 수 있습니다.
          '@ | Set-Content release-notes.md -Encoding utf8

          gh release view $env:RELEASE_TAG --repo '${{ github.repository }}' *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:RELEASE_TAG $env:RELEASE_ASSET SHA256SUMS.txt --clobber --repo '${{ github.repository }}'
            if ($LASTEXITCODE -ne 0) { throw 'Failed to upload v0.1.1 assets.' }
            gh release edit $env:RELEASE_TAG --target $env:RELEASE_SHA --title '준현 헬퍼 v0.1.1' --notes-file release-notes.md --repo '${{ github.repository }}'
            if ($LASTEXITCODE -ne 0) { throw 'Failed to update v0.1.1 release.' }
          } else {
            gh release create $env:RELEASE_TAG $env:RELEASE_ASSET SHA256SUMS.txt `
              --target $env:RELEASE_SHA `
              --title '준현 헬퍼 v0.1.1' `
              --notes-file release-notes.md `
              --repo '${{ github.repository }}'
            if ($LASTEXITCODE -ne 0) { throw 'Failed to create v0.1.1 release.' }
          }

      - name: Verify live public release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $releaseJson = gh release view $env:RELEASE_TAG --repo '${{ github.repository }}' --json url,isDraft,isPrerelease,tagName,name,assets,publishedAt,targetCommitish
          if ($LASTEXITCODE -ne 0) { throw 'Could not read v0.1.1 release.' }
          $release = $releaseJson | ConvertFrom-Json
          if ($release.isDraft -or $release.isPrerelease) { throw 'v0.1.1 is not a final public release.' }
          if ($release.tagName -ne $env:RELEASE_TAG) { throw "Unexpected tag $($release.tagName)" }

          $names = @($release.assets | ForEach-Object { $_.name })
          if ($names.Count -ne 2) { throw "Expected exactly two release assets, got $($names.Count): $($names -join ', ')" }
          foreach ($required in @($env:RELEASE_ASSET, 'SHA256SUMS.txt')) {
            if ($required -notin $names) { throw "Missing public release asset: $required" }
          }

          New-Item -ItemType Directory release-check -Force | Out-Null
          gh release download $env:RELEASE_TAG --repo '${{ github.repository }}' --pattern 'SHA256SUMS.txt' --dir release-check
          if ($LASTEXITCODE -ne 0) { throw 'Could not re-download SHA256SUMS.txt.' }
          $publishedHash = ((Get-Content release-check/SHA256SUMS.txt -Raw).Trim() -split '\s+')[0]
          if ($publishedHash -ne $env:RELEASE_ASSET_SHA256) {
            throw "Published checksum mismatch: $publishedHash != $env:RELEASE_ASSET_SHA256"
          }

          Write-Host "VERIFIED_RELEASE_URL=$($release.url)"
          Write-Host "VERIFIED_RELEASE_SHA256=$publishedHash"
