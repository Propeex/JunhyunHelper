name: Temporary post-fix live quest audit

on:
  push:
    branches:
      - fix/2026-08-17-usability-stability-pass

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Measure unresolved live availability gates
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $resolvedDialogueIds = [System.Collections.Generic.HashSet[string]]::new([System.StringComparer]::Ordinal)
          @(
            '657315ddab5a49b71f098853',
            '657315e270bb0b8dba00cc48',
            '657315e4a6af4ab4b50f3459',
            '59689fbd86f7740d137ebfc4',
            '596a0e1686f7741ddf17dbee',
            '596b36c586f77450d6045ad2',
            '5ac23c6186f7741247042bad',
            '5ae448bf86f7744d733e55ee',
            '5ae448f286f77448d73c0131',
            '5ae449c386f7744bde357697',
            '5d2495a886f77425cd51e403',
            '675c1570526ff496850895d9'
          ) | ForEach-Object { [void]$resolvedDialogueIds.Add($_) }

          foreach ($mode in @('regular', 'pve', 'pvp-season')) {
            $feed = Invoke-RestMethod -Uri "https://json.tarkov.dev/$mode/tasks"
            $collection = $feed.data.tasks
            $tasks = if ($collection -is [System.Array]) {
              @($collection)
            } else {
              @($collection.PSObject.Properties | ForEach-Object { $_.Value })
            }

            $globalQuestIds = [System.Collections.Generic.HashSet[string]]::new([System.StringComparer]::Ordinal)
            $delayQuestIds = [System.Collections.Generic.HashSet[string]]::new([System.StringComparer]::Ordinal)
            $dialogueQuestIds = [System.Collections.Generic.HashSet[string]]::new([System.StringComparer]::Ordinal)
            $residualDialogueQuestIds = [System.Collections.Generic.HashSet[string]]::new([System.StringComparer]::Ordinal)
            $otherUnknownQuestIds = [System.Collections.Generic.HashSet[string]]::new([System.StringComparer]::Ordinal)
            $postFixUnresolved = [System.Collections.Generic.HashSet[string]]::new([System.StringComparer]::Ordinal)

            foreach ($task in $tasks) {
              $id = [string]$task.id
              foreach ($requirement in @($task.otherRequirements)) {
                if ($null -eq $requirement) { continue }
                $type = [string]$requirement.type
                switch ($type) {
                  'globalVariable' {
                    [void]$globalQuestIds.Add($id)
                    [void]$postFixUnresolved.Add($id)
                  }
                  'dialogue' {
                    [void]$dialogueQuestIds.Add($id)
                    if (-not $resolvedDialogueIds.Contains($id)) {
                      [void]$residualDialogueQuestIds.Add($id)
                      [void]$postFixUnresolved.Add($id)
                    }
                  }
                  default {
                    [void]$otherUnknownQuestIds.Add($id)
                    [void]$postFixUnresolved.Add($id)
                  }
                }
              }

              $minDelay = if ($null -ne $task.availableDelaySecondsMin) { [int]$task.availableDelaySecondsMin } else { 0 }
              $maxDelay = if ($null -ne $task.availableDelaySecondsMax) { [int]$task.availableDelaySecondsMax } else { $minDelay }
              if ($minDelay -gt 0 -or $maxDelay -gt 0) {
                [void]$delayQuestIds.Add($id)
                [void]$postFixUnresolved.Add($id)
              }
            }

            $dialogueOverlapWithOther = @($dialogueQuestIds | Where-Object {
              $globalQuestIds.Contains($_) -or $delayQuestIds.Contains($_) -or $otherUnknownQuestIds.Contains($_)
            }).Count

            Write-Host "=== $mode ==="
            Write-Host "tasks=$($tasks.Count)"
            Write-Host "globalVariableQuests=$($globalQuestIds.Count)"
            Write-Host "delayQuests=$($delayQuestIds.Count)"
            Write-Host "dialogueQuests=$($dialogueQuestIds.Count)"
            Write-Host "resolvedKnownDialogueQuests=$(@($dialogueQuestIds | Where-Object { $resolvedDialogueIds.Contains($_) }).Count)"
            Write-Host "residualDialogueQuests=$($residualDialogueQuestIds.Count)"
            Write-Host "otherUnknownQuests=$($otherUnknownQuestIds.Count)"
            Write-Host "dialogueOverlapWithOther=$dialogueOverlapWithOther"
            Write-Host "postFixStructurallyUnresolvedQuests=$($postFixUnresolved.Count)"
          }
