name: Release v1.6.0

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-v1.6.0.yml'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      SOURCE_SHA: c58b5cd3b3128ff6dce5a2221a453bc56aa41c37
      VERSION: 1.6.0
      TAG: v1.6.0
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout exact product source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0

      - name: Checkout pinned public Map donor
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git config --local --unset-all http.https://github.com/.extraheader
          if ($LASTEXITCODE -notin @(0, 5)) {
            throw "Could not clear repository-scoped GitHub auth header (exit $LASTEXITCODE)."
          }
          git submodule sync --recursive
          if ($LASTEXITCODE -ne 0) { throw 'Could not synchronize submodule metadata.' }
          git submodule update --init --force --depth=1 --recursive
          if ($LASTEXITCODE -ne 0) { throw 'Could not checkout the pinned public Map donor.' }

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build and test exact source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet build src/JunhyunHelper.Desktop/JunhyunHelper.Desktop.csproj --configuration Release
          if ($LASTEXITCODE -ne 0) { throw 'Desktop Release build failed.' }
          dotnet test tests/JunhyunHelper.Tests/JunhyunHelper.Tests.csproj --configuration Release
          if ($LASTEXITCODE -ne 0) { throw 'Automated tests failed.' }

      - name: Publish and audit exact Windows package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet publish src/JunhyunHelper.Desktop/JunhyunHelper.Desktop.csproj `
            --configuration Release `
            --runtime win-x64 `
            --self-contained true `
            --output artifacts/publish `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true `
            -p:PublishTrimmed=false `
            -p:PublishReadyToRun=false `
            -p:DebugType=None `
            -p:DebugSymbols=false
          if ($LASTEXITCODE -ne 0) { throw 'Windows x64 publish failed.' }

          Copy-Item packaging/FIRST_RUN_KO.txt artifacts/publish/FIRST_RUN_KO.txt

          $required = @('준현 헬퍼.exe', 'FIRST_RUN_KO.txt', 'Assets/tarkov_data.db')
          foreach ($relative in $required) {
            if (-not (Test-Path (Join-Path artifacts/publish $relative))) {
              throw "Required published file was not produced: $relative"
            }
          }

          $exe = (Resolve-Path 'artifacts/publish/준현 헬퍼.exe').Path
          $productVersion = (Get-Item $exe).VersionInfo.ProductVersion
          $expectedProductVersion = "$env:VERSION+$env:SOURCE_SHA"
          if (-not [string]::Equals($productVersion, $expectedProductVersion, [System.StringComparison]::Ordinal)) {
            throw "ProductVersion '$productVersion' does not exactly match '$expectedProductVersion'."
          }

          $firstLine = Get-Content 'artifacts/publish/FIRST_RUN_KO.txt' -TotalCount 1
          $expectedFirstLine = "준현 헬퍼 v$env:VERSION — Windows x64"
          if (-not [string]::Equals($firstLine, $expectedFirstLine, [System.StringComparison]::Ordinal)) {
            throw "FIRST_RUN first line '$firstLine' does not match '$expectedFirstLine'."
          }

          $unexpectedRootFiles = @(Get-ChildItem artifacts/publish -File | Where-Object {
            $_.Name -notin @('준현 헬퍼.exe', 'FIRST_RUN_KO.txt')
          })
          if ($unexpectedRootFiles.Count -gt 0) {
            throw "Unexpected files exist beside the single-file executable: $($unexpectedRootFiles.Name -join ', ')"
          }
          $unexpectedRootDirs = @(Get-ChildItem artifacts/publish -Directory | Where-Object { $_.Name -ne 'Assets' })
          if ($unexpectedRootDirs.Count -gt 0) {
            throw "Unexpected release root directories: $($unexpectedRootDirs.Name -join ', ')"
          }
          if (Get-ChildItem artifacts/publish -Recurse -File -Filter *.pdb) {
            throw 'Release publish contains PDB files.'
          }
          $nested = @(Get-ChildItem artifacts/publish -Recurse -File | Where-Object { $_.Extension -in @('.zip', '.7z', '.rar') })
          if ($nested.Count -gt 0) { throw 'Release publish contains nested archives.' }

          Write-Host "Exact release source: $env:SOURCE_SHA"
          Write-Host "ProductVersion: $productVersion"

      - name: Pack stable and v1.5 bridge assets
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          ./packaging/New-ReleasePackage.ps1 `
            -PublishDirectory artifacts/publish `
            -OutputDirectory artifacts/release

          $stable = 'artifacts/release/준현 헬퍼.zip'
          $bridge = "artifacts/release/Junhyun-Helper-v$env:VERSION-win-x64.zip"
          $checksum = 'artifacts/release/SHA256SUMS.txt'
          foreach ($path in @($stable, $bridge, $checksum)) {
            if (-not (Test-Path $path)) { throw "Missing release asset: $path" }
          }

      - name: Packaged product smoke
        shell: pwsh
        env:
          JUNHYUNHELPER_MAP_SMOKE: '1'
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = (Resolve-Path 'artifacts/publish/준현 헬퍼.exe').Path
          $diagnostic = Join-Path $env:TEMP 'junhyun-map-smoke-error.txt'
          $success = Join-Path $env:TEMP 'junhyun-map-smoke-success.txt'
          $startupLog = Join-Path $env:LOCALAPPDATA 'JunhyunHelper/logs/startup.log'
          Remove-Item $diagnostic,$success,$startupLog -Force -ErrorAction SilentlyContinue

          $process = Start-Process -FilePath $exe -WorkingDirectory artifacts/publish -PassThru
          try {
            $deadline = (Get-Date).AddSeconds(75)
            while ((Get-Date) -lt $deadline -and -not (Test-Path $success)) {
              $process.Refresh()
              if (Test-Path $diagnostic) { throw "Product smoke failed: $(Get-Content $diagnostic -Raw)" }
              if ($process.HasExited) { throw "Product exited before smoke completion: $($process.ExitCode)" }
              Start-Sleep -Milliseconds 250
            }
            if (-not (Test-Path $success)) { throw 'Product smoke did not complete within 75 seconds.' }
            if (-not $process.CloseMainWindow()) { throw 'Could not request normal Main Window close.' }
            if (-not $process.WaitForExit(7000)) { throw 'Product did not terminate after normal close.' }
            if (Test-Path 'artifacts/publish/Logs') { throw 'Portable release root was polluted by a Logs directory.' }
          }
          finally {
            $process.Refresh()
            if (-not $process.HasExited) { Stop-Process -Id $process.Id -Force }
          }

      - name: Create or recover exact draft release
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $repo = $env:GITHUB_REPOSITORY

          $tagJson = gh api "repos/$repo/git/ref/tags/$env:TAG" 2>$null
          if ($LASTEXITCODE -eq 0) {
            $tag = $tagJson | ConvertFrom-Json
            if (-not [string]::Equals($tag.object.sha, $env:SOURCE_SHA, [System.StringComparison]::OrdinalIgnoreCase)) {
              throw "Existing tag $env:TAG points to $($tag.object.sha), expected $env:SOURCE_SHA."
            }
          }
          else {
            gh api --method POST "repos/$repo/git/refs" -f ref="refs/tags/$env:TAG" -f sha="$env:SOURCE_SHA" | Out-Null
            if ($LASTEXITCODE -ne 0) { throw "Could not create exact source tag $env:TAG." }
          }

          $releaseJson = gh release view $env:TAG --repo $repo --json isDraft,isPrerelease,tagName 2>$null
          if ($LASTEXITCODE -eq 0) {
            $release = $releaseJson | ConvertFrom-Json
            if (-not $release.isDraft -or $release.isPrerelease) {
              throw "Existing $env:TAG release is not the expected recoverable draft."
            }
          }
          else {
            gh release create $env:TAG `
              --repo $repo `
              --draft `
              --title "준현 헬퍼 v$env:VERSION" `
              --notes-file docs/RELEASE_NOTES_V1.6.0.md
            if ($LASTEXITCODE -ne 0) { throw 'Could not create draft release.' }
          }

          gh release upload $env:TAG `
            'artifacts/release/준현 헬퍼.zip' `
            "artifacts/release/Junhyun-Helper-v$env:VERSION-win-x64.zip" `
            'artifacts/release/SHA256SUMS.txt' `
            --repo $repo `
            --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Could not upload release assets.' }

      - name: Redownload and verify draft assets
        shell: pwsh
        env:
          JUNHYUNHELPER_MAP_SMOKE: '1'
        run: |
          $ErrorActionPreference = 'Stop'
          $repo = $env:GITHUB_REPOSITORY
          $download = 'artifacts/draft-redownload'
          New-Item -ItemType Directory -Path $download -Force | Out-Null
          gh release download $env:TAG --repo $repo --dir $download `
            --pattern '준현 헬퍼.zip' `
            --pattern "Junhyun-Helper-v$env:VERSION-win-x64.zip" `
            --pattern 'SHA256SUMS.txt'
          if ($LASTEXITCODE -ne 0) { throw 'Could not redownload draft assets.' }

          $stableOriginal = 'artifacts/release/준현 헬퍼.zip'
          $bridgeOriginal = "artifacts/release/Junhyun-Helper-v$env:VERSION-win-x64.zip"
          $stableDownloaded = Join-Path $download '준현 헬퍼.zip'
          $bridgeDownloaded = Join-Path $download "Junhyun-Helper-v$env:VERSION-win-x64.zip"
          $checksumDownloaded = Join-Path $download 'SHA256SUMS.txt'

          foreach ($pair in @(@($stableOriginal,$stableDownloaded), @($bridgeOriginal,$bridgeDownloaded))) {
            $left = (Get-FileHash $pair[0] -Algorithm SHA256).Hash.ToLowerInvariant()
            $right = (Get-FileHash $pair[1] -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($left -ne $right) { throw "Redownloaded release asset hash mismatch: $($pair[1])" }
          }

          $checksumLines = @(Get-Content $checksumDownloaded | Where-Object { -not [string]::IsNullOrWhiteSpace($_) })
          foreach ($packageName in @('준현 헬퍼.zip', "Junhyun-Helper-v$env:VERSION-win-x64.zip")) {
            $packagePath = Join-Path $download $packageName
            $actual = (Get-FileHash $packagePath -Algorithm SHA256).Hash.ToLowerInvariant()
            $line = $checksumLines | Where-Object {
              $_ -match '^([0-9a-fA-F]{64})\s+(.+)$' -and [string]::Equals($Matches[2], $packageName, [System.StringComparison]::Ordinal)
            }
            if (@($line).Count -ne 1) { throw "Checksum entry missing or duplicated for $packageName." }
            if ($line -notmatch '^([0-9a-fA-F]{64})\s+(.+)$') { throw "Malformed checksum entry for $packageName." }
            if ($Matches[1].ToLowerInvariant() -ne $actual) { throw "Checksum mismatch for $packageName." }
          }

          $stableExtract = 'artifacts/stable-redownload'
          $bridgeExtract = 'artifacts/bridge-redownload'
          Expand-Archive -LiteralPath $stableDownloaded -DestinationPath $stableExtract -Force
          Expand-Archive -LiteralPath $bridgeDownloaded -DestinationPath $bridgeExtract -Force
          $stableRoot = Join-Path $stableExtract '준현 헬퍼'
          foreach ($relative in @('준현 헬퍼.exe','FIRST_RUN_KO.txt','Assets/tarkov_data.db')) {
            if (-not (Test-Path (Join-Path $stableRoot $relative))) { throw "Stable ZIP missing $relative." }
            if (-not (Test-Path (Join-Path $bridgeExtract $relative))) { throw "Bridge ZIP missing $relative." }
          }

          function Get-PayloadManifest([string]$Root) {
            @(Get-ChildItem $Root -Recurse -File | ForEach-Object {
              $relative = $_.FullName.Substring($Root.Length).TrimStart('\\','/').Replace('\\','/')
              [pscustomobject]@{
                Path = $relative
                Length = $_.Length
                Hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
              }
            } | Sort-Object Path)
          }
          $stableManifest = Get-PayloadManifest $stableRoot
          $bridgeManifest = Get-PayloadManifest $bridgeExtract
          if (($stableManifest | ConvertTo-Json -Compress) -ne ($bridgeManifest | ConvertTo-Json -Compress)) {
            throw 'Stable and v1.5 bridge ZIPs do not contain identical product payloads.'
          }

          $exe = (Resolve-Path (Join-Path $stableRoot '준현 헬퍼.exe')).Path
          $productVersion = (Get-Item $exe).VersionInfo.ProductVersion
          $expectedProductVersion = "$env:VERSION+$env:SOURCE_SHA"
          if ($productVersion -ne $expectedProductVersion) { throw "Redownloaded ProductVersion mismatch: $productVersion" }
          $firstLine = Get-Content (Join-Path $stableRoot 'FIRST_RUN_KO.txt') -TotalCount 1
          if ($firstLine -ne "준현 헬퍼 v$env:VERSION — Windows x64") { throw 'Redownloaded FIRST_RUN identity mismatch.' }
          if (Get-ChildItem $stableRoot -Recurse -File -Filter *.pdb) { throw 'Stable public candidate contains PDBs.' }
          $nested = @(Get-ChildItem $stableRoot -Recurse -File | Where-Object { $_.Extension -in @('.zip','.7z','.rar') })
          if ($nested.Count -gt 0) { throw 'Stable public candidate contains nested archives.' }

          $diagnostic = Join-Path $env:TEMP 'junhyun-map-smoke-error.txt'
          $success = Join-Path $env:TEMP 'junhyun-map-smoke-success.txt'
          Remove-Item $diagnostic,$success -Force -ErrorAction SilentlyContinue
          $process = Start-Process -FilePath $exe -WorkingDirectory $stableRoot -PassThru
          try {
            $deadline = (Get-Date).AddSeconds(75)
            while ((Get-Date) -lt $deadline -and -not (Test-Path $success)) {
              $process.Refresh()
              if (Test-Path $diagnostic) { throw "Redownloaded EXE smoke failed: $(Get-Content $diagnostic -Raw)" }
              if ($process.HasExited) { throw "Redownloaded EXE exited early: $($process.ExitCode)" }
              Start-Sleep -Milliseconds 250
            }
            if (-not (Test-Path $success)) { throw 'Redownloaded EXE smoke timed out.' }
            if (-not $process.CloseMainWindow()) { throw 'Could not normally close redownloaded EXE.' }
            if (-not $process.WaitForExit(7000)) { throw 'Redownloaded EXE did not terminate after close.' }
            if (Test-Path (Join-Path $stableRoot 'Logs')) { throw 'Redownloaded portable root was polluted.' }
          }
          finally {
            $process.Refresh()
            if (-not $process.HasExited) { Stop-Process -Id $process.Id -Force }
          }

          $stableHash = (Get-FileHash $stableDownloaded -Algorithm SHA256).Hash.ToLowerInvariant()
          $bridgeHash = (Get-FileHash $bridgeDownloaded -Algorithm SHA256).Hash.ToLowerInvariant()
          $status = [ordered]@{
            version = $env:VERSION
            source_sha = $env:SOURCE_SHA
            stable_asset = '준현 헬퍼.zip'
            stable_bytes = (Get-Item $stableDownloaded).Length
            stable_sha256 = $stableHash
            bridge_asset = "Junhyun-Helper-v$env:VERSION-win-x64.zip"
            bridge_bytes = (Get-Item $bridgeDownloaded).Length
            bridge_sha256 = $bridgeHash
            product_version = $productVersion
            draft_redownload_verified = $true
          }
          $status | ConvertTo-Json | Set-Content 'artifacts/release-controller-status.json' -Encoding utf8
          $status | Format-List

      - name: Publish stable latest
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          gh release edit $env:TAG --repo $env:GITHUB_REPOSITORY --draft=false --latest
          if ($LASTEXITCODE -ne 0) { throw 'Could not publish v1.6.0 as stable/latest.' }

      - name: Upload controller status
        uses: actions/upload-artifact@v4
        with:
          name: v1.6.0-release-controller-status
          path: artifacts/release-controller-status.json
          if-no-files-found: error
          retention-days: 14
