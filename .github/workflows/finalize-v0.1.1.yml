name: Finalize v0.1.1 Release Docs

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/finalize-v0.1.1.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Finalize official release state
        shell: python
        run: |
          from pathlib import Path

          release_url = 'https://github.com/Propeex/JunhyunHelper/releases/tag/v0.1.1'
          asset_name = 'Junhyun-Helper-v0.1.1-win-x64.zip'
          asset_sha = '91394101c5011b833c2810d8857fe2e9fd59b9f42f8710b90a899fe8169f0b54'

          readme_path = Path('README.md')
          readme = readme_path.read_text(encoding='utf-8')
          replacements = {
              '**v0.1.0 RELEASED — Windows x64**': '**v0.1.1 RELEASED — Windows x64**',
              '**공개 다운로드:** [준현 헬퍼 v0.1.0 GitHub Release](https://github.com/Propeex/JunhyunHelper/releases/tag/v0.1.0)': f'**공개 다운로드:** [준현 헬퍼 v0.1.1 GitHub Release]({release_url})',
              'Windows 배포 파일: `Junhyun-Helper-v0.1.0-win-x64.zip`': f'Windows 배포 파일: `{asset_name}`',
              'v0.1.0 공식 릴리즈 기록: [`docs/RELEASE_0.1.0.md`](docs/RELEASE_0.1.0.md)': 'v0.1.1 공식 릴리즈 기록: [`docs/RELEASE_0.1.1.md`](docs/RELEASE_0.1.1.md)',
              'GitHub Release에서 `Junhyun-Helper-v0.1.0-win-x64.zip`을': f'GitHub Release에서 `{asset_name}`을',
              'Quest/Hideout/Item/Ammo의 온라인 Game Content update와 Map artwork/config bundle update는 별도 시스템입니다. v0.1.0에서는 검증된 Map bundle을 배포물에 포함합니다.': 'Quest/Hideout/Item/Ammo의 온라인 Game Content update와 Map artwork/config bundle update는 별도 시스템입니다. 현재 릴리즈에는 검증된 Map bundle을 배포물에 포함합니다.',
              '## v0.1.0 검증': '## v0.1.1 검증',
              '공식 v0.1.0 배포물은 다음 검증을 통과했습니다.': '공식 v0.1.1 배포물은 다음 검증을 통과했습니다.',
              'Core/Application/Infrastructure 자동 테스트 — 163 passed / 0 failed': 'Core/Application/Infrastructure 자동 테스트 — 173 passed / 0 failed',
              'f3c1a4208fc70b7ec7fb6612933de9d383e4c54e84a7352f529dc7de21550f91': asset_sha,
          }
          for old, new in replacements.items():
              if old not in readme:
                  raise SystemExit(f'README marker missing: {old}')
              readme = readme.replace(old, new, 1)
          readme = readme.replace(
              '10. [`docs/GITHUB_RELEASE_0.1.0.md`](docs/GITHUB_RELEASE_0.1.0.md) — 실제 GitHub Release 검증 기록',
              '10. [`docs/QUEST_PREREQUISITE_AUDIT_2026-08-15.md`](docs/QUEST_PREREQUISITE_AUDIT_2026-08-15.md) — 최신 Quest 선행/해금 조건 감사\n11. [`docs/RELEASE_0.1.1.md`](docs/RELEASE_0.1.1.md) — v0.1.1 릴리즈 기록\n12. [`docs/GITHUB_RELEASE_0.1.0.md`](docs/GITHUB_RELEASE_0.1.0.md) — v0.1.0 공개 릴리즈 검증 기록')
          upgrade_note = '''\n> **v0.1.0에서 업그레이드하는 경우:** v0.1.1을 처음 실행한 뒤 상단 **`데이터 업데이트`를 한 번 실행**해 주세요. 최신 Quest 판정 규칙이 포함된 v5 Game Content를 재구축합니다. 기존 프로필/완료 기록/인벤토리(`user.db`)는 유지됩니다.\n'''
          marker = f'Windows 배포 파일: `{asset_name}`\n'
          if upgrade_note.strip() not in readme:
              readme = readme.replace(marker, marker + upgrade_note, 1)
          readme_path.write_text(readme, encoding='utf-8')

          product_path = Path('docs/PRODUCT.md')
          product = product_path.read_text(encoding='utf-8')
          old_status = '**v0.1.0 RELEASED — 2026-08-10 / v0.1.1 QUEST CORRECTNESS CANDIDATE — 2026-08-15**'
          if old_status not in product:
              raise SystemExit('PRODUCT release status marker missing')
          product = product.replace(old_status, '**v0.1.1 RELEASED — 2026-08-15**', 1)
          product = product.replace(
              'PR #74 — Scanner placeholder 복구 / 준현 헬퍼 이름 / single-file packaging',
              'PR #74 — Scanner placeholder 복구 / 준현 헬퍼 이름 / single-file packaging\nPR #75 — current Quest prerequisite / availability correctness\nPR #76 — v0.1.1 Windows version metadata',
              1)
          product = product.replace(
              '상세 릴리즈 기록: `docs/RELEASE_0.1.0.md`',
              'v0.1.0 기록: `docs/RELEASE_0.1.0.md`\n\nv0.1.1 기록: `docs/RELEASE_0.1.1.md`',
              1)
          product = product.replace(
              'v0.1.1 후보에서는 2026-08-15 최신 live 데이터로 Quest prerequisite/availability를 재감사했습니다.',
              'v0.1.1에서는 2026-08-15 최신 live 데이터로 Quest prerequisite/availability를 재감사했습니다.',
              1)
          if 'v0.1.1 공개 Release:' not in product:
              product = product.replace(
                  '현재 상세 상태는 `docs/STATE.md`를 기준으로 합니다.',
                  f'v0.1.1 공개 Release: `{release_url}` / Windows ZIP SHA-256 `{asset_sha}`.\n\n현재 상세 상태는 `docs/STATE.md`를 기준으로 합니다.',
                  1)
          product_path.write_text(product, encoding='utf-8')

          state = f'''# STATE — 현재 프로젝트 상태

> 새 대화/새 개발자는 이 문서를 먼저 읽습니다. 대화 기억이 아니라 저장소의 공식 문서와 코드가 프로젝트의 기준입니다.

## 현재 상태

**v0.1.1 RELEASED — `준현 헬퍼` Windows x64 single-file portable**

릴리즈일: **2026-08-15**

```text
Quest correctness: PR #75 MERGED
version metadata: PR #76 MERGED
release code baseline: fc9d098c1312e837a205b5d08ba44ba6d516e779
release workflow run: 31821096591 — SUCCESS
public asset: {asset_name}
public SHA-256: {asset_sha}
release: {release_url}
```

현재 확인된 기능/패키징 blocker는 없습니다.

## v0.1.1 Quest 정확도 수정

- 현재 `taskRequirements`의 `active / complete / failed` 상태 모델을 최신 live source로 재검증
- prerequisite missing/self/duplicate reference: 0
- Lightkeeper / BTR Driver / Ref 상인 접근 이후 후속 Quest가 너무 일찍 열릴 수 있던 공백 보강
- source가 의미를 완전히 제공하지 않는 `globalVariable` / `dialogue` 조건은 추측하지 않고 기존 `판정 문제`에 원래 Indeterminate 진단을 보존
- 각 GameMode 13개의 `availableDelaySecondsMin/Max`를 canonical metadata에 보존
- 실제 게임 완료 시각을 알 수 없으므로 UI 완료 클릭 시각으로 가짜 countdown을 만들지 않음
- Content snapshot schema: **v5**
- v3/v4는 offline last-known-good read 유지
- `user.db` schema/progress는 변경하지 않음

상세 감사: `docs/QUEST_PREREQUISITE_AUDIT_2026-08-15.md`

## 2026-08-15 최신 데이터 전체 검증

실제 product importer/validator 결과:

