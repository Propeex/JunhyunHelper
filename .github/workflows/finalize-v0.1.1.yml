## 사용자 업그레이드 정책

**v0.1.0 사용자는 v0.1.1로 교체한 뒤 상단 `데이터 업데이트`를 한 번 실행합니다.**

그러면 현재 online source에서 v5 Game Content를 새로 만들고 최신 Quest availability semantics를 적용합니다. `%LocalAppData%/JunhyunHelper/user.db`의 Profile / Quest 완료 / Inventory / Hideout 진행은 그대로 유지됩니다.

## 제품 기능 상태

| 영역 | 상태 |
|---|---|
| Profile | 구현 완료 |
| Quest | 구현 완료 / v0.1.1 current live prerequisite audit 반영 |
| Hideout | 구현 완료 / current live validation 통과 |
| Needed Items / Inventory | 구현 완료 |
| Ammo | 구현 완료 / current live validation 통과 |
| Map + MiniMap | 구현 완료 / Windows 실사용 및 release smoke 검증 |
| Scanner | `준비 중` placeholder 탭 유지 / 실제 기능 PRODUCT OPEN |

## 핵심 데이터 원칙

```text
online source
→ download
→ external shape/semantic validation
→ canonical transform
→ candidate DB
→ relationship/read-back validation
→ active swap
→ User Progress와 결합
```

실패 candidate는 last-known-good active content를 덮지 않으며 Game Content update는 `user.db`를 삭제/덮어쓰지 않습니다. Runtime GPT/AI 의존성은 없습니다.

## Map 기준

Map subsystem은 독립이고 Quest만 JunhyunHelper current profile/content와 연결합니다. pinned submodule revision은 `d933792b6042a51cea38dc44b686a096fe30de67`입니다. 상세는 `docs/MAP_PRODUCT_REQUIREMENTS.md`를 따릅니다.

## 현재 공개 릴리즈

```text
v0.1.1
{release_url}
asset: {asset_name}
SHA-256: {asset_sha}
```

## 비차단 후속 범위

- Scanner 실제 기능 설계/구현
- Map artwork/config/general-marker atomic bundle updater
- code signing / installer / application updater
- user.db backup/restore UX
- repository license / third-party notice 정책
'''
          Path('docs/STATE.md').write_text(state, encoding='utf-8')

          release_doc = f'''# 준현 헬퍼 v0.1.1

Release date: **2026-08-15**

Status: **RELEASED / PUBLIC GITHUB RELEASE VERIFIED**

## 공개 다운로드

GitHub Release:

{release_url}

Windows x64 asset:

```text
{asset_name}
SHA-256: {asset_sha}
```

Release는 draft/prerelease가 아닌 정식 공개 상태이며 Windows ZIP과 `SHA256SUMS.txt` 두 asset만 게시합니다.

## 기존 v0.1.0 사용자

v0.1.1 설치 후 프로그램 상단 **`데이터 업데이트`를 한 번 실행**합니다. 최신 온라인 source에서 Content schema v5를 재구축합니다. `user.db`는 별도 저장소이므로 Profile, Quest 완료 기록, Inventory, Hideout 진행은 유지됩니다.

## 수정 내용

- current live `taskRequirements` (`active / complete / failed`) 재검증
- Lightkeeper / BTR Driver / Ref 상인 접근 gate를 current GameMode에 검증된 unlock Quest가 존재할 때 Complete prerequisite로 보강
- opaque `globalVariable` / `dialogue` availability를 임의 추정하지 않고 `판정 문제`에 Indeterminate 진단 유지
- timed Quest의 `availableDelaySecondsMin/Max` canonical 보존
- 실제 인게임 완료 시각을 모르는 상태에서 가짜 delay countdown을 생성하지 않음
- Content snapshot schema v5

## live source 감사

2026-08-15 실제 online source를 product importer/validator로 전부 통과시켰습니다.

| GameMode | Quest | Item | Trader | Map | Hideout | Ammo |
|---|---:|---:|---:|---:|---:|---:|
| regular | 517 | 5312 | 16 | 17 | 26 | 200 |
| pve | 513 | 5312 | 16 | 17 | 26 | 200 |
| pvp-season | 490 | 5312 | 16 | 17 | 26 | 200 |

- validation errors: 0
- importer warnings: 0
- prerequisite missing/self/duplicate references: 0

상세: `docs/QUEST_PREREQUISITE_AUDIT_2026-08-15.md`

