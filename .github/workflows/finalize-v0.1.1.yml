'''
          Path('docs/RELEASE_0.1.1.md').write_text(release_doc, encoding='utf-8')

          for path in [
              '.github/workflows/release-v0.1.1.yml',
              '.github/workflows/finalize-v0.1.1.yml',
          ]:
              Path(path).unlink(missing_ok=True)

      - name: Commit finalized release docs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Finalize public v0.1.1 release state'
          git push origin HEAD:main
