name: Release v1.7.0

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-v1.7.0.yml'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      SOURCE_SHA: 56e12342e3490fd0defa5f327a03d20d4f32b3a6
      VERSION: 1.7.0
      TAG: v1.7.0
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout exact product source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0

      - name: Checkout pinned public Map donor
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git config --local --unset-all http.https://github.com/.extraheader
          if ($LASTEXITCODE -notin @(0, 5)) { throw "Could not clear GitHub auth header (exit $LASTEXITCODE)." }
          git submodule sync --recursive
          if ($LASTEXITCODE -ne 0) { throw 'Could not synchronize submodule metadata.' }
          git submodule update --init --force --depth=1 --recursive
          if ($LASTEXITCODE -ne 0) { throw 'Could not checkout the pinned public Map donor.' }

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Verify exact source identity
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          [xml]$project = Get-Content 'src/JunhyunHelper.Desktop/JunhyunHelper.Desktop.csproj'
          $version = [string]($project.Project.PropertyGroup.Version | Select-Object -First 1)
          if ($version -ne $env:VERSION) { throw "Source project version '$version' is not '$env:VERSION'." }
          $firstLine = Get-Content 'packaging/FIRST_RUN_KO.txt' -TotalCount 1
          if ($firstLine -ne "준현 헬퍼 v$env:VERSION — Windows x64") { throw "FIRST_RUN identity mismatch: $firstLine" }
          $notes = "docs/RELEASE_NOTES_V$env:VERSION.md"
          if (-not (Test-Path $notes)) { throw "Release notes are missing: $notes" }
          $heading = Get-Content $notes -TotalCount 1
          if ($heading -ne "# 준현 헬퍼 v$env:VERSION") { throw "Release notes identity mismatch: $heading" }
          $actualSource = (git rev-parse HEAD).Trim()
          if ($actualSource -ne $env:SOURCE_SHA) { throw "Checked out '$actualSource', expected '$env:SOURCE_SHA'." }
          Write-Host "Exact product source: $actualSource"

      - name: Build and test exact source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Path artifacts/test-results -Force | Out-Null
          dotnet build src/JunhyunHelper.Desktop/JunhyunHelper.Desktop.csproj --configuration Release
          if ($LASTEXITCODE -ne 0) { throw 'Desktop Release build failed.' }
          dotnet test tests/JunhyunHelper.Tests/JunhyunHelper.Tests.csproj `
            --configuration Release `
            --logger 'trx;LogFileName=v1.7.0.trx' `
            --results-directory artifacts/test-results
          if ($LASTEXITCODE -ne 0) { throw 'Automated tests failed.' }
          [xml]$trx = Get-Content 'artifacts/test-results/v1.7.0.trx'
          $counters = $trx.TestRun.ResultSummary.Counters
          $total = [int]$counters.total
          $passed = [int]$counters.passed
          $failed = [int]$counters.failed
          $notExecuted = [int]$counters.notExecuted
          if ($total -ne 348 -or $passed -ne 348 -or $failed -ne 0 -or $notExecuted -ne 0) {
            throw "Unexpected test gate: total=$total passed=$passed failed=$failed notExecuted=$notExecuted"
          }
          Write-Host 'Exact-source test gate: 348 passed / 0 failed / 0 skipped.'

      - name: Publish and audit exact Windows package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet publish src/JunhyunHelper.Desktop/JunhyunHelper.Desktop.csproj `
            --configuration Release `
            --runtime win-x64 `
            --self-contained true `
            --output artifacts/publish `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true `
            -p:PublishTrimmed=false `
            -p:PublishReadyToRun=false `
            -p:DebugType=None `
            -p:DebugSymbols=false
          if ($LASTEXITCODE -ne 0) { throw 'Windows x64 publish failed.' }
          Copy-Item packaging/FIRST_RUN_KO.txt artifacts/publish/FIRST_RUN_KO.txt
          foreach ($relative in @('준현 헬퍼.exe','FIRST_RUN_KO.txt','Assets/tarkov_data.db')) {
            if (-not (Test-Path (Join-Path artifacts/publish $relative))) { throw "Required published file is missing: $relative" }
          }
          $exe = (Resolve-Path 'artifacts/publish/준현 헬퍼.exe').Path
          $productVersion = (Get-Item $exe).VersionInfo.ProductVersion
          $expected = "$env:VERSION+$env:SOURCE_SHA"
          if ($productVersion -ne $expected) { throw "ProductVersion '$productVersion' does not exactly match '$expected'." }
          $firstLine = Get-Content 'artifacts/publish/FIRST_RUN_KO.txt' -TotalCount 1
          if ($firstLine -ne "준현 헬퍼 v$env:VERSION — Windows x64") { throw "Published FIRST_RUN identity mismatch: $firstLine" }
          $unexpectedRootFiles = @(Get-ChildItem artifacts/publish -File | Where-Object { $_.Name -notin @('준현 헬퍼.exe','FIRST_RUN_KO.txt') })
          if ($unexpectedRootFiles.Count -gt 0) { throw "Unexpected release-root files: $($unexpectedRootFiles.Name -join ', ')" }
          $unexpectedRootDirs = @(Get-ChildItem artifacts/publish -Directory | Where-Object { $_.Name -ne 'Assets' })
          if ($unexpectedRootDirs.Count -gt 0) { throw "Unexpected release-root directories: $($unexpectedRootDirs.Name -join ', ')" }
          if (Get-ChildItem artifacts/publish -Recurse -File -Filter *.pdb) { throw 'Release publish contains PDB files.' }
          $nested = @(Get-ChildItem artifacts/publish -Recurse -File | Where-Object { $_.Extension -in @('.zip','.7z','.rar') })
          if ($nested.Count -gt 0) { throw 'Release publish contains nested archives.' }
          foreach ($forbidden in @('AutoUpdater.NET.dll','Microsoft.Web.WebView2.Core.dll','Microsoft.Web.WebView2.WinForms.dll','Microsoft.Web.WebView2.Wpf.dll','WebView2Loader.dll','Westermo.GraphX.Controls.dll','Westermo.GraphX.Common.dll','QuikGraph.dll')) {
            if (Get-ChildItem artifacts/publish -Recurse -File -Filter $forbidden) { throw "Unused legacy dependency leaked into release: $forbidden" }
          }
          Write-Host "ProductVersion: $productVersion"

      - name: Exact packaged-product smoke
        shell: pwsh
        env:
          JUNHYUNHELPER_MAP_SMOKE: '1'
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = (Resolve-Path 'artifacts/publish/준현 헬퍼.exe').Path
          $diagnostic = Join-Path $env:TEMP 'junhyun-map-smoke-error.txt'
          $success = Join-Path $env:TEMP 'junhyun-map-smoke-success.txt'
          $startupLog = Join-Path $env:LOCALAPPDATA 'JunhyunHelper/logs/startup.log'
          Remove-Item $diagnostic,$success,$startupLog -Force -ErrorAction SilentlyContinue
          $process = Start-Process -FilePath $exe -WorkingDirectory artifacts/publish -PassThru
          try {
            $deadline = (Get-Date).AddSeconds(75)
            while ((Get-Date) -lt $deadline -and -not (Test-Path $success)) {
              $process.Refresh()
              if (Test-Path $diagnostic) { throw "Product smoke failed: $(Get-Content $diagnostic -Raw)" }
              if ($process.HasExited) { throw "Product exited before smoke completion: $($process.ExitCode)" }
              Start-Sleep -Milliseconds 250
            }
            if (-not (Test-Path $success)) { throw 'Product smoke did not complete within 75 seconds.' }
            if (-not $process.CloseMainWindow()) { throw 'Could not request normal Main Window close.' }
            if (-not $process.WaitForExit(7000)) { throw 'Product did not terminate after normal close.' }
            if (Test-Path 'artifacts/publish/Logs') { throw 'Portable release root was polluted by Logs.' }
          }
          finally {
            $process.Refresh()
            if (-not $process.HasExited) { Stop-Process -Id $process.Id -Force }
          }

      - name: Build and verify stable package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          ./packaging/New-ReleasePackage.ps1 -PublishDirectory artifacts/publish -OutputDirectory artifacts/release
          $stable = 'artifacts/release/Junhyun-Helper.zip'
          $checksums = 'artifacts/release/SHA256SUMS.txt'
          foreach ($path in @($stable,$checksums)) { if (-not (Test-Path $path)) { throw "Missing release artifact: $path" } }
          $lines = @(Get-Content $checksums | Where-Object { -not [string]::IsNullOrWhiteSpace($_) })
          if ($lines.Count -ne 1 -or $lines[0] -notmatch '^([0-9a-fA-F]{64})\s+Junhyun-Helper\.zip$') { throw 'SHA256SUMS.txt must contain exactly the stable package entry.' }
          $actual = (Get-FileHash $stable -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($Matches[1].ToLowerInvariant() -ne $actual) { throw 'Stable package checksum manifest mismatch.' }
          Write-Host "Stable bytes: $((Get-Item $stable).Length)"
          Write-Host "Stable SHA-256: $actual"

      - name: Create or recover exact draft release
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $repo = $env:GITHUB_REPOSITORY
          $tagJson = gh api "repos/$repo/git/ref/tags/$env:TAG" 2>$null
          if ($LASTEXITCODE -eq 0) {
            $tag = $tagJson | ConvertFrom-Json
            if ($tag.object.sha -ne $env:SOURCE_SHA) { throw "Existing tag points to $($tag.object.sha), expected $env:SOURCE_SHA." }
          }
          else {
            gh api --method POST "repos/$repo/git/refs" -f ref="refs/tags/$env:TAG" -f sha="$env:SOURCE_SHA" | Out-Null
            if ($LASTEXITCODE -ne 0) { throw "Could not create exact-source tag $env:TAG." }
          }
          $releaseJson = gh release view $env:TAG --repo $repo --json isDraft,isPrerelease,tagName 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $env:TAG --repo $repo --draft --title "준현 헬퍼 v$env:VERSION" --notes-file "docs/RELEASE_NOTES_V$env:VERSION.md"
            if ($LASTEXITCODE -ne 0) { throw 'Could not create draft release.' }
            $state = 'draft'
          }
          else {
            $release = $releaseJson | ConvertFrom-Json
            if ($release.isDraft) { $state = 'draft' }
            elseif ($release.isPrerelease) { $state = 'prerelease' }
            else { $state = 'stable' }
          }
          "RELEASE_STATE=$state" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Release recovery state: $state"

      - name: Upload and verify draft assets
        if: env.RELEASE_STATE == 'draft'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $repo = $env:GITHUB_REPOSITORY
          gh release upload $env:TAG 'artifacts/release/Junhyun-Helper.zip' 'artifacts/release/SHA256SUMS.txt' --repo $repo --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Could not upload draft release assets.' }
          $download = 'artifacts/draft-redownload'
          New-Item -ItemType Directory -Path $download -Force | Out-Null
          gh release download $env:TAG --repo $repo --dir $download
          if ($LASTEXITCODE -ne 0) { throw 'Could not redownload draft release assets.' }
          foreach ($name in @('Junhyun-Helper.zip','SHA256SUMS.txt')) {
            $left = (Get-FileHash (Join-Path 'artifacts/release' $name) -Algorithm SHA256).Hash.ToLowerInvariant()
            $right = (Get-FileHash (Join-Path $download $name) -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($left -ne $right) { throw "Draft asset round-trip mismatch: $name" }
          }
          gh release edit $env:TAG --repo $repo --draft=false --prerelease
          if ($LASTEXITCODE -ne 0) { throw 'Could not publish the verified draft as a prerelease for public verification.' }
          "RELEASE_STATE=prerelease" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Anonymous public redownload and product verification
        shell: pwsh
        env:
          JUNHYUNHELPER_MAP_SMOKE: '1'
        run: |
          $ErrorActionPreference = 'Stop'
          $public = 'artifacts/public-redownload'
          New-Item -ItemType Directory -Path $public -Force | Out-Null
          $base = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/$env:TAG"
          function Get-PublicAsset([string]$Name) {
            $target = Join-Path $public $Name
            for ($attempt = 1; $attempt -le 12; $attempt++) {
              try {
                Invoke-WebRequest -Uri "$base/$Name" -OutFile $target -MaximumRedirection 10 -TimeoutSec 30
                if ((Test-Path $target) -and (Get-Item $target).Length -gt 0) { return $target }
              }
              catch {
                if ($attempt -eq 12) { throw }
              }
              Start-Sleep -Seconds 5
            }
            throw "Could not anonymously download public asset '$Name'."
          }
          $stableDownloaded = Get-PublicAsset 'Junhyun-Helper.zip'
          $checksumDownloaded = Get-PublicAsset 'SHA256SUMS.txt'
          $localStable = 'artifacts/release/Junhyun-Helper.zip'
          $localHash = (Get-FileHash $localStable -Algorithm SHA256).Hash.ToLowerInvariant()
          $publicHash = (Get-FileHash $stableDownloaded -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($localHash -ne $publicHash) { throw 'Public stable package hash differs from the exact-source package.' }
          if ((Get-Item $localStable).Length -ne (Get-Item $stableDownloaded).Length) { throw 'Public stable package byte size differs from the exact-source package.' }
          $lines = @(Get-Content $checksumDownloaded | Where-Object { -not [string]::IsNullOrWhiteSpace($_) })
          if ($lines.Count -ne 1 -or $lines[0] -notmatch '^([0-9a-fA-F]{64})\s+Junhyun-Helper\.zip$') { throw 'Public checksum manifest is invalid.' }
          if ($Matches[1].ToLowerInvariant() -ne $publicHash) { throw 'Public checksum manifest does not match the public package.' }
          $extract = 'artifacts/public-extract'
          Expand-Archive -LiteralPath $stableDownloaded -DestinationPath $extract -Force
          $root = Join-Path $extract '준현 헬퍼'
          foreach ($relative in @('준현 헬퍼.exe','FIRST_RUN_KO.txt','Assets/tarkov_data.db')) {
            if (-not (Test-Path (Join-Path $root $relative))) { throw "Public ZIP missing required path: $relative" }
          }
          $outside = @(Get-ChildItem $extract -Force | Where-Object { $_.Name -ne '준현 헬퍼' })
          if ($outside.Count -gt 0) { throw 'Public ZIP contains entries outside the stable product folder.' }
          if (Get-ChildItem $root -Recurse -File -Filter *.pdb) { throw 'Public release contains PDB files.' }
          $nested = @(Get-ChildItem $root -Recurse -File | Where-Object { $_.Extension -in @('.zip','.7z','.rar') })
          if ($nested.Count -gt 0) { throw 'Public release contains nested archives.' }
          $exe = (Resolve-Path (Join-Path $root '준현 헬퍼.exe')).Path
          $productVersion = (Get-Item $exe).VersionInfo.ProductVersion
          if ($productVersion -ne "$env:VERSION+$env:SOURCE_SHA") { throw "Public ProductVersion mismatch: $productVersion" }
          $firstLine = Get-Content (Join-Path $root 'FIRST_RUN_KO.txt') -TotalCount 1
          if ($firstLine -ne "준현 헬퍼 v$env:VERSION — Windows x64") { throw 'Public FIRST_RUN identity mismatch.' }
          $diagnostic = Join-Path $env:TEMP 'junhyun-map-smoke-error.txt'
          $success = Join-Path $env:TEMP 'junhyun-map-smoke-success.txt'
          Remove-Item $diagnostic,$success -Force -ErrorAction SilentlyContinue
          $process = Start-Process -FilePath $exe -WorkingDirectory $root -PassThru
          try {
            $deadline = (Get-Date).AddSeconds(75)
            while ((Get-Date) -lt $deadline -and -not (Test-Path $success)) {
              $process.Refresh()
              if (Test-Path $diagnostic) { throw "Public product smoke failed: $(Get-Content $diagnostic -Raw)" }
              if ($process.HasExited) { throw "Public product exited before smoke completion: $($process.ExitCode)" }
              Start-Sleep -Milliseconds 250
            }
            if (-not (Test-Path $success)) { throw 'Public product smoke timed out.' }
            if (-not $process.CloseMainWindow()) { throw 'Could not request normal close of public product.' }
            if (-not $process.WaitForExit(7000)) { throw 'Public product did not terminate after normal close.' }
            if (Test-Path (Join-Path $root 'Logs')) { throw 'Public portable root was polluted by Logs.' }
          }
          finally {
            $process.Refresh()
            if (-not $process.HasExited) { Stop-Process -Id $process.Id -Force }
          }
          $status = [ordered]@{
            version = $env:VERSION
            source_sha = $env:SOURCE_SHA
            tag = $env:TAG
            release_controller_run_id = $env:GITHUB_RUN_ID
            tests_passed = 348
            tests_failed = 0
            tests_skipped = 0
            stable_asset = 'Junhyun-Helper.zip'
            stable_bytes = (Get-Item $stableDownloaded).Length
            stable_sha256 = $publicHash
            product_version = $productVersion
            public_redownload_verified = $true
            public_product_smoke_verified = $true
          }
          $status | ConvertTo-Json | Set-Content 'artifacts/release-controller-status.json' -Encoding utf8
          $status | Format-List

      - name: Promote verified release to stable latest
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          gh release edit $env:TAG --repo $env:GITHUB_REPOSITORY --draft=false --prerelease=false --latest
          if ($LASTEXITCODE -ne 0) { throw 'Could not promote verified v1.7.0 release to stable/latest.' }
          $latest = Invoke-RestMethod -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/releases/latest" -Headers @{ 'User-Agent'='JunhyunHelper-release-verifier' }
          if ($latest.tag_name -ne $env:TAG -or $latest.draft -or $latest.prerelease) { throw "Public latest release did not resolve to stable $env:TAG." }
          Write-Host "Public stable/latest verified: $($latest.html_url)"

      - name: Upload release controller status
        uses: actions/upload-artifact@v4
        with:
          name: v1.7.0-release-controller-status
          path: artifacts/release-controller-status.json
          if-no-files-found: error
          retention-days: 14
