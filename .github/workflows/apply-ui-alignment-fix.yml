name: Apply UI alignment fix

on:
  push:
    branches:
      - fix/ui-alignment-and-ammo-controls
    paths:
      - .github/workflows/apply-ui-alignment-fix.yml

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: fix/ui-alignment-and-ammo-controls
          submodules: recursive

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Apply requested UI patch
        run: python tools/apply_ui_alignment_fix.py

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build desktop
        run: dotnet build src/JunhyunHelper.Desktop/JunhyunHelper.Desktop.csproj --configuration Release

      - name: Test core
        run: dotnet test tests/JunhyunHelper.Tests/JunhyunHelper.Tests.csproj --configuration Release

      - name: Commit validated source changes
        shell: pwsh
        run: |
          git rm .github/workflows/apply-ui-alignment-fix.yml tools/apply_ui_alignment_fix.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git status --short
          git commit -m 'Fix UI alignment and compact ammo controls'
          git push origin HEAD:fix/ui-alignment-and-ammo-controls
