name: Fix Task Pool Audit Wording

on:
  push:
    branches: [agent/task-pool-support-2026-08-17]

permissions:
  contents: write

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/task-pool-support-2026-08-17
      - name: Fix stale pre-decision wording
        shell: python
        run: |
          from pathlib import Path
          p = Path('docs/QUEST_TASK_POOL_AUDIT_2026-08-17.md')
          text = p.read_text(encoding='utf-8')
          old = 'It intentionally does **not** authorize guessing unknown profile-variable values. A product decision is still required before the staged-pool inference described below becomes an availability rule.'
          new = 'It intentionally does **not** authorize guessing unknown profile-variable values. DEC-044 now defines the product boundary: exact read-side conditions are supported, while unobserved values and undocumented server write rules remain conservative.'
          if old not in text:
              raise SystemExit('Expected stale wording not found')
          p.write_text(text.replace(old, new, 1), encoding='utf-8')
      - name: Commit wording fix
        shell: bash
        run: |
          rm .github/workflows/fix-task-pool-audit-wording.yml
          git config user.name "Propeex"
          git config user.email "60839060+Propeex@users.noreply.github.com"
          git add -A
          git commit -m "Align task-pool audit with confirmed policy"
          git push origin HEAD:agent/task-pool-support-2026-08-17
