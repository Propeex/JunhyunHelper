name: Finalize v1.6.0 Release v3

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/finalize-v1.6.0-release-v3.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-latest
    timeout-minutes: 10
    env:
      SOURCE_SHA: c58b5cd3b3128ff6dce5a2221a453bc56aa41c37
      VERSION: 1.6.0
      TAG: v1.6.0
      STABLE_SHA: bb4ba7c8e95eb3b7838348b5f0c3fa19b2d9816e1f8e92e1d8b7ad155e1dda76
      BRIDGE_SHA: a0d249e8cbfc989674824b33e57fc80e5adc4c3208503053376a41528a100896
      GH_TOKEN: ${{ github.token }}
      JUNHYUNHELPER_MAP_SMOKE: '1'

    steps:
      - name: Normalize Korean stable asset name through upload API
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $repo=$env:GITHUB_REPOSITORY
          $tag=gh api "repos/$repo/git/ref/tags/$env:TAG"|ConvertFrom-Json
          if($tag.object.sha-ne$env:SOURCE_SHA){throw "Tag source mismatch: $($tag.object.sha)"}
          $all=@(gh api "repos/$repo/releases?per_page=100"|ConvertFrom-Json)
          $m=@($all|Where-Object{$_.tag_name-eq$env:TAG});if($m.Count-ne1){throw "Release count $($m.Count)"};$r=$m[0]
          if(-not$r.draft-or$r.prerelease){throw "Expected draft release. draft=$($r.draft) prerelease=$($r.prerelease)"}

          $legacyName='default.zip';$targetName='준현 헬퍼.zip'
          $target=@($r.assets|Where-Object{$_.name-eq$targetName})
          if($target.Count-eq0){
            $legacy=@($r.assets|Where-Object{$_.name-eq$legacyName});if($legacy.Count-ne1){throw "Expected one default.zip source asset; found $($legacy.Count)."}
            New-Item -ItemType Directory artifacts -Force|Out-Null
            $payload='artifacts/stable-source.zip'
            curl.exe --fail --location --silent --show-error -H "Accept: application/octet-stream" -H "Authorization: Bearer $env:GH_TOKEN" -H "X-GitHub-Api-Version: 2022-11-28" $legacy[0].url --output $payload
            if($LASTEXITCODE-ne0){throw 'Could not download default.zip by asset ID.'}
            $hash=(Get-FileHash $payload -Algorithm SHA256).Hash.ToLowerInvariant();if($hash-ne$env:STABLE_SHA){throw "default.zip payload hash mismatch: $hash"}

            $encoded=[uri]::EscapeDataString($targetName)
            $uploadUrl="https://uploads.github.com/repos/$repo/releases/$($r.id)/assets?name=$encoded"
            $response='artifacts/upload-response.json'
            curl.exe --fail --silent --show-error -X POST -H "Accept: application/vnd.github+json" -H "Authorization: Bearer $env:GH_TOKEN" -H "X-GitHub-Api-Version: 2022-11-28" -H "Content-Type: application/zip" --data-binary "@$payload" $uploadUrl --output $response
            if($LASTEXITCODE-ne0){throw 'Direct Korean-name asset upload failed.'}
            $uploaded=Get-Content $response -Raw|ConvertFrom-Json
            if($uploaded.name-ne$targetName){throw "GitHub returned asset name '$($uploaded.name)' instead of '$targetName'."}
            gh api --method DELETE "repos/$repo/releases/assets/$($legacy[0].id)"|Out-Null
            if($LASTEXITCODE-ne0){throw 'Could not delete default.zip after Korean-name upload.'}
          }
          elseif($target.Count-ne1){throw 'Korean stable asset is duplicated.'}

          $r2=gh api "repos/$repo/releases/$($r.id)"|ConvertFrom-Json
          $expected=@($targetName,"Junhyun-Helper-v$env:VERSION-win-x64.zip",'SHA256SUMS.txt')
          foreach($name in $expected){$a=@($r2.assets|Where-Object{$_.name-eq$name});if($a.Count-ne1){throw "Normalized release asset '$name' missing or duplicated."}}
          if(@($r2.assets|Where-Object{$_.name-eq' default.zip'.Trim()}).Count-ne0){throw 'default.zip still exists after normalization.'}
          $r2|ConvertTo-Json -Depth 6|Set-Content artifacts/release.json -Encoding utf8

      - name: Redownload all normalized assets by ID and verify
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $repo=$env:GITHUB_REPOSITORY;$r=Get-Content artifacts/release.json -Raw|ConvertFrom-Json
          New-Item -ItemType Directory artifacts/download -Force|Out-Null
          foreach($name in @('준현 헬퍼.zip',"Junhyun-Helper-v$env:VERSION-win-x64.zip",'SHA256SUMS.txt')){
            $a=@($r.assets|Where-Object{$_.name-eq$name})[0];$dest=Join-Path artifacts/download $name
            curl.exe --fail --location --silent --show-error -H "Accept: application/octet-stream" -H "Authorization: Bearer $env:GH_TOKEN" -H "X-GitHub-Api-Version: 2022-11-28" $a.url --output $dest
            if($LASTEXITCODE-ne0-or-not(Test-Path$dest)){throw "Asset-ID redownload failed: $name"}
          }
          $stable='artifacts/download/준현 헬퍼.zip';$bridge="artifacts/download/Junhyun-Helper-v$env:VERSION-win-x64.zip";$sum='artifacts/download/SHA256SUMS.txt'
          $sh=(Get-FileHash $stable -Algorithm SHA256).Hash.ToLowerInvariant();$bh=(Get-FileHash $bridge -Algorithm SHA256).Hash.ToLowerInvariant()
          if($sh-ne$env:STABLE_SHA){throw "Stable hash mismatch: $sh"};if($bh-ne$env:BRIDGE_SHA){throw "Bridge hash mismatch: $bh"}
          $lines=@(Get-Content $sum|Where-Object{-not[string]::IsNullOrWhiteSpace($_)})
          foreach($e in @(@('준현 헬퍼.zip',$env:STABLE_SHA),@("Junhyun-Helper-v$env:VERSION-win-x64.zip",$env:BRIDGE_SHA))){$x=@($lines|Where-Object{$_-match'^([0-9a-fA-F]{64})\s+(.+)$'-and$Matches[2]-eq$e[0]});if($x.Count-ne1-or$x[0]-notmatch'^([0-9a-fA-F]{64})\s+(.+)$'-or$Matches[1].ToLowerInvariant()-ne$e[1]){throw "Checksum mismatch: $($e[0])"}}

          Expand-Archive -LiteralPath $stable -DestinationPath artifacts/stable -Force;Expand-Archive -LiteralPath $bridge -DestinationPath artifacts/bridge -Force
          $sr='artifacts/stable/준현 헬퍼';foreach($rel in @('준현 헬퍼.exe','FIRST_RUN_KO.txt','Assets/tarkov_data.db')){if(-not(Test-Path(Join-Path$sr $rel))){throw "Stable missing $rel"};if(-not(Test-Path(Join-Path'artifacts/bridge' $rel))){throw "Bridge missing $rel"}}
          function M([string]$r){@(Get-ChildItem$r-Recurse-File|ForEach-Object{$p=$_.FullName.Substring($r.Length).TrimStart('\\','/').Replace('\\','/');[pscustomobject]@{P=$p;L=$_.Length;H=(Get-FileHash$_.FullName-Algorithm SHA256).Hash.ToLowerInvariant()}}|Sort-Object P)}
          if(((M$sr)|ConvertTo-Json-Compress)-ne((M'artifacts/bridge')|ConvertTo-Json-Compress)){throw 'Stable/bridge payload mismatch.'}
          $exe=(Resolve-Path(Join-Path$sr '준현 헬퍼.exe')).Path;$pv=(Get-Item$exe).VersionInfo.ProductVersion;if($pv-ne"$env:VERSION+$env:SOURCE_SHA"){throw "ProductVersion mismatch: $pv"}
          if((Get-Content(Join-Path$sr 'FIRST_RUN_KO.txt')-TotalCount 1)-ne"준현 헬퍼 v$env:VERSION — Windows x64"){throw 'FIRST_RUN mismatch.'};if(Get-ChildItem$sr-Recurse-File-Filter *.pdb){throw 'PDB found.'}
          $diag=Join-Path$env:TEMP'junhyun-map-smoke-error.txt';$ok=Join-Path$env:TEMP'junhyun-map-smoke-success.txt';Remove-Item$diag,$ok-Force-ErrorAction SilentlyContinue
          $p=Start-Process-FilePath$exe-WorkingDirectory$sr-PassThru;try{$d=(Get-Date).AddSeconds(75);while((Get-Date)-lt$d-and-not(Test-Path$ok)){$p.Refresh();if(Test-Path$diag){throw(Get-Content$diag-Raw)};if($p.HasExited){throw"EXE exited $($p.ExitCode)"};Start-Sleep-Milliseconds 250};if(-not(Test-Path$ok)){throw'Smoke timeout'};if(-not$p.CloseMainWindow()){throw'Close failed'};if(-not$p.WaitForExit(7000)){throw'Exit timeout'}}finally{$p.Refresh();if(-not$p.HasExited){Stop-Process-Id$p.Id-Force}}
          Write-Host "Stable bytes: $((Get-Item$stable).Length)";Write-Host "Stable SHA-256: $sh";Write-Host "Bridge bytes: $((Get-Item$bridge).Length)";Write-Host "Bridge SHA-256: $bh";Write-Host "ProductVersion: $pv"

      - name: Publish stable latest
        shell: pwsh
        run: |
          gh release edit $env:TAG --repo $env:GITHUB_REPOSITORY --draft=false --prerelease=false --latest
          if($LASTEXITCODE-ne0){throw 'Publish failed.'}

  public_verify:
    needs: publish
    runs-on: windows-latest
    timeout-minutes: 10
    env:
      SOURCE_SHA: c58b5cd3b3128ff6dce5a2221a453bc56aa41c37
      VERSION: 1.6.0
      TAG: v1.6.0
      STABLE_SHA: bb4ba7c8e95eb3b7838348b5f0c3fa19b2d9816e1f8e92e1d8b7ad155e1dda76
      BRIDGE_SHA: a0d249e8cbfc989674824b33e57fc80e5adc4c3208503053376a41528a100896
      GH_TOKEN: ${{ github.token }}
      JUNHYUNHELPER_MAP_SMOKE: '1'
    steps:
      - name: Anonymous public verification
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop';$h=@{'User-Agent'='JunhyunHelper-Public-Verifier';'Accept'='application/vnd.github+json'}
          $r=Invoke-RestMethod'https://api.github.com/repos/Propeex/JunhyunHelper/releases/latest'-Headers$h;if($r.tag_name-ne$env:TAG-or$r.draft-or$r.prerelease){throw'Public latest mismatch'}
          $t=Invoke-RestMethod"https://api.github.com/repos/Propeex/JunhyunHelper/git/ref/tags/$env:TAG"-Headers$h;if($t.object.sha-ne$env:SOURCE_SHA){throw'Public tag source mismatch'}
          New-Item-ItemType Directory artifacts/public-Force|Out-Null;foreach($name in @('준현 헬퍼.zip',"Junhyun-Helper-v$env:VERSION-win-x64.zip",'SHA256SUMS.txt')){$a=@($r.assets|Where-Object{$_.name-eq$name});if($a.Count-ne1){throw"Public asset missing: $name"};curl.exe --fail --location --silent --show-error $a[0].browser_download_url --output (Join-Path artifacts/public $name);if($LASTEXITCODE-ne0){throw"Public download failed: $name"}}
          $s='artifacts/public/준현 헬퍼.zip';$b="artifacts/public/Junhyun-Helper-v$env:VERSION-win-x64.zip";$sum='artifacts/public/SHA256SUMS.txt';$sh=(Get-FileHash$s-Algorithm SHA256).Hash.ToLowerInvariant();$bh=(Get-FileHash$b-Algorithm SHA256).Hash.ToLowerInvariant();if($sh-ne$env:STABLE_SHA){throw'Public stable hash mismatch'};if($bh-ne$env:BRIDGE_SHA){throw'Public bridge hash mismatch'}
          $lines=@(Get-Content$sum|Where-Object{-not[string]::IsNullOrWhiteSpace($_)});foreach($e in @(@('준현 헬퍼.zip',$env:STABLE_SHA),@("Junhyun-Helper-v$env:VERSION-win-x64.zip",$env:BRIDGE_SHA))){$x=@($lines|Where-Object{$_-match'^([0-9a-fA-F]{64})\s+(.+)$'-and$Matches[2]-eq$e[0]});if($x.Count-ne1-or$x[0]-notmatch'^([0-9a-fA-F]{64})\s+(.+)$'-or$Matches[1].ToLowerInvariant()-ne$e[1]){throw"Public checksum mismatch: $($e[0])"}}
          Expand-Archive-LiteralPath$s-DestinationPath artifacts/extract-Force;$pr='artifacts/extract/준현 헬퍼';foreach($rel in @('준현 헬퍼.exe','FIRST_RUN_KO.txt','Assets/tarkov_data.db')){if(-not(Test-Path(Join-Path$pr $rel))){throw"Public package missing $rel"}}
          $exe=(Resolve-Path(Join-Path$pr '준현 헬퍼.exe')).Path;$pv=(Get-Item$exe).VersionInfo.ProductVersion;if($pv-ne"$env:VERSION+$env:SOURCE_SHA"){throw"Public ProductVersion mismatch: $pv"};if(Get-ChildItem$pr-Recurse-File-Filter *.pdb){throw'Public PDB found'}
          $diag=Join-Path$env:TEMP'junhyun-map-smoke-error.txt';$ok=Join-Path$env:TEMP'junhyun-map-smoke-success.txt';Remove-Item$diag,$ok-Force-ErrorAction SilentlyContinue;$p=Start-Process-FilePath$exe-WorkingDirectory$pr-PassThru;try{$d=(Get-Date).AddSeconds(75);while((Get-Date)-lt$d-and-not(Test-Path$ok)){$p.Refresh();if(Test-Path$diag){throw(Get-Content$diag-Raw)};if($p.HasExited){throw"Public EXE exited $($p.ExitCode)"};Start-Sleep-Milliseconds 250};if(-not(Test-Path$ok)){throw'Smoke timeout'};if(-not$p.CloseMainWindow()){throw'Close failed'};if(-not$p.WaitForExit(7000)){throw'Exit timeout'}}finally{$p.Refresh();if(-not$p.HasExited){Stop-Process-Id$p.Id-Force}}
          $o=[ordered]@{version='v1.6.0';source_sha=$env:SOURCE_SHA;finalizer_run_id=[long]$env:GITHUB_RUN_ID;stable_asset='준현 헬퍼.zip';stable_bytes=(Get-Item$s).Length;stable_sha256=$sh;bridge_asset="Junhyun-Helper-v$env:VERSION-win-x64.zip";bridge_bytes=(Get-Item$b).Length;bridge_sha256=$bh;product_version=$pv;automated_tests='299 passed / 0 failed / 0 skipped';public_latest='VERIFIED';exact_public_tag_source='VERIFIED';public_redownload='VERIFIED';public_exe_smoke='SUCCESS';verified_at_utc=[DateTime]::UtcNow.ToString('o')};$o|ConvertTo-Json|Set-Content status.json-Encoding utf8;$o|Format-List
      - name: Persist release status
        shell: pwsh
        run: |
          $repo=$env:GITHUB_REPOSITORY;$path='docs/.release-v1.6.0-status.json';$b64=[Convert]::ToBase64String([IO.File]::ReadAllBytes('status.json'));$old=gh api"repos/$repo/contents/$path?ref=main"2>$null;$sha=$null;if($LASTEXITCODE-eq0){$sha=($old|ConvertFrom-Json).sha};$a=@('--method','PUT',"repos/$repo/contents/$path",'-f','message=Record verified v1.6.0 public release','-f',"content=$b64",'-f','branch=main');if($sha){$a+=@('-f',"sha=$sha")};gh api @a|Out-Null;if($LASTEXITCODE-ne0){throw'Persist status failed'}
