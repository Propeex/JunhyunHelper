          literal_once('docs/CURRENT_STATE.md', '상태: **`v1.6.0 PUBLIC RELEASE / VERIFIED — LIVE GROUND TRUTH MAINTENANCE`**', '상태: **`v1.7.0 PUBLIC RELEASE / VERIFIED — LIVE GROUND TRUTH MAINTENANCE`**')
          current_release = block('''
          ## 공개 stable과 현재 source

          현재 공개 stable/latest는 **v1.7.0**이다.

          ```text
          public stable/latest: v1.7.0
