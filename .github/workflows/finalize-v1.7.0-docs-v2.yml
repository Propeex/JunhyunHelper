          regex_once('docs/STATE.md', r'## 2\. 공개 stable과 현재 source\n.*?(?=## 3\. 아키텍처)', state_release)
          for old, new in [
              ('v1.6.0 일반 Scanner 화면에는 catalog force-refresh action을 노출하지 않는다.', '현재 일반 Scanner 화면에는 catalog force-refresh action을 노출하지 않는다.'),
