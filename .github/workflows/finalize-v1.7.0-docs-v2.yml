          literal_once('docs/STATE.md', '상태: **v1.6.0 PUBLIC RELEASE / VERIFIED — LIVE GROUND TRUTH MAINTENANCE**', '상태: **v1.7.0 PUBLIC RELEASE / VERIFIED — LIVE GROUND TRUTH MAINTENANCE**')
          state_release = block('''
          ## 2. 공개 stable과 현재 source

