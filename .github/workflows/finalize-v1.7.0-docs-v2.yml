          literal_once('docs/CURRENT_SCANNER_WORK.md', '상태: **v1.6.0 PUBLIC RELEASE / VERIFIED — LIVE GROUND TRUTH MAINTENANCE**', '상태: **v1.7.0 PUBLIC RELEASE / VERIFIED — LIVE GROUND TRUTH MAINTENANCE**')
          literal_optional('docs/CURRENT_SCANNER_WORK.md', 'Scanner v1.6.0 사용자 작업 흐름 정리와 공개 릴리즈 검증이 완료되었다.', 'Scanner v1.7.0 Product Completion hardening과 공개 릴리즈 검증이 완료되었다.')
          scanner_goal = block('''
