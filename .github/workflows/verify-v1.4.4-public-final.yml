name: Verify public v1.4.4 final

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-v1.4.4-public-final.yml'

permissions:
  contents: write
  actions: read

jobs:
  verify-public:
    runs-on: windows-latest
    timeout-minutes: 18
    env:
      SOURCE_SHA: 0c7f31e118122ffef6e5999f7a20a77d823a450d
      RELEASE_TRIGGER_SHA: 85f8aa42e03cd555ff83adb085216d2e8b6102f2
      VERSION: 1.4.4
      TAG: v1.4.4
      ASSET: Junhyun-Helper-v1.4.4-win-x64.zip
    steps:
      - name: Checkout main for durable status
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Wait for recovery release workflow completion
        id: release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $deadline = (Get-Date).AddMinutes(13)
          $run = $null
          while ((Get-Date) -lt $deadline) {
            $runs = gh api "repos/$env:GITHUB_REPOSITORY/actions/workflows/release-v1.4.4.yml/runs?event=push&per_page=20" | ConvertFrom-Json
            $run = $runs.workflow_runs | Where-Object { $_.head_sha -eq $env:RELEASE_TRIGGER_SHA } | Select-Object -First 1
            if ($null -ne $run -and $run.status -eq 'completed') { break }
            Start-Sleep -Seconds 15
          }
          if ($null -eq $run) { throw 'Could not find recovery v1.4.4 release run.' }
          if ($run.status -ne 'completed') { throw "Recovery release run did not complete: $($run.id) $($run.status)" }
          "run_id=$($run.id)" >> $env:GITHUB_OUTPUT
          "conclusion=$($run.conclusion)" >> $env:GITHUB_OUTPUT
          Write-Host "Recovery release run: $($run.id) / $($run.conclusion)"
          if ($run.conclusion -ne 'success') { throw "Recovery release workflow failed: $($run.id)" }

      - name: Verify public latest and exact tag anonymously
        id: metadata
        shell: pwsh
        run: |
          $headers = @{ 'User-Agent' = 'JunhyunHelper-PublicVerifier-v1.4.4'; 'Accept' = 'application/vnd.github+json' }
          $latest = Invoke-RestMethod -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/releases/latest" -Headers $headers
          if ($latest.tag_name -ne $env:TAG -or $latest.draft -or $latest.prerelease) { throw 'v1.4.4 is not public stable/latest.' }
          $ref = Invoke-RestMethod -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/git/ref/tags/$env:TAG" -Headers $headers
          $tagSha = $ref.object.sha
          if ($ref.object.type -eq 'tag') {
            $tagObject = Invoke-RestMethod -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/git/tags/$tagSha" -Headers $headers
            $tagSha = $tagObject.object.sha
          }
          if ($tagSha -ne $env:SOURCE_SHA) { throw "Public tag source mismatch: $tagSha" }
          $zipAsset = $latest.assets | Where-Object name -eq $env:ASSET | Select-Object -First 1
          $sumAsset = $latest.assets | Where-Object name -eq 'SHA256SUMS.txt' | Select-Object -First 1
          if ($null -eq $zipAsset -or $null -eq $sumAsset) { throw 'Required public assets missing.' }
          "zip_url=$($zipAsset.browser_download_url)" >> $env:GITHUB_OUTPUT
          "sum_url=$($sumAsset.browser_download_url)" >> $env:GITHUB_OUTPUT
          "published_at=$($latest.published_at)" >> $env:GITHUB_OUTPUT

      - name: Redownload public assets anonymously
        id: package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path verify -Force | Out-Null
          $headers = @{ 'User-Agent' = 'JunhyunHelper-PublicVerifier-v1.4.4' }
          Invoke-WebRequest -Uri '${{ steps.metadata.outputs.zip_url }}' -Headers $headers -OutFile "verify/$env:ASSET"
          Invoke-WebRequest -Uri '${{ steps.metadata.outputs.sum_url }}' -Headers $headers -OutFile verify/SHA256SUMS.txt
          $expected = ((Get-Content verify/SHA256SUMS.txt -Raw).Trim() -split '\s+')[0].ToLowerInvariant()
          $actual = (Get-FileHash "verify/$env:ASSET" -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($expected -ne $actual) { throw "Public checksum mismatch: $expected / $actual" }
          "sha256=$actual" >> $env:GITHUB_OUTPUT
          "bytes=$((Get-Item "verify/$env:ASSET").Length)" >> $env:GITHUB_OUTPUT

      - name: Verify public package layout and identity
        shell: pwsh
        run: |
          Expand-Archive "verify/$env:ASSET" verify/package -Force
          $rootFiles = @(Get-ChildItem verify/package -File)
          if (@($rootFiles | Where-Object { $_.Name -notin @('준현 헬퍼.exe','FIRST_RUN_KO.txt') }).Count -gt 0) { throw 'Unexpected public package root files.' }
          $rootDirs = @(Get-ChildItem verify/package -Directory)
          if ($rootDirs.Count -ne 1 -or $rootDirs[0].Name -ne 'Assets') { throw 'Unexpected public package root directory layout.' }
          if (-not (Test-Path verify/package/Assets/tarkov_data.db)) { throw 'Public Map database missing.' }
          if (@(Get-ChildItem verify/package -Recurse -File -Filter *.pdb).Count -gt 0) { throw 'Public package contains PDB.' }
          if (@(Get-ChildItem verify/package -Recurse -File | Where-Object Extension -in @('.zip','.7z','.rar')).Count -gt 0) { throw 'Public package contains nested archive.' }
          $exe = (Resolve-Path 'verify/package/준현 헬퍼.exe').Path
          $pv = (Get-Item $exe).VersionInfo.ProductVersion
          if ($pv -ne "$env:VERSION+$env:SOURCE_SHA") { throw "Public ProductVersion mismatch: $pv" }
          $first = Get-Content verify/package/FIRST_RUN_KO.txt -TotalCount 1
          if ($first -ne "준현 헬퍼 v$env:VERSION — Windows x64") { throw "Public FIRST_RUN mismatch: $first" }

      - name: Smoke public-downloaded executable
        shell: pwsh
        env:
          JUNHYUNHELPER_MAP_SMOKE: '1'
        run: |
          $exe = (Resolve-Path 'verify/package/준현 헬퍼.exe').Path
          $diagnostic = Join-Path $env:TEMP 'junhyun-map-smoke-error.txt'
          $success = Join-Path $env:TEMP 'junhyun-map-smoke-success.txt'
          $startupLog = Join-Path $env:LOCALAPPDATA 'JunhyunHelper/logs/startup.log'
          Remove-Item $diagnostic,$success,$startupLog -Force -ErrorAction SilentlyContinue
          $process = Start-Process -FilePath $exe -WorkingDirectory verify/package -PassThru
          try {
            $deadline = (Get-Date).AddSeconds(75)
            while ((Get-Date) -lt $deadline -and -not (Test-Path $success)) {
              $process.Refresh()
              if (Test-Path $diagnostic) { Get-Content $diagnostic | Write-Host; throw 'Public EXE smoke failure.' }
              if ($process.HasExited) { throw "Public EXE exited early: $($process.ExitCode)" }
              Start-Sleep -Milliseconds 250
            }
            if (-not (Test-Path $success)) { throw 'Public EXE smoke timed out.' }
            if (-not $process.CloseMainWindow()) { throw 'Could not close public EXE normally.' }
            if (-not $process.WaitForExit(7000)) { throw 'Public EXE did not terminate normally.' }
            if (Test-Path verify/package/Logs) { throw 'Public EXE recreated portable-root Logs.' }
          }
          finally {
            $process.Refresh()
            if (-not $process.HasExited) { Stop-Process -Id $process.Id -Force }
          }

      - name: Record durable v1.4.4 status
        shell: pwsh
        env:
          RELEASE_RUN: ${{ steps.release.outputs.run_id }}
          RELEASE_CONCLUSION: ${{ steps.release.outputs.conclusion }}
          ASSET_SHA256: ${{ steps.package.outputs.sha256 }}
          ASSET_BYTES: ${{ steps.package.outputs.bytes }}
          PUBLISHED_AT: ${{ steps.metadata.outputs.published_at }}
        run: |
          $status = [ordered]@{
            version = $env:TAG
            source_sha = $env:SOURCE_SHA
            tag_sha = $env:SOURCE_SHA
            asset = $env:ASSET
            bytes = [long]$env:ASSET_BYTES
            sha256 = $env:ASSET_SHA256
            product_version = "$env:VERSION+$env:SOURCE_SHA"
            tests = 283
            release_run = [long]$env:RELEASE_RUN
            release_workflow_conclusion = $env:RELEASE_CONCLUSION
            public_verifier_run = [long]$env:GITHUB_RUN_ID
            public_latest_verified = $true
            exact_tag_source_verified = $true
            public_redownload_verified = $true
            public_sha256sums_verified = $true
            public_package_layout_verified = $true
            public_exe_smoke = 'SUCCESS'
            published_at_utc = $env:PUBLISHED_AT
            verified_at_utc = [DateTimeOffset]::UtcNow.ToString('O')
          }
          $status | ConvertTo-Json -Depth 4 | Set-Content docs/.release-v1.4.4-status.json -Encoding utf8
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/.release-v1.4.4-status.json
          git commit -m 'Record verified v1.4.4 public release status'
          git push origin HEAD:main
