name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  core-tests:
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build desktop
        run: dotnet build src/JunhyunHelper.Desktop/JunhyunHelper.Desktop.csproj --configuration Release

      - name: Test core
        run: dotnet test tests/JunhyunHelper.Tests/JunhyunHelper.Tests.csproj --configuration Release

      - name: Publish Windows x64 release candidate
        shell: pwsh
        run: |
          dotnet publish src/JunhyunHelper.Desktop/JunhyunHelper.Desktop.csproj `
            --configuration Release `
            --runtime win-x64 `
            --self-contained true `
            --output artifacts/publish `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true `
            -p:PublishTrimmed=false `
            -p:PublishReadyToRun=false `
            -p:DebugType=None `
            -p:DebugSymbols=false

          Copy-Item packaging/FIRST_RUN_KO.txt artifacts/publish/FIRST_RUN_KO.txt

          $required = @(
            '준현 헬퍼.exe',
            'FIRST_RUN_KO.txt',
            'Assets/tarkov_data.db'
          )
          foreach ($file in $required) {
            if (-not (Test-Path (Join-Path artifacts/publish $file))) {
              throw "Required published file was not produced: $file"
            }
          }

          [xml]$project = Get-Content 'src/JunhyunHelper.Desktop/JunhyunHelper.Desktop.csproj'
          $expectedVersion = [string]($project.Project.PropertyGroup.Version | Select-Object -First 1)
          if ([string]::IsNullOrWhiteSpace($expectedVersion)) {
            throw 'Desktop project version is missing.'
          }

          $exePath = (Resolve-Path 'artifacts/publish/준현 헬퍼.exe').Path
          $productVersion = (Get-Item $exePath).VersionInfo.ProductVersion
          if ([string]::IsNullOrWhiteSpace($productVersion) -or -not $productVersion.StartsWith($expectedVersion, [System.StringComparison]::Ordinal)) {
            throw "Published ProductVersion '$productVersion' does not match project version '$expectedVersion'."
          }

          $firstRun = Get-Content 'artifacts/publish/FIRST_RUN_KO.txt' -Raw
          if (-not $firstRun.StartsWith("준현 헬퍼 v$expectedVersion", [System.StringComparison]::Ordinal)) {
            throw "FIRST_RUN_KO.txt does not identify project version '$expectedVersion'."
          }

          $rootFiles = @(Get-ChildItem artifacts/publish -File)
          $unexpectedRootFiles = @($rootFiles | Where-Object {
            $_.Name -notin @('준현 헬퍼.exe', 'FIRST_RUN_KO.txt')
          })
          if ($unexpectedRootFiles.Count -gt 0) {
            $unexpectedRootFiles | ForEach-Object { Write-Host "Unexpected root file: $($_.Name)" }
            throw "Single-file publish left runtime/dependency files beside the executable."
          }

          $rootDirectories = @(Get-ChildItem artifacts/publish -Directory)
          $unexpectedRootDirectories = @($rootDirectories | Where-Object { $_.Name -ne 'Assets' })
          if ($unexpectedRootDirectories.Count -gt 0) {
            $unexpectedRootDirectories | ForEach-Object { Write-Host "Unexpected root directory: $($_.Name)" }
            throw "Release root contains an unexpected directory."
          }

          $rootDlls = @(Get-ChildItem artifacts/publish -File -Filter *.dll)
          if ($rootDlls.Count -gt 0) {
            $rootDlls | ForEach-Object { Write-Host "Unexpected root DLL: $($_.Name)" }
            throw "Release root still contains DLL clutter."
          }

          $pdbs = @(Get-ChildItem artifacts/publish -Recurse -File -Filter *.pdb)
          if ($pdbs.Count -gt 0) {
            $pdbs | ForEach-Object { Write-Host "Unexpected PDB: $($_.FullName)" }
            throw "Release publish contains debug symbols."
          }

          $nestedArchives = @(Get-ChildItem artifacts/publish -Recurse -File | Where-Object {
            $_.Extension -in @('.zip', '.7z', '.rar')
          })
          if ($nestedArchives.Count -gt 0) {
            $nestedArchives | ForEach-Object { Write-Host "Unexpected nested archive: $($_.FullName)" }
            throw "Release publish contains a nested archive."
          }

          $forbidden = @(
            'AutoUpdater.NET.dll',
            'Microsoft.Web.WebView2.Core.dll',
            'Microsoft.Web.WebView2.WinForms.dll',
            'Microsoft.Web.WebView2.Wpf.dll',
            'WebView2Loader.dll',
            'Westermo.GraphX.Controls.dll',
            'Westermo.GraphX.Common.dll',
            'QuikGraph.dll'
          )
          foreach ($file in $forbidden) {
            if (Get-ChildItem artifacts/publish -Recurse -File -Filter $file) {
              throw "Unused legacy dependency leaked into release publish: $file"
            }
          }

          Write-Host "Release identity: v$expectedVersion / ProductVersion $productVersion"
          Write-Host "Release root:"
          Get-ChildItem artifacts/publish | Sort-Object Name | Select-Object Name,Length,PSIsContainer | Format-Table -AutoSize
          Write-Host "Total files: $(@(Get-ChildItem artifacts/publish -Recurse -File).Count)"

      - name: Startup + Product UI + Map + graceful shutdown smoke
        shell: pwsh
        env:
          JUNHYUNHELPER_MAP_SMOKE: "1"
        run: |
          $exe = (Resolve-Path 'artifacts/publish/준현 헬퍼.exe').Path
          $diagnostic = Join-Path $env:TEMP 'junhyun-map-smoke-error.txt'
          $success = Join-Path $env:TEMP 'junhyun-map-smoke-success.txt'
          Remove-Item $diagnostic -Force -ErrorAction SilentlyContinue
          Remove-Item $success -Force -ErrorAction SilentlyContinue

          $process = Start-Process -FilePath $exe -WorkingDirectory artifacts/publish -PassThru
          try {
            # The in-process smoke performs rendered product UI assertions plus real
            # asynchronous Factory/MainMap/MiniMap assertions. Process liveness alone
            # is never considered success.
            $deadline = (Get-Date).AddSeconds(75)
            $smokeCompleted = $false
            while ((Get-Date) -lt $deadline) {
              $process.Refresh()

              if (Test-Path $diagnostic) {
                Write-Host 'Product smoke diagnostic:'
                Get-Content $diagnostic | ForEach-Object { Write-Host $_ }
                throw 'Published 준현 헬퍼 reported a product smoke failure.'
              }

              if (Test-Path $success) {
                $smokeCompleted = $true
                break
              }

              if ($process.HasExited) {
                throw "Published 준현 헬퍼 exited before product smoke completion with code $($process.ExitCode)."
              }

              Start-Sleep -Milliseconds 250
            }

            if (-not $smokeCompleted) {
              if (Test-Path $diagnostic) {
                Write-Host 'Product smoke diagnostic:'
                Get-Content $diagnostic | ForEach-Object { Write-Host $_ }
              }
              throw 'Product smoke did not publish an explicit success signal within 75 seconds.'
            }

            Write-Host "Startup + rendered Product UI + full Map/Factory/MiniMap smoke passed. Requesting normal Main Window close..."

            $closeRequested = $false
            for ($attempt = 1; $attempt -le 10; $attempt++) {
              $process.Refresh()
              if ($process.HasExited) {
                $closeRequested = $true
                break
              }

              if ($process.CloseMainWindow()) {
                $closeRequested = $true
                break
              }

              Start-Sleep -Milliseconds 500
            }

            if (-not $closeRequested) {
              throw "Could not send a normal close request to the 준현 헬퍼 Main Window after retries."
            }

            $process.Refresh()
            if (-not $process.HasExited -and -not $process.WaitForExit(7000)) {
              throw "준현 헬퍼 Main Window closed but the process did not terminate within 7 seconds."
            }

            if (Test-Path 'artifacts/publish/Logs') {
              throw "Runtime smoke recreated a Logs folder beside the portable executable."
            }

            Write-Host "Graceful shutdown + clean portable root smoke passed."
          }
          finally {
            $process.Refresh()
            if (-not $process.HasExited) {
              Stop-Process -Id $process.Id -Force
            }
          }

      - name: Upload Windows x64 release candidate
        uses: actions/upload-artifact@v4
        with:
          name: JunhyunHelper-win-x64
          path: artifacts/publish
          if-no-files-found: error
          retention-days: ${{ github.event_name == 'push' && 14 || 3 }}
