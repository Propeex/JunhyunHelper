name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  core-tests:
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Checkout pinned public Map donor
        shell: pwsh
        run: |
          # Keep the primary checkout unauthenticated after fetch so the public
          # cross-repository donor cannot inherit a repository-scoped token.
          git submodule sync --recursive
          if ($LASTEXITCODE -ne 0) {
            throw "Could not synchronize submodule metadata."
          }

          git submodule update --init --force --depth=1 --recursive
          if ($LASTEXITCODE -ne 0) {
            throw "Could not checkout the pinned public Map donor."
          }

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Build desktop
        run: dotnet build src/JunhyunHelper.Desktop/JunhyunHelper.Desktop.csproj --configuration Release

      - name: Test core
        run: dotnet test tests/JunhyunHelper.Tests/JunhyunHelper.Tests.csproj --configuration Release

      - name: Publish Windows x64 release candidate
        shell: pwsh
        run: |
          dotnet publish src/JunhyunHelper.Desktop/JunhyunHelper.Desktop.csproj `
            --configuration Release `
            --runtime win-x64 `
            --self-contained true `
            --output artifacts/publish `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true `
            -p:PublishTrimmed=false `
            -p:PublishReadyToRun=false `
            -p:DebugType=None `
            -p:DebugSymbols=false

          Copy-Item packaging/FIRST_RUN_KO.txt artifacts/publish/FIRST_RUN_KO.txt

          $required = @(
            '준현 헬퍼.exe',
            'FIRST_RUN_KO.txt',
            'Assets/tarkov_data.db'
          )
          foreach ($file in $required) {
            if (-not (Test-Path (Join-Path artifacts/publish $file))) {
              throw "Required published file was not produced: $file"
            }
          }

          [xml]$project = Get-Content 'src/JunhyunHelper.Desktop/JunhyunHelper.Desktop.csproj'
          $expectedVersion = [string]($project.Project.PropertyGroup.Version | Select-Object -First 1)
          if ([string]::IsNullOrWhiteSpace($expectedVersion)) {
            throw 'Desktop project version is missing.'
          }

          $exePath = (Resolve-Path 'artifacts/publish/준현 헬퍼.exe').Path
          $productVersion = (Get-Item $exePath).VersionInfo.ProductVersion
          $escapedVersion = [Regex]::Escape($expectedVersion)
          if ([string]::IsNullOrWhiteSpace($productVersion) -or $productVersion -notmatch "^$escapedVersion(?:$|[+-])") {
            throw "Published ProductVersion '$productVersion' does not match project version '$expectedVersion'."
          }

          $firstRunFirstLine = Get-Content 'artifacts/publish/FIRST_RUN_KO.txt' -TotalCount 1
          $expectedFirstRunLine = "준현 헬퍼 v$expectedVersion — Windows x64"
          if (-not [string]::Equals($firstRunFirstLine, $expectedFirstRunLine, [System.StringComparison]::Ordinal)) {
            throw "FIRST_RUN_KO.txt first line '$firstRunFirstLine' does not exactly match '$expectedFirstRunLine'."
          }

          $rootFiles = @(Get-ChildItem artifacts/publish -File)
          $unexpectedRootFiles = @($rootFiles | Where-Object {
            $_.Name -notin @('준현 헬퍼.exe', 'FIRST_RUN_KO.txt')
          })
          if ($unexpectedRootFiles.Count -gt 0) {
            $unexpectedRootFiles | ForEach-Object { Write-Host "Unexpected root file: $($_.Name)" }
            throw "Single-file publish left runtime/dependency files beside the executable."
          }

          $rootDirectories = @(Get-ChildItem artifacts/publish -Directory)
          $unexpectedRootDirectories = @($rootDirectories | Where-Object { $_.Name -ne 'Assets' })
          if ($unexpectedRootDirectories.Count -gt 0) {
            $unexpectedRootDirectories | ForEach-Object { Write-Host "Unexpected root directory: $($_.Name)" }
            throw "Release root contains an unexpected directory."
          }

          $rootDlls = @(Get-ChildItem artifacts/publish -File -Filter *.dll)
          if ($rootDlls.Count -gt 0) {
            $rootDlls | ForEach-Object { Write-Host "Unexpected root DLL: $($_.Name)" }
            throw "Release root still contains DLL clutter."
          }

          $pdbs = @(Get-ChildItem artifacts/publish -Recurse -File -Filter *.pdb)
          if ($pdbs.Count -gt 0) {
            $pdbs | ForEach-Object { Write-Host "Unexpected PDB: $($_.FullName)" }
            throw "Release publish contains debug symbols."
          }

          $nestedArchives = @(Get-ChildItem artifacts/publish -Recurse -File | Where-Object {
            $_.Extension -in @('.zip', '.7z', '.rar')
          })
          if ($nestedArchives.Count -gt 0) {
            $nestedArchives | ForEach-Object { Write-Host "Unexpected nested archive: $($_.FullName)" }
            throw "Release publish contains a nested archive."
          }

          $forbidden = @(
            'AutoUpdater.NET.dll',
            'Microsoft.Web.WebView2.Core.dll',
            'Microsoft.Web.WebView2.WinForms.dll',
            'Microsoft.Web.WebView2.Wpf.dll',
            'WebView2Loader.dll',
            'Westermo.GraphX.Controls.dll',
            'Westermo.GraphX.Common.dll',
            'QuikGraph.dll'
          )
          foreach ($file in $forbidden) {
            if (Get-ChildItem artifacts/publish -Recurse -File -Filter $file) {
              throw "Unused legacy dependency leaked into release publish: $file"
            }
          }

          Write-Host "Release identity: v$expectedVersion / ProductVersion $productVersion"
          Write-Host "Release root:"
          Get-ChildItem artifacts/publish | Sort-Object Name | Select-Object Name,Length,PSIsContainer | Format-Table -AutoSize
          Write-Host "Total files: $(@(Get-ChildItem artifacts/publish -Recurse -File).Count)"

      - name: Startup + Product UI + Map + graceful shutdown smoke
        shell: pwsh
        env:
          JUNHYUNHELPER_MAP_SMOKE: "1"
        run: |
          $exe = (Resolve-Path 'artifacts/publish/준현 헬퍼.exe').Path
          $diagnostic = Join-Path $env:TEMP 'junhyun-map-smoke-error.txt'
          $success = Join-Path $env:TEMP 'junhyun-map-smoke-success.txt'
          $ammoIcons = Join-Path $env:TEMP 'junhyun-ammo-ui-smoke-success.txt'
          $ammoToolbar = Join-Path $env:TEMP 'junhyun-ammo-toolbar-smoke-success.txt'
          $mapExtract = Join-Path $env:TEMP 'junhyun-map-extract-filter-smoke-success.txt'
          $miniMapSelectionSync = Join-Path $env:TEMP 'junhyun-minimap-selection-sync-smoke-success.txt'
          $scannerDetail = Join-Path $env:TEMP 'junhyun-scanner-item-detail-smoke-success.txt'
          $scannerFavorites = Join-Path $env:TEMP 'junhyun-scanner-favorites-recents-smoke-success.txt'
          $scannerDetailActions = Join-Path $env:TEMP 'junhyun-scanner-v191-detail-actions-smoke-success.txt'
          $startupLog = Join-Path $env:LOCALAPPDATA 'JunhyunHelper/logs/startup.log'
          foreach ($path in @($diagnostic, $success, $ammoIcons, $ammoToolbar, $mapExtract, $miniMapSelectionSync, $scannerDetail, $scannerFavorites, $scannerDetailActions, $startupLog)) {
            Remove-Item $path -Force -ErrorAction SilentlyContinue
          }

          function Write-SmokeFailureContext {
            param([System.Diagnostics.Process]$Process)
            try {
              $Process.Refresh()
              Write-Host "Process: id=$($Process.Id) exited=$($Process.HasExited) responding=$($Process.Responding) title='$($Process.MainWindowTitle)' cpu=$($Process.TotalProcessorTime)"
            }
            catch {
              Write-Host "Could not read process state: $($_.Exception.Message)"
            }
            if (Test-Path $diagnostic) {
              Write-Host 'Product smoke diagnostic:'
              Get-Content $diagnostic | ForEach-Object { Write-Host $_ }
            }
            if (Test-Path $startupLog) {
              Write-Host 'Application startup/dispatcher diagnostic:'
              Get-Content $startupLog | ForEach-Object { Write-Host $_ }
            }
          }

          function Assert-MarkerContains {
            param(
              [string]$Path,
              [string[]]$ExpectedLines,
              [string]$Name
            )
            $content = @(Get-Content $Path)
            foreach ($expected in $ExpectedLines) {
              if ($content -notcontains $expected) {
                throw "Published runtime evidence '$Name' is missing contract line '$expected'."
              }
            }
          }

          $process = Start-Process -FilePath $exe -WorkingDirectory artifacts/publish -PassThru
          try {
            $deadline = (Get-Date).AddSeconds(75)
            $smokeCompleted = $false
            while ((Get-Date) -lt $deadline) {
              $process.Refresh()

              if (Test-Path $diagnostic) {
                Write-SmokeFailureContext -Process $process
                throw 'Published 준현 헬퍼 reported a product smoke failure.'
              }

              if (Test-Path $success) {
                $smokeCompleted = $true
                break
              }

              if ($process.HasExited) {
                Write-SmokeFailureContext -Process $process
                throw "Published 준현 헬퍼 exited before product smoke completion with code $($process.ExitCode)."
              }

              Start-Sleep -Milliseconds 250
            }

            if (-not $smokeCompleted) {
              Write-SmokeFailureContext -Process $process
              throw 'Product smoke did not publish an explicit success signal within 75 seconds.'
            }

            $requiredRuntimeMarkers = @(
              @{ Name = 'Ammo animated dropdown'; Path = $ammoIcons },
              @{ Name = 'Ammo toolbar layout'; Path = $ammoToolbar },
              @{ Name = 'Map extract filters'; Path = $mapExtract },
              @{ Name = 'MiniMap map selection synchronization'; Path = $miniMapSelectionSync },
              @{ Name = 'Scanner item detail'; Path = $scannerDetail },
              @{ Name = 'Scanner favorites/recents'; Path = $scannerFavorites },
              @{ Name = 'Scanner detail actions'; Path = $scannerDetailActions }
            )

            # Some feature probes are scheduled at Dispatcher.ContextIdle after the main
            # smoke completion marker. Map extract validation can itself wait up to 20 seconds
            # for the preceding MiniMap lifecycle evidence, then runs additional real checks.
            # Keep this bounded above that legal probe runtime without weakening any assertion.
            $evidenceDeadline = (Get-Date).AddSeconds(35)
            while ((Get-Date) -lt $evidenceDeadline) {
              if (Test-Path $diagnostic) {
                Write-SmokeFailureContext -Process $process
                throw 'Published 준현 헬퍼 reported a feature smoke failure while collecting runtime evidence.'
              }

              $missing = @($requiredRuntimeMarkers | Where-Object { -not (Test-Path $_.Path) })
              if ($missing.Count -eq 0) {
                break
              }

              $process.Refresh()
              if ($process.HasExited) {
                Write-SmokeFailureContext -Process $process
                throw "Published 준현 헬퍼 exited before all runtime evidence was produced with code $($process.ExitCode)."
              }
              Start-Sleep -Milliseconds 200
            }

            foreach ($marker in $requiredRuntimeMarkers) {
              if (-not (Test-Path $marker.Path)) {
                Write-SmokeFailureContext -Process $process
                throw "Published runtime smoke did not produce required evidence: $($marker.Name)."
              }
              Write-Host "$($marker.Name) runtime evidence:"
              Get-Content $marker.Path | ForEach-Object { Write-Host $_ }
            }

            Assert-MarkerContains -Path $ammoIcons -Name 'Ammo animated dropdown' -ExpectedLines @(
              'ammo-caliber-runtime-template=ok',
              'favorites-shared-template=ok',
              'shared-cycle-ms=700'
            )
            Assert-MarkerContains -Path $mapExtract -Name 'Map extract filters' -ExpectedLines @(
              'real-donor-checkboxes=ok',
              'marker-panel-visible=ok',
              'master-filter-render-state=ok',
              'minimap-refresh-handler-preserved=ok'
            )
            Assert-MarkerContains -Path $miniMapSelectionSync -Name 'MiniMap map selection synchronization' -ExpectedLines @(
              'main-map-selection-boundary=ok',
              'active-minimap-map-sync=ok'
            )
            Assert-MarkerContains -Path $scannerDetail -Name 'Scanner item detail' -ExpectedLines @(
              'product-lifecycle=ok',
              'canonical-open-boundary=ok',
              'basic-four-fields=ok',
              'related-item-buttons=ok'
            )
            Assert-MarkerContains -Path $scannerFavorites -Name 'Scanner favorites/recents' -ExpectedLines @(
              'search-clear-detail=ok',
              'favorite-toggle-persistence=ok',
              'recent-open-persistence=ok',
              'right-pane-two-to-one=ok',
              'independent-scroll=ok',
              'user-log-pane-hidden=ok',
              'canonical-item-id=ok'
            )
            Assert-MarkerContains -Path $scannerDetailActions -Name 'Scanner detail actions' -ExpectedLines @(
              'favorite-wiki-height=34',
              'favorite-symbol-font=ok',
              'favorite-content-centered=ok',
              'wiki-content-centered=ok'
            )

            Write-Host "Startup + rendered Product UI + full Map/Factory/MiniMap + Scanner smoke passed. Requesting normal Main Window close..."

            $closeRequested = $false
            for ($attempt = 1; $attempt -le 10; $attempt++) {
              $process.Refresh()
              if ($process.HasExited) {
                $closeRequested = $true
                break
              }

              if ($process.CloseMainWindow()) {
                $closeRequested = $true
                break
              }

              Start-Sleep -Milliseconds 500
            }

            if (-not $closeRequested) {
              Write-SmokeFailureContext -Process $process
              throw "Could not send a normal close request to the 준현 헬퍼 Main Window after retries."
            }

            $process.Refresh()
            if (-not $process.HasExited -and -not $process.WaitForExit(7000)) {
              Write-SmokeFailureContext -Process $process
              throw "준현 헬퍼 Main Window closed but the process did not terminate within 7 seconds."
            }

            if (Test-Path 'artifacts/publish/Logs') {
              throw "Runtime smoke recreated a Logs folder beside the portable executable."
            }

            Write-Host "Graceful shutdown + clean portable root smoke passed."
          }
          finally {
            $process.Refresh()
            if (-not $process.HasExited) {
              Stop-Process -Id $process.Id -Force
            }
          }

      - name: Build and verify release packages
        shell: pwsh
        run: |
          ./packaging/New-ReleasePackage.ps1 `
            -PublishDirectory artifacts/publish `
            -OutputDirectory artifacts/release

          [xml]$project = Get-Content 'src/JunhyunHelper.Desktop/JunhyunHelper.Desktop.csproj'
          $expectedVersion = [string]($project.Project.PropertyGroup.Version | Select-Object -First 1)
          $stableName = 'Junhyun-Helper.zip'
          $stablePath = Join-Path 'artifacts/release' $stableName
          $checksumPath = 'artifacts/release/SHA256SUMS.txt'

          foreach ($requiredPath in @($stablePath, $checksumPath)) {
            if (-not (Test-Path $requiredPath)) {
              throw "Required release artifact was not produced: $requiredPath"
            }
          }

          $expectedPackages = @($stableName)

          $checksumLines = @(Get-Content $checksumPath | Where-Object { -not [string]::IsNullOrWhiteSpace($_) })
          if ($checksumLines.Count -ne 1) {
            throw "SHA256SUMS.txt contains $($checksumLines.Count) entries; expected exactly one stable package entry."
          }

          foreach ($packageName in $expectedPackages) {
            $packagePath = Join-Path 'artifacts/release' $packageName
            $actualHash = (Get-FileHash $packagePath -Algorithm SHA256).Hash.ToLowerInvariant()
            $size = (Get-Item $packagePath).Length
            $matching = @($checksumLines | Where-Object {
              $_ -match '^([0-9a-fA-F]{64})\s+(.+)$' -and
              [string]::Equals($Matches[2], $packageName, [System.StringComparison]::Ordinal)
            })
            if ($matching.Count -ne 1) {
              throw "SHA256SUMS.txt does not contain exactly one entry for '$packageName'."
            }
            if ($matching[0] -notmatch '^([0-9a-fA-F]{64})\s+(.+)$') {
              throw "Invalid SHA256SUMS.txt entry for '$packageName'."
            }
            $publishedHash = $Matches[1].ToLowerInvariant()
            if (-not [string]::Equals($publishedHash, $actualHash, [System.StringComparison]::Ordinal)) {
              throw "Checksum mismatch for '$packageName'."
            }

            Write-Host "Release package: $packageName"
            Write-Host "Bytes: $size"
            Write-Host "SHA-256: $actualHash"
          }

          Write-Host "Stable extracted folder: 준현 헬퍼/"
          Write-Host "Checksum manifest: SHA256SUMS.txt"

      - name: Upload Windows x64 release candidate
        uses: actions/upload-artifact@v7
        with:
          name: JunhyunHelper-win-x64
          path: |
            artifacts/publish
            artifacts/release
          if-no-files-found: error
          retention-days: ${{ github.event_name == 'push' && 14 || 3 }}