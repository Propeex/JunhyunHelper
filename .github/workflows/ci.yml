name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  core-tests:
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build desktop
        run: dotnet build src/JunhyunHelper.Desktop/JunhyunHelper.Desktop.csproj --configuration Release

      - name: Test core
        run: dotnet test tests/JunhyunHelper.Tests/JunhyunHelper.Tests.csproj --configuration Release

      - name: Publish Windows x64 test build
        shell: pwsh
        run: |
          dotnet publish src/JunhyunHelper.Desktop/JunhyunHelper.Desktop.csproj `
            --configuration Release `
            --runtime win-x64 `
            --self-contained true `
            --output artifacts/publish `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:PublishTrimmed=false `
            -p:PublishReadyToRun=false `
            -p:DebugType=None `
            -p:DebugSymbols=false

          Copy-Item packaging/FIRST_RUN_KO.txt artifacts/publish/FIRST_RUN_KO.txt

          if (-not (Test-Path artifacts/publish/JunhyunHelper.exe)) {
            throw "Published JunhyunHelper.exe was not produced."
          }

          Get-Item artifacts/publish/JunhyunHelper.exe | Format-List Name,Length,LastWriteTime

      - name: Create test ZIP
        shell: pwsh
        run: |
          Compress-Archive `
            -Path artifacts/publish/* `
            -DestinationPath artifacts/JunhyunHelper-win-x64.zip `
            -Force

          if (-not (Test-Path artifacts/JunhyunHelper-win-x64.zip)) {
            throw "Test ZIP was not produced."
          }

          Get-Item artifacts/JunhyunHelper-win-x64.zip | Format-List Name,Length,LastWriteTime

      - name: Upload Windows x64 test build
        uses: actions/upload-artifact@v4
        with:
          name: JunhyunHelper-win-x64
          path: artifacts/JunhyunHelper-win-x64.zip
          if-no-files-found: error
          retention-days: ${{ github.event_name == 'push' && 14 || 3 }}
