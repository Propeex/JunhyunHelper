name: Release v1.3.4
# One-shot exact-source controller. Build and release only SOURCE_SHA.

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-v1.3.4.yml'

permissions:
  contents: write

env:
  SOURCE_SHA: a78ddbc649747f1320236556f17e6b908304674a
  RELEASE_VERSION: 1.3.4
  RELEASE_TAG: v1.3.4
  EXPECTED_TESTS: '267'
  FINAL_PR_CI: '32636665202'
  ASSET_NAME: Junhyun-Helper-v1.3.4-win-x64.zip
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  JUNHYUNHELPER_MAP_SMOKE: '1'

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - name: Checkout exact release source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 1

      - name: Checkout pinned public Map donor
        shell: pwsh
        run: |
          git config --local --unset-all http.https://github.com/.extraheader
          if ($LASTEXITCODE -notin @(0, 5)) { throw 'Could not clear repository-scoped GitHub auth header.' }
          git submodule sync --recursive
          if ($LASTEXITCODE -ne 0) { throw 'Could not synchronize submodule metadata.' }
          git submodule update --init --force --depth=1 --recursive
          if ($LASTEXITCODE -ne 0) { throw 'Could not checkout pinned public Map donor.' }
          $donor = (git -C vendor/Tarkov-Helper rev-parse HEAD).Trim()
          if ($donor -ne 'd933792b6042a51cea38dc44b686a096fe30de67') { throw "Pinned Map donor drifted to $donor." }

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build test publish release and verify exact public artifact
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          function Assert-Exit([string]$Message) {
            if ($LASTEXITCODE -ne 0) { throw "$Message (exit $LASTEXITCODE)." }
          }

          function Assert-Package([string]$Root) {
            foreach ($file in @('준현 헬퍼.exe','FIRST_RUN_KO.txt','Assets/tarkov_data.db')) {
              if (-not (Test-Path (Join-Path $Root $file))) { throw "Missing package file: $file" }
            }

            $rootNames = @(Get-ChildItem $Root | Select-Object -ExpandProperty Name | Sort-Object)
            $expectedRoot = @('Assets','FIRST_RUN_KO.txt','준현 헬퍼.exe') | Sort-Object
            if (Compare-Object $rootNames $expectedRoot) { throw "Package root mismatch: $($rootNames -join ', ')" }
            if (@(Get-ChildItem $Root -Recurse -File -Filter *.pdb).Count -gt 0) { throw 'Package contains PDB files.' }
            if (@(Get-ChildItem $Root -Recurse -File | Where-Object { $_.Extension -in @('.zip','.7z','.rar') }).Count -gt 0) { throw 'Package contains nested archives.' }

            foreach ($legacy in @(
              'AutoUpdater.NET.dll',
              'Microsoft.Web.WebView2.Core.dll',
              'Microsoft.Web.WebView2.WinForms.dll',
              'Microsoft.Web.WebView2.Wpf.dll',
              'WebView2Loader.dll',
              'Westermo.GraphX.Controls.dll',
              'Westermo.GraphX.Common.dll',
              'QuikGraph.dll')) {
              if (Get-ChildItem $Root -Recurse -File -Filter $legacy) { throw "Legacy dependency leaked into package: $legacy" }
            }

            $exe = Get-Item (Join-Path $Root '준현 헬퍼.exe')
            $expectedProduct = "$env:RELEASE_VERSION+$env:SOURCE_SHA"
            if ($exe.VersionInfo.ProductVersion -ne $expectedProduct) {
              throw "ProductVersion '$($exe.VersionInfo.ProductVersion)' != '$expectedProduct'."
            }
            $first = Get-Content (Join-Path $Root 'FIRST_RUN_KO.txt') -TotalCount 1
            if ($first -ne "준현 헬퍼 v$env:RELEASE_VERSION — Windows x64") { throw "FIRST_RUN identity mismatch: $first" }
          }

          function Invoke-ProductSmoke([string]$Root, [string]$Label) {
            $exe = (Resolve-Path (Join-Path $Root '준현 헬퍼.exe')).Path
            $diagnostic = Join-Path $env:TEMP 'junhyun-map-smoke-error.txt'
            $success = Join-Path $env:TEMP 'junhyun-map-smoke-success.txt'
            $startupLog = Join-Path $env:LOCALAPPDATA 'JunhyunHelper/logs/startup.log'
            Remove-Item $diagnostic,$success,$startupLog -Force -ErrorAction SilentlyContinue

            $process = Start-Process -FilePath $exe -WorkingDirectory $Root -PassThru
            try {
              $deadline = (Get-Date).AddSeconds(75)
              while ((Get-Date) -lt $deadline) {
                $process.Refresh()
                if (Test-Path $diagnostic) {
                  Write-Host "$Label product-smoke diagnostic:"
                  Get-Content $diagnostic | ForEach-Object { Write-Host $_ }
                  throw "$Label smoke diagnostic failure."
                }
                if (Test-Path $startupLog) {
                  Write-Host "$Label startup diagnostic:"
                  Get-Content $startupLog | ForEach-Object { Write-Host $_ }
                  throw "$Label startup failure."
                }
                if (Test-Path $success) { break }
                if ($process.HasExited) { throw "$Label exited before smoke completion: $($process.ExitCode)" }
                Start-Sleep -Milliseconds 250
              }

              if (-not (Test-Path $success)) { throw "$Label smoke timed out." }

              $closeRequested = $false
              for ($i = 0; $i -lt 10; $i++) {
                $process.Refresh()
                if ($process.HasExited -or $process.CloseMainWindow()) { $closeRequested = $true; break }
                Start-Sleep -Milliseconds 500
              }
              if (-not $closeRequested) { throw "$Label could not request normal MainWindow close." }

              $process.Refresh()
              if (-not $process.HasExited -and -not $process.WaitForExit(7000)) {
                throw "$Label did not terminate after normal close."
              }
              if (Test-Path (Join-Path $Root 'Logs')) { throw "$Label polluted the portable package root." }
            }
            finally {
              $process.Refresh()
              if (-not $process.HasExited) { Stop-Process -Id $process.Id -Force }
            }
          }

          $actual = (git rev-parse HEAD).Trim()
          if ($actual -ne $env:SOURCE_SHA) { throw "Release source drift: $actual" }

          [xml]$project = Get-Content 'src/JunhyunHelper.Desktop/JunhyunHelper.Desktop.csproj'
          $version = [string]($project.Project.PropertyGroup.Version | Select-Object -First 1)
          if ($version -ne $env:RELEASE_VERSION) { throw "Project version '$version' is not '$env:RELEASE_VERSION'." }
          $firstSource = Get-Content 'packaging/FIRST_RUN_KO.txt' -TotalCount 1
          if ($firstSource -ne "준현 헬퍼 v$env:RELEASE_VERSION — Windows x64") { throw "FIRST_RUN source identity mismatch: $firstSource" }

          gh release view $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY *> $null
          $releaseProbeExit = $LASTEXITCODE
          $global:LASTEXITCODE = 0
          if ($releaseProbeExit -eq 0) { throw "Release $env:RELEASE_TAG already exists." }
          gh api "repos/$env:GITHUB_REPOSITORY/git/ref/tags/$env:RELEASE_TAG" *> $null
          $tagProbeExit = $LASTEXITCODE
          $global:LASTEXITCODE = 0
          if ($tagProbeExit -eq 0) { throw "Tag $env:RELEASE_TAG already exists." }

          dotnet build src/JunhyunHelper.Desktop/JunhyunHelper.Desktop.csproj --configuration Release
          Assert-Exit 'Exact-source Release build failed'

          $testLines = @(dotnet test tests/JunhyunHelper.Tests/JunhyunHelper.Tests.csproj --configuration Release 2>&1)
          $testExit = $LASTEXITCODE
          $testLines | ForEach-Object { Write-Host $_ }
          if ($testExit -ne 0) { throw "Automated tests failed with exit code $testExit." }
          $summary = ($testLines | Where-Object { $_ -match 'Passed:\s+\d+.*Total:\s+\d+' } | Select-Object -Last 1)
          if (-not $summary -or
              $summary -notmatch 'Failed:\s+0' -or
              $summary -notmatch 'Skipped:\s+0' -or
              $summary -notmatch "Passed:\s+$env:EXPECTED_TESTS" -or
              $summary -notmatch "Total:\s+$env:EXPECTED_TESTS") {
            throw "Expected exactly $env:EXPECTED_TESTS passing tests: $summary"
          }

          Remove-Item artifacts -Recurse -Force -ErrorAction SilentlyContinue
          dotnet publish src/JunhyunHelper.Desktop/JunhyunHelper.Desktop.csproj `
            --configuration Release `
            --runtime win-x64 `
            --self-contained true `
            --output artifacts/publish `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true `
            -p:PublishTrimmed=false `
            -p:PublishReadyToRun=false `
            -p:DebugType=None `
            -p:DebugSymbols=false
          Assert-Exit 'Publish failed'
          Copy-Item packaging/FIRST_RUN_KO.txt artifacts/publish/FIRST_RUN_KO.txt
          Assert-Package (Resolve-Path artifacts/publish).Path
          Invoke-ProductSmoke (Resolve-Path artifacts/publish).Path 'Exact-source publish'

          New-Item -ItemType Directory -Force artifacts/release | Out-Null
          $zip = Join-Path artifacts/release $env:ASSET_NAME
          Compress-Archive -Path 'artifacts/publish/*' -DestinationPath $zip -CompressionLevel Optimal
          $releaseHash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          $releaseBytes = (Get-Item $zip).Length
          "$releaseHash  $env:ASSET_NAME" | Set-Content -NoNewline -Encoding utf8NoBOM artifacts/release/SHA256SUMS.txt

          $draftCreated = $false
          $published = $false
          try {
            $notes = @"
          Scanner v1.3.4 is a live-recognition reliability patch built from actual Tarkov feedback.

          - one embedded OCR glyph rendered as impossible punctuation is preserved as unknown evidence, never hard-coded to a specific letter
          - unknown-glyph recovery requires exactly one complete-current-catalog candidate and a conservative global runner-up margin
          - the magnifier is now selected only inside the fixed frame-left search-icon lane using a normalized ring/hollow/handle template
          - the red close/X combines color, geometry, and diagonal-X shape evidence
          - only full HEADER_FRAME_LOCKED candidates reach OCR identity resolution
          - selected detail bounds are realigned from the locked header instead of preserving structural drift
          - user-exported diagnostic PNGs include detail/title/magnifier/close color rectangles
          - normal confidence/top1-top2 margin, highest trader price, flea avg24hPrice, RequiredTotal, and all schemas remain unchanged
          "@

            gh release create $env:RELEASE_TAG `
              $zip `
              'artifacts/release/SHA256SUMS.txt' `
              --repo $env:GITHUB_REPOSITORY `
              --target $env:SOURCE_SHA `
              --title "준현 헬퍼 $env:RELEASE_TAG" `
              --notes $notes `
              --draft
            Assert-Exit 'Draft release creation failed'
            $draftCreated = $true

            New-Item -ItemType Directory -Force artifacts/draft-download | Out-Null
            gh release download $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --dir artifacts/draft-download --clobber
            Assert-Exit 'Draft asset download failed'
            $draftZip = Join-Path artifacts/draft-download $env:ASSET_NAME
            $draftHash = (Get-FileHash $draftZip -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($draftHash -ne $releaseHash -or (Get-Item $draftZip).Length -ne $releaseBytes) { throw 'Draft asset hash/size mismatch.' }
            New-Item -ItemType Directory -Force artifacts/draft-extracted | Out-Null
            Expand-Archive $draftZip artifacts/draft-extracted -Force
            Assert-Package (Resolve-Path artifacts/draft-extracted).Path
            Invoke-ProductSmoke (Resolve-Path artifacts/draft-extracted).Path 'Draft-downloaded EXE'

            gh release edit $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --draft=false --latest
            Assert-Exit 'Could not publish release'
            $published = $true

            $ref = gh api "repos/$env:GITHUB_REPOSITORY/git/ref/tags/$env:RELEASE_TAG" | ConvertFrom-Json
            Assert-Exit 'Could not read public tag ref'
            $tagSha = [string]$ref.object.sha
            if ([string]$ref.object.type -eq 'tag') {
              $tagObject = gh api "repos/$env:GITHUB_REPOSITORY/git/tags/$tagSha" | ConvertFrom-Json
              Assert-Exit 'Could not dereference annotated public tag'
              $tagSha = [string]$tagObject.object.sha
            }
            if ($tagSha -ne $env:SOURCE_SHA) { throw "Public tag points to '$tagSha', not '$env:SOURCE_SHA'." }

            $latest = (gh api "repos/$env:GITHUB_REPOSITORY/releases/latest" --jq '.tag_name').Trim()
            Assert-Exit 'Could not read latest public release'
            if ($latest -ne $env:RELEASE_TAG) { throw "Latest release is '$latest', not '$env:RELEASE_TAG'." }

            New-Item -ItemType Directory -Force artifacts/public-download | Out-Null
            gh release download $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --dir artifacts/public-download --clobber
            Assert-Exit 'Public asset download failed'
            $publicZip = Join-Path artifacts/public-download $env:ASSET_NAME
            $publicHash = (Get-FileHash $publicZip -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($publicHash -ne $releaseHash -or (Get-Item $publicZip).Length -ne $releaseBytes) { throw 'Public asset hash/size mismatch.' }

            $sumLine = Get-Content (Join-Path artifacts/public-download 'SHA256SUMS.txt') | Where-Object { $_ -match [Regex]::Escape($env:ASSET_NAME) } | Select-Object -First 1
            if ($sumLine -notmatch '^([0-9a-fA-F]{64})\s{2,}(.+)$' -or $Matches[1].ToLowerInvariant() -ne $publicHash) {
              throw 'Public SHA256SUMS does not match ZIP.'
            }

            New-Item -ItemType Directory -Force artifacts/public-extracted | Out-Null
            Expand-Archive $publicZip artifacts/public-extracted -Force
            Assert-Package (Resolve-Path artifacts/public-extracted).Path
            Invoke-ProductSmoke (Resolve-Path artifacts/public-extracted).Path 'Public-downloaded EXE'

            $record = [ordered]@{
              version = $env:RELEASE_TAG
              source_sha = $env:SOURCE_SHA
              tag_sha = $tagSha
              asset = $env:ASSET_NAME
              bytes = [long]$releaseBytes
              sha256 = $releaseHash
              product_version = "$env:RELEASE_VERSION+$env:SOURCE_SHA"
              tests = [int]$env:EXPECTED_TESTS
              final_pr_ci = [long]$env:FINAL_PR_CI
              release_run = [long]$env:GITHUB_RUN_ID
              draft_redownload_verified = $true
              draft_exe_smoke = 'SUCCESS'
              public_latest_verified = $true
              exact_tag_source_verified = $true
              public_redownload_verified = $true
              public_exe_smoke = 'SUCCESS'
            }
            $record | ConvertTo-Json | Set-Content -Encoding utf8NoBOM artifacts/release-v1.3.4-status.json
            Write-Host "PUBLIC_RELEASE_VERIFIED $($record | ConvertTo-Json -Compress)"
          }
          catch {
            if ($draftCreated -and -not $published) {
              gh release delete $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --yes --cleanup-tag *> $null
              $global:LASTEXITCODE = 0
            }
            throw
          }

      - name: Upload release verification evidence
        uses: actions/upload-artifact@v4
        with:
          name: release-v1.3.4-verification
          path: |
            artifacts/release-v1.3.4-status.json
            artifacts/release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
