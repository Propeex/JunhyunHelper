name: Probe v1.6.0 Release State

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/probe-v1.6.0-release.yml'

permissions:
  contents: write
  actions: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Record current workflow state
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $repo = $env:GITHUB_REPOSITORY
          $finalizer = gh api "repos/$repo/actions/workflows/finalize-v1.6.0-release-v3.yml/runs?per_page=5" | ConvertFrom-Json
          $f = @($finalizer.workflow_runs | Sort-Object created_at -Descending | Select-Object -First 1)[0]
          $status = [ordered]@{
            observed_at_utc = [DateTime]::UtcNow.ToString('o')
            finalizer_run_id = if ($null -ne $f) { [long]$f.id } else { $null }
            finalizer_status = if ($null -ne $f) { [string]$f.status } else { $null }
            finalizer_conclusion = if ($null -ne $f) { [string]$f.conclusion } else { $null }
            finalizer_head_sha = if ($null -ne $f) { [string]$f.head_sha } else { $null }
          }
          $json = $status | ConvertTo-Json
          $encoded = [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes($json))
          $path = "repos/$repo/contents/docs/.v1.6.0-release-probe.json"
          $existing = gh api $path 2>$null
          $sha = $null
          if ($LASTEXITCODE -eq 0) { $sha = ($existing | ConvertFrom-Json).sha }
          $args = @('--method','PUT',$path,'-f','message=Record v1.6.0 release workflow state','-f',"content=$encoded",'-f','branch=main')
          if ($sha) { $args += @('-f',"sha=$sha") }
          gh api @args | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'Could not persist release probe.' }
          $status | Format-List

      # refresh: 2026-08-24T08:48Z
