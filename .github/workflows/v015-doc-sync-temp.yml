name: Sync v0.1.5 public release docs

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v015-doc-sync-temp.yml'

permissions:
  contents: write

jobs:
  sync-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Record verified public release
        shell: python
        run: |
          import re
          from pathlib import Path

          release_sha = '2ff504c24661b6e37ec40e685dd344ce5581350f'
          branch_ci = '31863894702'
          main_ci = '31864041783'
          release_run = '31864223946'
          public_hash = '565bf0ad01ac9ec8385e99b26aa692e0962550a0c975a889e4b56ad33a6a41f7'
          release_url = 'https://github.com/Propeex/JunhyunHelper/releases/tag/v0.1.5'

          def replace_required(text, old, new, label):
              if old not in text:
                  raise RuntimeError(f'missing expected text for {label}')
              return text.replace(old, new, 1)

          # README
          path = Path('README.md')
          text = path.read_text(encoding='utf-8')
          text = replace_required(
              text,
              '**v0.1.5 RELEASE CANDIDATE — Windows x64**\n\n현재 공개 버전은 **v0.1.4**입니다.\n\n**현재 공개 다운로드:** https://github.com/Propeex/JunhyunHelper/releases/tag/v0.1.4',
              '**v0.1.5 PUBLIC RELEASE — Windows x64**\n\n현재 공개 버전은 **v0.1.5**입니다.\n\n**현재 공개 다운로드:** https://github.com/Propeex/JunhyunHelper/releases/tag/v0.1.5',
              'README public status')
          text = replace_required(text, '## v0.1.5 Map 회귀 패치 후보', '## v0.1.5 Map 회귀 패치', 'README v0.1.5 heading')
          anchor = 'v0.1.5에서는 floor up/down과 NumPad 직접 층 선택 모두 변경 직전의 live zoom + map-space 중심을 저장하고 floor render 뒤 복원합니다. 층을 바꿔도 Main Map과 MiniMap에서 보고 있던 위치가 유지되어야 합니다.\n'
          release_block = f'''\n공개 릴리즈 검증:\n\n```text\nrelease baseline: {release_sha}\nbranch CI: {branch_ci} — SUCCESS\nmain CI: {main_ci} — SUCCESS\nrelease workflow: {release_run} — SUCCESS\n177 tests passed / 0 failed\nWindows x64 self-contained single-file publish: SUCCESS\nMain Map off-floor async-settle smoke: SUCCESS\nFactory Gate 3 / Office Window smoke: SUCCESS\nMiniMap floor viewport preservation smoke: SUCCESS\nnormal Main Window close / process exit: SUCCESS\nasset: Junhyun-Helper-v0.1.5-win-x64.zip\nSHA-256: {public_hash}\nrelease: {release_url}\n```\n'''
          text = replace_required(text, anchor, anchor + release_block, 'README release verification')
          path.write_text(text, encoding='utf-8')

          # STATE
          path = Path('docs/STATE.md')
          text = path.read_text(encoding='utf-8')
          old_status = '''**v0.1.5 RELEASE CANDIDATE — Main Map 타층 marker + MiniMap floor viewport 회귀 패치 / Windows x64**\n\n현재 공개 릴리즈는 **v0.1.4**입니다. v0.1.5는 v0.1.4 실사용에서 확인된 두 Map 회귀를 수정합니다.\n\n1. 다른 층 일반 marker가 잠깐 보인 뒤 깜박이며 사라짐\n2. 층 변경 시 MiniMap의 현재 지도 중심이 초기/이전 위치로 돌아감\n\n```text\nfeature PR: #82 OPEN\nbranch: agent/fix-off-floor-marker-flicker-2026-08-15\nDesktop ProductVersion: 0.1.5\nContent schema: unchanged (v5)\nuser.db schema: unchanged\nrequired data update from v0.1.4: none\npublic v0.1.5 release: PENDING final CI + merge + exact-baseline release gate\n```'''
          new_status = f'''**v0.1.5 PUBLIC RELEASE — Main Map 타층 marker + MiniMap floor viewport 회귀 패치 / Windows x64**\n\n현재 공개 릴리즈는 **v0.1.5**입니다. v0.1.4 실사용에서 확인된 두 Map 회귀를 수정했습니다.\n\n1. 다른 층 일반 marker가 잠깐 보인 뒤 깜박이며 사라지는 문제\n2. 층 변경 시 MiniMap의 현재 지도 중심이 초기/이전 위치로 돌아가는 문제\n\n```text\nfeature PR: #82 MERGED\nrelease baseline: {release_sha}\nDesktop ProductVersion: 0.1.5\nContent schema: unchanged (v5)\nuser.db schema: unchanged\nrequired data update from v0.1.4: none\nbranch CI: {branch_ci} — SUCCESS\nmain CI: {main_ci} — SUCCESS\nrelease workflow: {release_run} — SUCCESS\npublic asset SHA-256: {public_hash}\nrelease: {release_url}\n```'''
          text = replace_required(text, old_status, new_status, 'STATE status')

          validation = f'''### v0.1.5 검증 상태\n\n최종 변경 범위와 exact release baseline에서 전체 검증을 완료했습니다.\n\n```text\nrelease baseline: {release_sha}\nbranch CI: {branch_ci} — SUCCESS\nmain CI: {main_ci} — SUCCESS\nrelease workflow: {release_run} — SUCCESS\nDesktop Release build: SUCCESS\nautomated tests: 177 passed / 0 failed\nWindows x64 self-contained single-file publish: SUCCESS\nactual MapMarkersContainer off-floor standard-marker async-settle assertion: SUCCESS\nFactory Gate 3 / Office Window regression smoke: SUCCESS\nMain Map floor-hotkey zoom + map-space viewport-center preservation: SUCCESS\nMiniMap stale-offset floor viewport preservation: SUCCESS\nMiniMap marker-scale / floor runtime smoke: SUCCESS\nnormal Main Window close / process exit: SUCCESS\npublic ZIP re-download + SHA-256 verification: SUCCESS\npublic SHA-256: {public_hash}\n```\n'''
          text, count = re.subn(r'### v0\.1\.5 검증 상태\n\n.*?\n상세:', validation + '\n상세:', text, count=1, flags=re.S)
          if count != 1:
              raise RuntimeError('failed to replace STATE validation section')

          current_release = f'''## 현재 공개 릴리즈 — v0.1.5\n\n릴리즈일: **2026-08-15**\n\n```text\nrelease baseline: {release_sha}\npublic asset: Junhyun-Helper-v0.1.5-win-x64.zip\npublic SHA-256: {public_hash}\nrelease workflow: {release_run} — SUCCESS\nrelease: {release_url}\n```\n\nv0.1.5의 현재 Map 제품 기준:\n\n- floor는 marker visibility filter가 아니라 presentation relation\n- enabled 타층 일반 marker는 same-type/near-XZ라도 각각 유지\n- current/above/below 초록/빨강/파랑 compact ring, known off-floor 약 75% opacity\n- legacy current-floor-only filter와 cross-floor vertical-stack suppression은 제품 경로에서 비활성\n- Factory `Gate 3` 같은 실제 동일 물리 semantic duplicate extract 정규화는 유지\n- MiniMap floor 변경은 live zoom + map-space viewport center를 보존\n- 빠른 연속 floor 변경에서 superseded render cancellation은 정상 처리\n- v0.1.4의 Quest `확인 필요` 정확도 정책과 Future Needed Items 보수 보호 유지\n\n'''
          text, count = re.subn(r'## 현재 공개 릴리즈 — v0\.1\.4\n\n.*?(?=## v0\.1\.3 변경)', current_release, text, count=1, flags=re.S)
          if count != 1:
              raise RuntimeError('failed to replace STATE current release section')
          text = text.replace(
              '| Map + MiniMap | 구현 완료 / v0.1.5 off-floor marker + MiniMap floor viewport regression patch 검증 중 |',
              '| Map + MiniMap | 구현 완료 / v0.1.5 off-floor marker + MiniMap floor viewport regression patch 공개 완료 |')
          path.write_text(text, encoding='utf-8')

          # RELEASE_0.1.5
          path = Path('docs/RELEASE_0.1.5.md')
          text = path.read_text(encoding='utf-8')
          text = replace_required(text, '상태: **RELEASE CANDIDATE / PUBLIC RELEASE PENDING**', '상태: **PUBLIC RELEASE / VERIFIED**', 'release doc status')
          final_record = f'''## 최종 공개 검증 기록\n\n```text\nPR: #82 — MERGED\nrelease baseline: {release_sha}\nbranch CI run: {branch_ci} — SUCCESS\nmain CI run: {main_ci} — SUCCESS\nrelease workflow run: {release_run} — SUCCESS\nDesktop ProductVersion: 0.1.5\nautomated tests: 177 passed / 0 failed\nWindows x64 self-contained single-file publish: SUCCESS\nMain Map off-floor standard-marker async-settle smoke: SUCCESS\nFactory Gate 3 / Office Window regression smoke: SUCCESS\nMain Map viewport preservation smoke: SUCCESS\nMiniMap stale-offset floor viewport preservation smoke: SUCCESS\nMiniMap marker-scale/floor runtime smoke: SUCCESS\ngraceful shutdown: SUCCESS\npublic asset: Junhyun-Helper-v0.1.5-win-x64.zip\npublic SHA-256: {public_hash}\npublic ZIP re-download + SHA-256 verification: SUCCESS\ndraft: false\nprerelease: false\nrelease: {release_url}\n```\n\n`v0.1.4 → v0.1.5` 업그레이드에는 필수 데이터 업데이트가 없습니다. Content schema v5와 `user.db` schema는 변경하지 않았으며 기존 사용자 진행과 Map 설정을 유지합니다.\n'''
          text, count = re.subn(r'## 현재 검증 기록\n\n.*\Z', final_record, text, count=1, flags=re.S)
          if count != 1:
              raise RuntimeError('failed to replace final release record')
          path.write_text(text, encoding='utf-8')

      - name: Commit synchronized docs
        shell: bash
        run: |
          git diff --check
          git diff -- README.md docs/STATE.md docs/RELEASE_0.1.5.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md docs/STATE.md docs/RELEASE_0.1.5.md
          git commit -m 'Record public v0.1.5 release'
          git push origin HEAD:main
