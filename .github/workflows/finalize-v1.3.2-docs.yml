## Scanner v1.3.2

v1.3.1 공개 후 실제 Tarkov/DisplayTest에서 확인된 추가 title-recognition 실패를 보강했습니다.

```text
pixels
→ detail structural candidate
→ title field + red close/X
→ magnifier morphology / left-header association
→ magnifier-free title ROI
→ Windows ko-KR OCR
→ current-catalog-derived symbol sanitation
→ exact / conservative fuzzy matcher
→ unique bounded 1-edit recovery when safe
→ optional strict Tarkov-font visual corroboration
→ Item ID or fail closed
→ local presentation data
→ Mini Scanner
```

핵심 변경:

- magnifier 뒤 title glyph segmentation은 corroboration이며 필수조건이 아님
- current official Korean catalog에 없는 OCR punctuation/symbol 제거
- 1-edit recovery는 normalized length >= 7, current catalog 전체 유일 후보, global runner-up margin >= 10%p일 때만 허용
- multi-edit low-confidence OCR은 strict visual corroboration 없이 확정 금지
- 최고 상점가 / flea `avg24hPrice` / `RequiredTotal` 의미와 schema 변경 없음

