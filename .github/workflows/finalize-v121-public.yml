name: Finalize v1.2.1 public release

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/finalize-v121-public.yml'

permissions:
  contents: write

concurrency:
  group: finalize-v121-public
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_SHA: 8c0de649f18d7caa4f5669a06511c15e784dfd29
      PUBLIC_SHA256: 48a8b54fcdc3346a092ef3da2744f2d4ca7e27d99da5b52e3ebee7b55fa0affa
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Verify canonical public release
        shell: bash
        run: |
          set -euo pipefail
          latest="$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq '.tag_name')"
          test "$latest" = "v1.2.1"
          tag_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v1.2.1" --jq '.object.sha')"
          tag_type="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v1.2.1" --jq '.object.type')"
          if [ "$tag_type" = "tag" ]; then
            tag_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$tag_sha" --jq '.object.sha')"
          fi
          test "$tag_sha" = "$SOURCE_SHA"
          rm -rf /tmp/v121-public && mkdir -p /tmp/v121-public
          gh release download v1.2.1 --repo "$GITHUB_REPOSITORY" --pattern 'Junhyun-Helper-v1.2.1-win-x64.zip' --dir /tmp/v121-public
          actual="$(sha256sum /tmp/v121-public/Junhyun-Helper-v1.2.1-win-x64.zip | awk '{print $1}')"
          test "$actual" = "$PUBLIC_SHA256"

      - name: Remove duplicate draft release
        shell: bash
        run: |
          set -euo pipefail
          ids="$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '.[] | select(.draft == true and .tag_name == "v1.2.1") | .id')"
          if [ -n "$ids" ]; then
            while read -r id; do
              [ -n "$id" ] || continue
              gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/$id"
            done <<< "$ids"
          fi

      - name: Finalize docs and remove one-shot files
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/finalize-v121.py
          git rm -f .github/workflows/release-v1.2.1.yml
          git rm -f docs/.release-v1.2.1-status.json
          git rm -f .github/scripts/finalize-v121.py
          git rm -f .github/workflows/finalize-v121-public.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md docs/RELEASE_1.2.1.md docs/STATE.md docs/CURRENT_STATE.md docs/SCANNER.md docs/SCANNER_TEST_PLAN.md docs/ARCHITECTURE.md
          git commit -m 'Finalize v1.2.1 public release records'
          git push origin HEAD:main
