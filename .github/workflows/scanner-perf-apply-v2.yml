name: Run Scanner performance patch script

on:
  push:
    branches:
      - perf/v1.7.3-scanner-latency-2026-08-25

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[scanner-perf-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/v1.7.3-scanner-latency-2026-08-25
          fetch-depth: 0
      - name: Apply patch
        run: python tools/scanner_perf_apply.py
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src tests docs packaging
          git commit -m "Optimize Scanner latency without relaxing recognition [scanner-perf-applied]"
          git push origin HEAD:perf/v1.7.3-scanner-latency-2026-08-25
