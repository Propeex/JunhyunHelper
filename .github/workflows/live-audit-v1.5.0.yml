name: Temporary v1.5.0 live data audit

on:
  pull_request:
  workflow_dispatch:

jobs:
  live-data-audit:
    if: github.event.pull_request.number == 172 || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Audit current json.tarkov.dev shapes
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $poolRules = @{
            '6a20540cf1b67a977cc5a088' = @{ trader='54cb50c76803fa8b248b4571'; ll=1; count=8; thresholds=@(1,3,5); seeds=0 }
            '6a2688488bba18e0b0187a04' = @{ trader='54cb50c76803fa8b248b4571'; ll=2; count=6; thresholds=@(3,5); seeds=4 }
            '6a32651a811905ed0cac0973' = @{ trader='54cb50c76803fa8b248b4571'; ll=3; count=6; thresholds=@(1,3); seeds=5 }
            '6a326525789ae12ecb0b2807' = @{ trader='54cb50c76803fa8b248b4571'; ll=4; count=5; thresholds=@(1,2); seeds=4 }
            '6a4e4ab3ecd1145894d00990' = @{ trader='54cb57776803fa99248b456e'; ll=1; count=6; thresholds=@(1,2,4); seeds=0 }
            '6a4e4aed3ded7a18126603f6' = @{ trader='54cb57776803fa99248b456e'; ll=2; count=6; thresholds=@(1,2,4); seeds=4 }
            '6a4e4b28629dc64c4001967c' = @{ trader='54cb57776803fa99248b456e'; ll=3; count=5; thresholds=@(1,3); seeds=4 }
            '6a56925b1c30ba5a77c7c518' = @{ trader='54cb57776803fa99248b456e'; ll=4; count=1; thresholds=@(1); seeds=3 }
            '6a59f3ba06c8949abad30871' = @{ trader='58330581ace78e27b8b10cee'; ll=1; count=8; thresholds=@(1,2,3); seeds=0 }
            '6a5a111de1f417ac80a163e5' = @{ trader='58330581ace78e27b8b10cee'; ll=2; count=9; thresholds=@(1,3,4); seeds=3 }
            '6a5a115181116e807b55f258' = @{ trader='58330581ace78e27b8b10cee'; ll=3; count=6; thresholds=@(1,3); seeds=3 }
            '6a5a1192efde11cc7105b18f' = @{ trader='58330581ace78e27b8b10cee'; ll=4; count=2; thresholds=@(1); seeds=4 }
            '6a5ba40fe5c4eaef5610f232' = @{ trader='5935c25fb3acc3127c3d8cd9'; ll=1; count=6; thresholds=@(1,3); seeds=0 }
            '6a5ba450a7851e16ce0bde44' = @{ trader='5935c25fb3acc3127c3d8cd9'; ll=2; count=9; thresholds=@(1,3,5); seeds=4 }
            '6a5ba48b8cfd0bddb3d4d2e1' = @{ trader='5935c25fb3acc3127c3d8cd9'; ll=3; count=4; thresholds=@(2,4); seeds=5 }
            '6a5ba4c57cbb93b629051591' = @{ trader='5935c25fb3acc3127c3d8cd9'; ll=4; count=7; thresholds=@(1,3); seeds=3 }
            '6a3171c927ca9591bf4db1c4' = @{ trader='5a7c2eca46aef81a7ca2145d'; ll=1; count=6; thresholds=@(1,3); seeds=0 }
            '6a3c0fefbea2d2ad581c090b' = @{ trader='5a7c2eca46aef81a7ca2145d'; ll=2; count=10; thresholds=@(1,3,5); seeds=4 }
            '6a3cf95c6b35530c4a4f532e' = @{ trader='5a7c2eca46aef81a7ca2145d'; ll=3; count=12; thresholds=@(1,3,5); seeds=5 }
            '6a3d1c0990e9ffe15463e961' = @{ trader='5a7c2eca46aef81a7ca2145d'; ll=4; count=2; thresholds=@(1); seeds=5 }
            '6a4b339f18db62e03b4f7ded' = @{ trader='5ac3b934156ae10c4430e83c'; ll=1; count=6; thresholds=@(1,2); seeds=0 }
            '6a4b4e6a30dac4b01af220aa' = @{ trader='5ac3b934156ae10c4430e83c'; ll=2; count=7; thresholds=@(1,2,4); seeds=4 }
            '6a4b9c9a60b56d421cceea18' = @{ trader='5ac3b934156ae10c4430e83c'; ll=3; count=3; thresholds=@(1,2); seeds=5 }
            '6a43a01ccc83aceedd35f09c' = @{ trader='5c0647fdd443bc2504c2d371'; ll=1; count=8; thresholds=@(1,3); seeds=0 }
            '6a43a095bfef0cd74c298963' = @{ trader='5c0647fdd443bc2504c2d371'; ll=2; count=4; thresholds=@(2,5); seeds=6 }
            '6a43a13633c97d216dfc85de' = @{ trader='5c0647fdd443bc2504c2d371'; ll=3; count=7; thresholds=@(2,4); seeds=8 }
            '6a43a16dde81644a7951f31b' = @{ trader='5c0647fdd443bc2504c2d371'; ll=4; count=3; thresholds=@(1); seeds=5 }
          }

          foreach ($mode in @('regular','pve','pvp-season')) {
            Write-Host "=== MODE $mode ==="
            $tasks = Invoke-RestMethod "https://json.tarkov.dev/$mode/tasks"
            $items = Invoke-RestMethod "https://json.tarkov.dev/$mode/items"
            $questList = @($tasks.data.tasks.PSObject.Properties | ForEach-Object { $_.Value })
            $itemList = @($items.data.items.PSObject.Properties | ForEach-Object { $_.Value })
            if ($itemList.Count -eq 0 -and $items.data.items -is [System.Array]) { $itemList = @($items.data.items) }

            Write-Host "quests=$($questList.Count) items=$($itemList.Count)"
            $other = @($questList | ForEach-Object { @($_.otherRequirements) } | Where-Object { $_ -ne $null })
            $types = $other | Group-Object type | Sort-Object Count -Descending
            Write-Host 'otherRequirements by type:'
            $types | ForEach-Object { Write-Host "  $($_.Name)=$($_.Count)" }

            $delayed = @($questList | Where-Object { [int]$_.availableDelaySecondsMax -gt 0 })
            Write-Host "delayedQuests=$($delayed.Count)"

            $dialogueQuests = @($questList | Where-Object {
              @($_.otherRequirements | Where-Object { $_.type -eq 'dialogue' }).Count -gt 0
            })
            Write-Host "dialogueQuests=$($dialogueQuests.Count)"
            foreach ($q in $dialogueQuests) {
              $dialogue = @($q.otherRequirements | Where-Object { $_.type -eq 'dialogue' })
              $reqs = @($q.taskRequirements)
              $dialogueSummary = ($dialogue | ForEach-Object { "traders=" + (@($_.traders) -join ',') }) -join ';'
              $reqSummary = ($reqs | ForEach-Object { "$($_.task):$(@($_.status)-join ',')" }) -join ';'
              Write-Host "DIALOGUE|$($q.id)|$($q.name)|giver=$($q.trader)|taskReq=$reqSummary|$dialogueSummary"
            }

            $globalQuestRows = @()
            foreach ($q in $questList) {
              foreach ($g in @($q.otherRequirements | Where-Object { $_.type -eq 'globalVariable' })) {
                $globalQuestRows += [pscustomobject]@{ Quest=$q; QuestId=$q.id; VariableId=$g.variableId; Value=[int]$g.value; CompareMethod=$g.compareMethod }
              }
            }
            Write-Host "globalVariableRequirements=$($globalQuestRows.Count) uniqueVariables=$((@($globalQuestRows | Select-Object -ExpandProperty VariableId -Unique)).Count)"
            foreach ($group in $globalQuestRows | Group-Object VariableId | Sort-Object Name) {
              $questsForVar = @($group.Group | Group-Object QuestId | ForEach-Object { $_.Group[0].Quest })
              $thresholds = @($group.Group | Select-Object -ExpandProperty Value -Unique | Sort-Object)
              $traders = @($questsForVar | Select-Object -ExpandProperty trader -Unique)
              $badCompare = @($group.Group | Where-Object { $_.CompareMethod -ne '>=' }).Count
              $extraAvailability = 0
              foreach ($q in $questsForVar) {
                $globalCount = @($q.otherRequirements | Where-Object { $_.type -eq 'globalVariable' }).Count
                $otherCount = @($q.otherRequirements).Count
                if (@($q.taskRequirements).Count -gt 0 -or @($q.traderRequirements).Count -gt 0 -or $globalCount -ne 1 -or $otherCount -ne 1) {
                  $extraAvailability++
                }
              }
              $expected = $poolRules[$group.Name]
              $expectedText = if ($null -eq $expected) { 'NEW_VARIABLE' } else { "expectedCount=$($expected.count),expectedThresholds=$($expected.thresholds -join ','),expectedTrader=$($expected.trader),LL=$($expected.ll)" }
              Write-Host "POOL|$($group.Name)|count=$($questsForVar.Count)|thresholds=$($thresholds -join ',')|traders=$($traders -join ',')|badCompare=$badCompare|extraAvailability=$extraAvailability|questIds=$((@($questsForVar | Select-Object -ExpandProperty id)) -join ',')|$expectedText"

              if ($null -ne $expected) {
                $seeds = @($questList | Where-Object {
                  $q = $_
                  $hasAnyGlobal = @($q.otherRequirements | Where-Object { $_.type -eq 'globalVariable' }).Count -gt 0
                  $sameTraderLevel = @($q.traderRequirements | Where-Object {
                    $_.requirementType -eq 'level' -and $_.trader -eq $expected.trader -and [int]$_.value -eq [int]$expected.ll
                  }).Count -gt 0
                  $q.trader -eq $expected.trader -and -not $hasAnyGlobal -and $sameTraderLevel
                })
                Write-Host "SEEDS|$($group.Name)|actual=$($seeds.Count)|expected=$($expected.seeds)|ids=$((@($seeds | Select-Object -ExpandProperty id)) -join ',')"
              }
            }

            $study = @($questList | ForEach-Object { @($_.otherRequirements | Where-Object { $_.type -eq 'studyItems' }) })
            Write-Host "studyItemsRequirements=$($study.Count)"

            $withStaticTrader = @($itemList | Where-Object { @($_.sellToTrader).Count -gt 0 })
            $withLegacyTrader = @($itemList | Where-Object { @($_.traderPrices).Count -gt 0 })
            $withFlea = @($itemList | Where-Object { [int]$_.avg24hPrice -gt 0 })
            Write-Host "itemsWithSellToTrader=$($withStaticTrader.Count) itemsWithTraderPrices=$($withLegacyTrader.Count) itemsWithFleaAvg=$($withFlea.Count)"
            foreach ($item in $withStaticTrader | Select-Object -First 2) {
              Write-Host "ITEM_SAMPLE|$($item.id)|$($item.name)|sellToTrader=$((@($item.sellToTrader) | ConvertTo-Json -Compress -Depth 5))"
            }
          }