name: Finalize v1.2.2 Public Verification
# One-shot independent public-package verifier. Remove after docs are finalized.

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/finalize-v122-public.yml'

permissions:
  contents: write
  actions: read

jobs:
  verify-public:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      RELEASE_VERSION: 1.2.2
      RELEASE_TAG: v1.2.2
      SOURCE_SHA: e3925cbc55215c7de0502c9b6b1ff1428d2f272b
      RELEASE_WORKFLOW: release-v1.2.2.yml
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      JUNHYUNHELPER_MAP_SMOKE: '1'

    steps:
      - name: Checkout main for status publication
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Wait for successful release controller and public latest
        shell: pwsh
        run: |
          $releaseRunId = $null
          $publishedAt = $null
          $ready = $false

          for ($attempt = 1; $attempt -le 60; $attempt++) {
            $runs = gh api "repos/$env:GITHUB_REPOSITORY/actions/workflows/$env:RELEASE_WORKFLOW/runs?event=push&branch=main&per_page=10" | ConvertFrom-Json
            $successful = @($runs.workflow_runs | Where-Object { $_.conclusion -eq 'success' } | Select-Object -First 1)
            if ($successful.Count -gt 0) {
              $releaseRunId = [string]$successful[0].id
            }

            $releaseJson = $null
            try {
              $releaseJson = gh api "repos/$env:GITHUB_REPOSITORY/releases/tags/$env:RELEASE_TAG" 2>$null | ConvertFrom-Json
            }
            catch {
              $releaseJson = $null
            }

            $latestTag = $null
            try {
              $latestTag = (gh api "repos/$env:GITHUB_REPOSITORY/releases/latest" --jq '.tag_name' 2>$null).Trim()
            }
            catch {
              $latestTag = $null
            }

            if ($releaseRunId -and $releaseJson -and -not [bool]$releaseJson.draft -and -not [bool]$releaseJson.prerelease -and $latestTag -eq $env:RELEASE_TAG) {
              if ([string]$releaseJson.target_commitish -ne $env:SOURCE_SHA) {
                throw "Public release target_commitish '$($releaseJson.target_commitish)' does not match '$env:SOURCE_SHA'."
              }
              $publishedAt = [string]$releaseJson.published_at
              $ready = $true
              break
            }

            Start-Sleep -Seconds 5
          }

          if (-not $ready) {
            throw 'v1.2.2 did not reach successful-controller + public/latest state within the verification window.'
          }

          "RELEASE_RUN_ID=$releaseRunId" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "PUBLISHED_AT=$publishedAt" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "RELEASE_RUN_ID=$releaseRunId"
          Write-Host "PUBLISHED_AT=$publishedAt"

      - name: Verify exact public tag source
        shell: pwsh
        run: |
          $ref = gh api "repos/$env:GITHUB_REPOSITORY/git/ref/tags/$env:RELEASE_TAG" | ConvertFrom-Json
          $tagSha = [string]$ref.object.sha
          if ([string]$ref.object.type -eq 'tag') {
            $tagObject = gh api "repos/$env:GITHUB_REPOSITORY/git/tags/$tagSha" | ConvertFrom-Json
            $tagSha = [string]$tagObject.object.sha
          }
          if ($tagSha -ne $env:SOURCE_SHA) { throw "Public tag points to $tagSha instead of $env:SOURCE_SHA." }
          "PUBLIC_TAG_SHA=$tagSha" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "PUBLIC_TAG_SHA=$tagSha"

      - name: Download and audit public assets
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path artifacts/public-download -Force | Out-Null
          gh release download $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --dir artifacts/public-download --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Public release download failed.' }

          $zipName = "Junhyun-Helper-v$env:RELEASE_VERSION-win-x64.zip"
          $zip = Join-Path artifacts/public-download $zipName
          $sum = Join-Path artifacts/public-download 'SHA256SUMS.txt'
          if (-not (Test-Path $zip)) { throw "Missing public asset: $zipName" }
          if (-not (Test-Path $sum)) { throw 'Missing public asset: SHA256SUMS.txt' }

          $releaseFiles = @(Get-ChildItem artifacts/public-download -File | Select-Object -ExpandProperty Name | Sort-Object)
          $expectedReleaseFiles = @($zipName, 'SHA256SUMS.txt') | Sort-Object
          if (Compare-Object $releaseFiles $expectedReleaseFiles) {
            throw "Unexpected public release asset set: $($releaseFiles -join ', ')"
          }

          $actualBytes = [string](Get-Item $zip).Length
          $actualHash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          $expectedLine = Get-Content $sum | Where-Object { $_ -match [Regex]::Escape($zipName) } | Select-Object -First 1
          if ($expectedLine -notmatch '^([0-9a-fA-F]{64})\s{2,}(.+)$') { throw 'Public SHA256SUMS format invalid.' }
          $recordedHash = $Matches[1].ToLowerInvariant()
          $recordedName = $Matches[2].Trim()
          if ($recordedName -ne $zipName) { throw "Checksum names '$recordedName' instead of '$zipName'." }
          if ($actualHash -ne $recordedHash) { throw "Public ZIP hash '$actualHash' does not match SHA256SUMS '$recordedHash'." }

          Expand-Archive $zip artifacts/public-extracted -Force
          $rootNames = @(Get-ChildItem artifacts/public-extracted | Select-Object -ExpandProperty Name | Sort-Object)
          $expectedRootNames = @('Assets','FIRST_RUN_KO.txt','준현 헬퍼.exe') | Sort-Object
          if (Compare-Object $rootNames $expectedRootNames) { throw 'Public package root layout mismatch.' }
          if (@(Get-ChildItem artifacts/public-extracted -Recurse -File -Filter *.pdb).Count -gt 0) { throw 'Public package contains PDB files.' }
          if (@(Get-ChildItem artifacts/public-extracted -Recurse -File | Where-Object { $_.Extension -in @('.zip','.7z','.rar') }).Count -gt 0) { throw 'Public package contains nested archives.' }

          $exe = (Resolve-Path 'artifacts/public-extracted/준현 헬퍼.exe').Path
          $productVersion = (Get-Item $exe).VersionInfo.ProductVersion
          $expectedProductVersion = "$env:RELEASE_VERSION+$env:SOURCE_SHA"
          if ($productVersion -ne $expectedProductVersion) { throw "ProductVersion '$productVersion' does not match '$expectedProductVersion'." }
          $firstLine = Get-Content 'artifacts/public-extracted/FIRST_RUN_KO.txt' -TotalCount 1
          if ($firstLine -ne "준현 헬퍼 v$env:RELEASE_VERSION — Windows x64") { throw "FIRST_RUN identity mismatch: '$firstLine'" }

          "ZIP_BYTES=$actualBytes" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "ZIP_SHA256=$actualHash" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "PRODUCT_VERSION=$productVersion" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "ZIP_BYTES=$actualBytes"
          Write-Host "ZIP_SHA256=$actualHash"
          Write-Host "PRODUCT_VERSION=$productVersion"

      - name: Smoke public-downloaded EXE
        shell: pwsh
        run: |
          $exe = (Resolve-Path 'artifacts/public-extracted/준현 헬퍼.exe').Path
          $diagnostic = Join-Path $env:TEMP 'junhyun-map-smoke-error.txt'
          $success = Join-Path $env:TEMP 'junhyun-map-smoke-success.txt'
          Remove-Item $diagnostic,$success -Force -ErrorAction SilentlyContinue
          $process = Start-Process -FilePath $exe -WorkingDirectory artifacts/public-extracted -PassThru
          try {
            $deadline = (Get-Date).AddSeconds(75)
            while ((Get-Date) -lt $deadline) {
              $process.Refresh()
              if (Test-Path $diagnostic) {
                Get-Content $diagnostic | ForEach-Object { Write-Host $_ }
                throw 'Public-downloaded EXE product smoke failed.'
              }
              if (Test-Path $success) { break }
              if ($process.HasExited) { throw "Public EXE exited early: $($process.ExitCode)" }
              Start-Sleep -Milliseconds 250
            }
            if (-not (Test-Path $success)) { throw 'Public-downloaded EXE smoke did not complete.' }

            $closed = $false
            for ($attempt = 1; $attempt -le 10; $attempt++) {
              $process.Refresh()
              if ($process.HasExited) { $closed = $true; break }
              if ($process.CloseMainWindow()) { $closed = $true; break }
              Start-Sleep -Milliseconds 500
            }
            if (-not $closed) { throw 'Could not request normal MainWindow close.' }
            $process.Refresh()
            if (-not $process.HasExited -and -not $process.WaitForExit(7000)) { throw 'Public EXE did not exit normally.' }
            if (Test-Path 'artifacts/public-extracted/Logs') { throw 'Public portable root was polluted by Logs.' }
          }
          finally {
            $process.Refresh()
            if (-not $process.HasExited) { Stop-Process -Id $process.Id -Force }
          }

      - name: Publish successful verification status to main
        shell: pwsh
        env:
          FINALIZER_RUN_ID: ${{ github.run_id }}
        run: |
          $status = [ordered]@{
            version = $env:RELEASE_VERSION
            tag = $env:RELEASE_TAG
            sourceSha = $env:SOURCE_SHA
            releaseWorkflowRunId = $env:RELEASE_RUN_ID
            finalizerWorkflowRunId = [string]$env:FINALIZER_RUN_ID
            workflowStatus = 'success'
            publishedAt = $env:PUBLISHED_AT
            publicLatestVerified = $true
            exactPublicTagVerified = $true
            publicTagSha = $env:PUBLIC_TAG_SHA
            zipBytes = $env:ZIP_BYTES
            zipSha256 = $env:ZIP_SHA256
            productVersion = $env:PRODUCT_VERSION
            publicDownloadedExeSmoke = 'SUCCESS'
            verifiedAtUtc = [DateTimeOffset]::UtcNow.ToString('O')
          } | ConvertTo-Json

          $encoded = [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes($status))
          $path = 'docs/.release-v1.2.2-status.json'
          $apiPath = "repos/$env:GITHUB_REPOSITORY/contents/$path"
          $existingSha = $null
          try { $existingSha = (gh api $apiPath --jq '.sha' 2>$null).Trim() } catch { $existingSha = $null }
          $args = @('-X','PUT',$apiPath,'-f','message=Record v1.2.2 public verification','-f',"content=$encoded",'-f','branch=main')
          if (-not [string]::IsNullOrWhiteSpace($existingSha)) { $args += @('-f',"sha=$existingSha") }
          & gh api @args
          if ($LASTEXITCODE -ne 0) { throw 'Could not publish v1.2.2 verification status to main.' }

      - name: Publish failed verification status to main
        if: failure()
        shell: pwsh
        env:
          FINALIZER_RUN_ID: ${{ github.run_id }}
        run: |
          $status = [ordered]@{
            version = $env:RELEASE_VERSION
            tag = $env:RELEASE_TAG
            sourceSha = $env:SOURCE_SHA
            releaseWorkflowRunId = $env:RELEASE_RUN_ID
            finalizerWorkflowRunId = [string]$env:FINALIZER_RUN_ID
            workflowStatus = 'failure'
            verifiedAtUtc = [DateTimeOffset]::UtcNow.ToString('O')
          } | ConvertTo-Json
          $encoded = [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes($status))
          $path = 'docs/.release-v1.2.2-status.json'
          $apiPath = "repos/$env:GITHUB_REPOSITORY/contents/$path"
          $existingSha = $null
          try { $existingSha = (gh api $apiPath --jq '.sha' 2>$null).Trim() } catch { $existingSha = $null }
          $args = @('-X','PUT',$apiPath,'-f','message=Record failed v1.2.2 public verification','-f',"content=$encoded",'-f','branch=main')
          if (-not [string]::IsNullOrWhiteSpace($existingSha)) { $args += @('-f',"sha=$existingSha") }
          & gh api @args
