name: Live Quest Edge Condition Audit

on:
  push:
    branches:
      - agent/live-quest-prereq-audit-2026-08-15
    paths:
      - '.github/workflows/live-quest-edge-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect current edge conditions
        shell: bash
        run: |
          set -euo pipefail
          for mode in regular pve pvp-season; do
            echo "===== MODE: $mode ====="
            curl -fsSL "https://json.tarkov.dev/$mode/tasks" -o tasks.json
            curl -fsSL "https://json.tarkov.dev/$mode/traders" -o traders.json

            echo '-- otherRequirements types --'
            jq -r '[.data.tasks | to_entries[].value | (.otherRequirements // empty) | if type=="object" then to_entries[].value else .[] end | .type] | group_by(.)[] | "\(.[0])=\(length)"' tasks.json || true
            echo '-- quests with otherRequirements --'
            jq -r '.data.tasks | to_entries[].value | select((.otherRequirements // null) != null) | select(((.otherRequirements | if type=="object" then length else length end) // 0) > 0) | "OTHER \(.id) | \(.name) | \([.otherRequirements | if type=="object" then to_entries[].value else .[] end | .type] | join(",")) | \(.otherRequirements|tostring)"' tasks.json || true

            echo '-- unsupported fail condition details --'
            jq -r '.data.tasks | to_entries[].value as $q | ($q.failConditions // empty) | if type=="object" then to_entries[].value else .[] end | select(.type != "taskStatus") | "FAIL \($q.id) | \($q.name) | restartable=\($q.restartable // false) | type=\(.type) | \(.|tostring)"' tasks.json || true

            echo '-- taskStatus failure shapes --'
            jq -r '[.data.tasks | to_entries[].value as $q | ($q.failConditions // empty) | if type=="object" then to_entries[].value else .[] end | select(.type=="taskStatus") | ((.status // []) | if type=="array" then sort|join(",") else tostring end)] | group_by(.)[] | "\(.[0])=\(length)"' tasks.json || true

            echo '-- delayed quests with prerequisite details --'
            jq -r '.data.tasks | to_entries[].value | select((.availableDelaySecondsMax // 0) > 0) | "DELAY \(.id) | \(.name) | min=\(.availableDelaySecondsMin) max=\(.availableDelaySecondsMax) | reqs=\([(.taskRequirements // {}) | if type=="object" then to_entries[].value else .[] end | {task:(if (.task|type)=="object" then .task.id else .task end),status:.status}]|tostring)"' tasks.json

            echo '-- traders represented in tasks but absent from common trader set --'
            jq -r '.data | to_entries[] | [.value.id, (.value.normalizedName // .value.name // "")] | @tsv' traders.json > traders.tsv
            jq -r '.data.tasks | to_entries[].value | (if (.trader|type)=="object" then .trader.id else .trader end)' tasks.json | sort | uniq -c | sort -nr > trader-task-counts.txt
            while read -r count tid; do
              tname="$(awk -F '\t' -v id="$tid" '$1==id {print $2}' traders.tsv)"
              echo "TRADER_TASKS count=$count id=$tid name=$tname"
            done < trader-task-counts.txt
            echo "===== END MODE: $mode ====="
          done
