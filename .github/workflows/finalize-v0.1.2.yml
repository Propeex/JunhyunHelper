name: Finalize v0.1.2 Repository State

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/finalize-v0.1.2.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Finalize official docs
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          release_url = 'https://github.com/Propeex/JunhyunHelper/releases/tag/v0.1.2'
          asset = 'Junhyun-Helper-v0.1.2-win-x64.zip'
          sha = '163a2a33184a6f5d8abcefa542239cd2f29a686d924cf4d784081c47939398ab'
          baseline = 'b974d942dbddf09ebe91c6c2af337b66ae1e1ba0'
          release_run = '31829344223'
          main_ci = '31829061453'

          # README
          path = Path('README.md')
          text = path.read_text(encoding='utf-8')
          replacements = {
              '**v0.1.1 RELEASED — Windows x64**': '**v0.1.2 RELEASED — Windows x64**',
              '**공개 다운로드:** https://github.com/Propeex/JunhyunHelper/releases/tag/v0.1.1': f'**공개 다운로드:** {release_url}',
              'Junhyun-Helper-v0.1.1-win-x64.zip\nSHA-256: 91394101c5011b833c2810d8857fe2e9fd59b9f42f8710b90a899fe8169f0b54': f'{asset}\nSHA-256: {sha}',
              '> **v0.1.0에서 업그레이드하는 경우:** v0.1.1을 처음 실행한 뒤 상단 **`데이터 업데이트`를 한 번 실행**해 주세요. 최신 Quest 판정 규칙이 포함된 v5 Game Content를 재구축합니다. 기존 프로필, Quest 완료 기록, Inventory, Hideout 진행(`user.db`)은 유지됩니다.': '> **업그레이드:** v0.1.1 → v0.1.2는 필수 `데이터 업데이트`가 없습니다. v0.1.0에서 바로 올리는 경우에만 최신 Quest 선행 조건 판정을 위해 `데이터 업데이트`를 한 번 실행해 주세요. 기존 프로필, Quest 완료 기록, Inventory, Hideout 진행(`user.db`)은 유지됩니다.',
              '- flexible hand-in 그룹': '- flexible hand-in 그룹 + `필요 / 전체 / 충분` 상태 필터',
              '- Item 종류/용도/필요 상태 필터와 cross-navigation': '- Item 종류/용도/필요 상태 필터, cross-navigation, Item Wiki',
              '  - floor / zoom / MiniMap 크기 hotkey': '  - floor / zoom / MiniMap 크기 hotkey\n  - floor hotkey 전환 시 zoom/지도 중심 위치 보존\n  - 타층 marker 50% + 위층 `↑` / 아래층 `↓` 표시',
              '1. GitHub Release에서 `Junhyun-Helper-v0.1.1-win-x64.zip`을 다운로드합니다.': f'1. GitHub Release에서 `{asset}`을 다운로드합니다.',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'README marker missing: {old}')
              text = text.replace(old, new, 1)

          marker = '## v0.1.1 Quest 정확도 패치\n'
          section = '''## v0.1.2 사용성 패치\n\n- 층 단축키로 floor를 바꿔도 기존 zoom과 보고 있던 지도 중심 위치를 유지\n- 다른 층 marker를 숨기지 않고 약 50% 투명도 + 위층 `↑` / 아래층 `↓`로 구분\n- Main Map / MiniMap의 Quest·일반 marker·탈출구·Raider 층 표현 통일\n- 유동 제출 상태 dropdown `필요 / 전체 / 충분`; 모두 모은 그룹은 기본 `필요` 목록에서 자동 제외\n- Item 상세에 canonical Wiki URL 기반 `위키` 버튼 추가\n- 타층 badge 재사용 / MiniMap 타층 extract signature cache로 불필요한 반복 UI 작업 감소\n\n검증: **176 tests passed / 0 failed**, 실제 Main Map + MiniMap runtime smoke, floor-hotkey viewport 보존, 정상 종료까지 통과했습니다.\n\n'''
          if section.strip() not in text:
              if marker not in text:
                  raise SystemExit('README v0.1.1 section marker missing')
              text = text.replace(marker, section + marker, 1)

          docs_marker = '- [`docs/RELEASE_0.1.1.md`](docs/RELEASE_0.1.1.md) — v0.1.1 릴리즈 기록\n'
          docs_add = docs_marker + '- [`docs/USABILITY_REQUIREMENTS_2026-08-15.md`](docs/USABILITY_REQUIREMENTS_2026-08-15.md) — 층/유동 제출/Item Wiki 요구사항과 검증\n- [`docs/RELEASE_0.1.2.md`](docs/RELEASE_0.1.2.md) — v0.1.2 릴리즈 기록\n'
          if 'docs/RELEASE_0.1.2.md' not in text:
              if docs_marker not in text:
                  raise SystemExit('README docs marker missing')
              text = text.replace(docs_marker, docs_add, 1)
          path.write_text(text, encoding='utf-8')

          # PRODUCT — only replace/add stable current requirements; preserve historical sections.
          path = Path('docs/PRODUCT.md')
          text = path.read_text(encoding='utf-8')
          product_replacements = {
              '- 다른 floor opacity 0%, auto-floor OFF': '- 지도 artwork는 선택 floor만 표시 / 타층 marker는 약 50% + 위층 `↑` / 아래층 `↓` / auto-floor OFF',
              '**v0.1.1 RELEASED — 2026-08-15**': '**v0.1.2 RELEASED — 2026-08-15**',
              'PR #76 — v0.1.1 Windows version metadata': 'PR #76 — v0.1.1 Windows version metadata\nPR #77 — floor viewport / other-floor marker / flexible status / Item Wiki\nPR #78 — Windows graceful-close smoke 안정화',
          }
          for old, new in product_replacements.items():
              if old not in text:
                  raise SystemExit(f'PRODUCT marker missing: {old}')
              text = text.replace(old, new, 1)

          flex_marker = '- 목표 종료 전 후보별 cleanup은 보수적으로 보호\n'
          flex_add = '''- 목표 종료 전 후보별 cleanup은 보수적으로 보호\n- 유동 제출 view의 상태 dropdown은 `필요 / 전체 / 충분`\n- 기본 `필요`에서는 해당 Quest의 flexible objective를 모두 충족한 group을 자동 제외\n- 충족 여부는 별도 영구 상태가 아니라 현재 Inventory에서 계산한 `FlexibleQuestItemProgress`를 권위값으로 사용\n'''
          if '`필요 / 전체 / 충분`' not in text:
              if flex_marker not in text:
                  raise SystemExit('PRODUCT flexible marker missing')
              text = text.replace(flex_marker, flex_add, 1)

          detail_marker = '- Hideout 출처 → Hideout facility\n'
          detail_add = '- Hideout 출처 → Hideout facility\n- Item 상세 `위키` → canonical `GameItem.WikiUrl`의 유효한 HTTP/HTTPS 링크\n'
          if 'canonical `GameItem.WikiUrl`' not in text:
              if detail_marker not in text:
                  raise SystemExit('PRODUCT item detail marker missing')
              text = text.replace(detail_marker, detail_add, 1)

          map_marker = '- Main Map + MiniMap floor up/down global hotkey\n'
          map_add = '''- Main Map + MiniMap floor up/down global hotkey\n- Main Map floor hotkey는 floor 변경 전후 zoom + viewport 중앙 map-space 좌표 유지\n- NumPad 0~5 direct floor 선택도 같은 viewport-safe Main Map render 경로 사용\n- 타층 marker는 숨기지 않고 약 50% opacity + `Floor.Order` 기준 `↑`/`↓` 표시\n'''
          if 'viewport 중앙 map-space 좌표 유지' not in text:
              if map_marker not in text:
                  raise SystemExit('PRODUCT Map marker missing')
              text = text.replace(map_marker, map_add, 1)

          old_tail = 'v0.1.1 공개 Release: `https://github.com/Propeex/JunhyunHelper/releases/tag/v0.1.1` / Windows ZIP SHA-256 `91394101c5011b833c2810d8857fe2e9fd59b9f42f8710b90a899fe8169f0b54`.\n\n현재 상세 상태는 `docs/STATE.md`를 기준으로 합니다.'
          new_tail = f'''v0.1.1 공개 Release: `https://github.com/Propeex/JunhyunHelper/releases/tag/v0.1.1` / Windows ZIP SHA-256 `91394101c5011b833c2810d8857fe2e9fd59b9f42f8710b90a899fe8169f0b54`.\n\nv0.1.2에서는 floor viewport 보존, 타층 marker 방향 표현, 유동 제출 상태 filter, Item Wiki와 관련 최적화를 추가했습니다. 176개 자동 테스트와 실제 Main Map/MiniMap runtime smoke를 통과했습니다.\n\nv0.1.2 공개 Release: `{release_url}` / Windows ZIP SHA-256 `{sha}`.\n\n현재 상세 상태는 `docs/STATE.md`를 기준으로 합니다.'''
          if 'v0.1.2 공개 Release:' not in text:
              if old_tail not in text:
                  raise SystemExit('PRODUCT release tail marker missing')
              text = text.replace(old_tail, new_tail, 1)
          path.write_text(text, encoding='utf-8')

          # STATE — current operational truth.
          state = f'''# STATE — 현재 프로젝트 상태\n\n> 새 대화/새 개발자는 이 문서를 먼저 읽습니다. 대화 기억이 아니라 저장소의 공식 문서와 코드가 프로젝트의 기준입니다.\n\n## 현재 상태\n\n**v0.1.2 RELEASED — `준현 헬퍼` Windows x64 single-file portable**\n\n릴리즈일: **2026-08-15**\n\n```text\nfeature PR: #77 MERGED\nCI stabilization PR: #78 MERGED\nrelease baseline: {baseline}\nmain verification run: {main_ci} — SUCCESS\nrelease workflow run: {release_run} — SUCCESS\npublic asset: {asset}\npublic SHA-256: {sha}\nrelease: {release_url}\n```\n\n현재 확인된 기능/패키징 blocker는 없습니다.\n\n## v0.1.2 변경\n\n- Main Map floor up/down hotkey가 zoom + viewport 중앙의 map-space 위치를 보존\n- NumPad 0~5 직접 floor 선택도 같은 viewport-safe Main Map renderer 사용\n- 타층 marker는 숨기지 않고 약 50% opacity로 유지\n- `Floor.Order` 기준 위층 `↑` / 아래층 `↓` badge\n- Main Map / MiniMap의 Quest, 일반 marker, extract, Raider floor 의미 통일\n- 유동 제출 상태 dropdown `필요 / 전체 / 충분`\n- 유동 제출 기본 `필요`; 모든 objective 충족 group은 자동 제외\n- Item 상세 canonical Wiki URL `위키` 버튼\n- 같은 floor badge 재사용 + MiniMap off-floor extract signature cache로 반복 UI 생성 감소\n\n상세: `docs/USABILITY_REQUIREMENTS_2026-08-15.md`, `docs/MAP_PRODUCT_REQUIREMENTS.md`\n\n## v0.1.2 검증\n\n```text\nDesktop Release build: SUCCESS\nautomated tests: 176 passed / 0 failed\nWindows x64 self-contained single-file publish: SUCCESS\nEXE ProductVersion: 0.1.2\nMain Map multi-floor SVG switch: SUCCESS\nother-floor ↑/↓ + opacity visual smoke: SUCCESS\nfloor-hotkey zoom + map-space viewport-center preservation: SUCCESS\nMiniMap window / zoom / floor / marker-scale smoke: SUCCESS\nnormal Main Window close / process exit: SUCCESS\npublic Release draft/prerelease: false / false\npublic assets: exactly 2 (Windows ZIP + SHA256SUMS.txt)\npublic Windows ZIP re-download SHA-256: VERIFIED\n```\n\n## Quest / Game Content 기준\n\nQuest를 포함한 Game Content 분류는 `데이터 업데이트` 시 프로그램 importer가 수행합니다. Runtime GPT/AI 의존성은 없습니다.\n\nv0.1.1에서 도입한 Quest 정확도 기준은 유지됩니다.\n\n- `taskRequirements`의 `active / complete / failed` 상태 모델\n- Lightkeeper / BTR Driver / Ref 상인 접근 gate 보강\n- `globalVariable` / `dialogue` unresolved condition은 `판정 문제`에 보존\n- `availableDelaySecondsMin/Max` canonical 보존, 가짜 countdown 없음\n- Content snapshot schema **v5**\n- `user.db` schema/progress 변경 없음\n\n2026-08-15 live product importer/validator 기준:\n\n```text\nregular:    517 quests / 5312 items / 16 traders / 17 maps / 26 hideout / 200 ammo\npve:        513 quests / 5312 items / 16 traders / 17 maps / 26 hideout / 200 ammo\npvp-season: 490 quests / 5312 items / 16 traders / 17 maps / 26 hideout / 200 ammo\nvalidation errors: 0\nimporter warnings: 0\n```\n\n## 업그레이드 정책\n\n- **v0.1.1 → v0.1.2:** 필수 `데이터 업데이트` 없음. Content schema는 v5 그대로입니다.\n- **v0.1.0 → v0.1.2:** 최신 Quest 판정을 위해 설치 후 `데이터 업데이트`를 한 번 실행합니다.\n- `%LocalAppData%/JunhyunHelper/user.db`의 Profile / Quest 완료 / Inventory / Hideout 진행은 유지됩니다.\n\n## 제품 기능 상태\n\n| 영역 | 상태 |\n|---|---|\n| Profile | 구현 완료 |\n| Quest | 구현 완료 / v0.1.1 live prerequisite audit 유지 |\n| Hideout | 구현 완료 / current live validation 통과 |\n| Needed Items / Inventory | 구현 완료 / v0.1.2 flexible status + Item Wiki |\n| Ammo | 구현 완료 / current live validation 통과 |\n| Map + MiniMap | 구현 완료 / v0.1.2 viewport-safe floor + other-floor marker semantics |\n| Scanner | `준비 중` placeholder 탭 유지 / 실제 기능 PRODUCT OPEN |\n\n## Map 기준\n\nMap subsystem은 독립이고 Quest만 JunhyunHelper current profile/content와 연결합니다. pinned submodule revision은 `d933792b6042a51cea38dc44b686a096fe30de67`입니다.\n\n## 현재 공개 릴리즈\n\n```text\nv0.1.2\n{release_url}\nasset: {asset}\nSHA-256: {sha}\n```\n\n## 비차단 후속 범위\n\n- Scanner 실제 기능 설계/구현\n- Map artwork/config/general-marker atomic bundle updater\n- deeper pinned Map renderer refactor only when concrete regression/performance value justifies the risk\n- code signing / installer / application updater\n- user.db backup/restore UX\n- repository license / third-party notice 정책\n'''
          Path('docs/STATE.md').write_text(state, encoding='utf-8')

          release_doc = f'''# 준현 헬퍼 v0.1.2\n\nRelease date: **2026-08-15**\n\nStatus: **RELEASED / PUBLIC GITHUB RELEASE VERIFIED**\n\n## 공개 다운로드\n\n{release_url}\n\n```text\n{asset}\nSHA-256: {sha}\nsize: 74,030,297 bytes\n```\n\nRelease는 draft/prerelease가 아닌 정식 공개 상태이며 Windows ZIP과 `SHA256SUMS.txt` 두 asset만 게시합니다. 공개 ZIP을 다시 다운로드해 위 SHA-256과 일치함을 검증했습니다.\n\n## 주요 변경\n\n- floor up/down hotkey에서 Main Map zoom + viewport center 보존\n- NumPad 0~5 direct floor도 viewport-safe Main Map render 사용\n- 타층 marker 약 50% opacity + 위 `↑` / 아래 `↓`\n- Main Map/MiniMap의 Quest·일반 marker·extract·Raider floor 의미 통일\n- flexible hand-in 상태 `필요 / 전체 / 충분`\n- flexible objective를 모두 충족하면 기본 `필요` 목록에서 자동 제외\n- Item 상세 Wiki 버튼\n- floor badge reuse / MiniMap off-floor extract signature cache\n\n## 검증\n\n```text\nrelease baseline: {baseline}\nmain verification run: {main_ci}\nrelease workflow run: {release_run}\nautomated tests: 176 passed / 0 failed\nProductVersion: 0.1.2\nWindows x64 single-file publish: SUCCESS\nMain Map floor/viewport regression smoke: SUCCESS\nMiniMap regression smoke: SUCCESS\ngraceful shutdown: SUCCESS\npublic ZIP re-download checksum: VERIFIED\n```\n\n## 데이터 업데이트\n\n- v0.1.1 사용자는 이번 패치 때문에 데이터를 다시 받을 필요가 없습니다.\n- v0.1.0에서 바로 업그레이드하면 v0.1.1의 최신 Quest prerequisite semantics를 받기 위해 `데이터 업데이트`를 한 번 실행합니다.\n- 사용자 `user.db`는 유지됩니다.\n'''
          Path('docs/RELEASE_0.1.2.md').write_text(release_doc, encoding='utf-8')
          PY

      - name: Remove one-shot release workflows
        shell: bash
        run: |
          rm -f .github/workflows/release-v0.1.2.yml
          rm -f .github/workflows/finalize-v0.1.2.yml

      - name: Commit official release state
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No release-state changes to commit.'
            exit 0
          fi
          git commit -m 'Finalize v0.1.2 public release state'
          git push origin HEAD:main
