name: Apply quest failure tests

on:
  push:
    branches: [agent/quest-failure-state]

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/quest-failure-state
          fetch-depth: 0
      - name: Apply prepared regression tests
        shell: bash
        run: |
          echo '' | base64 -d > /tmp/quest-failure-tests.tar.gz
          tar -xzf /tmp/quest-failure-tests.tar.gz
          git add tests/JunhyunHelper.Tests
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Update quest failure regression tests'
          git push origin HEAD:agent/quest-failure-state
