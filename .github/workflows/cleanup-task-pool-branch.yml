name: Cleanup Task Pool Branch

on:
  push:
    branches: [agent/task-pool-support-2026-08-17]

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/task-pool-support-2026-08-17
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Remove generated build artifacts
        shell: bash
        run: |
          find src tests -type d \( -name bin -o -name obj \) -prune -exec rm -rf {} +
          cat > .gitignore <<'EOF'
          **/bin/
          **/obj/
          .vs/
          *.user
          *.suo
          EOF
      - name: Run full tests after cleanup
        run: dotnet test tests/JunhyunHelper.Tests/JunhyunHelper.Tests.csproj --configuration Release
      - name: Commit clean implementation
        shell: bash
        run: |
          rm .github/workflows/cleanup-task-pool-branch.yml
          git config user.name "Propeex"
          git config user.email "60839060+Propeex@users.noreply.github.com"
          git add -A
          git commit -m "Clean generated build artifacts"
          git push origin HEAD:agent/task-pool-support-2026-08-17
