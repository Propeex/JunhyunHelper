name: Live Special Trader Audit

on:
  push:
    branches:
      - agent/live-quest-prereq-audit-2026-08-15
    paths:
      - '.github/workflows/live-special-trader-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Audit special trader unlock gates
        shell: bash
        run: |
          set -euo pipefail
          for mode in regular pve pvp-season; do
            echo "===== MODE: $mode ====="
            curl -fsSL "https://json.tarkov.dev/$mode/tasks" -o tasks.json
            curl -fsSL "https://json.tarkov.dev/$mode/traders" -o traders.json

            jq -r '.data.traders | to_entries[] | [.value.id, (.value.normalizedName // .value.name // "")] | @tsv' traders.json > traders.tsv
            echo '-- special trader references --'
            grep -Ei $'\t(lightkeeper|btr-driver|ref)$' traders.tsv || true

            ref_unlock='66058cb22cee99303f1ba067'
            if [ "$mode" = 'pve' ]; then ref_unlock='6834145ebc1f443d7603c8a7'; fi

            while IFS=$'\t' read -r trader_id trader_name; do
              norm="$(printf '%s' "$trader_name" | tr '[:upper:]' '[:lower:]' | tr ' ' '-')"
              case "$norm" in
                lightkeeper) unlock='625d700cc48e6c62a440fab5' ;;
                btr-driver) unlock='6752f6d83038f7df520c83e8' ;;
                ref) unlock="$ref_unlock" ;;
                *) continue ;;
              esac

              total="$(jq --arg tid "$trader_id" '[.data.tasks | to_entries[].value | select((if (.trader|type)=="object" then .trader.id else .trader end) == $tid)] | length' tasks.json)"
              missing="$(jq --arg tid "$trader_id" --arg unlock "$unlock" '[.data.tasks | to_entries[].value | select((if (.trader|type)=="object" then .trader.id else .trader end) == $tid) | select(.id != $unlock) | select(([((.taskRequirements // {}) | if type=="object" then to_entries[].value else .[] end) | (if (.task|type)=="object" then .task.id else .task end)] | index($unlock)) == null)] | length' tasks.json)"
              echo "SPECIAL trader=$norm id=$trader_id unlock=$unlock total_tasks=$total missing_direct_unlock=$missing"
              jq -r --arg tid "$trader_id" --arg unlock "$unlock" '.data.tasks | to_entries[].value | select((if (.trader|type)=="object" then .trader.id else .trader end) == $tid) | select(.id != $unlock) | select(([((.taskRequirements // {}) | if type=="object" then to_entries[].value else .[] end) | (if (.task|type)=="object" then .task.id else .task end)] | index($unlock)) == null) | "MISSING_SPECIAL_GATE \(.id) trader='"$norm"' unlock='"$unlock"'"' tasks.json | head -n 30
            done < traders.tsv
            echo "===== END MODE: $mode ====="
          done
