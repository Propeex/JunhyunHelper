name: Release v1.3.1
# One-shot exact-source controller. The release binary is built only from SOURCE_SHA.

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-v1.3.1.yml'

permissions:
  contents: write

env:
  SOURCE_SHA: 028bfb600f4662962a0daac1dad04b570e018275
  RELEASE_VERSION: 1.3.1
  RELEASE_TAG: v1.3.1
  EXPECTED_TESTS: '256'
  ASSET_NAME: Junhyun-Helper-v1.3.1-win-x64.zip
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  JUNHYUNHELPER_MAP_SMOKE: '1'

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - name: Checkout exact release source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 1

      - name: Checkout pinned public Map donor
        shell: pwsh
        run: |
          git config --local --unset-all http.https://github.com/.extraheader
          if ($LASTEXITCODE -notin @(0, 5)) { throw 'Could not clear repository-scoped GitHub auth header.' }
          git submodule sync --recursive
          if ($LASTEXITCODE -ne 0) { throw 'Could not synchronize submodule metadata.' }
          git submodule update --init --force --depth=1 --recursive
          if ($LASTEXITCODE -ne 0) { throw 'Could not checkout pinned public Map donor.' }
          $donor = (git -C vendor/Tarkov-Helper rev-parse HEAD).Trim()
          if ($donor -ne 'd933792b6042a51cea38dc44b686a096fe30de67') { throw "Pinned Map donor drifted to $donor." }

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Verify exact source identity and release absence
        shell: pwsh
        run: |
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -ne $env:SOURCE_SHA) { throw "Release source drift: $actual" }
          [xml]$project = Get-Content 'src/JunhyunHelper.Desktop/JunhyunHelper.Desktop.csproj'
          $version = [string]($project.Project.PropertyGroup.Version | Select-Object -First 1)
          if ($version -ne $env:RELEASE_VERSION) { throw "Project version '$version' is not '$env:RELEASE_VERSION'." }
          $firstLine = Get-Content 'packaging/FIRST_RUN_KO.txt' -TotalCount 1
          $expected = "준현 헬퍼 v$env:RELEASE_VERSION — Windows x64"
          if (-not [string]::Equals($firstLine, $expected, [System.StringComparison]::Ordinal)) {
            throw "FIRST_RUN source identity mismatch: '$firstLine'"
          }
          gh release view $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) { throw "Release $env:RELEASE_TAG already exists." }
          $tagLine = git ls-remote --tags origin "refs/tags/$env:RELEASE_TAG"
          if (-not [string]::IsNullOrWhiteSpace($tagLine)) { throw "Tag $env:RELEASE_TAG already exists." }

      - name: Build exact source
        shell: pwsh
        run: |
          dotnet build src/JunhyunHelper.Desktop/JunhyunHelper.Desktop.csproj --configuration Release
          if ($LASTEXITCODE -ne 0) { throw 'Exact-source Release build failed.' }

      - name: Run exactly 256 automated tests
        shell: pwsh
        run: |
          $lines = @(dotnet test tests/JunhyunHelper.Tests/JunhyunHelper.Tests.csproj --configuration Release 2>&1)
          $exitCode = $LASTEXITCODE
          $lines | ForEach-Object { Write-Host $_ }
          if ($exitCode -ne 0) { throw "Automated tests failed with exit code $exitCode." }
          $summary = ($lines | Where-Object { $_ -match 'Passed:\s+\d+.*Total:\s+\d+' } | Select-Object -Last 1)
          if (-not $summary) { throw 'Could not find dotnet test summary.' }
          if ($summary -notmatch 'Failed:\s+0' -or $summary -notmatch 'Skipped:\s+0') { throw "Unexpected test summary: $summary" }
          if ($summary -notmatch "Passed:\s+$env:EXPECTED_TESTS" -or $summary -notmatch "Total:\s+$env:EXPECTED_TESTS") {
            throw "Expected exactly $env:EXPECTED_TESTS passing tests: $summary"
          }

      - name: Publish and audit Windows x64 package root
        shell: pwsh
        run: |
          dotnet publish src/JunhyunHelper.Desktop/JunhyunHelper.Desktop.csproj `
            --configuration Release `
            --runtime win-x64 `
            --self-contained true `
            --output artifacts/publish `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true `
            -p:PublishTrimmed=false `
            -p:PublishReadyToRun=false `
            -p:DebugType=None `
            -p:DebugSymbols=false
          if ($LASTEXITCODE -ne 0) { throw 'Publish failed.' }

          Copy-Item packaging/FIRST_RUN_KO.txt artifacts/publish/FIRST_RUN_KO.txt
          foreach ($file in @('준현 헬퍼.exe','FIRST_RUN_KO.txt','Assets/tarkov_data.db')) {
            if (-not (Test-Path (Join-Path artifacts/publish $file))) { throw "Missing published file: $file" }
          }

          $exe = (Resolve-Path 'artifacts/publish/준현 헬퍼.exe').Path
          $productVersion = (Get-Item $exe).VersionInfo.ProductVersion
          $escaped = [Regex]::Escape($env:RELEASE_VERSION)
          if ([string]::IsNullOrWhiteSpace($productVersion) -or $productVersion -notmatch "^$escaped(?:$|[+-])") {
            throw "ProductVersion '$productVersion' is not v$env:RELEASE_VERSION."
          }

          $rootFiles = @(Get-ChildItem artifacts/publish -File)
          $badFiles = @($rootFiles | Where-Object { $_.Name -notin @('준현 헬퍼.exe','FIRST_RUN_KO.txt') })
          if ($badFiles.Count -gt 0) { throw "Unexpected root files: $($badFiles.Name -join ', ')" }
          $rootDirs = @(Get-ChildItem artifacts/publish -Directory)
          $badDirs = @($rootDirs | Where-Object { $_.Name -ne 'Assets' })
          if ($badDirs.Count -gt 0) { throw "Unexpected root directories: $($badDirs.Name -join ', ')" }
          if (@(Get-ChildItem artifacts/publish -Recurse -File -Filter *.pdb).Count -gt 0) { throw 'Release contains PDB files.' }
          if (@(Get-ChildItem artifacts/publish -Recurse -File | Where-Object { $_.Extension -in @('.zip','.7z','.rar') }).Count -gt 0) {
            throw 'Release publish contains nested archives.'
          }

      - name: Smoke exact-source publish
        shell: pwsh
        run: |
          function Invoke-JunhyunSmoke([string]$Root) {
            $exe = (Resolve-Path (Join-Path $Root '준현 헬퍼.exe')).Path
            $diagnostic = Join-Path $env:TEMP 'junhyun-map-smoke-error.txt'
            $success = Join-Path $env:TEMP 'junhyun-map-smoke-success.txt'
            $startupLog = Join-Path $env:LOCALAPPDATA 'JunhyunHelper/logs/startup.log'
            Remove-Item $diagnostic,$success,$startupLog -Force -ErrorAction SilentlyContinue
            $process = Start-Process -FilePath $exe -WorkingDirectory $Root -PassThru
            try {
              $deadline = (Get-Date).AddSeconds(75)
              while ((Get-Date) -lt $deadline) {
                $process.Refresh()
                if (Test-Path $diagnostic) { Get-Content $diagnostic | Write-Host; throw 'Product smoke diagnostic reported failure.' }
                if (Test-Path $success) { break }
                if ($process.HasExited) { throw "Product exited before smoke completion: $($process.ExitCode)" }
                Start-Sleep -Milliseconds 250
              }
              if (-not (Test-Path $success)) {
                if (Test-Path $startupLog) { Get-Content $startupLog | Write-Host }
                throw 'Product smoke did not complete within 75 seconds.'
              }
              $requested = $false
              for ($i=0; $i -lt 10; $i++) {
                $process.Refresh()
                if ($process.HasExited -or $process.CloseMainWindow()) { $requested = $true; break }
                Start-Sleep -Milliseconds 500
              }
              if (-not $requested) { throw 'Could not request normal MainWindow close.' }
              $process.Refresh()
              if (-not $process.HasExited -and -not $process.WaitForExit(7000)) { throw 'Process did not terminate after normal close.' }
              if (Test-Path (Join-Path $Root 'Logs')) { throw 'Runtime recreated a Logs folder beside the portable executable.' }
            }
            finally {
              $process.Refresh()
              if (-not $process.HasExited) { Stop-Process -Id $process.Id -Force }
            }
          }
          Invoke-JunhyunSmoke (Resolve-Path 'artifacts/publish').Path

      - name: Build ZIP and checksum
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts/release | Out-Null
          $zip = Join-Path 'artifacts/release' $env:ASSET_NAME
          Compress-Archive -Path 'artifacts/publish/*' -DestinationPath $zip -CompressionLevel Optimal
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $env:ASSET_NAME" | Set-Content -NoNewline 'artifacts/release/SHA256SUMS.txt'
          "RELEASE_SHA256=$hash" | Out-File -FilePath $env:GITHUB_ENV -Append
          "RELEASE_BYTES=$((Get-Item $zip).Length)" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "Asset bytes: $((Get-Item $zip).Length)"
          Write-Host "SHA-256: $hash"

      - name: Create Draft release at exact source
        shell: pwsh
        run: |
          $notes = @"
          Scanner v1.3.1 is a reliability patch driven by live Tarkov recognition evidence.

          - hardened inspect-header structure recognition using title field + magnifier shape + first glyphs + red close/X
          - protects the first Korean item-name glyph from being mistaken for the magnifier
          - adds conservative Tarkov-font visual corroboration for semantic OCR successes
          - shows the running executable version in the top bar
          - keeps trader price, flea avg24hPrice, RequiredTotal, user.db and Game Content semantics unchanged
          "@
          gh release create $env:RELEASE_TAG `
            "artifacts/release/$env:ASSET_NAME" `
            'artifacts/release/SHA256SUMS.txt' `
            --repo $env:GITHUB_REPOSITORY `
            --target $env:SOURCE_SHA `
            --title "준현 헬퍼 $env:RELEASE_TAG" `
            --notes $notes `
            --draft
          if ($LASTEXITCODE -ne 0) { throw 'Draft release creation failed.' }

      - name: Re-download and verify Draft assets
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts/draft-download | Out-Null
          gh release download $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --pattern $env:ASSET_NAME --dir artifacts/draft-download
          if ($LASTEXITCODE -ne 0) { throw 'Draft asset download failed.' }
          $zip = Join-Path 'artifacts/draft-download' $env:ASSET_NAME
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne $env:RELEASE_SHA256) { throw "Draft asset checksum mismatch: $hash" }
          New-Item -ItemType Directory -Force artifacts/draft-extracted | Out-Null
          Expand-Archive -Path $zip -DestinationPath artifacts/draft-extracted
          $exe = Get-Item 'artifacts/draft-extracted/준현 헬퍼.exe'
          if ($exe.VersionInfo.ProductVersion -notmatch '^1\.3\.1(?:$|[+-])') { throw "Draft ProductVersion mismatch: $($exe.VersionInfo.ProductVersion)" }
          $first = Get-Content 'artifacts/draft-extracted/FIRST_RUN_KO.txt' -TotalCount 1
          if ($first -ne '준현 헬퍼 v1.3.1 — Windows x64') { throw "Draft FIRST_RUN mismatch: $first" }

      - name: Smoke Draft-downloaded executable
        shell: pwsh
        run: |
          $root = (Resolve-Path 'artifacts/draft-extracted').Path
          $exe = (Resolve-Path (Join-Path $root '준현 헬퍼.exe')).Path
          $diagnostic = Join-Path $env:TEMP 'junhyun-map-smoke-error.txt'
          $success = Join-Path $env:TEMP 'junhyun-map-smoke-success.txt'
          Remove-Item $diagnostic,$success -Force -ErrorAction SilentlyContinue
          $p = Start-Process -FilePath $exe -WorkingDirectory $root -PassThru
          try {
            $deadline=(Get-Date).AddSeconds(75)
            while((Get-Date)-lt $deadline){ $p.Refresh(); if(Test-Path $diagnostic){Get-Content $diagnostic|Write-Host;throw 'Draft smoke failure.'}; if(Test-Path $success){break}; if($p.HasExited){throw "Draft executable exited: $($p.ExitCode)"}; Start-Sleep -Milliseconds 250 }
            if(-not(Test-Path $success)){throw 'Draft smoke timeout.'}
            for($i=0;$i-lt 10;$i++){ $p.Refresh(); if($p.HasExited -or $p.CloseMainWindow()){break}; Start-Sleep -Milliseconds 500 }
            $p.Refresh(); if(-not $p.HasExited -and -not $p.WaitForExit(7000)){throw 'Draft executable did not close.'}
          } finally { $p.Refresh(); if(-not $p.HasExited){Stop-Process -Id $p.Id -Force} }

      - name: Publish release and verify exact tag source
        shell: pwsh
        run: |
          gh release edit $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --draft=false --latest
          if ($LASTEXITCODE -ne 0) { throw 'Could not publish release.' }
          $remote = (git ls-remote origin "refs/tags/$env:RELEASE_TAG" | ForEach-Object { ($_ -split '\s+')[0] }).Trim()
          if ($remote -ne $env:SOURCE_SHA) { throw "Public tag source '$remote' is not exact release source '$env:SOURCE_SHA'." }
          $latest = gh release view --repo $env:GITHUB_REPOSITORY --json tagName,isDraft,isPrerelease,isLatest | ConvertFrom-Json
          if ($latest.tagName -ne $env:RELEASE_TAG -or $latest.isDraft -or $latest.isPrerelease -or -not $latest.isLatest) {
            throw "Release did not become public latest: $($latest | ConvertTo-Json -Compress)"
          }

      - name: Re-download and independently verify public asset
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts/public-download | Out-Null
          gh release download $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --pattern $env:ASSET_NAME --dir artifacts/public-download
          if ($LASTEXITCODE -ne 0) { throw 'Public asset download failed.' }
          $zip = Join-Path 'artifacts/public-download' $env:ASSET_NAME
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne $env:RELEASE_SHA256) { throw "Public checksum mismatch: $hash" }
          if ((Get-Item $zip).Length -ne [long]$env:RELEASE_BYTES) { throw 'Public asset byte length changed.' }
          New-Item -ItemType Directory -Force artifacts/public-extracted | Out-Null
          Expand-Archive -Path $zip -DestinationPath artifacts/public-extracted
          $exe = Get-Item 'artifacts/public-extracted/준현 헬퍼.exe'
          if ($exe.VersionInfo.ProductVersion -notmatch '^1\.3\.1(?:$|[+-])') { throw "Public ProductVersion mismatch: $($exe.VersionInfo.ProductVersion)" }
          $rootFiles = @(Get-ChildItem artifacts/public-extracted -File)
          $bad = @($rootFiles | Where-Object { $_.Name -notin @('준현 헬퍼.exe','FIRST_RUN_KO.txt') })
          if ($bad.Count -gt 0) { throw "Public ZIP root contains unexpected files: $($bad.Name -join ', ')" }
          $rootDirs = @(Get-ChildItem artifacts/public-extracted -Directory)
          if ($rootDirs.Count -ne 1 -or $rootDirs[0].Name -ne 'Assets') { throw 'Public ZIP root directory contract failed.' }

      - name: Smoke public-downloaded executable
        shell: pwsh
        run: |
          $root = (Resolve-Path 'artifacts/public-extracted').Path
          $exe = (Resolve-Path (Join-Path $root '준현 헬퍼.exe')).Path
          $diagnostic = Join-Path $env:TEMP 'junhyun-map-smoke-error.txt'
          $success = Join-Path $env:TEMP 'junhyun-map-smoke-success.txt'
          Remove-Item $diagnostic,$success -Force -ErrorAction SilentlyContinue
          $p = Start-Process -FilePath $exe -WorkingDirectory $root -PassThru
          try {
            $deadline=(Get-Date).AddSeconds(75)
            while((Get-Date)-lt $deadline){ $p.Refresh(); if(Test-Path $diagnostic){Get-Content $diagnostic|Write-Host;throw 'Public smoke failure.'}; if(Test-Path $success){break}; if($p.HasExited){throw "Public executable exited: $($p.ExitCode)"}; Start-Sleep -Milliseconds 250 }
            if(-not(Test-Path $success)){throw 'Public smoke timeout.'}
            for($i=0;$i-lt 10;$i++){ $p.Refresh(); if($p.HasExited -or $p.CloseMainWindow()){break}; Start-Sleep -Milliseconds 500 }
            $p.Refresh(); if(-not $p.HasExited -and -not $p.WaitForExit(7000)){throw 'Public executable did not close.'}
          } finally { $p.Refresh(); if(-not $p.HasExited){Stop-Process -Id $p.Id -Force} }

      - name: Record release evidence artifact
        shell: pwsh
        run: |
          $record = [ordered]@{
            version = $env:RELEASE_TAG
            source_sha = $env:SOURCE_SHA
            asset = $env:ASSET_NAME
            bytes = [long]$env:RELEASE_BYTES
            sha256 = $env:RELEASE_SHA256
            tests = [int]$env:EXPECTED_TESTS
            draft_redownload_verified = $true
            draft_exe_smoke = 'SUCCESS'
            public_latest_verified = $true
            exact_tag_source_verified = $true
            public_redownload_verified = $true
            public_exe_smoke = 'SUCCESS'
          }
          $record | ConvertTo-Json | Set-Content 'artifacts/release-v1.3.1-status.json'

      - name: Upload release verification evidence
        uses: actions/upload-artifact@v4
        with:
          name: release-v1.3.1-verification
          path: |
            artifacts/release-v1.3.1-status.json
            artifacts/release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
