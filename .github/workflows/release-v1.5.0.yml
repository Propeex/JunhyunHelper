name: Release v1.5.0

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-v1.5.0.yml'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      SOURCE_SHA: 6de738959740d12e6ccb81b65e50006e463eb699
      VERSION: 1.5.0
      TAG: v1.5.0
      ASSET: Junhyun-Helper-v1.5.0-win-x64.zip
    steps:
      - name: Checkout exact product source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 1

      - name: Checkout pinned public Map donor
        shell: pwsh
        run: |
          git config --local --unset-all http.https://github.com/.extraheader
          if ($LASTEXITCODE -notin @(0, 5)) { throw 'Could not clear repository-scoped GitHub auth header.' }
          git submodule sync --recursive
          if ($LASTEXITCODE -ne 0) { throw 'Could not synchronize submodule metadata.' }
          git submodule update --init --force --depth=1 --recursive
          if ($LASTEXITCODE -ne 0) { throw 'Could not checkout the pinned public Map donor.' }

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build and test exact source
        shell: pwsh
        run: |
          $head = (git rev-parse HEAD).Trim()
          if ($head -ne $env:SOURCE_SHA) { throw "Exact source mismatch: $head" }
          dotnet build src/JunhyunHelper.Desktop/JunhyunHelper.Desktop.csproj --configuration Release
          if ($LASTEXITCODE -ne 0) { throw 'Desktop build failed.' }
          $output = dotnet test tests/JunhyunHelper.Tests/JunhyunHelper.Tests.csproj --configuration Release 2>&1 | Tee-Object -Variable testLog
          $output | Write-Host
          if ($LASTEXITCODE -ne 0) { throw 'Core tests failed.' }
          $joined = $testLog -join "`n"
          if ($joined -notmatch 'Passed:\s+296' -or $joined -notmatch 'Failed:\s+0' -or $joined -notmatch 'Skipped:\s+0') {
            throw 'Expected exactly 296 passing tests, 0 failed and 0 skipped.'
          }

      - name: Publish and audit Windows x64 package
        id: package
        shell: pwsh
        run: |
          dotnet publish src/JunhyunHelper.Desktop/JunhyunHelper.Desktop.csproj `
            --configuration Release `
            --runtime win-x64 `
            --self-contained true `
            --output artifacts/publish `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true `
            -p:PublishTrimmed=false `
            -p:PublishReadyToRun=false `
            -p:DebugType=None `
            -p:DebugSymbols=false
          if ($LASTEXITCODE -ne 0) { throw 'Publish failed.' }

          Copy-Item packaging/FIRST_RUN_KO.txt artifacts/publish/FIRST_RUN_KO.txt
          foreach ($file in @('준현 헬퍼.exe','FIRST_RUN_KO.txt','Assets/tarkov_data.db')) {
            if (-not (Test-Path (Join-Path artifacts/publish $file))) { throw "Required published file missing: $file" }
          }

          $exe = (Resolve-Path 'artifacts/publish/준현 헬퍼.exe').Path
          $pv = (Get-Item $exe).VersionInfo.ProductVersion
          if ($pv -ne "$env:VERSION+$env:SOURCE_SHA") { throw "ProductVersion mismatch: $pv" }
          $first = Get-Content artifacts/publish/FIRST_RUN_KO.txt -TotalCount 1
          if ($first -ne "준현 헬퍼 v$env:VERSION — Windows x64") { throw "FIRST_RUN identity mismatch: $first" }

          $rootFiles = @(Get-ChildItem artifacts/publish -File)
          if (@($rootFiles | Where-Object { $_.Name -notin @('준현 헬퍼.exe','FIRST_RUN_KO.txt') }).Count -gt 0) { throw 'Unexpected release-root files.' }
          $rootDirs = @(Get-ChildItem artifacts/publish -Directory)
          if ($rootDirs.Count -ne 1 -or $rootDirs[0].Name -ne 'Assets') { throw 'Unexpected release-root directories.' }
          if (@(Get-ChildItem artifacts/publish -Recurse -File -Filter *.pdb).Count -gt 0) { throw 'PDB leaked into package.' }
          if (@(Get-ChildItem artifacts/publish -Recurse -File | Where-Object Extension -in @('.zip','.7z','.rar')).Count -gt 0) { throw 'Nested archive leaked into package.' }

          foreach ($file in @('AutoUpdater.NET.dll','Microsoft.Web.WebView2.Core.dll','Microsoft.Web.WebView2.WinForms.dll','Microsoft.Web.WebView2.Wpf.dll','WebView2Loader.dll','Westermo.GraphX.Controls.dll','Westermo.GraphX.Common.dll','QuikGraph.dll')) {
            if (Get-ChildItem artifacts/publish -Recurse -File -Filter $file) { throw "Unused legacy dependency leaked into release: $file" }
          }

          New-Item -ItemType Directory -Path artifacts/release -Force | Out-Null
          Compress-Archive -Path artifacts/publish/* -DestinationPath "artifacts/release/$env:ASSET" -CompressionLevel Optimal
          $hash = (Get-FileHash "artifacts/release/$env:ASSET" -Algorithm SHA256).Hash.ToLowerInvariant()
          $bytes = (Get-Item "artifacts/release/$env:ASSET").Length
          "$hash  $env:ASSET" | Set-Content artifacts/release/SHA256SUMS.txt -Encoding utf8
          "sha256=$hash" >> $env:GITHUB_OUTPUT
          "bytes=$bytes" >> $env:GITHUB_OUTPUT
          Write-Host "Release identity: v$env:VERSION / ProductVersion $pv"
          Write-Host "ASSET_SHA256=$hash"
          Write-Host "ASSET_BYTES=$bytes"

      - name: Packaged product smoke
        shell: pwsh
        env:
          JUNHYUNHELPER_MAP_SMOKE: '1'
        run: |
          $exe = (Resolve-Path 'artifacts/publish/준현 헬퍼.exe').Path
          $diagnostic = Join-Path $env:TEMP 'junhyun-map-smoke-error.txt'
          $success = Join-Path $env:TEMP 'junhyun-map-smoke-success.txt'
          $startupLog = Join-Path $env:LOCALAPPDATA 'JunhyunHelper/logs/startup.log'
          Remove-Item $diagnostic,$success,$startupLog -Force -ErrorAction SilentlyContinue
          $process = Start-Process -FilePath $exe -WorkingDirectory artifacts/publish -PassThru
          try {
            $deadline = (Get-Date).AddSeconds(75)
            while ((Get-Date) -lt $deadline -and -not (Test-Path $success)) {
              $process.Refresh()
              if (Test-Path $diagnostic) { Get-Content $diagnostic | Write-Host; throw 'Packaged Product UI/Map/Scanner smoke failure.' }
              if ($process.HasExited) { throw "Packaged product exited early: $($process.ExitCode)" }
              Start-Sleep -Milliseconds 250
            }
            if (-not (Test-Path $success)) { throw 'Packaged product smoke timed out.' }
            $closed = $false
            for ($attempt = 1; $attempt -le 10; $attempt++) {
              $process.Refresh()
              if ($process.HasExited -or $process.CloseMainWindow()) { $closed = $true; break }
              Start-Sleep -Milliseconds 500
            }
            if (-not $closed) { throw 'Could not request normal Main Window close.' }
            $process.Refresh()
            if (-not $process.HasExited -and -not $process.WaitForExit(7000)) { throw 'Packaged product did not terminate normally.' }
            if (Test-Path artifacts/publish/Logs) { throw 'Packaged product recreated portable-root Logs.' }
          }
          finally {
            $process.Refresh()
            if (-not $process.HasExited) { Stop-Process -Id $process.Id -Force }
          }

      - name: Create or recover exact draft release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $releaseJson = gh release view $env:TAG --repo $env:GITHUB_REPOSITORY --json tagName,isDraft,isPrerelease,targetCommitish 2>$null
          if ($LASTEXITCODE -eq 0) {
            $release = $releaseJson | ConvertFrom-Json
            if (-not $release.isDraft -or $release.isPrerelease -or $release.tagName -ne $env:TAG) {
              throw "Existing $env:TAG release is not the expected recoverable draft."
            }
            if (-not [string]::IsNullOrWhiteSpace($release.targetCommitish) -and $release.targetCommitish -ne $env:SOURCE_SHA) {
              throw "Existing draft targets '$($release.targetCommitish)' instead of exact source '$env:SOURCE_SHA'."
            }
            gh release upload $env:TAG "artifacts/release/$env:ASSET" artifacts/release/SHA256SUMS.txt --repo $env:GITHUB_REPOSITORY --clobber
            if ($LASTEXITCODE -ne 0) { throw 'Could not replace recoverable draft assets.' }
          }
          else {
            gh release create $env:TAG `
              --repo $env:GITHUB_REPOSITORY `
              --target $env:SOURCE_SHA `
              --title "준현 헬퍼 v$env:VERSION" `
              --notes-file docs/RELEASE_NOTES_V1.5.0.md `
              --draft
            if ($LASTEXITCODE -ne 0) { throw 'Draft release creation failed.' }
            gh release upload $env:TAG "artifacts/release/$env:ASSET" artifacts/release/SHA256SUMS.txt --repo $env:GITHUB_REPOSITORY
            if ($LASTEXITCODE -ne 0) { throw 'Draft release asset upload failed.' }
          }

      - name: Create and verify exact source tag
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $refJson = gh api "repos/$env:GITHUB_REPOSITORY/git/ref/tags/$env:TAG" 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh api --method POST "repos/$env:GITHUB_REPOSITORY/git/refs" -f "ref=refs/tags/$env:TAG" -f "sha=$env:SOURCE_SHA" | Out-Null
            if ($LASTEXITCODE -ne 0) { throw 'Could not create exact v1.5.0 tag.' }
            $refJson = gh api "repos/$env:GITHUB_REPOSITORY/git/ref/tags/$env:TAG"
          }
          $ref = $refJson | ConvertFrom-Json
          $resolved = $ref.object.sha
          if ($ref.object.type -eq 'tag') {
            $tagObject = gh api "repos/$env:GITHUB_REPOSITORY/git/tags/$resolved" | ConvertFrom-Json
            $resolved = $tagObject.object.sha
          }
          if ($resolved -ne $env:SOURCE_SHA) { throw "Tag source mismatch: $resolved" }

      - name: Redownload and verify draft assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          JUNHYUNHELPER_MAP_SMOKE: '1'
        run: |
          New-Item -ItemType Directory -Path artifacts/redownload -Force | Out-Null
          gh release download $env:TAG --repo $env:GITHUB_REPOSITORY --dir artifacts/redownload --pattern $env:ASSET --pattern SHA256SUMS.txt
          if ($LASTEXITCODE -ne 0) { throw 'Draft asset redownload failed.' }
          $expected = ((Get-Content artifacts/redownload/SHA256SUMS.txt -Raw).Trim() -split '\s+')[0].ToLowerInvariant()
          $actual = (Get-FileHash "artifacts/redownload/$env:ASSET" -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw 'Draft redownload hash mismatch.' }
          Expand-Archive "artifacts/redownload/$env:ASSET" artifacts/redownload/package -Force
          $exe = (Resolve-Path 'artifacts/redownload/package/준현 헬퍼.exe').Path
          if ((Get-Item $exe).VersionInfo.ProductVersion -ne "$env:VERSION+$env:SOURCE_SHA") { throw 'Draft ProductVersion mismatch.' }
          if ((Get-Content artifacts/redownload/package/FIRST_RUN_KO.txt -TotalCount 1) -ne "준현 헬퍼 v$env:VERSION — Windows x64") { throw 'Draft FIRST_RUN mismatch.' }
          if (-not (Test-Path artifacts/redownload/package/Assets/tarkov_data.db)) { throw 'Draft Map database missing.' }

          $diagnostic = Join-Path $env:TEMP 'junhyun-map-smoke-error.txt'
          $success = Join-Path $env:TEMP 'junhyun-map-smoke-success.txt'
          Remove-Item $diagnostic,$success -Force -ErrorAction SilentlyContinue
          $process = Start-Process -FilePath $exe -WorkingDirectory artifacts/redownload/package -PassThru
          try {
            $deadline = (Get-Date).AddSeconds(75)
            while ((Get-Date) -lt $deadline -and -not (Test-Path $success)) {
              $process.Refresh()
              if (Test-Path $diagnostic) { Get-Content $diagnostic | Write-Host; throw 'Draft redownload smoke failure.' }
              if ($process.HasExited) { throw "Draft product exited early: $($process.ExitCode)" }
              Start-Sleep -Milliseconds 250
            }
            if (-not (Test-Path $success)) { throw 'Draft redownload smoke timed out.' }
            if (-not $process.CloseMainWindow()) { throw 'Could not close draft product normally.' }
            if (-not $process.WaitForExit(7000)) { throw 'Draft product did not terminate normally.' }
          }
          finally {
            $process.Refresh()
            if (-not $process.HasExited) { Stop-Process -Id $process.Id -Force }
          }

      - name: Publish stable latest release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release edit $env:TAG --repo $env:GITHUB_REPOSITORY --draft=false --latest
          if ($LASTEXITCODE -ne 0) { throw 'Could not publish stable latest release.' }
          $latest = gh api "repos/$env:GITHUB_REPOSITORY/releases/latest" | ConvertFrom-Json
          if ($latest.tag_name -ne $env:TAG -or $latest.draft -or $latest.prerelease) { throw 'Published release is not public stable/latest.' }

      - name: Record controller success
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          ASSET_SHA256: ${{ steps.package.outputs.sha256 }}
          ASSET_BYTES: ${{ steps.package.outputs.bytes }}
        run: |
          $status = [ordered]@{
            version = $env:TAG
            source_sha = $env:SOURCE_SHA
            tests = 296
            release_run = [long]$env:GITHUB_RUN_ID
            release_workflow_conclusion = 'success'
            asset = $env:ASSET
            bytes = [long]$env:ASSET_BYTES
            sha256 = $env:ASSET_SHA256
            product_version = "$env:VERSION+$env:SOURCE_SHA"
            public_latest_published = $true
            recorded_at_utc = [DateTimeOffset]::UtcNow.ToString('O')
          }
          $json = $status | ConvertTo-Json -Depth 4
          $base64 = [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes($json + "`n"))
          $path = 'docs/.release-v1.5.0-controller-status.json'
          $existingJson = gh api "repos/$env:GITHUB_REPOSITORY/contents/$path" 2>$null
          if ($LASTEXITCODE -eq 0) {
            $existing = $existingJson | ConvertFrom-Json
            gh api --method PUT "repos/$env:GITHUB_REPOSITORY/contents/$path" -f message='Record v1.5.0 release controller success' -f content="$base64" -f sha="$($existing.sha)" | Out-Null
          }
          else {
            gh api --method PUT "repos/$env:GITHUB_REPOSITORY/contents/$path" -f message='Record v1.5.0 release controller success' -f content="$base64" | Out-Null
          }
          if ($LASTEXITCODE -ne 0) { throw 'Could not persist v1.5.0 controller status.' }
