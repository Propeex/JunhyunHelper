name: Finalize Scanner v1.3.3 release candidate

on:
  push:
    branches: ['fix/scanner-live-title-v1.3.3']
    paths:
      - '.github/workflows/apply-scanner-v1.3.3-final.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/scanner-live-title-v1.3.3
          fetch-depth: 0

      - name: Finalize source and evidence
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $utf8 = [Text.UTF8Encoding]::new($false)
          function Read([string]$p) { [IO.File]::ReadAllText($p) }
          function Write([string]$p,[string]$v) { $d=Split-Path -Parent $p; if($d){New-Item -ItemType Directory -Force $d|Out-Null}; [IO.File]::WriteAllText($p,$v,$utf8) }
          function Replace([string]$p,[string]$old,[string]$new) { $t=Read $p; if(-not $t.Contains($old)){throw "Missing expected block in $p"}; Write $p ($t.Replace($old,$new)) }

          # Runtime defense-in-depth: only the fully locked live header can reach OCR.
          Replace 'src/JunhyunHelper.Desktop/Scanner/ScannerRuntimeService.cs' @'
              candidate.TitleAnchorScore >= 0.48 &&
              !string.Equals(candidate.TitleAnchorReason, "GEOMETRY_FALLBACK", StringComparison.Ordinal);
          '@ @'
              candidate.TitleAnchorScore >= 0.68 &&
              string.Equals(candidate.TitleAnchorReason, "HEADER_FRAME_LOCKED", StringComparison.Ordinal);
          '@

          # Expand packaged-EXE regression from representative cases to all 12 measured headers.
          $p='src/JunhyunHelper.Desktop/Scanner/ScannerInspectHeaderLockSmoke.cs'
          $t=Read $p
          $start=$t.IndexOf('    public static void Verify()', [StringComparison]::Ordinal)
          $end=$t.IndexOf('    private static void VerifyLockedHeader(', $start, [StringComparison]::Ordinal)
          if($start -lt 0 -or $end -le $start){throw 'Smoke markers not found.'}
          $verify=@'
              public static void Verify()
              {
                  var cases = new (int Width, int CloseW, int CloseH, int MagX, int Gap, int Glyphs)[]
                  {
                      (834,25,16,12,6,12), (862,27,17,13,6,18), (861,27,17,12,5,3),
                      (862,27,17,13,6,15), (856,27,17,13,6,14), (855,27,17,12,6,17),
                      (862,27,17,13,5,17), (854,27,17,12,6,14), (861,27,17,12,6,8),
                      (861,27,17,12,6,20), (827,26,16,11,5,9), (822,26,16,11,6,15),
                  };

                  foreach (var sample in cases)
                  {
                      VerifyLockedHeader(
                          headerLeft: 170,
                          headerTop: 150,
                          headerWidth: sample.Width,
                          closeWidth: sample.CloseW,
                          closeHeight: sample.CloseH,
                          magnifierOffsetX: sample.MagX,
                          titleGap: sample.Gap,
                          glyphCount: sample.Glyphs,
                          addDecoyRing: true);
                  }

                  // Coordinate independence: inspect windows can move substantially on screen.
                  VerifyLockedHeader(360, 122, 855, 27, 17, 12, 6, 17, true);
                  VerifyMissingMagnifierFailsClosed();
              }

          '@
          Write $p ($t.Substring(0,$start)+$verify+$t.Substring($end))

          Write 'docs/.scanner-v1.3.3-header-evidence.json' @'
          {
            "date":"2026-08-23",
            "source":"12 user-provided 2048x1280 Tarkov inspect captures",
            "privacy":"raw screenshots are not committed; only relative measurements are persisted",
            "samples":[
              {"id":"151846","header_width":834,"close":[25,16],"magnifier_core":[13,13],"magnifier_x":12,"magnifier_y":7,"title_gap":6},
              {"id":"151911","header_width":862,"close":[27,17],"magnifier_core":[13,13],"magnifier_x":13,"magnifier_y":7,"title_gap":6},
              {"id":"151932","header_width":861,"close":[27,17],"magnifier_core":[13,13],"magnifier_x":12,"magnifier_y":7,"title_gap":5},
              {"id":"151949","header_width":862,"close":[27,17],"magnifier_core":[13,13],"magnifier_x":13,"magnifier_y":7,"title_gap":6},
              {"id":"152007","header_width":856,"close":[27,17],"magnifier_core":[13,13],"magnifier_x":13,"magnifier_y":7,"title_gap":6},
              {"id":"152020","header_width":855,"close":[27,17],"magnifier_core":[13,13],"magnifier_x":12,"magnifier_y":7,"title_gap":6},
              {"id":"152036","header_width":862,"close":[27,17],"magnifier_core":[13,13],"magnifier_x":13,"magnifier_y":7,"title_gap":5},
              {"id":"152049","header_width":854,"close":[27,17],"magnifier_core":[13,13],"magnifier_x":12,"magnifier_y":7,"title_gap":6},
              {"id":"152105","header_width":861,"close":[27,17],"magnifier_core":[13,13],"magnifier_x":12,"magnifier_y":7,"title_gap":6},
              {"id":"152118","header_width":861,"close":[27,17],"magnifier_core":[13,13],"magnifier_x":12,"magnifier_y":7,"title_gap":6},
              {"id":"152148","header_width":827,"close":[26,16],"magnifier_core":[13,13],"magnifier_x":11,"magnifier_y":7,"title_gap":5},
              {"id":"152201","header_width":822,"close":[26,16],"magnifier_core":[13,13],"magnifier_x":11,"magnifier_y":7,"title_gap":6}
            ],
            "ranges":{"header_width":[822,862],"close_width":[25,27],"close_height":[16,17],"magnifier_core":[13,13],"magnifier_x":[11,13],"magnifier_y":[7,7],"title_gap":[5,6]}
          }
          '@

          Write 'docs/SCANNER_V1.3.3_HEADER_LOCK.md' @'
          # Scanner v1.3.3 — live inspect-header frame lock

          기준일: 2026-08-23
          상태: **RELEASE CANDIDATE**

          ## 근거
          v1.3.2 이후 사용자가 제공한 실제 2048x1280 Tarkov 상세창 12개를 다시 측정했다. raw 이미지는 저장소에 넣지 않고 `docs/.scanner-v1.3.3-header-evidence.json`에 상대 측정치만 보존한다.

          반복 범위는 header width 822~862px, red close 25~27×16~17px, magnifier bright core 12개 모두 13×13px, frame-left→magnifier 11~13px, frame-top→magnifier 7px, magnifier-right→첫 title evidence 5~6px였다. 짧은 Awl, 한글/영문 혼합명, 긴 무기명, 서로 다른 화면 위치에서도 구조가 유지됐다.

          ## 원인
          이전 title refinement에서 fragmented Korean first-glyph component가 ROI left edge에 영향을 줄 수 있었고, title glyph가 magnifier morphology 경쟁에 참여할 수 있었다. 결과적으로 제목 앞부분이 잘리거나 잘못된 icon anchor가 선택될 수 있었다.

          ## v1.3.3 계약
          ```text
          structural detail candidate
          → red close/X
          → long neutral top frame
          → bounded frame-left search-icon lane
          → 13px-class magnifier core + ring/hollow/handle morphology
          → dark title field + text-presence corroboration
          → HEADER_FRAME_LOCKED >= 0.68
          → magnifier-free title ROI
          → Windows ko-KR OCR
          → current-catalog sanitation
          → semantic/visual resolver
          → Item ID or fail closed
          ```

          first title glyph는 ROI left edge를 결정하지 않는다. runtime은 `HEADER_FRAME_LOCKED`이며 anchor score >=0.68인 candidate에서만 OCR을 실행한다. partial result는 refiner에서도 0.47 이하로 제한된다.

          raw OCR과 sanitation 이후 matcher input을 진단에서 분리한다. current official catalog에 없는 `「` 같은 punctuation이 raw OCR에 나타나더라도 matcher evidence에는 남지 않는다.

          기존 normal confidence/top1-top2 margin, whole-catalog unique bounded 1-edit + 10%p runner-up margin, current official Korean catalog authority를 유지한다. highest trader / flea avg24hPrice / RequiredTotal, Content v7, user.db v1, Scanner settings v4, catalog cache v1/v2 의미도 변경하지 않는다.

          packaged-EXE product smoke는 12개 측정 geometry 전부와 title-lane decoy ring, missing-magnifier fail-closed, right-shifted window를 검증한다.
          '@

          Write 'docs/DECISION_SCANNER_HEADER_LOCK_2026-08-23.md' @'
          # DEC-058 — Scanner title ROI는 실제 inspect-header frame이 소유한다

          - 상태: `CONFIRMED / IMPLEMENTED / RELEASE CANDIDATE v1.3.3`
          - 날짜: 2026-08-23
          - 근거: 실제 2048x1280 Tarkov 상세창 12개

          1. first title glyph connected component는 ROI left edge를 결정하지 않는다.
          2. red close/X와 long neutral top frame을 먼저 잠근다.
          3. magnifier는 bounded frame-left icon lane에서만 찾고 실제 13px-class core의 위치·크기와 ring/hollow/handle morphology를 함께 평가한다.
          4. dark title field와 text presence까지 확인되어 `HEADER_FRAME_LOCKED`가 되고 score가 0.68 이상일 때만 OCR을 허용한다.
          5. partial/failed anchor는 identity path로 진행하지 않는다.
          6. raw OCR과 current-catalog sanitation 이후 matcher input을 진단에서 분리한다.
          7. 기존 confidence/margin 및 bounded unique 1-edit 안전 조건은 완화하지 않는다.
          8. 가격/RequiredTotal 및 content/user/settings schema는 변경하지 않는다.
          9. 신규 사용자 기능이 아닌 live regression 수정이므로 DEC-048에 따라 v1.3.3 PATCH다.

          상세: `docs/SCANNER_V1.3.3_HEADER_LOCK.md`, `docs/.scanner-v1.3.3-header-evidence.json`.
          '@

          Write 'docs/RELEASE_1.3.3.md' @'
          # 준현 헬퍼 v1.3.3 릴리즈 후보

          기준일: 2026-08-23
          상태: **RELEASE CANDIDATE — PUBLIC RELEASE PENDING**

          ## 변경
          - 실제 12개 상세창의 long header frame / red X / 13×13 magnifier core 구조를 authoritative title-anchor로 사용
          - first title glyph의 ROI-left ownership 제거
          - `HEADER_FRAME_LOCKED` + score >=0.68 전 OCR 금지
          - raw OCR / sanitized matcher input 진단 분리
          - 기존 current-catalog symbol policy, confidence/margin, bounded unique 1-edit 유지
          - highest trader / flea avg24hPrice / RequiredTotal 및 schema 의미 변경 없음

          ## 호환성
          Desktop 1.3.3 / Content v7(read v3~v7) / user.db v1 / Scanner settings v4 / Scanner catalog v1-v2. mandatory content update와 user migration 없음.

          ## 검증
          - pre-final v1.3.3 CI `32624123821`: SUCCESS
          - follow-up CI `32624855995`: SUCCESS
          - automated tests: 263 passed / 0 failed / 0 skipped
          - Windows build/publish + actual packaged EXE Product UI/Scanner/Mini Scanner/Main Map/Factory/MiniMap smoke: SUCCESS
          - cleaned final-head CI: PENDING
          - exact release source / Draft / Public verification: PENDING
          '@

          Write 'docs/CURRENT_SCANNER_WORK.md' @'
          # Current Scanner work

          기준일: 2026-08-23
          현재 작업: **v1.3.3 release candidate — live inspect-header frame lock**

          현재 public stable은 v1.3.2다. v1.3.3은 사용자가 제공한 12개 실제 상세창 evidence를 기준으로 first-glyph ROI ownership을 제거하고 full header lock 전 OCR을 금지한다.

          공식 근거:
          - `docs/SCANNER_V1.3.3_HEADER_LOCK.md`
          - `docs/.scanner-v1.3.3-header-evidence.json`
          - `docs/DECISION_SCANNER_HEADER_LOCK_2026-08-23.md`
          - `docs/RELEASE_1.3.3.md`

          false positive보다 miss를 선호하고, live evidence 없이 global confidence/margin을 낮추지 않는다. Item ID 이후 highest trader / flea avg24hPrice / RequiredTotal 연결은 기존 권위 경로를 유지한다.
          '@

          Write 'docs/CURRENT_STATE.md' @'
          # CURRENT STATE

          기준일: 2026-08-23
          상태: **`v1.3.3 RELEASE CANDIDATE — v1.3.2 PUBLIC VERIFIED`**

          ## 공개 기준선
          v1.3.2 / source `922797a99ea221fdc4984dd6ed05df552149d6e4` / 263 tests / release run `32621021058` / public package verified.

          ## v1.3.3
          실제 2048x1280 상세창 12개를 측정해 title ROI를 다음 순서로 고정한다.
          ```text
          detail candidate → red X → long neutral top frame → bounded left icon lane
          → 13px-class magnifier → dark title field + text evidence
          → HEADER_FRAME_LOCKED >=0.68 → OCR → catalog sanitation → identity or fail closed
          ```
          first title glyph는 ROI left edge를 움직일 수 없다. partial header에서는 OCR을 실행하지 않는다. raw OCR과 matcher input은 별도 진단한다. confidence/margin/unique 1-edit와 price/RequiredTotal/schema 계약은 변경하지 않았다.

          pre-final CI `32624123821` 및 follow-up CI `32624855995`: build/test/publish/actual packaged EXE smoke SUCCESS. clean final-head CI와 public package verification이 남은 release blocker다.

          상세: `docs/SCANNER_V1.3.3_HEADER_LOCK.md`, `docs/DECISION_SCANNER_HEADER_LOCK_2026-08-23.md`, `docs/RELEASE_1.3.3.md`.
          '@

          # Remove every branch-only patch mechanism, including this workflow itself.
          Remove-Item '.github/workflows/patch-scanner-v1.3.3.yml' -Force -ErrorAction SilentlyContinue
          Remove-Item 'scripts/patch-scanner-v1.3.3.ps1' -Force -ErrorAction SilentlyContinue
          Remove-Item '.github/workflows/apply-scanner-v1.3.3-final.yml' -Force -ErrorAction SilentlyContinue

      - name: Commit clean candidate
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          if ($LASTEXITCODE -ne 0) { throw 'Whitespace validation failed.' }
          git diff --cached --quiet && throw 'No final changes were produced.'
          git commit -m 'fix(scanner): finalize live header lock regression'
          git push origin HEAD:fix/scanner-live-title-v1.3.3