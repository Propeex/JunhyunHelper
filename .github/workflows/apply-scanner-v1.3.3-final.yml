          # Scanner v1.3.3 — 실제 inspect-header frame lock

          기준일: 2026-08-23

          상태: **RELEASE CANDIDATE**

          ## 문제

          v1.3.2의 title-anchor 보강 뒤에도 실제 Tarkov에서 제목 앞부분이 잘리거나 돋보기/첫 글자 관계가 불안정한 사례가 확인됐다. 핵심 원인은 첫 title glyph connected component가 OCR ROI의 왼쪽 경계를 움직일 수 있었고, 밝은 component morphology 경쟁에서 title glyph가 search icon과 경쟁할 수 있었다는 점이다.

          ## 실제 12개 표본 분석

          사용자가 제공한 2048x1280 캡처 12개에서 inspect header를 동일 해상도로 비교했다. raw screenshot은 저장소에 커밋하지 않고 상대 측정치만 `docs/.scanner-v1.3.3-header-evidence.json`에 보존한다.

          반복 관측 범위:

          - 긴 neutral top frame: 822~862 px
          - red close control: 25~27 × 16~17 px
          - magnifier bright core: 12개 모두 13 × 13 px
          - frame left → magnifier core X: 11~13 px
          - frame top → magnifier core Y: 12개 모두 7 px
          - magnifier core right → first bright title glyph: 5~6 px

          `Awl` 같은 짧은 제목, 한글/영문 혼합 제목, 긴 무기명, 창 위치가 다른 표본에서도 같은 상대 구조가 유지됐다.

          ## v1.3.3 결정

          제목 ROI의 수평 소유권은 title glyph가 아니라 실제 inspect-header 구조가 가진다.

          ```text
          structural detail candidate
          → red close/X
          → long neutral top frame
          → bounded fixed left search-icon lane
          → 13px-class magnifier bright core + ring/hollow/handle morphology
          → dark title field
          → text-presence corroboration
          → HEADER_FRAME_LOCKED
          → magnifier-free title ROI
          → ko-KR OCR
          ```

          `HEADER_FRAME_LOCKED`가 아니거나 anchor score가 0.68 미만이면 OCR을 실행하지 않는다. partial result는 0.47 이하로 제한하여 미래/진단 caller에서도 우연히 trust floor를 넘지 못하게 한다.

          첫 Korean glyph component는 text가 존재한다는 corroboration으로만 사용할 수 있고 title ROI의 left edge를 오른쪽으로 이동시킬 수 없다.

          ## OCR / matcher diagnostics

          Windows OCR raw text와 current-catalog character policy를 적용한 matcher input을 별도로 기록/표시한다. 예를 들어 current official catalog에 없는 `「`가 raw OCR에 등장할 수는 있지만 matcher input에서는 제거된다. raw OCR 노이즈와 실제 identity evidence를 동일한 값처럼 표시하지 않는다.

          ## 변경하지 않는 계약

          - current official Korean full-item catalog가 identity 권위
          - normal confidence/top1-top2 margin 유지
          - bounded unique 1-edit recovery + 10 percentage-point global runner-up margin 유지
          - scan-time network 금지
          - game memory/DLL injection/packet interception 금지
          - highest trader / flea avg24hPrice / RequiredTotal 의미 변경 없음
          - Content v7 / user.db v1 / Scanner display settings v4 / Scanner catalog cache v1-v2 유지

          ## 회귀 검증

          packaged-EXE product smoke가 12개 live 측정 geometry를 모두 합성해 검사한다. 추가로 title lane 내부에 더 그럴듯한 decoy ring을 두어도 fixed icon lane의 실제 magnifier가 선택되어야 하며, magnifier가 없으면 반드시 fail closed해야 한다. 오른쪽으로 크게 이동한 상세창도 header-relative 좌표로 동일하게 통과해야 한다.
