name: Finalize Scanner v1.3.3 branch

on:
  push:
    branches: ['fix/scanner-live-title-v1.3.3']
    paths:
      - '.github/workflows/apply-scanner-v1.3.3-final.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/scanner-live-title-v1.3.3
          fetch-depth: 0

      - name: Apply final runtime, regression, and documentation state
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $utf8 = [Text.UTF8Encoding]::new($false)

          function Read-Text([string]$Path) {
            return [IO.File]::ReadAllText($Path)
          }

          function Write-Text([string]$Path, [string]$Text) {
            $directory = Split-Path -Parent $Path
            if ($directory) { New-Item -ItemType Directory -Force $directory | Out-Null }
            [IO.File]::WriteAllText($Path, $Text, $utf8)
          }

          function Replace-Exact([string]$Path, [string]$Old, [string]$New) {
            $text = Read-Text $Path
            if (-not $text.Contains($Old)) { throw "Expected block not found: $Path`n--- old ---`n$Old" }
            Write-Text $Path ($text.Replace($Old, $New))
          }

          function Replace-Between([string]$Path, [string]$StartMarker, [string]$EndMarker, [string]$Replacement) {
            $text = Read-Text $Path
            $start = $text.IndexOf($StartMarker, [StringComparison]::Ordinal)
            if ($start -lt 0) { throw "Start marker not found: $Path :: $StartMarker" }
            $end = $text.IndexOf($EndMarker, $start + $StartMarker.Length, [StringComparison]::Ordinal)
            if ($end -le $start) { throw "End marker not found: $Path :: $EndMarker" }
            Write-Text $Path ($text.Substring(0, $start) + $Replacement + $text.Substring($end))
          }

          function Insert-Before([string]$Path, [string]$Marker, [string]$Block) {
            $text = Read-Text $Path
            $index = $text.IndexOf($Marker, [StringComparison]::Ordinal)
            if ($index -lt 0) { throw "Insert marker not found: $Path :: $Marker" }
            Write-Text $Path ($text.Substring(0, $index) + $Block + $text.Substring($index))
          }

          # 1. Runtime must explicitly require the authoritative v1.3.3 header lock.
          $runtime = 'src/JunhyunHelper.Desktop/Scanner/ScannerRuntimeService.cs'
          Replace-Exact $runtime @'
              candidate.TitleAnchorScore >= 0.48 &&
              !string.Equals(candidate.TitleAnchorReason, "GEOMETRY_FALLBACK", StringComparison.Ordinal);
          '@ @'
              candidate.TitleAnchorScore >= 0.68 &&
              string.Equals(candidate.TitleAnchorReason, "HEADER_FRAME_LOCKED", StringComparison.Ordinal);
          '@

          $refiner = 'src/JunhyunHelper.Desktop/Scanner/ScannerTitleAnchorRefiner.cs'
          Replace-Exact $refiner @'
                  // The runtime's existing trusted-anchor floor is 0.48. Every partial/failed
                  // frame lock is deliberately kept below it so OCR cannot run merely because
                  // some subset of close/icon/field evidence happened to score well.
          '@ @'
                  // Runtime recognition explicitly requires HEADER_FRAME_LOCKED with score >= 0.68.
                  // Keep every partial/failed result below the historical 0.48 trust floor as a
                  // second defensive boundary for diagnostics or any future caller.
          '@

          # 2. Lock the packaged-EXE smoke to all 12 measured live header geometries.
          $smoke = 'src/JunhyunHelper.Desktop/Scanner/ScannerInspectHeaderLockSmoke.cs'
          Replace-Between $smoke '    public static void Verify()' '    private static void VerifyLockedHeader(' @'
              private static readonly LiveHeaderCase[] LiveEvidenceCases =
              [
                  new("151846", 834, 25, 16, 12, 6, 12, true),
                  new("151911", 862, 27, 17, 13, 6, 18, true),
                  new("151932", 861, 27, 17, 12, 5, 3, false),
                  new("151949", 862, 27, 17, 13, 6, 15, true),
                  new("152007", 856, 27, 17, 13, 6, 14, true),
                  new("152020", 855, 27, 17, 12, 6, 17, true),
                  new("152036", 862, 27, 17, 13, 5, 17, true),
                  new("152049", 854, 27, 17, 12, 6, 14, true),
                  new("152105", 861, 27, 17, 12, 6, 8, true),
                  new("152118", 861, 27, 17, 12, 6, 20, true),
                  new("152148", 827, 26, 16, 11, 5, 9, true),
                  new("152201", 822, 26, 16, 11, 6, 15, true),
              ];

              public static void Verify()
              {
                  foreach (var sample in LiveEvidenceCases)
                  {
                      VerifyLockedHeader(
                          headerLeft: 170,
                          headerTop: 150,
                          headerWidth: sample.HeaderWidth,
                          closeWidth: sample.CloseWidth,
                          closeHeight: sample.CloseHeight,
                          magnifierOffsetX: sample.MagnifierOffsetX,
                          titleGap: sample.TitleGap,
                          glyphCount: sample.GlyphCount,
                          addDecoyRing: sample.AddDecoyRing);
                  }

                  // Coordinate-independence regression: the MP-153-style inspect window can
                  // move far to the right without changing the header-relative contract.
                  VerifyLockedHeader(
                      headerLeft: 360,
                      headerTop: 122,
                      headerWidth: 855,
                      closeWidth: 27,
                      closeHeight: 17,
                      magnifierOffsetX: 12,
                      titleGap: 6,
                      glyphCount: 17,
                      addDecoyRing: true);

                  VerifyMissingMagnifierFailsClosed();
              }

          '@
          $smokeText = Read-Text $smoke
          $lastBrace = $smokeText.LastIndexOf('}', [StringComparison]::Ordinal)
          if ($lastBrace -lt 0) { throw 'Could not locate ScannerInspectHeaderLockSmoke closing brace.' }
          $record = @'

              private readonly record struct LiveHeaderCase(
