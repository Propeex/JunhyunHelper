name: Scanner symbol audit

on:
  push:
    branches: [scanner/live-evidence-v1.3.2]
    paths:
      - '.github/workflows/scanner-symbol-audit.yml'

jobs:
  audit:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - name: Audit current official Korean item-name symbols
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $all = @{}
          foreach ($mode in @('regular','pve','pvp-season')) {
            $base = Invoke-RestMethod "https://json.tarkov.dev/$mode/items"
            $ko = Invoke-RestMethod "https://json.tarkov.dev/$mode/items_ko"
            $records = @()
            if ($base.data.items -is [System.Array]) {
              $records = @($base.data.items)
            } else {
              $records = @($base.data.items.PSObject.Properties | ForEach-Object { $_.Value })
            }
            $names = New-Object System.Collections.Generic.List[string]
            foreach ($item in $records) {
              $key = [string]$item.name
              if ([string]::IsNullOrWhiteSpace($key)) { continue }
              $property = $ko.data.PSObject.Properties[$key]
              $name = if ($null -ne $property -and -not [string]::IsNullOrWhiteSpace([string]$property.Value)) {
                [string]$property.Value
              } else {
                $key
              }
              $names.Add($name)
            }
            Write-Host "MODE=$mode ITEM_NAMES=$($names.Count)"
            foreach ($name in $names) {
              foreach ($ch in $name.ToCharArray()) {
                if ([char]::IsLetterOrDigit($ch) -or [char]::IsWhiteSpace($ch)) { continue }
                $code = 'U+{0:X4}' -f [int][char]$ch
                $key = "$code`t$ch"
                if (-not $all.ContainsKey($key)) {
                  $all[$key] = [ordered]@{ Count = 0; Samples = New-Object System.Collections.Generic.List[string] }
                }
                $all[$key].Count++
                if ($all[$key].Samples.Count -lt 3 -and -not $all[$key].Samples.Contains($name)) {
                  $all[$key].Samples.Add($name)
                }
              }
            }
          }
          Write-Host '--- OFFICIAL_ITEM_NAME_SYMBOLS ---'
          foreach ($entry in $all.GetEnumerator() | Sort-Object Name) {
            Write-Host ("{0}`tcount={1}`tsamples={2}" -f $entry.Key, $entry.Value.Count, ($entry.Value.Samples -join ' || '))
          }
          foreach ($probe in @([char]0x300C, [char]0x0060)) {
            $code = 'U+{0:X4}' -f [int][char]$probe
            $present = @($all.Keys | Where-Object { $_ -like "$code`t*" }).Count -gt 0
            Write-Host "PROBE $code '$probe' PRESENT=$present"
          }
