name: Apply v0.1.10 direct UI layout fix

on:
  push:
    branches:
      - fix/v0.1.10-ui-actual-layout
    paths:
      - .github/workflows/apply-v0110-ui-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: fix/v0.1.10-ui-actual-layout
          submodules: recursive

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Apply source patch
        run: |
          python tools/apply_ui_patch_v0110.py
          python tools/remove_obsolete_polish_refs.py

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build desktop
        run: dotnet build src/JunhyunHelper.Desktop/JunhyunHelper.Desktop.csproj --configuration Release

      - name: Test
        run: dotnet test tests/JunhyunHelper.Tests/JunhyunHelper.Tests.csproj --configuration Release

      - name: Commit validated source fix
        shell: pwsh
        run: |
          git rm .github/workflows/apply-v0110-ui-fix.yml tools/apply_ui_patch_v0110.py tools/remove_obsolete_polish_refs.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git status --short
          git commit -m 'Fix requested UI layouts at source'
          git push origin HEAD:fix/v0.1.10-ui-actual-layout
