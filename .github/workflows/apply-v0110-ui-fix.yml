name: Apply v0.1.10 direct UI layout fix

on:
  push:
    branches: [fix/v0.1.10-ui-actual-layout]
    paths:
      - '.github/workflows/apply-v0110-ui-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: fix/v0.1.10-ui-actual-layout
          submodules: recursive

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Apply direct source-layout fixes
        shell: pwsh
        run: |
          @'
          from pathlib import Path
          import re

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f"{label}: expected exactly one match, got {count}")
              return text.replace(old, new, 1)

          # 1) Flexible hand-in candidates: make the canonical XAML template own the layout.
          items_path = Path('src/JunhyunHelper.Desktop/Items/ItemsPage.xaml')
          items = items_path.read_text(encoding='utf-8')
          pattern = re.compile(
              r'        <DataTemplate x:Key="FlexibleCandidateTemplate">.*?        </DataTemplate>\r?\n\r?\n        <DataTemplate x:Key="FlexibleGroupTemplate">',
              re.S,
          )
          replacement = '''        <DataTemplate x:Key="FlexibleCandidateTemplate">
            <Button Tag="{Binding ItemId}" Click="FlexibleCandidateButton_Click"
                    Height="68" MinHeight="68" MaxHeight="68"
                    HorizontalAlignment="Stretch" HorizontalContentAlignment="Stretch"
                    VerticalContentAlignment="Center" Padding="10,6" Margin="4,3">
                <Grid>
                    <Grid.ColumnDefinitions>
                        <ColumnDefinition Width="52" />
                        <ColumnDefinition Width="*" MinWidth="170" />
                        <ColumnDefinition Width="108" />
                        <ColumnDefinition Width="96" />
                    </Grid.ColumnDefinitions>
                    <Border Grid.Column="0" Width="44" Height="44"
                            Background="{StaticResource BackgroundDarkBrush}"
                            BorderBrush="{StaticResource BorderBrush}" BorderThickness="1"
                            CornerRadius="6" HorizontalAlignment="Left" VerticalAlignment="Center">
                        <Grid>
                            <TextBlock Text="?" Foreground="{StaticResource TextSecondaryBrush}"
                                       HorizontalAlignment="Center" VerticalAlignment="Center" />
                            <Image Source="{Binding Icon}" Stretch="Uniform" Margin="3" />
                        </Grid>
                    </Border>
                    <StackPanel Grid.Column="1" VerticalAlignment="Center" Margin="8,0,12,0">
                        <TextBlock Text="{Binding Name}" FontWeight="SemiBold"
                                   TextWrapping="NoWrap" TextTrimming="CharacterEllipsis" />
                        <Border Background="{StaticResource BackgroundLightBrush}" CornerRadius="7"
                                Padding="6,2" Margin="0,4,0,0" HorizontalAlignment="Left">
                            <TextBlock Text="{Binding CategoryLabel}" Foreground="{StaticResource TextSecondaryBrush}"
                                       FontSize="10" TextWrapping="NoWrap" />
                        </Border>
                    </StackPanel>
                    <StackPanel Grid.Column="2" VerticalAlignment="Center" HorizontalAlignment="Right">
                        <TextBlock Text="인레이드" Foreground="{StaticResource TextSecondaryBrush}"
                                   FontSize="10" HorizontalAlignment="Right" />
                        <TextBlock Text="{Binding OwnedFir}" FontWeight="SemiBold" FontSize="15"
                                   HorizontalAlignment="Right" Margin="0,2,0,0" />
                    </StackPanel>
                    <StackPanel Grid.Column="3" VerticalAlignment="Center" HorizontalAlignment="Right">
                        <TextBlock Text="일반" Foreground="{StaticResource TextSecondaryBrush}"
                                   FontSize="10" HorizontalAlignment="Right" />
                        <TextBlock Text="{Binding OwnedNonFir}" FontWeight="SemiBold" FontSize="15"
                                   HorizontalAlignment="Right" Margin="0,2,0,0" />
                    </StackPanel>
                </Grid>
            </Button>
        </DataTemplate>

        <DataTemplate x:Key="FlexibleGroupTemplate">'''
          items, n = pattern.subn(replacement, items, count=1)
          if n != 1:
              raise RuntimeError(f'FlexibleCandidateTemplate replacement count={n}')
          items_path.write_text(items, encoding='utf-8', newline='\n')

          polish = Path('src/JunhyunHelper.Desktop/Items/ItemsPage.FlexibleLayout.cs')
          if polish.exists():
              polish.unlink()

          # 2) Ammo: make header widths/labels and detail toggle part of XAML itself.
          ammo_xaml_path = Path('src/JunhyunHelper.Desktop/Ammo/AmmoPage.xaml')
          ammo = ammo_xaml_path.read_text(encoding='utf-8')
          ammo = replace_once(ammo,
              '<RowDefinition Height="8" />',
              '<RowDefinition Height="Auto" />',
              'ammo detail toggle row')
          ammo = replace_once(ammo,
              '<ColumnDefinition Width="Auto" />\n                <ColumnDefinition Width="210" />\n                <ColumnDefinition Width="Auto" />\n                <ColumnDefinition Width="12" />\n                <ColumnDefinition Width="Auto" />\n                <ColumnDefinition Width="210" />',
              '<ColumnDefinition Width="0" />\n                <ColumnDefinition Width="160" />\n                <ColumnDefinition Width="Auto" />\n                <ColumnDefinition Width="12" />\n                <ColumnDefinition Width="0" />\n                <ColumnDefinition Width="170" />',
              'ammo header columns')
          ammo = replace_once(ammo,
              '<TextBlock Grid.Column="0" Text="구경" VerticalAlignment="Center"\n                       Foreground="{StaticResource TextSecondaryBrush}" Margin="0,0,8,0" />\n            <ComboBox x:Name="CaliberComboBox" Grid.Column="1" SelectionChanged="CaliberComboBox_SelectionChanged" />\n            <Button x:Name="FavoriteCaliberButton" Grid.Column="2" Margin="8,0,0,0"\n                    Content="☆ 즐겨찾기" Click="FavoriteCaliberButton_Click" />',
              '<TextBlock Grid.Column="0" Text="구경" Visibility="Collapsed" />\n            <ComboBox x:Name="CaliberComboBox" Grid.Column="1" Width="160" MinWidth="160" MaxWidth="160"\n                      SelectionChanged="CaliberComboBox_SelectionChanged" />\n            <Button x:Name="FavoriteCaliberButton" Grid.Column="2" Margin="8,0,0,0"\n                    Width="38" MinWidth="38" MaxWidth="38" Padding="0" FontSize="16"\n                    Content="☆" ToolTip="즐겨찾기 추가" Click="FavoriteCaliberButton_Click" />',
              'ammo caliber controls')
          ammo = replace_once(ammo,
              '<TextBlock Grid.Column="4" Text="즐겨찾기" VerticalAlignment="Center"\n                       Foreground="{StaticResource TextSecondaryBrush}" Margin="0,0,8,0" />\n            <Button x:Name="FavoriteCaliberMenuButton" Grid.Column="5"\n                    Content="즐겨찾기 선택" HorizontalContentAlignment="Left"\n                    Click="FavoriteCaliberMenuButton_Click" />',
              '<TextBlock Grid.Column="4" Text="즐겨찾기" Visibility="Collapsed" />\n            <Button x:Name="FavoriteCaliberMenuButton" Grid.Column="5" Width="170" MinWidth="170" MaxWidth="170"\n                    Content="즐겨찾기 선택" HorizontalContentAlignment="Left"\n                    Click="FavoriteCaliberMenuButton_Click" />',
              'ammo favorites menu')
          ammo = replace_once(ammo,
              '<GridSplitter Grid.Row="3" Height="8" Background="Transparent" HorizontalAlignment="Stretch" />\n\n        <Border Grid.Row="4" Background="{StaticResource BackgroundMediumBrush}" CornerRadius="8" Padding="16">',
              '<Button x:Name="ProductDetailToggleButton" Grid.Row="3"\n                Content="▲  탄약 / 수급 경로 상세정보" ToolTip="상세정보 접기"\n                HorizontalAlignment="Center" VerticalAlignment="Center"\n                MinWidth="260" Height="30" Margin="0,3" Padding="14,2" FontWeight="SemiBold"\n                Click="ProductDetailToggleButton_Click" />\n\n        <Border x:Name="ProductDetailHost" Grid.Row="4" Background="{StaticResource BackgroundMediumBrush}" CornerRadius="8" Padding="16">',
              'ammo detail toggle')
          ammo_xaml_path.write_text(ammo, encoding='utf-8', newline='\n')

          ammo_code_path = Path('src/JunhyunHelper.Desktop/Ammo/AmmoPage.ProductSearchAndDetails.cs')
          ammo_code = ammo_code_path.read_text(encoding='utf-8')
          prepare_pattern = re.compile(
              r'    private void PrepareCollapsibleDetailPanel\(Grid root\)\n    \{.*?\n    \}\n\n    private void ProductDetailToggleButton_Click',
              re.S,
          )
          prepare_new = '''    private void PrepareCollapsibleDetailPanel(Grid root)
    {
        if (root.RowDefinitions.Count < 5 || _productDetailToggleButton is not null)
            return;

        // The header/detail controls are canonical XAML now. Runtime code only owns
        // expansion state; it no longer rewrites the visual tree after Loaded.
        _productDetailHost = ProductDetailHost;
        _productDetailToggleButton = ProductDetailToggleButton;
        root.RowDefinitions[3].Height = GridLength.Auto;
        ApplyProductDetailExpansionState();
    }

    private void ProductDetailToggleButton_Click'''
          ammo_code, n = prepare_pattern.subn(prepare_new, ammo_code, count=1)
          if n != 1:
              raise RuntimeError(f'PrepareCollapsibleDetailPanel replacement count={n}')
          ammo_code = ammo_code.replace('    private UIElement? _productDetailSplitter;\n', '')
          ammo_code_path.write_text(ammo_code, encoding='utf-8', newline='\n')

          # 3) Map current-Quest sidebar: build the requested lanes directly.
          map_path = Path('src/JunhyunHelper.Desktop/Map/LegacyMapQuestV2.cs')
          map_code = map_path.read_text(encoding='utf-8')
          map_pattern = re.compile(
              r'    private FrameworkElement CreateQuestRow\(LegacyMapQuestEntryV2 entry\)\n    \{.*?\n    \}\n\n    private static FrameworkElement CreateQuestContent\(LegacyMapQuestEntryV2 entry\)\n    \{.*?\n    \}\n\n    private void MarkerToggle_Changed',
              re.S,
          )
          map_new = '''    private FrameworkElement CreateQuestRow(LegacyMapQuestEntryV2 entry)
    {
        var grid = new Grid
        {
            HorizontalAlignment = HorizontalAlignment.Stretch,
            VerticalAlignment = VerticalAlignment.Stretch,
        };
        grid.ColumnDefinitions.Add(new ColumnDefinition { Width = new GridLength(30) });
        grid.ColumnDefinitions.Add(new ColumnDefinition { Width = new GridLength(34) });
        grid.ColumnDefinitions.Add(new ColumnDefinition { Width = new GridLength(1, GridUnitType.Star) });

        if (entry.Markers.Count > 0)
        {
            var markerToggle = new CheckBox
            {
                IsChecked = entry.MarkerEnabled,
                Width = 20,
                Height = 20,
                HorizontalAlignment = HorizontalAlignment.Left,
                VerticalAlignment = VerticalAlignment.Center,
                Margin = new Thickness(0),
                Tag = entry.QuestId,
                ToolTip = "이 퀘스트의 지도 마커 표시",
            };
            markerToggle.Checked += MarkerToggle_Changed;
            markerToggle.Unchecked += MarkerToggle_Changed;
            Grid.SetColumn(markerToggle, 0);
            grid.Children.Add(markerToggle);
        }

        if (!string.IsNullOrWhiteSpace(entry.MarkerCode))
        {
            var badge = new Border
            {
                Width = 28,
                Height = 28,
                CornerRadius = new CornerRadius(14),
                Background = new SolidColorBrush(Color.FromRgb(197, 168, 74)),
                HorizontalAlignment = HorizontalAlignment.Center,
                VerticalAlignment = VerticalAlignment.Center,
                IsHitTestVisible = false,
                Child = new TextBlock
                {
                    Text = entry.MarkerCode,
                    Foreground = Brushes.Black,
                    FontWeight = FontWeights.Bold,
                    FontSize = entry.MarkerCode.Length > 1 ? 8 : 11,
                    HorizontalAlignment = HorizontalAlignment.Center,
                    VerticalAlignment = VerticalAlignment.Center,
                    TextAlignment = TextAlignment.Center,
                },
            };
            Grid.SetColumn(badge, 1);
            grid.Children.Add(badge);
        }

        var button = new Button
        {
            Tag = entry.QuestId,
            Background = Brushes.Transparent,
            BorderThickness = new Thickness(0),
            Padding = new Thickness(0),
            Margin = new Thickness(0),
            HorizontalAlignment = HorizontalAlignment.Stretch,
            HorizontalContentAlignment = HorizontalAlignment.Stretch,
            VerticalAlignment = VerticalAlignment.Stretch,
            VerticalContentAlignment = VerticalAlignment.Center,
            Cursor = Cursors.Hand,
            Content = CreateQuestContent(entry),
        };
        button.Click += QuestButton_Click;
        Grid.SetColumn(button, 2);
        grid.Children.Add(button);

        return new Border
        {
            Height = 68,
            MinHeight = 68,
            MaxHeight = 68,
            HorizontalAlignment = HorizontalAlignment.Stretch,
            VerticalAlignment = VerticalAlignment.Top,
            Background = new SolidColorBrush(Color.FromRgb(40, 40, 40)),
            BorderBrush = new SolidColorBrush(Color.FromRgb(63, 63, 63)),
            BorderThickness = new Thickness(1),
            CornerRadius = new CornerRadius(6),
            Padding = new Thickness(8, 6, 8, 6),
            Margin = new Thickness(0, 0, 0, 7),
            Child = grid,
        };
    }

    private static FrameworkElement CreateQuestContent(LegacyMapQuestEntryV2 entry)
    {
        var content = new StackPanel
        {
            HorizontalAlignment = HorizontalAlignment.Stretch,
            VerticalAlignment = VerticalAlignment.Center,
        };
        content.Children.Add(new TextBlock
        {
            Text = entry.Name,
            Foreground = Brushes.White,
            FontSize = 13,
            FontWeight = FontWeights.SemiBold,
            TextWrapping = TextWrapping.NoWrap,
            TextTrimming = TextTrimming.CharacterEllipsis,
            HorizontalAlignment = HorizontalAlignment.Left,
            TextAlignment = TextAlignment.Left,
            VerticalAlignment = VerticalAlignment.Center,
        });
        content.Children.Add(new TextBlock
        {
            Text = entry.Markers.Count > 0 ? $"좌표 {entry.Markers.Count}개" : "정확한 좌표 없음",
            Foreground = entry.Markers.Count > 0
                ? new SolidColorBrush(Color.FromRgb(197, 168, 74))
                : new SolidColorBrush(Color.FromRgb(130, 130, 130)),
            FontSize = 10,
            Margin = new Thickness(0, 3, 0, 0),
            TextWrapping = TextWrapping.NoWrap,
            TextTrimming = TextTrimming.CharacterEllipsis,
            HorizontalAlignment = HorizontalAlignment.Left,
            TextAlignment = TextAlignment.Left,
        });
        return content;
    }

    private void MarkerToggle_Changed'''
          map_code, n = map_pattern.subn(map_new, map_code, count=1)
          if n != 1:
              raise RuntimeError(f'Map sidebar replacement count={n}')
          map_path.write_text(map_code, encoding='utf-8', newline='\n')

          map_polish = Path('src/JunhyunHelper.Desktop/Map/LegacyMapQuestSidebarPolishBridge.cs')
          if map_polish.exists():
              map_polish.unlink()

          # Source-level assertions: these are the product layout, not a post-load rewrite.
          items_after = items_path.read_text(encoding='utf-8')
          if 'Width="36" Height="36"' in re.search(r'<DataTemplate x:Key="FlexibleCandidateTemplate">.*?</DataTemplate>', items_after, re.S).group(0):
              raise RuntimeError('Old clipped 36px flexible icon frame still exists.')
          if 'Text="{Binding OwnedFir}"' not in items_after or 'Text="{Binding OwnedNonFir}"' not in items_after:
              raise RuntimeError('Flexible owned quantity lanes missing.')

          ammo_after = ammo_xaml_path.read_text(encoding='utf-8')
          if 'x:Name="ProductDetailToggleButton"' not in ammo_after or 'x:Name="ProductDetailHost"' not in ammo_after:
              raise RuntimeError('Canonical ammo detail toggle/host missing.')

          map_after = map_path.read_text(encoding='utf-8')
          if 'new GridLength(30)' not in map_after or 'new GridLength(34)' not in map_after:
              raise RuntimeError('Map sidebar fixed checkbox/marker lanes missing.')
          '@ | Set-Content apply_ui_patch.py -Encoding utf8
          python apply_ui_patch.py
          Remove-Item apply_ui_patch.py -Force

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build desktop
        run: dotnet build src/JunhyunHelper.Desktop/JunhyunHelper.Desktop.csproj --configuration Release

      - name: Test
        run: dotnet test tests/JunhyunHelper.Tests/JunhyunHelper.Tests.csproj --configuration Release

      - name: Commit validated direct-layout fix and remove one-shot workflow
        shell: pwsh
        run: |
          git rm .github/workflows/apply-v0110-ui-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git status --short
          git commit -m 'Fix requested UI layouts at source'
          git push origin HEAD:fix/v0.1.10-ui-actual-layout
