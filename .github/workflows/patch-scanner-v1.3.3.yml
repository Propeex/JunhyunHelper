name: Patch Scanner v1.3.3 live title

on:
  push:
    branches: ['fix/scanner-live-title-v1.3.3']
    paths:
      - '.github/workflows/patch-scanner-v1.3.3.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/scanner-live-title-v1.3.3
          fetch-depth: 0
      - name: Apply patch
        shell: pwsh
        run: ./scripts/patch-scanner-v1.3.3.ps1
      - name: Commit patch
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src
          git diff --cached --quiet && throw 'Patch produced no source changes.'
          git commit -m 'fix(scanner): harden live title anchors and OCR diagnostics'
          git push origin HEAD:fix/scanner-live-title-v1.3.3
