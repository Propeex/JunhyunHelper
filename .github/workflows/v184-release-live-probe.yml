name: v1.8.4 release live data probe

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  live-probe:
    runs-on: windows-latest
    timeout-minutes: 12
    env:
      JUNHYUNHELPER_LIVE_DATA_PROBE: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Checkout pinned public Map donor
        shell: pwsh
        run: |
          git submodule sync --recursive
          if ($LASTEXITCODE -ne 0) { throw "Could not synchronize submodules." }
          git submodule update --init --force --depth=1 --recursive
          if ($LASTEXITCODE -ne 0) { throw "Could not checkout Map donor." }

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Probe current Regular and PvE live sources
        shell: pwsh
        run: |
          $probeOutput = Join-Path $env:RUNNER_TEMP 'junhyun-v184-live-data-probe.txt'
          $env:JUNHYUNHELPER_LIVE_DATA_PROBE_OUTPUT = $probeOutput

          dotnet test tests/JunhyunHelper.Tests/JunhyunHelper.Tests.csproj `
            --configuration Release `
            --filter FullyQualifiedName~LiveDataUpdateProbeTests `
            --logger "console;verbosity=detailed"
          $probeExitCode = $LASTEXITCODE

          if (Test-Path $probeOutput) {
            Write-Host 'v1.8.4 live data probe report:'
            Get-Content $probeOutput | ForEach-Object { Write-Host $_ }
          }
          else {
            throw 'v1.8.4 live data contract probe did not produce its diagnostic report.'
          }

          if ($probeExitCode -ne 0) { throw 'v1.8.4 live data contract probe reported an unsupported or invalid current source.' }
