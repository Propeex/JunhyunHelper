name: Repair Release v1.3.2 controller

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/repair-release-v1.3.2.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Repair release/tag absence probes and retrigger controller
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/release-v1.3.2.yml')
          text = path.read_text(encoding='utf-8')
          old = '''          gh release view $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) { throw "Release $env:RELEASE_TAG already exists." }
          $tagRef = gh api "repos/$env:GITHUB_REPOSITORY/git/ref/tags/$env:RELEASE_TAG" 2>$null
          if ($LASTEXITCODE -eq 0) { throw "Tag $env:RELEASE_TAG already exists." }
'''
          new = '''          gh release view $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY *> $null
          $releaseProbeExit = $LASTEXITCODE
          if ($releaseProbeExit -eq 0) { throw "Release $env:RELEASE_TAG already exists." }
          $global:LASTEXITCODE = 0
          $tagRef = gh api "repos/$env:GITHUB_REPOSITORY/git/ref/tags/$env:RELEASE_TAG" 2>$null
          $tagProbeExit = $LASTEXITCODE
          if ($tagProbeExit -eq 0) { throw "Tag $env:RELEASE_TAG already exists." }
          $global:LASTEXITCODE = 0
'''
          if old not in text:
              raise SystemExit('Expected v1.3.2 absence-probe block was not found; refusing broad edit.')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --rebase origin main
          git add .github/workflows/release-v1.3.2.yml
          git diff --cached --quiet && exit 0
          git commit -m 'release: fix v1.3.2 absence probe exit status'
          git push origin HEAD:main
