name: Release v1.1.3 v3

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact main commit SHA to release
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 35
    env:
      RELEASE_VERSION: 1.1.3
      RELEASE_TAG: v1.1.3
      ZIP_NAME: Junhyun-Helper-v1.1.3-win-x64.zip
      RELEASE_SHA: ${{ inputs.source_sha }}

    steps:
      - name: Validate release request
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ($env:RELEASE_SHA -notmatch '^[0-9a-fA-F]{40}$') {
            throw "Invalid exact release SHA: '$env:RELEASE_SHA'"
          }

          $releasesJson = gh api "repos/$env:GITHUB_REPOSITORY/releases?per_page=100"
          if ($LASTEXITCODE -ne 0) { throw 'Could not enumerate repository releases.' }
          $releases = @($releasesJson | ConvertFrom-Json)
          if (@($releases | Where-Object { $_.tag_name -eq $env:RELEASE_TAG }).Count -gt 0) {
            throw "Release $env:RELEASE_TAG already exists."
          }

          $tagLines = @(git ls-remote --tags "https://github.com/$env:GITHUB_REPOSITORY.git" "refs/tags/$env:RELEASE_TAG")
          if ($LASTEXITCODE -ne 0) { throw 'Could not inspect the remote tag namespace.' }
          if ($tagLines.Count -gt 0) {
            throw "Tag $env:RELEASE_TAG already exists: $($tagLines -join '; ')"
          }

          Write-Host "Release namespace clean. Exact source: $env:RELEASE_SHA"

      - name: Checkout exact release source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 1

      - name: Verify exact source
        shell: pwsh
        run: |
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -ne $env:RELEASE_SHA) {
            throw "Release checkout mismatch: expected $env:RELEASE_SHA, got $actual"
          }
          Write-Host "Exact release source verified: $actual"

      - name: Checkout pinned public Map donor
        shell: pwsh
        run: |
          git config --local --unset-all http.https://github.com/.extraheader
          if ($LASTEXITCODE -notin @(0, 5)) { throw "Could not clear GitHub auth header (exit $LASTEXITCODE)." }
          git submodule sync --recursive
          if ($LASTEXITCODE -ne 0) { throw 'Could not synchronize submodule metadata.' }
          git submodule update --init --force --depth=1 --recursive
          if ($LASTEXITCODE -ne 0) { throw 'Could not checkout pinned Map donor.' }
          $actualDonor = (git -C vendor/Tarkov-Helper rev-parse HEAD).Trim()
          $expectedDonor = 'd933792b6042a51cea38dc44b686a096fe30de67'
          if ($actualDonor -ne $expectedDonor) { throw "Map donor mismatch: $actualDonor" }

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build and test exact source
        shell: pwsh
        run: |
          dotnet build src/JunhyunHelper.Desktop/JunhyunHelper.Desktop.csproj --configuration Release
          if ($LASTEXITCODE -ne 0) { throw 'Release build failed.' }
          dotnet test tests/JunhyunHelper.Tests/JunhyunHelper.Tests.csproj --configuration Release
          if ($LASTEXITCODE -ne 0) { throw 'Automated tests failed.' }

      - name: Publish and audit portable package
        shell: pwsh
        run: |
          dotnet publish src/JunhyunHelper.Desktop/JunhyunHelper.Desktop.csproj `
            --configuration Release `
            --runtime win-x64 `
            --self-contained true `
            --output artifacts/publish `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true `
            -p:PublishTrimmed=false `
            -p:PublishReadyToRun=false `
            -p:DebugType=None `
            -p:DebugSymbols=false
          if ($LASTEXITCODE -ne 0) { throw 'Release publish failed.' }

          Copy-Item packaging/FIRST_RUN_KO.txt artifacts/publish/FIRST_RUN_KO.txt

          foreach ($file in @('준현 헬퍼.exe', 'FIRST_RUN_KO.txt', 'Assets/tarkov_data.db')) {
            if (-not (Test-Path (Join-Path artifacts/publish $file))) { throw "Missing release file: $file" }
          }

          [xml]$project = Get-Content 'src/JunhyunHelper.Desktop/JunhyunHelper.Desktop.csproj'
          $projectVersion = [string]($project.Project.PropertyGroup.Version | Select-Object -First 1)
          if ($projectVersion -ne $env:RELEASE_VERSION) { throw "Project version mismatch: $projectVersion" }

          $exePath = (Resolve-Path 'artifacts/publish/준현 헬퍼.exe').Path
          $productVersion = (Get-Item $exePath).VersionInfo.ProductVersion
          $escapedVersion = [Regex]::Escape($env:RELEASE_VERSION)
          if ([string]::IsNullOrWhiteSpace($productVersion) -or $productVersion -notmatch "^$escapedVersion(?:$|[+-])") {
            throw "ProductVersion mismatch: $productVersion"
          }

          $firstLine = Get-Content 'artifacts/publish/FIRST_RUN_KO.txt' -TotalCount 1
          if ($firstLine -ne "준현 헬퍼 v$env:RELEASE_VERSION — Windows x64") { throw "FIRST_RUN mismatch: $firstLine" }

          $rootFiles = @(Get-ChildItem artifacts/publish -File | Select-Object -ExpandProperty Name)
          $unexpectedRootFiles = @($rootFiles | Where-Object { $_ -notin @('준현 헬퍼.exe', 'FIRST_RUN_KO.txt') })
          if ($unexpectedRootFiles.Count -gt 0) { throw "Unexpected release-root files: $($unexpectedRootFiles -join ', ')" }

          $rootDirs = @(Get-ChildItem artifacts/publish -Directory | Select-Object -ExpandProperty Name)
          if ($rootDirs.Count -ne 1 -or $rootDirs[0] -ne 'Assets') { throw 'Portable root directory contract is invalid.' }
          if (@(Get-ChildItem artifacts/publish -Recurse -File -Filter *.pdb).Count -gt 0) { throw 'Publish contains PDB files.' }
          if (@(Get-ChildItem artifacts/publish -Recurse -File | Where-Object { $_.Extension -in @('.zip','.7z','.rar') }).Count -gt 0) { throw 'Publish contains a nested archive.' }

          foreach ($file in @('AutoUpdater.NET.dll','Microsoft.Web.WebView2.Core.dll','Microsoft.Web.WebView2.WinForms.dll','Microsoft.Web.WebView2.Wpf.dll','WebView2Loader.dll','Westermo.GraphX.Controls.dll','Westermo.GraphX.Common.dll','QuikGraph.dll')) {
            if (Get-ChildItem artifacts/publish -Recurse -File -Filter $file) { throw "Forbidden legacy dependency: $file" }
          }

          "RELEASE_PRODUCT_VERSION=$productVersion" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "RELEASE_EXE_BYTES=$((Get-Item $exePath).Length)" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "ProductVersion: $productVersion"
          Write-Host "Published EXE bytes: $((Get-Item $exePath).Length)"
          Write-Host "Total published files: $(@(Get-ChildItem artifacts/publish -Recurse -File).Count)"

      - name: Smoke exact published executable
        shell: pwsh
        env:
          JUNHYUNHELPER_MAP_SMOKE: '1'
        run: |
          $workDir = (Resolve-Path artifacts/publish).Path
          $exe = Join-Path $workDir '준현 헬퍼.exe'
          $diagnostic = Join-Path $env:TEMP 'junhyun-map-smoke-error.txt'
          $success = Join-Path $env:TEMP 'junhyun-map-smoke-success.txt'
          Remove-Item $diagnostic,$success -Force -ErrorAction SilentlyContinue
          $p = Start-Process -FilePath $exe -WorkingDirectory $workDir -PassThru
          try {
            $deadline=(Get-Date).AddSeconds(75); $done=$false
            while((Get-Date)-lt $deadline){
              $p.Refresh()
              if(Test-Path $diagnostic){ Get-Content $diagnostic | ForEach-Object { Write-Host $_ }; throw 'Exact package smoke failed.' }
              if(Test-Path $success){ $done=$true; break }
              if($p.HasExited){ throw "Exact app exited early: $($p.ExitCode)" }
              Start-Sleep -Milliseconds 250
            }
            if(-not $done){ throw 'Exact package smoke timed out.' }
            $requested=$false
            for($i=0;$i-lt 10;$i++){
              $p.Refresh()
              if($p.HasExited){$requested=$true;break}
              if($p.CloseMainWindow()){$requested=$true;break}
              Start-Sleep -Milliseconds 500
            }
            if(-not $requested){ throw 'Could not request exact Main Window close.' }
            $p.Refresh()
            if(-not $p.HasExited -and -not $p.WaitForExit(7000)){ throw 'Exact app did not exit normally.' }
            if(Test-Path (Join-Path $workDir 'Logs')){ throw 'Portable root was polluted with Logs.' }
          }
          finally { $p.Refresh(); if(-not $p.HasExited){ Stop-Process -Id $p.Id -Force } }
          Write-Host 'Exact v1.1.3 Product UI + Scanner + Main Map + Factory + MiniMap smoke passed.'

      - name: Package release and checksum
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts/release | Out-Null
          $zip = Join-Path artifacts/release $env:ZIP_NAME
          Compress-Archive -Path 'artifacts/publish/*' -DestinationPath $zip -CompressionLevel Optimal
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          $bytes = (Get-Item $zip).Length
          "$hash  $env:ZIP_NAME" | Set-Content artifacts/release/SHA256SUMS.txt -Encoding ascii
          @"
          # 준현 헬퍼 v1.1.3 — Scanner Lab v3.8 인식 파이프라인 복원

          실제로 잘 작동했던 Scanner Lab v3.8 원본을 기준으로 Scanner recognition architecture를 복원한 PATCH 릴리즈입니다.

          - RED-X + rectangle structural candidates
          - 최대 8개 candidate semantic OCR/catalog validation
          - adaptive 4x/6x/8x OCR
          - 상위 3개 deep OCR preprocessing
          - current official Korean full-item catalog와 conservative matcher 유지
          - historical alias 추가/threshold 완화 없음
          - Scanner UI / Mini Scanner / 기존 데이터 bridge 유지
          - 245 automated tests
          - Windows Release / self-contained publish / actual EXE Product UI + Scanner + Map smoke

          최신 Tarkov Borderless E2E는 공개 후 사용자 환경에서 scanner.log와 함께 계속 검증합니다.
          "@ | Set-Content artifacts/release/RELEASE_NOTES.md -Encoding utf8
          "RELEASE_ZIP_SHA256=$hash" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "RELEASE_ZIP_BYTES=$bytes" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "ZIP bytes: $bytes"
          Write-Host "ZIP SHA-256: $hash"

      - name: Create draft release with assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create $env:RELEASE_TAG `
            --repo $env:GITHUB_REPOSITORY `
            --target $env:RELEASE_SHA `
            --draft `
            --title '준현 헬퍼 v1.1.3 — Scanner Lab v3.8 인식 복원' `
            --notes-file artifacts/release/RELEASE_NOTES.md `
            "artifacts/release/$env:ZIP_NAME" `
            artifacts/release/SHA256SUMS.txt
          if ($LASTEXITCODE -ne 0) { throw 'Could not create draft v1.1.3 release.' }

          $releases = @(gh api "repos/$env:GITHUB_REPOSITORY/releases?per_page=100" | ConvertFrom-Json)
          if ($LASTEXITCODE -ne 0) { throw 'Could not enumerate releases after draft creation.' }
          $matches = @($releases | Where-Object { $_.tag_name -eq $env:RELEASE_TAG })
          if ($matches.Count -ne 1) { throw "Expected one draft release, found $($matches.Count)." }
          $draft = $matches[0]
          if (-not $draft.draft -or [string]$draft.target_commitish -ne $env:RELEASE_SHA) {
            throw 'Draft release metadata does not match exact-source contract.'
          }
          "DRAFT_RELEASE_ID=$($draft.id)" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Draft release id: $($draft.id) / target: $($draft.target_commitish)"

      - name: Download and verify draft package
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force artifacts/draft-download | Out-Null
          gh release download $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --dir artifacts/draft-download --pattern $env:ZIP_NAME --pattern SHA256SUMS.txt
          if ($LASTEXITCODE -ne 0) { throw 'Could not download draft assets.' }

          $zip = Join-Path artifacts/draft-download $env:ZIP_NAME
          $checksum = Get-Content artifacts/draft-download/SHA256SUMS.txt | Where-Object { $_ -match [Regex]::Escape($env:ZIP_NAME) } | Select-Object -First 1
          if (-not $checksum) { throw 'Draft checksum entry missing.' }
          $expected = (($checksum -split '\s+')[0]).ToLowerInvariant()
          $actual = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          $bytes = (Get-Item $zip).Length
          if ($expected -ne $env:RELEASE_ZIP_SHA256 -or $actual -ne $env:RELEASE_ZIP_SHA256) { throw 'Draft ZIP SHA-256 mismatch.' }
          if ([string]$bytes -ne [string]$env:RELEASE_ZIP_BYTES) { throw "Draft ZIP size mismatch: $bytes" }

          Expand-Archive $zip artifacts/draft-extracted
          $productVersion = (Get-Item 'artifacts/draft-extracted/준현 헬퍼.exe').VersionInfo.ProductVersion
          if ($productVersion -notmatch '^1\.1\.3(?:$|[+-])') { throw "Draft ProductVersion mismatch: $productVersion" }
          $firstLine = Get-Content artifacts/draft-extracted/FIRST_RUN_KO.txt -TotalCount 1
          if ($firstLine -ne '준현 헬퍼 v1.1.3 — Windows x64') { throw "Draft FIRST_RUN mismatch: $firstLine" }
          Write-Host "Draft package verified: $bytes bytes / $actual / $productVersion"

      - name: Smoke draft-downloaded executable
        shell: pwsh
        env:
          JUNHYUNHELPER_MAP_SMOKE: '1'
        run: |
          $workDir = (Resolve-Path artifacts/draft-extracted).Path
          $exe = Join-Path $workDir '준현 헬퍼.exe'
          $diagnostic = Join-Path $env:TEMP 'junhyun-map-smoke-error.txt'
          $success = Join-Path $env:TEMP 'junhyun-map-smoke-success.txt'
          Remove-Item $diagnostic,$success -Force -ErrorAction SilentlyContinue
          $p = Start-Process -FilePath $exe -WorkingDirectory $workDir -PassThru
          try {
            $deadline=(Get-Date).AddSeconds(75); $done=$false
            while((Get-Date)-lt $deadline){ $p.Refresh(); if(Test-Path $diagnostic){Get-Content $diagnostic|ForEach-Object{Write-Host $_};throw 'Draft smoke failed.'}; if(Test-Path $success){$done=$true;break}; if($p.HasExited){throw "Draft app exited early: $($p.ExitCode)"}; Start-Sleep -Milliseconds 250 }
            if(-not $done){throw 'Draft smoke timed out.'}
            $requested=$false
            for($i=0;$i-lt 10;$i++){ $p.Refresh(); if($p.HasExited){$requested=$true;break}; if($p.CloseMainWindow()){$requested=$true;break}; Start-Sleep -Milliseconds 500 }
            if(-not $requested){throw 'Could not request draft Main Window close.'}
            $p.Refresh(); if(-not $p.HasExited -and -not $p.WaitForExit(7000)){throw 'Draft app did not exit normally.'}
          }
          finally { $p.Refresh(); if(-not $p.HasExited){Stop-Process -Id $p.Id -Force} }
          Write-Host 'Draft-downloaded v1.1.3 EXE smoke passed.'

      - name: Publish release as latest and verify exact tag
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release edit $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --draft=false --latest
          if ($LASTEXITCODE -ne 0) { throw 'Could not publish v1.1.3 release.' }

          $publicJson = gh api "repos/$env:GITHUB_REPOSITORY/releases/tags/$env:RELEASE_TAG"
          if ($LASTEXITCODE -ne 0) { throw 'Could not fetch public release metadata.' }
          $public = $publicJson | ConvertFrom-Json
          if ($public.draft -or $public.prerelease) { throw 'Published release flags are invalid.' }

          $refJson = gh api "repos/$env:GITHUB_REPOSITORY/git/ref/tags/$env:RELEASE_TAG"
          if ($LASTEXITCODE -ne 0) { throw 'Could not fetch public tag ref through GitHub API.' }
          $tagRef = $refJson | ConvertFrom-Json
          $tagSha = [string]$tagRef.object.sha
          if ([string]$tagRef.object.type -eq 'tag') {
            $tagObjectJson = gh api "repos/$env:GITHUB_REPOSITORY/git/tags/$tagSha"
            if ($LASTEXITCODE -ne 0) { throw 'Could not dereference annotated release tag.' }
            $tagObject = $tagObjectJson | ConvertFrom-Json
            $tagSha = [string]$tagObject.object.sha
          }
          if ($tagSha -ne $env:RELEASE_SHA) { throw "Public tag target mismatch: $tagSha" }
          Write-Host "Public/latest release target verified through GitHub API: $tagSha"

      - name: Re-download and verify public package
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force artifacts/public-download | Out-Null
          gh release download $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --dir artifacts/public-download --pattern $env:ZIP_NAME --pattern SHA256SUMS.txt
          if ($LASTEXITCODE -ne 0) { throw 'Could not download public assets.' }

          $zip = Join-Path artifacts/public-download $env:ZIP_NAME
          $checksum = Get-Content artifacts/public-download/SHA256SUMS.txt | Where-Object { $_ -match [Regex]::Escape($env:ZIP_NAME) } | Select-Object -First 1
          if (-not $checksum) { throw 'Public checksum entry missing.' }
          $expected = (($checksum -split '\s+')[0]).ToLowerInvariant()
          $actual = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          $bytes = (Get-Item $zip).Length
          if ($expected -ne $env:RELEASE_ZIP_SHA256 -or $actual -ne $env:RELEASE_ZIP_SHA256) { throw 'Public ZIP SHA-256 mismatch.' }
          if ([string]$bytes -ne [string]$env:RELEASE_ZIP_BYTES) { throw "Public ZIP size mismatch: $bytes" }

          Expand-Archive $zip artifacts/public-extracted
          $productVersion = (Get-Item 'artifacts/public-extracted/준현 헬퍼.exe').VersionInfo.ProductVersion
          if ($productVersion -notmatch '^1\.1\.3(?:$|[+-])') { throw "Public ProductVersion mismatch: $productVersion" }
          Write-Host "Public package verified: $bytes bytes / $actual / $productVersion"

      - name: Smoke public-downloaded executable
        shell: pwsh
        env:
          JUNHYUNHELPER_MAP_SMOKE: '1'
        run: |
          $workDir = (Resolve-Path artifacts/public-extracted).Path
          $exe = Join-Path $workDir '준현 헬퍼.exe'
          $diagnostic = Join-Path $env:TEMP 'junhyun-map-smoke-error.txt'
          $success = Join-Path $env:TEMP 'junhyun-map-smoke-success.txt'
          Remove-Item $diagnostic,$success -Force -ErrorAction SilentlyContinue
          $p = Start-Process -FilePath $exe -WorkingDirectory $workDir -PassThru
          try {
            $deadline=(Get-Date).AddSeconds(75); $done=$false
            while((Get-Date)-lt $deadline){ $p.Refresh(); if(Test-Path $diagnostic){Get-Content $diagnostic|ForEach-Object{Write-Host $_};throw 'Public smoke failed.'}; if(Test-Path $success){$done=$true;break}; if($p.HasExited){throw "Public app exited early: $($p.ExitCode)"}; Start-Sleep -Milliseconds 250 }
            if(-not $done){throw 'Public smoke timed out.'}
            $requested=$false
            for($i=0;$i-lt 10;$i++){ $p.Refresh(); if($p.HasExited){$requested=$true;break}; if($p.CloseMainWindow()){$requested=$true;break}; Start-Sleep -Milliseconds 500 }
            if(-not $requested){throw 'Could not request public Main Window close.'}
            $p.Refresh(); if(-not $p.HasExited -and -not $p.WaitForExit(7000)){throw 'Public app did not exit normally.'}
          }
          finally { $p.Refresh(); if(-not $p.HasExited){Stop-Process -Id $p.Id -Force} }
          Write-Host 'Public-downloaded v1.1.3 Product UI + Scanner + Main Map + Factory + MiniMap smoke passed.'

      - name: Publish release verification summary
        shell: pwsh
        run: |
          Write-Host 'v1.1.3 PUBLIC RELEASE VERIFIED'
          Write-Host "source=$env:RELEASE_SHA"
          Write-Host "asset=$env:ZIP_NAME"
          Write-Host "bytes=$env:RELEASE_ZIP_BYTES"
          Write-Host "sha256=$env:RELEASE_ZIP_SHA256"
          Write-Host "productVersion=$env:RELEASE_PRODUCT_VERSION"

      - name: Upload verified release package for workflow audit
        uses: actions/upload-artifact@v4
        with:
          name: JunhyunHelper-v1.1.3-release-audit
          path: artifacts/release
          if-no-files-found: error
          retention-days: 14

      - name: Retract incomplete v1.1.3 release on failure
        if: failure()
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $releasesJson = gh api "repos/$env:GITHUB_REPOSITORY/releases?per_page=100"
          if ($LASTEXITCODE -eq 0) {
            $releases = @($releasesJson | ConvertFrom-Json)
            $matches = @($releases | Where-Object { $_.tag_name -eq $env:RELEASE_TAG })
            if ($matches.Count -gt 0) {
              gh release delete $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --yes --cleanup-tag
            }
          }
          Write-Host 'Failure cleanup completed; no incomplete v1.1.3 release is intentionally retained.'
