name: Verify public v1.4.2
# One-shot independent verifier for the public release produced by release-v1.4.2.yml.

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-v1.4.2.yml'

permissions:
  contents: write
  actions: read

env:
  SOURCE_SHA: a2d939b5f28e0d6de2468312bdd11467e3b35622
  CONTROLLER_SHA: f664d067ade4a669aa944f157cd0d4acc1b21718
  RELEASE_VERSION: 1.4.2
  RELEASE_TAG: v1.4.2
  RELEASE_WORKFLOW: release-v1.4.2.yml
  FINAL_PR_CI: '32656572239'
  EXPECTED_TESTS: '272'
  ASSET_NAME: Junhyun-Helper-v1.4.2-win-x64.zip
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  JUNHYUNHELPER_MAP_SMOKE: '1'

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout verifier source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Verify workflow, public release, package and executable
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          function Assert-Exit([string]$Message) {
            if ($LASTEXITCODE -ne 0) { throw "$Message (exit $LASTEXITCODE)." }
          }

          function Assert-Package([string]$Root) {
            foreach ($file in @('준현 헬퍼.exe','FIRST_RUN_KO.txt','Assets/tarkov_data.db')) {
              if (-not (Test-Path (Join-Path $Root $file))) { throw "Missing package file: $file" }
            }
            $rootNames = @(Get-ChildItem $Root | Select-Object -ExpandProperty Name | Sort-Object)
            $expectedRoot = @('Assets','FIRST_RUN_KO.txt','준현 헬퍼.exe') | Sort-Object
            if (Compare-Object $rootNames $expectedRoot) { throw "Package root mismatch: $($rootNames -join ', ')" }
            if (@(Get-ChildItem $Root -Recurse -File -Filter *.pdb).Count -gt 0) { throw 'Package contains PDB files.' }
            if (@(Get-ChildItem $Root -Recurse -File | Where-Object { $_.Extension -in @('.zip','.7z','.rar') }).Count -gt 0) { throw 'Package contains nested archives.' }

            foreach ($legacy in @(
              'AutoUpdater.NET.dll',
              'Microsoft.Web.WebView2.Core.dll',
              'Microsoft.Web.WebView2.WinForms.dll',
              'Microsoft.Web.WebView2.Wpf.dll',
              'WebView2Loader.dll',
              'Westermo.GraphX.Controls.dll',
              'Westermo.GraphX.Common.dll',
              'QuikGraph.dll')) {
              if (Get-ChildItem $Root -Recurse -File -Filter $legacy) { throw "Legacy dependency leaked into package: $legacy" }
            }

            $exe = Get-Item (Join-Path $Root '준현 헬퍼.exe')
            $expectedProduct = "$env:RELEASE_VERSION+$env:SOURCE_SHA"
            if ($exe.VersionInfo.ProductVersion -ne $expectedProduct) {
              throw "ProductVersion '$($exe.VersionInfo.ProductVersion)' != '$expectedProduct'."
            }
            $first = Get-Content (Join-Path $Root 'FIRST_RUN_KO.txt') -TotalCount 1
            if ($first -ne "준현 헬퍼 v$env:RELEASE_VERSION — Windows x64") { throw "FIRST_RUN identity mismatch: $first" }
          }

          function Invoke-ProductSmoke([string]$Root, [string]$Label) {
            $exe = (Resolve-Path (Join-Path $Root '준현 헬퍼.exe')).Path
            $diagnostic = Join-Path $env:TEMP 'junhyun-map-smoke-error.txt'
            $success = Join-Path $env:TEMP 'junhyun-map-smoke-success.txt'
            $startupLog = Join-Path $env:LOCALAPPDATA 'JunhyunHelper/logs/startup.log'
            Remove-Item $diagnostic,$success,$startupLog -Force -ErrorAction SilentlyContinue

            $process = Start-Process -FilePath $exe -WorkingDirectory $Root -PassThru
            try {
              $deadline = (Get-Date).AddSeconds(75)
              while ((Get-Date) -lt $deadline) {
                $process.Refresh()
                if (Test-Path $diagnostic) {
                  Get-Content $diagnostic | ForEach-Object { Write-Host $_ }
                  throw "$Label smoke diagnostic failure."
                }
                if (Test-Path $startupLog) {
                  Get-Content $startupLog | ForEach-Object { Write-Host $_ }
                  throw "$Label startup failure."
                }
                if (Test-Path $success) { break }
                if ($process.HasExited) { throw "$Label exited before smoke completion: $($process.ExitCode)" }
                Start-Sleep -Milliseconds 250
              }
              if (-not (Test-Path $success)) { throw "$Label smoke timed out." }

              $closeRequested = $false
              for ($i = 0; $i -lt 10; $i++) {
                $process.Refresh()
                if ($process.HasExited -or $process.CloseMainWindow()) { $closeRequested = $true; break }
                Start-Sleep -Milliseconds 500
              }
              if (-not $closeRequested) { throw "$Label could not request normal MainWindow close." }
              $process.Refresh()
              if (-not $process.HasExited -and -not $process.WaitForExit(7000)) { throw "$Label did not terminate after normal close." }
              if (Test-Path (Join-Path $Root 'Logs')) { throw "$Label polluted the portable package root." }
            }
            finally {
              $process.Refresh()
              if (-not $process.HasExited) { Stop-Process -Id $process.Id -Force }
            }
          }

          $releaseRun = $null
          for ($attempt = 0; $attempt -lt 60; $attempt++) {
            $runs = @(gh run list --repo $env:GITHUB_REPOSITORY --workflow $env:RELEASE_WORKFLOW --limit 1 --json databaseId,status,conclusion,headSha | ConvertFrom-Json)
            Assert-Exit 'Could not query v1.4.2 release workflow'
            if ($runs.Count -gt 0 -and $runs[0].status -eq 'completed') {
              $releaseRun = $runs[0]
              break
            }
            Start-Sleep -Seconds 10
          }
          if ($null -eq $releaseRun) { throw 'v1.4.2 release workflow did not complete within verifier window.' }
          if ($releaseRun.conclusion -ne 'success') { throw "Release workflow conclusion is '$($releaseRun.conclusion)'." }
          if ($releaseRun.headSha -ne $env:CONTROLLER_SHA) { throw "Release workflow head '$($releaseRun.headSha)' != controller '$env:CONTROLLER_SHA'." }

          $release = gh release view $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --json tagName,isDraft,isPrerelease,url | ConvertFrom-Json
          Assert-Exit 'Could not read v1.4.2 release'
          if ($release.tagName -ne $env:RELEASE_TAG -or $release.isDraft -or $release.isPrerelease) { throw 'v1.4.2 is not a public stable release.' }
          $latest = (gh api "repos/$env:GITHUB_REPOSITORY/releases/latest" --jq '.tag_name').Trim()
          Assert-Exit 'Could not read latest public release'
          if ($latest -ne $env:RELEASE_TAG) { throw "Latest release is '$latest', not '$env:RELEASE_TAG'." }

          $ref = gh api "repos/$env:GITHUB_REPOSITORY/git/ref/tags/$env:RELEASE_TAG" | ConvertFrom-Json
          Assert-Exit 'Could not read v1.4.2 tag ref'
          $tagSha = [string]$ref.object.sha
          if ([string]$ref.object.type -eq 'tag') {
            $tagObject = gh api "repos/$env:GITHUB_REPOSITORY/git/tags/$tagSha" | ConvertFrom-Json
            Assert-Exit 'Could not dereference annotated v1.4.2 tag'
            $tagSha = [string]$tagObject.object.sha
          }
          if ($tagSha -ne $env:SOURCE_SHA) { throw "v1.4.2 tag '$tagSha' != exact source '$env:SOURCE_SHA'." }

          Remove-Item artifacts -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force artifacts/public | Out-Null
          gh release download $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --dir artifacts/public --clobber
          Assert-Exit 'Could not download public v1.4.2 assets'
          $zip = Join-Path artifacts/public $env:ASSET_NAME
          $sum = Join-Path artifacts/public 'SHA256SUMS.txt'
          if (-not (Test-Path $zip) -or -not (Test-Path $sum)) { throw 'Public release assets are incomplete.' }
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          $bytes = (Get-Item $zip).Length
          $sumLine = Get-Content $sum | Where-Object { $_ -match [Regex]::Escape($env:ASSET_NAME) } | Select-Object -First 1
          if ($sumLine -notmatch '^([0-9a-fA-F]{64})\s{2,}(.+)$' -or $Matches[1].ToLowerInvariant() -ne $hash) { throw 'Public SHA256SUMS does not match ZIP.' }

          Expand-Archive $zip artifacts/extracted -Force
          Assert-Package (Resolve-Path artifacts/extracted).Path
          Invoke-ProductSmoke (Resolve-Path artifacts/extracted).Path 'Independent public v1.4.2 verifier'

          $record = [ordered]@{
            version = $env:RELEASE_TAG
            source_sha = $env:SOURCE_SHA
            tag_sha = $tagSha
            asset = $env:ASSET_NAME
            bytes = [long]$bytes
            sha256 = $hash
            product_version = "$env:RELEASE_VERSION+$env:SOURCE_SHA"
            tests = [int]$env:EXPECTED_TESTS
            final_pr_ci = [long]$env:FINAL_PR_CI
            release_run = [long]$releaseRun.databaseId
            release_workflow_conclusion = [string]$releaseRun.conclusion
            public_verifier_run = [long]$env:GITHUB_RUN_ID
            public_latest_verified = $true
            exact_tag_source_verified = $true
            public_redownload_verified = $true
            public_sha256sums_verified = $true
            public_package_layout_verified = $true
            public_exe_smoke = 'SUCCESS'
            verified_at_utc = [DateTimeOffset]::UtcNow.ToString('O')
          }
          $statusPath = 'docs/.release-v1.4.2-status.json'
          $record | ConvertTo-Json | Set-Content -Encoding utf8NoBOM $statusPath
          Write-Host "PUBLIC_V1_4_2_VERIFIED $($record | ConvertTo-Json -Compress)"

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add $statusPath
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m 'docs: record verified v1.4.2 public release'
            Assert-Exit 'Could not commit v1.4.2 public verification status'
            git push origin HEAD:main
            Assert-Exit 'Could not publish v1.4.2 verification status to main'
          }
