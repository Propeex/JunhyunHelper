name: Diagnose v1.8.2 live regressions

on:
  push:
    branches:
      - fix/v1.8.2-runtime-live-regressions-2026-08-28
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  diagnose-live-crafts:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Inspect current json.tarkov.dev craft shapes
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $targetCraftId = '5d5c205bd582a50d042a3c0e'
          $targetStationId = '5d494a445b56502f18c98a10'
          $targetProductId = '59faff1d86f7746c51718c9c'
          foreach ($mode in @('regular', 'pve')) {
            $headers = @{ 'User-Agent' = 'JunhyunHelper-v1.8.2-diagnostic/1.0' }
            $craftRoot = Invoke-RestMethod -Uri "https://json.tarkov.dev/$mode/crafts" -Headers $headers
            $crafts = @($craftRoot.data)
            Write-Host "MODE=$mode CRAFTS=$($crafts.Count)"
            $empty = @($crafts | Where-Object { @($_.requiredItems).Count -eq 0 })
            Write-Host "MODE=$mode EMPTY_REQUIRED=$($empty.Count)"
            foreach ($craft in $empty) {
              $json = $craft | ConvertTo-Json -Depth 12 -Compress
              Write-Host "EMPTY_CRAFT mode=$mode id=$($craft.id) payload=$json"
            }

            $itemsRoot = Invoke-RestMethod -Uri "https://json.tarkov.dev/$mode/items" -Headers $headers
            $product = @($itemsRoot.data) | Where-Object { $_.id -eq $targetProductId } | Select-Object -First 1
            Write-Host "PRODUCT mode=$mode id=$targetProductId payload=$(($product | ConvertTo-Json -Depth 12 -Compress))"

            $hideoutRoot = Invoke-RestMethod -Uri "https://json.tarkov.dev/$mode/hideout" -Headers $headers
            $station = @($hideoutRoot.data) | Where-Object { $_.id -eq $targetStationId } | Select-Object -First 1
            if (-not $station) {
              $station = @($hideoutRoot.data.stations) | Where-Object { $_.id -eq $targetStationId } | Select-Object -First 1
            }
            Write-Host "STATION mode=$mode id=$targetStationId payload=$(($station | ConvertTo-Json -Depth 12 -Compress))"
          }

      - name: Reproduce production live data build
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Checkout pinned public Map donor
        shell: pwsh
        run: |
          git submodule sync --recursive
          if ($LASTEXITCODE -ne 0) { throw 'Could not synchronize submodules.' }
          git submodule update --init --force --depth=1 --recursive
          if ($LASTEXITCODE -ne 0) { throw 'Could not checkout Map donor.' }

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Run current production live probe
        continue-on-error: true
        shell: pwsh
        env:
          JUNHYUNHELPER_LIVE_DATA_PROBE: '1'
        run: |
          dotnet test tests/JunhyunHelper.Tests/JunhyunHelper.Tests.csproj --configuration Release --filter FullyQualifiedName~LiveDataUpdateProbeTests --logger "console;verbosity=detailed"
