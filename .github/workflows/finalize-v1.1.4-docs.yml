name: Finalize v1.1.4 docs

on:
  push:
    branches: [finalize-v1.1.4-release]
    paths:
      - '.github/workflows/finalize-v1.1.4-docs.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout finalization branch
        uses: actions/checkout@v4
        with:
          ref: finalize-v1.1.4-release
          fetch-depth: 1

      - name: Replace release-candidate state with verified public evidence
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          function Replace-Exact([string]$Path, [string]$Old, [string]$New) {
            $text = [IO.File]::ReadAllText($Path)
            if (-not $text.Contains($Old)) {
              throw "Expected text not found in $Path`n--- expected ---`n$Old"
            }
            $text = $text.Replace($Old, $New)
            [IO.File]::WriteAllText($Path, $text, [Text.UTF8Encoding]::new($false))
          }

          $releaseEvidence = @'
          ```text
          public stable: v1.1.4
          release source: 833ac66c522632a695d106bd7ca9b1d6bfc030dc
          PR final CI: 32475893012 — SUCCESS
          exact-source Draft-first release run: 32476391800
          public verification run: 32476952938 — SUCCESS
          automated tests: 247 passed / 0 failed / 0 skipped
          asset: Junhyun-Helper-v1.1.4-win-x64.zip
          bytes: 80,253,044
          SHA-256: 6d7a4646032c91a66d66ceac0d78b197dd112e78fa9c7a6e99d7092febc2cb54
          ProductVersion: 1.1.4+833ac66c522632a695d106bd7ca9b1d6bfc030dc
          Draft-downloaded EXE smoke: SUCCESS
          public/latest: VERIFIED
          exact tag source: VERIFIED
          public-downloaded EXE smoke: SUCCESS
          ```
          '@.Trim()

          Replace-Exact 'README.md' `
            '현재 public stable은 v1.1.3이며 **v1.1.4 Scanner hardening PATCH release candidate**를 검증 중입니다.' `
            '현재 public stable은 **v1.1.4**이며 Scanner hardening PATCH의 공개 패키지 검증까지 완료했습니다.'
          Replace-Exact 'README.md' `
            '최종 public source/run/ZIP hash는 `docs/RELEASE_1.1.4.md`에 기록합니다.' `
            ("공개 검증 기준선:`n`n" + $releaseEvidence + "`n`n상세 릴리즈 기록은 `docs/RELEASE_1.1.4.md`에 있습니다.")

          Replace-Exact 'docs/CURRENT_STATE.md' `
            '상태: **`v1.1.4 RELEASE CANDIDATE — Scanner hardening / data reliability / log clear`**' `
            '상태: **`v1.1.4 PUBLIC RELEASE / VERIFIED — Scanner hardening / data reliability / log clear`**'
          Replace-Exact 'docs/CURRENT_STATE.md' `
            '현재 public stable은 v1.1.3이며 v1.1.4 public release 검증을 진행합니다.' `
            '현재 public stable은 **v1.1.4**이며 Draft와 public 자산을 각각 다시 내려받아 검증했습니다.'
          Replace-Exact 'docs/CURRENT_STATE.md' `
            '최종 release source/run/hash는 `docs/RELEASE_1.1.4.md`에 기록합니다.' `
            ("공개 릴리즈 증거:`n`n" + $releaseEvidence + "`n`n상세: `docs/RELEASE_1.1.4.md`.")
          Replace-Exact 'docs/CURRENT_STATE.md' `
            '| Scanner + Mini Scanner | **v1.1.4 release candidate / live Tarkov validation ongoing** |' `
            '| Scanner + Mini Scanner | **v1.1.4 public verified / live Tarkov validation ongoing** |'

          Replace-Exact 'docs/STATE.md' `
            '현재 public stable은 **v1.1.3**입니다. 현재 branch의 target은 **v1.1.4 PATCH**이며 최종 Windows/public release gate를 진행합니다.' `
            '현재 public stable은 **v1.1.4**입니다. Scanner hardening PATCH의 Windows, Draft, public package gate를 모두 완료했습니다.'
          Replace-Exact 'docs/STATE.md' `
            '최종 source SHA, release run, ZIP bytes/SHA-256, ProductVersion은 public release 완료 뒤 이 문서와 `docs/RELEASE_1.1.4.md`에 고정합니다.' `
            ("v1.1.4 공개 릴리즈 증거:`n`n" + $releaseEvidence + "`n`n릴리즈 태그 `v1.1.4`와 release source `833ac66c522632a695d106bd7ca9b1d6bfc030dc`는 identical로 검증되었습니다.")
          Replace-Exact 'docs/STATE.md' `
            '| Scanner | **v1.1.4 release candidate / Scanner Lab v3.8 contract preserved / live Tarkov validation ongoing** |' `
            '| Scanner | **v1.1.4 public verified / Scanner Lab v3.8 contract preserved / live Tarkov validation ongoing** |'

          Replace-Exact 'docs/RELEASE_1.1.4.md' `
            '상태: **`RELEASE CANDIDATE — FINAL WINDOWS GATE IN PROGRESS`**' `
            '상태: **`PUBLIC RELEASE / VERIFIED`**'
          Replace-Exact 'docs/RELEASE_1.1.4.md' `
            '최종 release source/run/ZIP bytes/SHA-256/ProductVersion은 public release 검증 완료 후 이 문서에 기록합니다.' `
            ("최종 공개 릴리즈 검증:`n`n" + $releaseEvidence + @'

첫 exact-source release workflow `32476391800`은 public 전환 자체까지 성공한 뒤 태그 재조회용 PowerShell refspec 문자열 버그로 마지막 자동 단계가 실패했습니다. 제품/패키지 실패가 아니었으며, 그 전에 exact-source build, 247 tests, package audit, exact-source EXE smoke, Draft 생성, Draft 재다운로드 checksum/ProductVersion 검증, Draft-downloaded EXE smoke가 모두 성공했습니다.

이후 독립 public verification run `32476952938`에서 public/latest, exact tag source, public ZIP SHA-256, package root, ProductVersion, FIRST_RUN identity, public-downloaded EXE Product UI/Scanner/Map/Factory/MiniMap smoke와 정상 종료를 다시 검증해 릴리즈를 최종 승인했습니다.
'@)

          Replace-Exact 'docs/PRODUCT.md' `
            '`CONFIRMED / IMPLEMENTED / v1.1.4 RELEASE CANDIDATE / LIVE TARKOV VALIDATION ONGOING`' `
            '`CONFIRMED / IMPLEMENTED / v1.1.4 PUBLIC VERIFIED / LIVE TARKOV VALIDATION ONGOING`'
          Replace-Exact 'docs/PRODUCT.md' `
            "개발 target:`n`n```text`nv1.1.4 — Scanner stability / market & needed-data reliability / diagnostics hardening`n247 tests`n```" `
            "현재 public stable:`n`n```text`nv1.1.4 — Scanner stability / market & needed-data reliability / diagnostics hardening`nrelease source: 833ac66c522632a695d106bd7ca9b1d6bfc030dc`n247 passed / 0 failed / 0 skipped`npublic-downloaded EXE smoke: SUCCESS`n```"
          Replace-Exact 'docs/PRODUCT.md' `
            '최종 public source/run/hash는 `docs/RELEASE_1.1.4.md`에 기록합니다.' `
            '최종 public source/run/hash는 `docs/RELEASE_1.1.4.md`에 고정되어 있습니다.'

          Replace-Exact 'docs/SCANNER.md' `
            '상태: **`v1.1.4 RELEASE CANDIDATE / SCANNER LAB v3.8 CONTRACT PRESERVED / LIVE TARKOV E2E ONGOING`**' `
            '상태: **`v1.1.4 PUBLIC RELEASE / VERIFIED / SCANNER LAB v3.8 CONTRACT PRESERVED / LIVE TARKOV E2E ONGOING`**'
          Replace-Exact 'docs/SCANNER.md' `
            'v1.1.4 release gate:' `
            'v1.1.4 public release gate — 완료:'

          Replace-Exact 'docs/SCANNER_TEST_PLAN.md' `
            '상태: **`RELEASE CANDIDATE / FINAL WINDOWS + PUBLIC RELEASE GATE`**' `
            '상태: **`PUBLIC RELEASE GATE PASSED / v1.1.4 PUBLIC VERIFIED / LIVE TARKOV E2E POST-RELEASE`**'
          Replace-Exact 'docs/SCANNER_TEST_PLAN.md' `
            '최종 run/source/hash는 `docs/RELEASE_1.1.4.md`와 `docs/STATE.md`에 기록합니다.' `
            '최종 run/source/hash는 `docs/RELEASE_1.1.4.md`와 `docs/STATE.md`에 고정되어 있습니다.'

          Replace-Exact 'docs/ARCHITECTURE.md' `
            '현재 개발 기준선: **`v1.1.4 RELEASE CANDIDATE`**. 현재 public stable은 v1.1.3이며 최종 public 검증 후 상태 문서를 갱신합니다.' `
            '현재 기준선: **`v1.1.4 PUBLIC RELEASE / VERIFIED`**. release source는 `833ac66c522632a695d106bd7ca9b1d6bfc030dc`이며 실제 공개 ZIP 재다운로드와 EXE smoke까지 검증했습니다.'

          Replace-Exact 'docs/DEVELOPER_REFERENCE.md' `
            '상태: **`ACTIVE / v1.1.4 RELEASE CANDIDATE`**' `
            '상태: **`ACTIVE / v1.1.4 PUBLIC RELEASE / VERIFIED`**'

          Write-Host 'Release documentation finalized without rewriting subsystem detail.'

      - name: Commit finalized documentation
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- README.md docs/STATE.md docs/CURRENT_STATE.md docs/PRODUCT.md docs/SCANNER.md docs/SCANNER_TEST_PLAN.md docs/ARCHITECTURE.md docs/DEVELOPER_REFERENCE.md docs/RELEASE_1.1.4.md
          git diff --cached --check
          git commit -m 'Finalize v1.1.4 public release records'
          git push origin HEAD:finalize-v1.1.4-release
