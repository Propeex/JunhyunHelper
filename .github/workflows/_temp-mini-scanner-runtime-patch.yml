name: Temporary Mini Scanner runtime patch

on:
  push:
    branches:
      - fix/v1.7.2-mini-scanner-stability-2026-08-25

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v1.7.2-mini-scanner-stability-2026-08-25
          fetch-depth: 0

      - name: Wire continuous presentation retention
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("src/JunhyunHelper.Desktop/Scanner/ScannerRuntimeService.cs")
          text = path.read_text(encoding="utf-8")

          def replace_once(old: str, new: str, label: str) -> None:
              global text
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f"{label}: expected exactly one match, found {count}")
              text = text.replace(old, new, 1)

          replace_once(
              "                                _overlay.ShowStandby(refreshMessage);",
              "                                _overlay.ReportTransientMiss(refreshMessage);",
              "presentation refresh miss")

          replace_once(
              "                    _overlay.ShowStandby(changedMessage);",
              "                    _overlay.HoldStandby(changedMessage);",
              "candidate change progress")

          replace_once(
              """                    const string message = \"상세창 후보를 확인하는 중입니다.\";
                    _overlay.ShowStandby(message);
                    Publish(ScannerRuntimeState.Stabilizing, message, captureMode: mode);""",
              """                    const string message = \"상세창 후보를 확인하는 중입니다.\";
                    _overlay.HoldStandby(message);
                    Publish(ScannerRuntimeState.Stabilizing, message, captureMode: mode);""",
              "candidate stabilization progress")

          replace_once(
              """                const string readingMessage = \"아이템 이름을 읽는 중입니다.\";
                _overlay.ShowStandby(readingMessage);
                Publish(ScannerRuntimeState.ReadingTitle, readingMessage, captureMode: mode);""",
              """                const string readingMessage = \"아이템 이름을 읽는 중입니다.\";
                _overlay.HoldStandby(readingMessage);
                Publish(ScannerRuntimeState.ReadingTitle, readingMessage, captureMode: mode);""",
              "OCR progress")

          replace_once(
              """                    var message = string.IsNullOrWhiteSpace(search.OcrText)
                        ? \"아이템 이름을 읽지 못해 식별을 보류했습니다.\"
                        : $\"아이템을 확실하게 식별하지 못했습니다. ({search.Recognition.Reason}, {search.Recognition.Confidence:P0})\";
                    _overlay.ShowStandby(message);
                    Publish(ScannerRuntimeState.Uncertain, message, captureMode: mode);""",
              """                    var message = string.IsNullOrWhiteSpace(search.OcrText)
                        ? \"아이템 이름을 읽지 못해 식별을 보류했습니다.\"
                        : $\"아이템을 확실하게 식별하지 못했습니다. ({search.Recognition.Reason}, {search.Recognition.Confidence:P0})\";
                    _overlay.ReportTransientMiss(message);
                    Publish(ScannerRuntimeState.Uncertain, message, captureMode: mode);""",
              "semantic recognition miss")

          replace_once(
              """                    const string message = \"Item ID는 확정했지만 현재 표시 데이터를 만들 수 없습니다.\";
                    _overlay.ShowStandby(message);
                    Publish(ScannerRuntimeState.Uncertain, message, captureMode: mode);""",
              """                    const string message = \"Item ID는 확정했지만 현재 표시 데이터를 만들 수 없습니다.\";
                    _overlay.ReportTransientMiss(message);
                    Publish(ScannerRuntimeState.Uncertain, message, captureMode: mode);""",
              "presentation join miss")

          replace_once(
              """    private void HandleMiss(ScannerCaptureMode mode, string detectorMessage)
    {
        _consecutiveMisses++;
        _candidatePresenceHits = 0;
        _previousCandidateGeometrySignatures.Clear();
        if (_consecutiveMisses < MissesToHide)
            return;

        ClearVerifiedItem();
        var message = string.IsNullOrWhiteSpace(detectorMessage)
            ? ModeInitialMessage(mode)
            : detectorMessage;
        _overlay.ShowStandby(message);
        Publish(ScannerRuntimeState.WaitingForInspectWindow, message, captureMode: mode);
    }""",
              """    private void HandleMiss(ScannerCaptureMode mode, string detectorMessage)
    {
        _consecutiveMisses++;
        _candidatePresenceHits = 0;
        _previousCandidateGeometrySignatures.Clear();

        var message = string.IsNullOrWhiteSpace(detectorMessage)
            ? ModeInitialMessage(mode)
            : detectorMessage;
        _overlay.ReportTransientMiss(message);

        // Runtime identity state remains conservative and is cleared on the existing
        // second geometry miss. Mini Scanner presentation has its own three-miss latch,
        // so the last confirmed item can remain visually stable while reacquisition runs.
        if (_consecutiveMisses < MissesToHide)
            return;

        ClearVerifiedItem();
        Publish(ScannerRuntimeState.WaitingForInspectWindow, message, captureMode: mode);
    }""",
              "geometry miss handling")

          path.write_text(text, encoding="utf-8", newline="\n")
          Path(".github/workflows/_temp-mini-scanner-runtime-patch.yml").unlink()
          PY

      - name: Verify patch shape
        run: |
          git diff --check
          test ! -e .github/workflows/_temp-mini-scanner-runtime-patch.yml
          grep -q '_overlay.ReportTransientMiss(message);' src/JunhyunHelper.Desktop/Scanner/ScannerRuntimeService.cs
          grep -q '_overlay.HoldStandby(readingMessage);' src/JunhyunHelper.Desktop/Scanner/ScannerRuntimeService.cs

      - name: Commit scoped runtime wiring
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: wire sticky Mini Scanner runtime state [mini-scanner-runtime-patch]"
          git push origin HEAD:fix/v1.7.2-mini-scanner-stability-2026-08-25
