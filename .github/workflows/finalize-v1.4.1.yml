name: Finalize v1.4.1 release
# One-shot documentation/workflow cleanup after durable public verification exists.

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/finalize-v1.4.1.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Finalize canonical release state and remove one-shot workflows
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          SOURCE = '8ff790cbcaa3172d068200d5b34de1ea4c142ac0'
          FIX_CI = '32648713289'
          PREP_CI = '32649049071'
          RELEASE_RUN = '32652350079'
          VERIFIER_RUN = '32652827208'
          ASSET = 'Junhyun-Helper-v1.4.1-win-x64.zip'
          BYTES = '80,379,956'
          HASH = '7f666e3348b3d87aae27e22de078c1b3f36458f107a662cae1c58df8cdfa3e6f'
          PRODUCT = f'1.4.1+{SOURCE}'

          def read(path):
              return Path(path).read_text(encoding='utf-8')

          def write(path, text):
              Path(path).write_text(text, encoding='utf-8', newline='\n')

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one anchor, found {count}')
              return text.replace(old, new, 1)

          def replace_regex_once(text, pattern, replacement, label):
              updated, count = re.subn(pattern, replacement, text, count=1, flags=re.S)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one regex section, found {count}')
              return updated

          # RELEASE_1.4.1.md
          path = 'docs/RELEASE_1.4.1.md'
          text = read(path)
          text = replace_once(text, '상태: `RELEASE CANDIDATE`', '상태: `PUBLIC RELEASE / VERIFIED`', 'release status')
          text = replace_once(
              text,
              '아래가 모두 충족되어야 PUBLIC RELEASE / VERIFIED로 전환한다.',
              '아래 릴리즈 게이트는 모두 충족되었습니다.',
              'release gate wording')
          if '## 공개 검증 결과' not in text:
              text += f'''\n## 공개 검증 결과\n\n```text\nrelease source/tag: {SOURCE}\nfix PR #155 CI: {FIX_CI} — SUCCESS\nrelease-prep PR #156 CI: {PREP_CI} — SUCCESS\nautomated tests: 268 passed / 0 failed / 0 skipped\nexact-source release run: {RELEASE_RUN} — SUCCESS\nindependent public verifier: {VERIFIER_RUN} — SUCCESS\nasset: {ASSET}\nbytes: {BYTES}\nSHA-256: {HASH}\nProductVersion: {PRODUCT}\npublic/latest: VERIFIED\nexact public tag source: VERIFIED\npublic re-download: VERIFIED\npublic SHA256SUMS: VERIFIED\npublic package layout: VERIFIED\npublic-downloaded EXE smoke: SUCCESS\none-shot release/verifier/finalizer workflows: CLEANED UP\n```\n\n기계 판독 가능한 영구 증거는 `docs/.release-v1.4.1-status.json`입니다. 공개 바이너리는 release source `{SOURCE}`에서 생성되었고, 후속 문서/housekeeping 변경은 공개 바이너리를 변경하지 않습니다.\n'''
          write(path, text)

          # CURRENT_SCANNER_WORK.md
          path = 'docs/CURRENT_SCANNER_WORK.md'
          text = read(path)
          text = replace_once(text, '기준일: 2026-08-23', '기준일: 2026-08-24', 'current date')
          text = replace_once(
              text,
              '현재 작업: **v1.4.0 공개 완료 후 실제 Tarkov Ground Truth 수집 및 evidence 기반 정확도 개선**',
              '현재 작업: **v1.4.1 공개 완료 후 실제 Tarkov Ground Truth 추가 수집 및 evidence 기반 정확도 개선**',
              'current work')

          baseline = f'''## 공개 기준선\n\n현재 public stable / latest는 **v1.4.1**입니다.\n\n```text\nrelease source/tag: {SOURCE}\nfix PR #155 CI: {FIX_CI} — SUCCESS\nrelease-prep PR #156 CI: {PREP_CI} — SUCCESS\n268 tests / 0 failed / 0 skipped\nrelease run: {RELEASE_RUN} — SUCCESS\nindependent public verifier: {VERIFIER_RUN} — SUCCESS\nasset: {ASSET}\nbytes: {BYTES}\nSHA-256: {HASH}\nProductVersion: {PRODUCT}\npublic/latest: VERIFIED\npublic-downloaded EXE smoke: SUCCESS\none-shot release/verifier/finalizer workflows: removed after durable evidence write\n```\n\n공식 릴리즈 기록:\n\n- `docs/RELEASE_1.4.1.md`\n- `docs/.release-v1.4.1-status.json`\n\n'''
          text = replace_regex_once(
              text,
              r'## 공개 기준선\n.*?(?=## 현재 production recognition 기준선)',
              baseline,
              'current public baseline')
          text = replace_once(
              text,
              'v1.3.x에서 검증한 recognition 구조를 v1.4.0에서도 유지합니다.',
              'v1.4.1은 v1.4.0 recognition 구조를 유지하면서, primary header lock이 실패한 경우에만 실제 Tarkov Ground Truth 기반 fallback을 추가합니다.',
              'current recognition intro')
          text = replace_once(
              text,
              '- false positive보다 miss를 선호하는 fail-closed 정책\n',
              '- false positive보다 miss를 선호하는 fail-closed 정책\n- v1.4.1 live fallback: 어두운 red close X + gray 38~39 neutral top border + upper-right lens/lower-left handle magnifier + dark title field/text evidence를 함께 요구\n- 1회 고정밀 스캔은 최대 12 candidates, continuous Scanner는 기존 최대 8 candidates 유지\n',
              'current recognition bullets')
          text = replace_once(
              text,
              '현재 Ground Truth가 없는 상태에서 detector/header/matcher threshold를 임의로 낮추지 않습니다.',
              '첫 4개 reviewed live failure Ground Truth로 header-lock 실패 원인을 수정했으며, 이후에도 추가 Ground Truth 없이 detector/header/OCR/matcher threshold를 임의로 낮추지 않습니다.',
              'current GT threshold wording')

          verification = f'''## 현재 검증 상태\n\n- PR #149 Ground Truth/correction/regression 구현 최종 CI `32643727571`: SUCCESS\n- PR #155 실제 Tarkov Ground Truth header fix 최종 CI `{FIX_CI}`: SUCCESS\n- v1.4.1 release-prep PR #156 CI `{PREP_CI}`: SUCCESS\n- automated tests: **268 passed / 0 failed / 0 skipped**\n- exact-source public release run `{RELEASE_RUN}`: SUCCESS\n- independent public verifier `{VERIFIER_RUN}`: SUCCESS\n- exact release source/tag: `{SOURCE}`\n- public/latest: VERIFIED\n- public ZIP re-download/hash/SHA256SUMS/layout: VERIFIED\n- ProductVersion/FIRST_RUN: VERIFIED\n- public-downloaded EXE rendered UI/Map/Scanner Ground Truth smoke + graceful shutdown: SUCCESS\n- durable status: `docs/.release-v1.4.1-status.json`\n- completed v1.4.1 release/verifier/finalizer one-shot workflows removed; normal `ci.yml`만 유지\n\n따라서 v1.4.1 release blocker는 없습니다.\n\n'''
          text = replace_regex_once(
              text,
              r'## 현재 검증 상태\n.*?(?=## 다음 실제 작업)',
              verification,
              'current verification')
          text = text.replace('v1.4.0 실제 Tarkov 사용', 'v1.4.1 실제 Tarkov 사용')
          write(path, text)

          # STATE.md — preserve the full architecture/feature document and replace only
          # release/current Scanner sections that changed in v1.4.1.
          path = 'docs/STATE.md'
          text = read(path)
          text = replace_once(text, '기준일: 2026-08-23', '기준일: 2026-08-24', 'state date')

          release_section = f'''## 2. 현재 공개 릴리즈\n\n현재 public stable / latest는 **v1.4.1**입니다.\n\n```text\nversion: v1.4.1 PUBLIC RELEASE / VERIFIED\nrelease source: {SOURCE}\npublic tag source: {SOURCE}\nfix PR #155 final CI: {FIX_CI} — SUCCESS\nrelease-prep PR #156 final CI: {PREP_CI} — SUCCESS\nautomated tests: 268 passed / 0 failed / 0 skipped\nrelease run: {RELEASE_RUN} — SUCCESS\nindependent public verifier: {VERIFIER_RUN} — SUCCESS\nasset: {ASSET}\nbytes: {BYTES}\nSHA-256: {HASH}\nProductVersion: {PRODUCT}\npublic/latest: VERIFIED\nexact public tag source: VERIFIED\npublic re-download: VERIFIED\npublic SHA256SUMS: VERIFIED\npublic package layout: VERIFIED\npublic-downloaded EXE smoke: SUCCESS\n```\n\n```text\nDesktop Version: 1.4.1\nContent schema: v7\nReadable Content schemas: v3~v7\nuser.db schema: v1\nScanner display settings schema: v4\nScanner catalog cache schema: v1/v2 readable, v2 written\nScanner Ground Truth dataset: local diagnostics persistence\nv1.4.0 → v1.4.1 mandatory Game Content update: none\nv1.4.0 → v1.4.1 user.db migration: none\n```\n\n공식 검증 기록:\n\n- `docs/RELEASE_1.4.1.md`\n- `docs/.release-v1.4.1-status.json`\n- `docs/SCANNER_GROUND_TRUTH.md`\n- `docs/CURRENT_SCANNER_WORK.md`\n\n'''
          text = replace_regex_once(
              text,
              r'## 2\. 현재 공개 릴리즈\n.*?(?=## 3\. 아키텍처 기준)',
              release_section,
              'state public release')
          text = replace_once(
              text,
              '- 최대 8 candidates\n',
              '- continuous mode 최대 8 candidates\n- one-shot 정밀 스캔 최대 12 candidates\n',
              'state candidate limits')
          text = replace_once(
              text,
              '- diagnostic-only structural candidate는 관찰/저장할 수 있으나 OCR identity path에 들어가지 않음\n',
              '- diagnostic-only structural candidate는 관찰/저장할 수 있으나 OCR identity path에 들어가지 않음\n\nv1.4.1에서는 위 primary `ScannerInspectHeaderLock`을 그대로 우선 사용합니다. primary가 fail-closed 한 경우에만 `ScannerLiveHeaderGroundTruthRefiner`가 reviewed live Ground Truth에서 확인된 어두운 red close X, gray 38~39 neutral top border, upper-right lens + lower-left handle magnifier, dark title field/text evidence를 함께 검증합니다. recovered header는 coarse candidate의 left/width ownership과 일치해야 하며, 최종 semantic gate `HEADER_FRAME_LOCKED >= 0.68`은 변경하지 않았습니다.\n',
              'state live fallback')
          text = replace_once(
              text,
              '## 7. v1.4.0 Ground Truth / correction / regression\n',
              '## 7. Ground Truth / correction / regression\n\nv1.4.0에서 교정/dataset/regression 기반을 제품화했고, v1.4.1에서는 첫 4개 reviewed live failure Ground Truth를 실제 header-lock 수정 근거로 사용했습니다.\n\n',
              'state GT heading')

          public_validation = f'''## 14. v1.4.1 공개 검증 결과\n\n완료:\n\n- PR #155 live Ground Truth header fix final CI `{FIX_CI}`: SUCCESS\n- PR #156 v1.4.1 release-prep final CI `{PREP_CI}`: SUCCESS\n- automated tests: **268 passed / 0 failed / 0 skipped**\n- exact-source release run `{RELEASE_RUN}`: SUCCESS\n- independent public verifier `{VERIFIER_RUN}`: SUCCESS\n- exact release source/tag: `{SOURCE}`\n- public/latest: VERIFIED\n- public ZIP re-download/hash/SHA256SUMS/layout: VERIFIED\n- ProductVersion/FIRST_RUN: VERIFIED\n- public-downloaded Product UI + Map/Factory/MiniMap + Scanner Ground Truth smoke: SUCCESS\n\n공개 asset:\n\n```text\n{ASSET}\n{BYTES} bytes\nSHA-256 {HASH}\nProductVersion {PRODUCT}\n```\n\n기계 판독 증거: `docs/.release-v1.4.1-status.json`.\n\n'''
          text = replace_regex_once(
              text,
              r'## 14\. v1\.4\.0 공개 검증 결과\n.*?(?=## 15\. 현재 알려진 열린 영역)',
              public_validation,
              'state public validation')
          text = text.replace('1. v1.4.0을 실제 Tarkov Borderless 환경', '1. v1.4.1을 실제 Tarkov Borderless 환경')
          write(path, text)
          PY

          git rm .github/workflows/release-v1.4.1.yml
          git rm .github/workflows/verify-v1.4.1.yml
          git rm .github/workflows/finalize-v1.4.1.yml

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/RELEASE_1.4.1.md docs/CURRENT_SCANNER_WORK.md docs/STATE.md
          git diff --cached --check
          git commit -m 'docs: finalize verified v1.4.1 release'
          git push origin HEAD:main
