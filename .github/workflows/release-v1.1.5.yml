name: Release v1.1.5

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-v1.1.5.yml'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      SOURCE_SHA: 3541bab6536ff91a00f394c4f7b03d5cbf112746
      RELEASE_VERSION: 1.1.5
      RELEASE_TAG: v1.1.5
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      JUNHYUNHELPER_MAP_SMOKE: '1'

    steps:
      - name: Checkout exact release source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 1

      - name: Checkout pinned public Map donor
        shell: pwsh
        run: |
          git config --local --unset-all http.https://github.com/.extraheader
          if ($LASTEXITCODE -notin @(0, 5)) {
            throw "Could not clear repository-scoped GitHub auth header (exit $LASTEXITCODE)."
          }
          git submodule sync --recursive
          if ($LASTEXITCODE -ne 0) { throw 'Could not synchronize submodule metadata.' }
          git submodule update --init --force --depth=1 --recursive
          if ($LASTEXITCODE -ne 0) { throw 'Could not checkout the pinned public Map donor.' }

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Verify source identity and release absence
        shell: pwsh
        run: |
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -ne $env:SOURCE_SHA) {
            throw "Release checkout drifted: expected $env:SOURCE_SHA, got $actual"
          }

          [xml]$project = Get-Content 'src/JunhyunHelper.Desktop/JunhyunHelper.Desktop.csproj'
          $version = [string]($project.Project.PropertyGroup.Version | Select-Object -First 1)
          if ($version -ne $env:RELEASE_VERSION) {
            throw "Project version '$version' does not match '$env:RELEASE_VERSION'."
          }

          $firstLine = Get-Content 'packaging/FIRST_RUN_KO.txt' -TotalCount 1
          $expectedFirstLine = "준현 헬퍼 v$env:RELEASE_VERSION — Windows x64"
          if (-not [string]::Equals($firstLine, $expectedFirstLine, [System.StringComparison]::Ordinal)) {
            throw "FIRST_RUN source identity mismatch: '$firstLine'"
          }

          gh release view $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            throw "Release $env:RELEASE_TAG already exists; refusing to overwrite it."
          }

          $tagLine = git ls-remote --tags origin "refs/tags/$env:RELEASE_TAG"
          if (-not [string]::IsNullOrWhiteSpace($tagLine)) {
            throw "Tag $env:RELEASE_TAG already exists; refusing to move it."
          }

      - name: Build exact source
        shell: pwsh
        run: |
          dotnet build src/JunhyunHelper.Desktop/JunhyunHelper.Desktop.csproj --configuration Release
          if ($LASTEXITCODE -ne 0) { throw 'Exact-source Release build failed.' }

      - name: Run exactly 249 automated tests
        shell: pwsh
        run: |
          $lines = @(dotnet test tests/JunhyunHelper.Tests/JunhyunHelper.Tests.csproj --configuration Release 2>&1)
          $exitCode = $LASTEXITCODE
          $lines | ForEach-Object { Write-Host $_ }
          if ($exitCode -ne 0) { throw 'Automated tests failed.' }
          $joined = $lines -join "`n"
          if ($joined -notmatch 'Failed:\s+0,\s+Passed:\s+249,\s+Skipped:\s+0,\s+Total:\s+249') {
            throw 'Automated test count/result is not exactly 249 passed, 0 failed, 0 skipped.'
          }

      - name: Publish and audit Windows x64 package root
        shell: pwsh
        run: |
          dotnet publish src/JunhyunHelper.Desktop/JunhyunHelper.Desktop.csproj `
            --configuration Release `
            --runtime win-x64 `
            --self-contained true `
            --output artifacts/publish `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true `
            -p:PublishTrimmed=false `
            -p:PublishReadyToRun=false `
            -p:DebugType=None `
            -p:DebugSymbols=false
          if ($LASTEXITCODE -ne 0) { throw 'win-x64 publish failed.' }

          Copy-Item packaging/FIRST_RUN_KO.txt artifacts/publish/FIRST_RUN_KO.txt

          $required = @('준현 헬퍼.exe', 'FIRST_RUN_KO.txt', 'Assets/tarkov_data.db')
          foreach ($file in $required) {
            if (-not (Test-Path (Join-Path artifacts/publish $file))) {
              throw "Required published file was not produced: $file"
            }
          }

          $exe = (Resolve-Path 'artifacts/publish/준현 헬퍼.exe').Path
          $productVersion = (Get-Item $exe).VersionInfo.ProductVersion
          $expectedProductVersion = "$env:RELEASE_VERSION+$env:SOURCE_SHA"
          if ($productVersion -ne $expectedProductVersion) {
            throw "ProductVersion '$productVersion' does not exactly match '$expectedProductVersion'."
          }

          $firstLine = Get-Content 'artifacts/publish/FIRST_RUN_KO.txt' -TotalCount 1
          $expectedFirstLine = "준현 헬퍼 v$env:RELEASE_VERSION — Windows x64"
          if (-not [string]::Equals($firstLine, $expectedFirstLine, [System.StringComparison]::Ordinal)) {
            throw "FIRST_RUN identity mismatch: '$firstLine'"
          }

          $rootNames = @(Get-ChildItem artifacts/publish | Select-Object -ExpandProperty Name | Sort-Object)
          $expectedRootNames = @('Assets','FIRST_RUN_KO.txt','준현 헬퍼.exe') | Sort-Object
          if (Compare-Object $rootNames $expectedRootNames) { throw 'Release root layout mismatch.' }
          if (@(Get-ChildItem artifacts/publish -Recurse -File -Filter *.pdb).Count -gt 0) { throw 'Release contains PDB debug symbols.' }
          if (@(Get-ChildItem artifacts/publish -Recurse -File | Where-Object { $_.Extension -in @('.zip','.7z','.rar') }).Count -gt 0) { throw 'Release contains a nested archive.' }

          $forbidden = @(
            'AutoUpdater.NET.dll',
            'Microsoft.Web.WebView2.Core.dll',
            'Microsoft.Web.WebView2.WinForms.dll',
            'Microsoft.Web.WebView2.Wpf.dll',
            'WebView2Loader.dll',
            'Westermo.GraphX.Controls.dll',
            'Westermo.GraphX.Common.dll',
            'QuikGraph.dll'
          )
          foreach ($file in $forbidden) {
            if (Get-ChildItem artifacts/publish -Recurse -File -Filter $file) {
              throw "Unused legacy dependency leaked into release: $file"
            }
          }

          Write-Host "EXACT_PRODUCT_VERSION=$productVersion"
          Write-Host "EXACT_EXE_BYTES=$((Get-Item $exe).Length)"
          Write-Host "EXACT_FILE_COUNT=$(@(Get-ChildItem artifacts/publish -Recurse -File).Count)"

      - name: Smoke exact published EXE
        shell: pwsh
        run: |
          $exe = (Resolve-Path 'artifacts/publish/준현 헬퍼.exe').Path
          $diagnostic = Join-Path $env:TEMP 'junhyun-map-smoke-error.txt'
          $success = Join-Path $env:TEMP 'junhyun-map-smoke-success.txt'
          Remove-Item $diagnostic,$success -Force -ErrorAction SilentlyContinue

          $process = Start-Process -FilePath $exe -WorkingDirectory artifacts/publish -PassThru
          try {
            $deadline = (Get-Date).AddSeconds(75)
            while ((Get-Date) -lt $deadline) {
              $process.Refresh()
              if (Test-Path $diagnostic) {
                Get-Content $diagnostic | ForEach-Object { Write-Host $_ }
                throw 'Exact-source published EXE reported a product smoke failure.'
              }
              if (Test-Path $success) { break }
              if ($process.HasExited) { throw "EXE exited early with code $($process.ExitCode)." }
              Start-Sleep -Milliseconds 250
            }
            if (-not (Test-Path $success)) { throw 'Exact-source EXE smoke did not complete.' }

            $closed = $false
            for ($attempt = 1; $attempt -le 10; $attempt++) {
              $process.Refresh()
              if ($process.HasExited -or $process.CloseMainWindow()) { $closed = $true; break }
              Start-Sleep -Milliseconds 500
            }
            if (-not $closed) { throw 'Could not request normal MainWindow close.' }
            $process.Refresh()
            if (-not $process.HasExited -and -not $process.WaitForExit(7000)) { throw 'Process did not terminate after normal close.' }
            if (Test-Path 'artifacts/publish/Logs') { throw 'Portable root was polluted by runtime logs.' }
          }
          finally {
            $process.Refresh()
            if (-not $process.HasExited) { Stop-Process -Id $process.Id -Force }
          }

      - name: Create release ZIP, checksum and notes
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path artifacts/release -Force | Out-Null
          $zipName = "Junhyun-Helper-v$env:RELEASE_VERSION-win-x64.zip"
          $zipPath = Join-Path (Resolve-Path artifacts/release).Path $zipName
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          [System.IO.Compression.ZipFile]::CreateFromDirectory(
            (Resolve-Path artifacts/publish).Path,
            $zipPath,
            [System.IO.Compression.CompressionLevel]::Optimal,
            $false)

          $hash = (Get-FileHash $zipPath -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $zipName" | Set-Content artifacts/release/SHA256SUMS.txt -Encoding utf8NoBOM

          @'
          # 준현 헬퍼 v1.1.5

          Scanner와 Mini Scanner의 작동성·안정성·신뢰성·정확성을 보강한 PATCH 릴리즈입니다.

          ## Mini Scanner
          - 인식된 아이템 정보만 표시하고 대기/OCR/진단 상태 문구는 표시하지 않음
          - WPF Topmost와 native HWND_TOPMOST를 함께 유지하며 Tarkov 입력 포커스를 빼앗지 않음
          - 전체 카드 영역을 드래그 hitbox로 사용하고 마우스 포인터는 일반 화살표 유지
          - 실사용에서는 foreground Tarkov 인벤토리/보관함 UI가 확인될 때만 표시하고 불확실하면 숨김
          - 기존 설치의 아이콘/상점가/상점가-슬롯 표시 기본값을 1회 정상화

          ## 가격과 아이콘
          - raw traderPrices와 derived sellFor 두 시장 데이터 형태를 모두 지원
          - flea 행을 상점 최고가에서 제외하고 market-empty 카탈로그가 정상 캐시를 덮지 못하도록 차단
          - Game Content 업데이트 시 전체 canonical item icon을 로컬 캐시에 준비
          - Scanner 인식 순간에는 네트워크를 사용하지 않음

          ## 상세창 아이템명 인식
          - 기존 Windows ko-KR 일반/Deep OCR과 current official Korean catalog 검증이 계속 1차 판정
          - 기존 OCR 성공은 새 경로가 변경하거나 거부하지 않음
          - Deep OCR까지 기존 semantic gate를 통과하지 못한 경우에만 Tarkov 제목 폰트 기반 시각 검증 시도
          - Tarkov가 사용하는 Bender 계열 + Noto Sans CJK KR 한글 fallback 조합으로 공식 이름 후보를 렌더링해 실제 title ROI 글리프와 비교
          - semantic 점수, 시각 점수, top1/top2 margin이 모두 보수적 기준을 넘을 때만 복구
          - 폰트 바이너리는 릴리즈에 포함하지 않으며 실행 중인 사용자의 Tarkov resources.assets를 읽기 전용으로 확인해 app-local Scanner cache에 필요한 폰트만 추출
          - 폰트 탐색/추출/검증 실패 시 기존 OCR-only 경로로 안전하게 복귀

          ## 검증
          - Release build
          - 249/249 automated tests, 0 failed, 0 skipped
          - win-x64 self-contained single-file publish
          - 실제 게시 EXE Product UI / Mini Scanner / Scanner title-font parser / Main Map / Factory / MiniMap smoke
          - 정상 종료 및 clean portable-root 검사
          - Draft와 Public 다운로드본 SHA-256, root layout, ProductVersion, FIRST_RUN, 실행 smoke 재검증

          최신 Tarkov Borderless 환경에서 인벤토리 anchor와 실제 resources.assets 폰트 추출 결과는 실사용 환경 검증을 계속하며, 불확실한 경우 Scanner는 오탐보다 미탐을 우선해 fail closed 합니다.
          '@ | Set-Content artifacts/release/RELEASE_NOTES.md -Encoding utf8NoBOM

          Write-Host "ZIP_BYTES=$((Get-Item $zipPath).Length)"
          Write-Host "ZIP_SHA256=$hash"

      - name: Create Draft GitHub Release
        shell: pwsh
        run: |
          $zip = "artifacts/release/Junhyun-Helper-v$env:RELEASE_VERSION-win-x64.zip"
          gh release create $env:RELEASE_TAG `
            $zip `
            artifacts/release/SHA256SUMS.txt `
            --repo $env:GITHUB_REPOSITORY `
            --target $env:SOURCE_SHA `
            --title "준현 헬퍼 v$env:RELEASE_VERSION" `
            --notes-file artifacts/release/RELEASE_NOTES.md `
            --draft
          if ($LASTEXITCODE -ne 0) { throw 'Draft release creation failed.' }

          $ref = gh api "repos/$env:GITHUB_REPOSITORY/git/ref/tags/$env:RELEASE_TAG" | ConvertFrom-Json
          $tagSha = [string]$ref.object.sha
          if ([string]$ref.object.type -eq 'tag') {
            $tagObject = gh api "repos/$env:GITHUB_REPOSITORY/git/tags/$tagSha" | ConvertFrom-Json
            $tagSha = [string]$tagObject.object.sha
          }
          if ($tagSha -ne $env:SOURCE_SHA) { throw "Draft tag points to $tagSha instead of $env:SOURCE_SHA." }

      - name: Re-download and verify Draft assets
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path artifacts/draft-download -Force | Out-Null
          gh release download $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --dir artifacts/draft-download --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Draft release download failed.' }

          $zipName = "Junhyun-Helper-v$env:RELEASE_VERSION-win-x64.zip"
          $zip = Join-Path artifacts/draft-download $zipName
          $sum = Join-Path artifacts/draft-download 'SHA256SUMS.txt'
          if (-not (Test-Path $zip) -or -not (Test-Path $sum)) { throw 'Draft assets are incomplete.' }

          $expectedLine = Get-Content $sum | Where-Object { $_ -match [Regex]::Escape($zipName) } | Select-Object -First 1
          if ($expectedLine -notmatch '^([0-9a-fA-F]{64})\s{2,}(.+)$') { throw 'Draft checksum format is invalid.' }
          $expectedHash = $Matches[1].ToLowerInvariant()
          $actualHash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualHash -ne $expectedHash) { throw 'Draft ZIP checksum mismatch.' }

          Expand-Archive $zip artifacts/draft-extracted -Force
          $exe = (Resolve-Path 'artifacts/draft-extracted/준현 헬퍼.exe').Path
          $productVersion = (Get-Item $exe).VersionInfo.ProductVersion
          $expectedProductVersion = "$env:RELEASE_VERSION+$env:SOURCE_SHA"
          if ($productVersion -ne $expectedProductVersion) { throw "Draft ProductVersion mismatch: $productVersion" }

          $firstLine = Get-Content 'artifacts/draft-extracted/FIRST_RUN_KO.txt' -TotalCount 1
          $expectedFirstLine = "준현 헬퍼 v$env:RELEASE_VERSION — Windows x64"
          if (-not [string]::Equals($firstLine, $expectedFirstLine, [System.StringComparison]::Ordinal)) { throw 'Draft FIRST_RUN mismatch.' }

          $rootNames = @(Get-ChildItem artifacts/draft-extracted | Select-Object -ExpandProperty Name | Sort-Object)
          $expectedNames = @('Assets','FIRST_RUN_KO.txt','준현 헬퍼.exe') | Sort-Object
          if (Compare-Object $rootNames $expectedNames) { throw 'Draft ZIP root layout mismatch.' }

      - name: Smoke Draft-downloaded EXE
        shell: pwsh
        run: |
          $exe = (Resolve-Path 'artifacts/draft-extracted/준현 헬퍼.exe').Path
          $diagnostic = Join-Path $env:TEMP 'junhyun-map-smoke-error.txt'
          $success = Join-Path $env:TEMP 'junhyun-map-smoke-success.txt'
          Remove-Item $diagnostic,$success -Force -ErrorAction SilentlyContinue
          $process = Start-Process -FilePath $exe -WorkingDirectory artifacts/draft-extracted -PassThru
          try {
            $deadline = (Get-Date).AddSeconds(75)
            while ((Get-Date) -lt $deadline) {
              $process.Refresh()
              if (Test-Path $diagnostic) { Get-Content $diagnostic | ForEach-Object { Write-Host $_ }; throw 'Draft-downloaded EXE smoke failed.' }
              if (Test-Path $success) { break }
              if ($process.HasExited) { throw "Draft EXE exited early: $($process.ExitCode)" }
              Start-Sleep -Milliseconds 250
            }
            if (-not (Test-Path $success)) { throw 'Draft EXE smoke did not complete.' }
            $closed = $false
            for ($attempt = 1; $attempt -le 10; $attempt++) {
              $process.Refresh(); if ($process.HasExited -or $process.CloseMainWindow()) { $closed = $true; break }; Start-Sleep -Milliseconds 500
            }
            if (-not $closed) { throw 'Draft EXE normal close could not be requested.' }
            $process.Refresh(); if (-not $process.HasExited -and -not $process.WaitForExit(7000)) { throw 'Draft EXE did not exit normally.' }
            if (Test-Path 'artifacts/draft-extracted/Logs') { throw 'Draft package root was polluted by logs.' }
          }
          finally { $process.Refresh(); if (-not $process.HasExited) { Stop-Process -Id $process.Id -Force } }

      - name: Publish release and verify public latest/tag
        shell: pwsh
        run: |
          gh release edit $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --draft=false --latest
          if ($LASTEXITCODE -ne 0) { throw 'Could not publish release.' }

          $release = gh api "repos/$env:GITHUB_REPOSITORY/releases/tags/$env:RELEASE_TAG" | ConvertFrom-Json
          if ([bool]$release.draft -or [bool]$release.prerelease) { throw 'Release is still draft or prerelease.' }

          $latestTag = (gh api "repos/$env:GITHUB_REPOSITORY/releases/latest" --jq '.tag_name').Trim()
          if ($latestTag -ne $env:RELEASE_TAG) { throw "Latest release is $latestTag instead of $env:RELEASE_TAG." }

          $ref = gh api "repos/$env:GITHUB_REPOSITORY/git/ref/tags/$env:RELEASE_TAG" | ConvertFrom-Json
          $tagSha = [string]$ref.object.sha
          if ([string]$ref.object.type -eq 'tag') {
            $tagObject = gh api "repos/$env:GITHUB_REPOSITORY/git/tags/$tagSha" | ConvertFrom-Json
            $tagSha = [string]$tagObject.object.sha
          }
          if ($tagSha -ne $env:SOURCE_SHA) { throw "Public tag points to $tagSha instead of $env:SOURCE_SHA." }

      - name: Re-download and verify Public assets
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path artifacts/public-download -Force | Out-Null
          gh release download $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --dir artifacts/public-download --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Public release download failed.' }

          $zipName = "Junhyun-Helper-v$env:RELEASE_VERSION-win-x64.zip"
          $zip = Join-Path artifacts/public-download $zipName
          $sum = Join-Path artifacts/public-download 'SHA256SUMS.txt'
          $expectedLine = Get-Content $sum | Where-Object { $_ -match [Regex]::Escape($zipName) } | Select-Object -First 1
          if ($expectedLine -notmatch '^([0-9a-fA-F]{64})\s{2,}(.+)$') { throw 'Public checksum format is invalid.' }
          $expectedHash = $Matches[1].ToLowerInvariant()
          $actualHash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualHash -ne $expectedHash) { throw 'Public ZIP checksum mismatch.' }

          Expand-Archive $zip artifacts/public-extracted -Force
          $exe = (Resolve-Path 'artifacts/public-extracted/준현 헬퍼.exe').Path
          $productVersion = (Get-Item $exe).VersionInfo.ProductVersion
          $expectedProductVersion = "$env:RELEASE_VERSION+$env:SOURCE_SHA"
          if ($productVersion -ne $expectedProductVersion) { throw "Public ProductVersion mismatch: $productVersion" }

          $firstLine = Get-Content 'artifacts/public-extracted/FIRST_RUN_KO.txt' -TotalCount 1
          $expectedFirstLine = "준현 헬퍼 v$env:RELEASE_VERSION — Windows x64"
          if (-not [string]::Equals($firstLine, $expectedFirstLine, [System.StringComparison]::Ordinal)) { throw 'Public FIRST_RUN mismatch.' }

          $rootNames = @(Get-ChildItem artifacts/public-extracted | Select-Object -ExpandProperty Name | Sort-Object)
          $expectedNames = @('Assets','FIRST_RUN_KO.txt','준현 헬퍼.exe') | Sort-Object
          if (Compare-Object $rootNames $expectedNames) { throw 'Public ZIP root layout mismatch.' }

          "PUBLIC_ZIP_BYTES=$((Get-Item $zip).Length)" | Set-Content artifacts/release/PUBLIC_EVIDENCE.txt -Encoding utf8NoBOM
          "PUBLIC_ZIP_SHA256=$actualHash" | Add-Content artifacts/release/PUBLIC_EVIDENCE.txt -Encoding utf8NoBOM
          "PUBLIC_PRODUCT_VERSION=$productVersion" | Add-Content artifacts/release/PUBLIC_EVIDENCE.txt -Encoding utf8NoBOM
          "PUBLIC_SOURCE_SHA=$env:SOURCE_SHA" | Add-Content artifacts/release/PUBLIC_EVIDENCE.txt -Encoding utf8NoBOM
          Get-Content artifacts/release/PUBLIC_EVIDENCE.txt | ForEach-Object { Write-Host $_ }

      - name: Smoke Public-downloaded EXE
        shell: pwsh
        run: |
          $exe = (Resolve-Path 'artifacts/public-extracted/준현 헬퍼.exe').Path
          $diagnostic = Join-Path $env:TEMP 'junhyun-map-smoke-error.txt'
          $success = Join-Path $env:TEMP 'junhyun-map-smoke-success.txt'
          Remove-Item $diagnostic,$success -Force -ErrorAction SilentlyContinue
          $process = Start-Process -FilePath $exe -WorkingDirectory artifacts/public-extracted -PassThru
          try {
            $deadline = (Get-Date).AddSeconds(75)
            while ((Get-Date) -lt $deadline) {
              $process.Refresh()
              if (Test-Path $diagnostic) { Get-Content $diagnostic | ForEach-Object { Write-Host $_ }; throw 'Public-downloaded EXE smoke failed.' }
              if (Test-Path $success) { break }
              if ($process.HasExited) { throw "Public EXE exited early: $($process.ExitCode)" }
              Start-Sleep -Milliseconds 250
            }
            if (-not (Test-Path $success)) { throw 'Public EXE smoke did not complete.' }
            $closed = $false
            for ($attempt = 1; $attempt -le 10; $attempt++) {
              $process.Refresh(); if ($process.HasExited -or $process.CloseMainWindow()) { $closed = $true; break }; Start-Sleep -Milliseconds 500
            }
            if (-not $closed) { throw 'Public EXE normal close could not be requested.' }
            $process.Refresh(); if (-not $process.HasExited -and -not $process.WaitForExit(7000)) { throw 'Public EXE did not exit normally.' }
            if (Test-Path 'artifacts/public-extracted/Logs') { throw 'Public package root was polluted by logs.' }
          }
          finally { $process.Refresh(); if (-not $process.HasExited) { Stop-Process -Id $process.Id -Force } }

      - name: Upload release verification evidence
        uses: actions/upload-artifact@v4
        with:
          name: v1.1.5-release-verification
          path: |
            artifacts/release/SHA256SUMS.txt
            artifacts/release/RELEASE_NOTES.md
            artifacts/release/PUBLIC_EVIDENCE.txt
          if-no-files-found: error
          retention-days: 30

      - name: Publish workflow status to main
        if: always()
        shell: pwsh
        env:
          RELEASE_JOB_STATUS: ${{ job.status }}
        run: |
          $status = [ordered]@{
            version = $env:RELEASE_VERSION
            tag = $env:RELEASE_TAG
            sourceSha = $env:SOURCE_SHA
            workflowRunId = [string]$env:GITHUB_RUN_ID
            workflowStatus = $env:RELEASE_JOB_STATUS
            updatedAtUtc = [DateTimeOffset]::UtcNow.ToString('O')
          } | ConvertTo-Json
          $bytes = [Text.Encoding]::UTF8.GetBytes($status)
          $encoded = [Convert]::ToBase64String($bytes)
          $path = 'docs/.release-v1.1.5-status.json'
          $apiPath = "repos/$env:GITHUB_REPOSITORY/contents/$path"
          $existingSha = $null
          gh api $apiPath --jq '.sha' 2>$null | ForEach-Object { $existingSha = $_.Trim() }
          $args = @('-X','PUT',$apiPath,'-f',"message=Record v1.1.5 release workflow result",'-f',"content=$encoded",'-f','branch=main')
          if (-not [string]::IsNullOrWhiteSpace($existingSha)) { $args += @('-f',"sha=$existingSha") }
          & gh api @args
          if ($LASTEXITCODE -ne 0) { Write-Warning 'Could not publish release workflow status file.' }
