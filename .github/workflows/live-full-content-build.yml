name: Live Full Content Build Audit
# 2026-08-15 final quest-prerequisite rerun

on:
  push:
    branches:
      - agent/live-quest-prereq-audit-2026-08-15
    paths:
      - '.github/workflows/live-full-content-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-build:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build desktop
        run: dotnet build src/JunhyunHelper.Desktop/JunhyunHelper.Desktop.csproj --configuration Release

      - name: Test suite
        run: dotnet test tests/JunhyunHelper.Tests/JunhyunHelper.Tests.csproj --configuration Release

      - name: Create live importer harness
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path live-audit -Force | Out-Null
          @'
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup>
              <OutputType>Exe</OutputType>
              <TargetFramework>net10.0</TargetFramework>
              <ImplicitUsings>enable</ImplicitUsings>
              <Nullable>enable</Nullable>
            </PropertyGroup>
            <ItemGroup>
              <ProjectReference Include="../src/JunhyunHelper.Infrastructure/JunhyunHelper.Infrastructure.csproj" />
            </ItemGroup>
          </Project>
          '@ | Set-Content live-audit/LiveAudit.csproj -Encoding utf8

          @'
          using JunhyunHelper.Core.Profiles;
          using JunhyunHelper.Infrastructure.Content;
          using JunhyunHelper.Infrastructure.EditionData;
          using JunhyunHelper.Infrastructure.TarkovJson;
          using JunhyunHelper.Infrastructure.Validation;

          using var http = new HttpClient { Timeout = TimeSpan.FromMinutes(3) };
          var loader = new TarkovEndpointSourceLoader(new TarkovJsonClient(http));
          var editions = new TarkovEditionCatalogClient(http);
          var builder = new TarkovContentBuildService(loader, editions);

          foreach (var mode in new[] { GameMode.Regular, GameMode.Pve, GameMode.PvpSeason })
          {
              Console.WriteLine($"===== LIVE PRODUCT BUILD {mode} =====");
              var result = await builder.BuildAsync(mode);
              Console.WriteLine($"valid={result.IsValid}");
              Console.WriteLine($"items={result.Content.Items.Count}");
              Console.WriteLine($"traders={result.Content.Traders.Count}");
              Console.WriteLine($"maps={result.Content.Maps.Count}");
              Console.WriteLine($"quests={result.Content.Quests.Count}");
              Console.WriteLine($"questObjectives={result.Content.QuestObjectives.Count}");
              Console.WriteLine($"questItemRequirements={result.Content.QuestItemRequirements.Count}");
              Console.WriteLine($"hideoutStations={result.Content.HideoutStations.Count}");
              Console.WriteLine($"ammo={result.Content.Ammo.Count}");
              Console.WriteLine($"warnings={result.Warnings.Count}");
              foreach (var warning in result.Warnings.Take(30))
                  Console.WriteLine($"WARNING {warning}");
              foreach (var issue in result.Validation.Issues)
                  Console.WriteLine($"VALIDATION_{issue.Severity.ToString().ToUpperInvariant()} {issue.Code} {issue.Message}");

              var delayed = result.Content.Quests.Count(q => q.HasAvailabilityDelay);
              var unresolved = result.Content.Quests.Count(q => q.UnsupportedAvailabilityRequirements.Count > 0);
              var lightkeeperGated = result.Content.Quests.Count(q =>
                  q.TraderId == "638f541a29ffd1183d187f57" &&
                  q.Id != "625d700cc48e6c62a440fab5" &&
                  q.TaskRequirements.Any(r => r.RequiredQuestId == "625d700cc48e6c62a440fab5" && r.AcceptedStatuses.Contains(JunhyunHelper.Core.Quests.QuestRequiredStatus.Complete)));
              var btrGated = result.Content.Quests.Count(q =>
                  q.TraderId == "656f0f98d80a697f855d34b1" &&
                  q.Id != "6752f6d83038f7df520c83e8" &&
                  q.TaskRequirements.Any(r => r.RequiredQuestId == "6752f6d83038f7df520c83e8" && r.AcceptedStatuses.Contains(JunhyunHelper.Core.Quests.QuestRequiredStatus.Complete)));
              var refUnlock = mode == GameMode.Pve ? "6834145ebc1f443d7603c8a7" : "66058cb22cee99303f1ba067";
              var refGated = result.Content.Quests.Count(q =>
                  q.TraderId == "6617beeaa9cfa777ca915b7c" &&
                  q.Id != refUnlock &&
                  q.TaskRequirements.Any(r => r.RequiredQuestId == refUnlock && r.AcceptedStatuses.Contains(JunhyunHelper.Core.Quests.QuestRequiredStatus.Complete)));
              Console.WriteLine($"delayedQuests={delayed} unresolvedQuests={unresolved} lightkeeperGated={lightkeeperGated} btrGated={btrGated} refGated={refGated}");

              if (!result.IsValid)
                  throw new InvalidDataException($"Live product build for {mode} failed validation.");
              if (delayed != 13)
                  throw new InvalidDataException($"Expected 13 delayed quests in {mode}, found {delayed}.");
          }
          '@ | Set-Content live-audit/Program.cs -Encoding utf8

      - name: Build all current live game modes through product importer
        run: dotnet run --project live-audit/LiveAudit.csproj --configuration Release
