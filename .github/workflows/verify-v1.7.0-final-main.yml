name: Verify v1.7.0 final main

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-v1.7.0-final-main.yml'

permissions:
  contents: write

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      TARGET_SHA: 8706ce2036e924c8d7097850c1d21f5947e25558
      RELEASE_SOURCE_SHA: 56e12342e3490fd0defa5f327a03d20d4f32b3a6
      VERSION: 1.7.0

    steps:
      - name: Checkout exact final documentation state
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 0

      - name: Verify post-release changes are documentation only
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git fetch --tags --force
          $tagSha = (git rev-list -n 1 v1.7.0).Trim()
          if ($tagSha -ne $env:RELEASE_SOURCE_SHA) {
            throw "v1.7.0 tag moved: $tagSha"
          }
          $changed = @(git diff --name-only "$env:RELEASE_SOURCE_SHA..$env:TARGET_SHA")
          $unexpected = @($changed | Where-Object {
            $_ -ne 'README.md' -and -not $_.StartsWith('docs/', [StringComparison]::Ordinal)
          })
          if ($unexpected.Count -gt 0) {
            throw "Post-release product-code drift detected: $($unexpected -join ', ')"
          }
          Write-Host "Post-release delta is documentation/release-record only: $($changed.Count) files."

      - name: Checkout pinned public Map donor
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git config --local --unset-all http.https://github.com/.extraheader
          if ($LASTEXITCODE -notin @(0, 5)) { throw 'Could not clear repository-scoped GitHub auth header.' }
          git submodule sync --recursive
          if ($LASTEXITCODE -ne 0) { throw 'Could not synchronize submodule metadata.' }
          git submodule update --init --force --depth=1 --recursive
          if ($LASTEXITCODE -ne 0) { throw 'Could not checkout pinned Map donor.' }

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build exact final main state
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet build src/JunhyunHelper.Desktop/JunhyunHelper.Desktop.csproj --configuration Release
          if ($LASTEXITCODE -ne 0) { throw 'Release build failed.' }

      - name: Run and count exact automated suite
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Path artifacts/test-results -Force | Out-Null
          dotnet test tests/JunhyunHelper.Tests/JunhyunHelper.Tests.csproj `
            --configuration Release `
            --logger "trx;LogFileName=results.trx" `
            --results-directory artifacts/test-results
          if ($LASTEXITCODE -ne 0) { throw 'Automated tests failed.' }
          [xml]$trx = Get-Content artifacts/test-results/results.trx
          $counters = $trx.TestRun.ResultSummary.Counters
          $total = [int]$counters.total
          $passed = [int]$counters.passed
          $failed = [int]$counters.failed
          $notExecuted = [int]$counters.notExecuted
          if ($total -ne 348 -or $passed -ne 348 -or $failed -ne 0 -or $notExecuted -ne 0) {
            throw "Unexpected test counts: total=$total passed=$passed failed=$failed notExecuted=$notExecuted"
          }
          Write-Host 'Exact final-main automated suite: 348 passed / 0 failed / 0 skipped.'

      - name: Publish and audit Windows x64 product
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet publish src/JunhyunHelper.Desktop/JunhyunHelper.Desktop.csproj `
            --configuration Release `
            --runtime win-x64 `
            --self-contained true `
            --output artifacts/publish `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true `
            -p:PublishTrimmed=false `
            -p:PublishReadyToRun=false `
            -p:DebugType=None `
            -p:DebugSymbols=false
          if ($LASTEXITCODE -ne 0) { throw 'Windows x64 publish failed.' }
          Copy-Item packaging/FIRST_RUN_KO.txt artifacts/publish/FIRST_RUN_KO.txt
          foreach ($relative in @('준현 헬퍼.exe','FIRST_RUN_KO.txt','Assets/tarkov_data.db')) {
            if (-not (Test-Path (Join-Path artifacts/publish $relative))) { throw "Missing published file: $relative" }
          }
          $exe = (Resolve-Path 'artifacts/publish/준현 헬퍼.exe').Path
          $productVersion = (Get-Item $exe).VersionInfo.ProductVersion
          $expected = "$env:VERSION+$env:TARGET_SHA"
          if ($productVersion -ne $expected) { throw "ProductVersion '$productVersion' != '$expected'." }
          $firstLine = Get-Content artifacts/publish/FIRST_RUN_KO.txt -TotalCount 1
          if ($firstLine -ne "준현 헬퍼 v$env:VERSION — Windows x64") { throw "FIRST_RUN mismatch: $firstLine" }
          $rootFiles = @(Get-ChildItem artifacts/publish -File | Where-Object { $_.Name -notin @('준현 헬퍼.exe','FIRST_RUN_KO.txt') })
          if ($rootFiles.Count -gt 0) { throw "Unexpected publish-root files: $($rootFiles.Name -join ', ')" }
          $rootDirs = @(Get-ChildItem artifacts/publish -Directory | Where-Object { $_.Name -ne 'Assets' })
          if ($rootDirs.Count -gt 0) { throw "Unexpected publish-root directories: $($rootDirs.Name -join ', ')" }
          if (Get-ChildItem artifacts/publish -Recurse -File -Filter *.pdb) { throw 'Publish contains PDBs.' }
          $nested = @(Get-ChildItem artifacts/publish -Recurse -File | Where-Object { $_.Extension -in @('.zip','.7z','.rar') })
          if ($nested.Count -gt 0) { throw 'Publish contains nested archives.' }

      - name: Rendered Product UI Scanner Map and graceful shutdown smoke
        shell: pwsh
        env:
          JUNHYUNHELPER_MAP_SMOKE: '1'
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = (Resolve-Path 'artifacts/publish/준현 헬퍼.exe').Path
          $diagnostic = Join-Path $env:TEMP 'junhyun-map-smoke-error.txt'
          $success = Join-Path $env:TEMP 'junhyun-map-smoke-success.txt'
          $startupLog = Join-Path $env:LOCALAPPDATA 'JunhyunHelper/logs/startup.log'
          Remove-Item $diagnostic,$success,$startupLog -Force -ErrorAction SilentlyContinue
          $process = Start-Process -FilePath $exe -WorkingDirectory artifacts/publish -PassThru
          try {
            $deadline = (Get-Date).AddSeconds(75)
            while ((Get-Date) -lt $deadline -and -not (Test-Path $success)) {
              $process.Refresh()
              if (Test-Path $diagnostic) { throw "Product smoke failed: $(Get-Content $diagnostic -Raw)" }
              if ($process.HasExited) { throw "Product exited before smoke completion: $($process.ExitCode)" }
              Start-Sleep -Milliseconds 250
            }
            if (-not (Test-Path $success)) { throw 'Product smoke timed out.' }
            $closeRequested = $false
            for ($attempt = 1; $attempt -le 10; $attempt++) {
              $process.Refresh()
              if ($process.HasExited -or $process.CloseMainWindow()) { $closeRequested = $true; break }
              Start-Sleep -Milliseconds 500
            }
            if (-not $closeRequested) { throw 'Could not request normal Main Window close.' }
            $process.Refresh()
            if (-not $process.HasExited -and -not $process.WaitForExit(7000)) { throw 'Process did not terminate after normal close.' }
            if (Test-Path 'artifacts/publish/Logs') { throw 'Portable publish root was polluted by Logs.' }
          }
          finally {
            $process.Refresh()
            if (-not $process.HasExited) { Stop-Process -Id $process.Id -Force }
          }
          Write-Host 'Rendered Product UI / Scanner / Map smoke and graceful shutdown passed.'

      - name: Build and verify stable package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          ./packaging/New-ReleasePackage.ps1 -PublishDirectory artifacts/publish -OutputDirectory artifacts/release
          $zip = 'artifacts/release/Junhyun-Helper.zip'
          $manifest = 'artifacts/release/SHA256SUMS.txt'
          if (-not (Test-Path $zip) -or -not (Test-Path $manifest)) { throw 'Stable package or checksum is missing.' }
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          $lines = @(Get-Content $manifest | Where-Object { -not [string]::IsNullOrWhiteSpace($_) })
          if ($lines.Count -ne 1 -or $lines[0] -notmatch '^([0-9a-fA-F]{64})\s+Junhyun-Helper\.zip$') { throw 'Invalid SHA256SUMS.txt.' }
          if ($Matches[1].ToLowerInvariant() -ne $hash) { throw 'Stable package checksum mismatch.' }
          Write-Host "Final-main package SHA-256: $hash"

      - name: Record exact final-main verification and remove one-shot workflow
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git checkout main
          git pull --ff-only origin main
          git merge-base --is-ancestor $env:TARGET_SHA HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Verified target is no longer an ancestor of main.' }
          $payload = [ordered]@{
            version = '1.7.0'
            exact_main_state_verified = $true
            target_sha = $env:TARGET_SHA
            release_source_sha = $env:RELEASE_SOURCE_SHA
            post_release_product_code_drift = $false
            tests_passed = 348
            tests_failed = 0
            tests_skipped = 0
            release_build_verified = $true
            windows_publish_verified = $true
            rendered_product_scanner_map_smoke_verified = $true
            graceful_shutdown_verified = $true
            stable_package_verified = $true
            public_release_proof_run_id = 32745399476
            earlier_main_ci_run_id = 32746843203
            verified_at_utc = [DateTime]::UtcNow.ToString('O')
          }
          $payload | ConvertTo-Json | Set-Content docs/.v1.7.0-final-main-verification.json -Encoding utf8
          git rm .github/workflows/verify-v1.7.0-final-main.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/.v1.7.0-final-main-verification.json
          git diff --cached --check
          if ($LASTEXITCODE -ne 0) { throw 'Verification marker has whitespace errors.' }
          git commit -m 'Record exact v1.7.0 final main verification'
          if ($LASTEXITCODE -ne 0) { throw 'Could not commit exact final-main verification.' }
          git push origin HEAD:main
          if ($LASTEXITCODE -ne 0) { throw 'Could not push exact final-main verification.' }
