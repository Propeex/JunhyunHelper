현재 v1.6.0 public release 기준:
'@
          $t=Replace-Required $t $old $new 'README release state'
          $t=$t.Replace('automated test suite: 296 tests','automated test suite: 299 tests')
          $pattern='마지막 공개 검증 기준선 v1\.5\.0:\s*```text.*?```'
          $replacement=@'
