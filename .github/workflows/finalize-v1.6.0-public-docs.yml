name: Finalize v1.6.0 Public Docs

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/finalize-v1.6.0-public-docs.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Update canonical public release state
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $utf8=[Text.UTF8Encoding]::new($false)

          function Read([string]$p){[IO.File]::ReadAllText($p)}
          function Write([string]$p,[string]$s){[IO.File]::WriteAllText($p,$s,$utf8)}
          function Replace-Required([string]$text,[string]$old,[string]$new,[string]$label){
            if(-not$text.Contains($old)){throw "Required text not found: $label"}
            $text.Replace($old,$new)
          }

          $p='README.md';$t=Read $p
          $old=@'
