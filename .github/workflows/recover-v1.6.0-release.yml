name: Recover v1.6.0 Release

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/recover-v1.6.0-release.yml'

permissions:
  contents: write

jobs:
  verify_and_publish:
    runs-on: windows-latest
    timeout-minutes: 12
    outputs:
      stable_hash: ${{ steps.info.outputs.stable_hash }}
      bridge_hash: ${{ steps.info.outputs.bridge_hash }}
      stable_bytes: ${{ steps.info.outputs.stable_bytes }}
      bridge_bytes: ${{ steps.info.outputs.bridge_bytes }}
    env:
      SOURCE_SHA: e18c108380572913552030aa677bba06ebf49355
      VERSION: 1.6.0
      TAG: v1.6.0
      GH_TOKEN: ${{ github.token }}
      JUNHYUNHELPER_MAP_SMOKE: '1'

    steps:
      - name: Verify exact draft assets from GitHub
        id: info
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $repo=$env:GITHUB_REPOSITORY

          $tag=gh api "repos/$repo/git/ref/tags/$env:TAG"|ConvertFrom-Json
          if($tag.object.sha-ne$env:SOURCE_SHA){throw "Tag source mismatch: $($tag.object.sha)"}

          $all=@(gh api "repos/$repo/releases?per_page=100"|ConvertFrom-Json)
          $matches=@($all|Where-Object{$_.tag_name-eq$env:TAG})
          if($matches.Count-ne1){throw "Expected one v1.6.0 release; found $($matches.Count)."}
          $release=$matches[0]
          if(-not$release.draft-or$release.prerelease){throw "Expected draft non-prerelease before publication. draft=$($release.draft) prerelease=$($release.prerelease)"}

          $expected=@('Junhyun-Helper.zip',"Junhyun-Helper-v$env:VERSION-win-x64.zip",'SHA256SUMS.txt')
          if(@($release.assets).Count-ne3){throw "Draft asset count is $(@($release.assets).Count), expected 3."}
          New-Item -ItemType Directory artifacts/download -Force|Out-Null
          foreach($name in $expected){
            $assets=@($release.assets|Where-Object{$_.name-eq$name})
            if($assets.Count-ne1){throw "Draft asset '$name' missing or duplicated."}
            $dest=Join-Path artifacts/download $name
            curl.exe --fail --location --silent --show-error -H "Accept: application/octet-stream" -H "Authorization: Bearer $env:GH_TOKEN" -H "X-GitHub-Api-Version: 2022-11-28" $assets[0].url --output $dest
            if($LASTEXITCODE-ne0-or-not(Test-Path $dest)){throw "Could not redownload '$name'."}
          }

          $stable='artifacts/download/Junhyun-Helper.zip'
          $bridge="artifacts/download/Junhyun-Helper-v$env:VERSION-win-x64.zip"
          $sum='artifacts/download/SHA256SUMS.txt'
          $stableHash=(Get-FileHash $stable -Algorithm SHA256).Hash.ToLowerInvariant()
          $bridgeHash=(Get-FileHash $bridge -Algorithm SHA256).Hash.ToLowerInvariant()
          $stableBytes=(Get-Item $stable).Length
          $bridgeBytes=(Get-Item $bridge).Length

          $lines=@(Get-Content $sum|Where-Object{-not[string]::IsNullOrWhiteSpace($_)})
          if($lines.Count-ne2){throw "SHA256SUMS entry count is $($lines.Count), expected 2."}
          foreach($entry in @(@('Junhyun-Helper.zip',$stableHash),@("Junhyun-Helper-v$env:VERSION-win-x64.zip",$bridgeHash))){
            $matches=@($lines|Where-Object{$_-match'^([0-9a-fA-F]{64})\s+(.+)$'-and$Matches[2]-eq$entry[0]})
            if($matches.Count-ne1){throw "Checksum entry missing or duplicated for $($entry[0])."}
            if($matches[0]-notmatch'^([0-9a-fA-F]{64})\s+(.+)$'){throw "Malformed checksum for $($entry[0])."}
            if($Matches[1].ToLowerInvariant()-ne$entry[1]){throw "Checksum mismatch for $($entry[0])."}
          }

          Expand-Archive -LiteralPath $stable -DestinationPath artifacts/stable -Force
          Expand-Archive -LiteralPath $bridge -DestinationPath artifacts/bridge -Force
          $stableRoot=(Resolve-Path 'artifacts/stable/준현 헬퍼').Path
          $bridgeRoot=(Resolve-Path 'artifacts/bridge').Path
          foreach($rel in @('준현 헬퍼.exe','FIRST_RUN_KO.txt','Assets/tarkov_data.db')){
            if(-not(Test-Path(Join-Path $stableRoot $rel))){throw "Stable ZIP missing $rel."}
            if(-not(Test-Path(Join-Path $bridgeRoot $rel))){throw "Bridge ZIP missing $rel."}
          }

          function Get-Manifest([string]$root){
            $rootPath=(Resolve-Path $root).Path.TrimEnd([IO.Path]::DirectorySeparatorChar,[IO.Path]::AltDirectorySeparatorChar)
            @(Get-ChildItem $rootPath -Recurse -File|ForEach-Object{
              $relative=$_.FullName.Substring($rootPath.Length)
              if($relative.StartsWith([IO.Path]::DirectorySeparatorChar)){ $relative=$relative.Substring(1) }
              $relative=$relative.Replace([IO.Path]::DirectorySeparatorChar,'/')
              [pscustomobject]@{Path=$relative;Length=$_.Length;Hash=(Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()}
            }|Sort-Object Path)
          }
          $stableManifest=(Get-Manifest $stableRoot)|ConvertTo-Json -Compress
          $bridgeManifest=(Get-Manifest $bridgeRoot)|ConvertTo-Json -Compress
          if($stableManifest-ne$bridgeManifest){throw 'Stable and v1.5 bridge ZIP payloads differ.'}

          $exe=(Resolve-Path(Join-Path $stableRoot '준현 헬퍼.exe')).Path
          $pv=(Get-Item $exe).VersionInfo.ProductVersion
          if($pv-ne"$env:VERSION+$env:SOURCE_SHA"){throw "ProductVersion mismatch: $pv"}
          if((Get-Content(Join-Path $stableRoot 'FIRST_RUN_KO.txt') -TotalCount 1)-ne"준현 헬퍼 v$env:VERSION — Windows x64"){throw 'FIRST_RUN identity mismatch.'}
          if(Get-ChildItem $stableRoot -Recurse -File -Filter *.pdb){throw 'PDB found in stable ZIP.'}
          if(@(Get-ChildItem $stableRoot -Recurse -File|Where-Object{$_.Extension-in@('.zip','.7z','.rar')}).Count-gt0){throw 'Nested archive found in stable ZIP.'}

          $diag=Join-Path $env:TEMP 'junhyun-map-smoke-error.txt'
          $ok=Join-Path $env:TEMP 'junhyun-map-smoke-success.txt'
          $startup=Join-Path $env:LOCALAPPDATA 'JunhyunHelper/logs/startup.log'
          Remove-Item $diag,$ok,$startup -Force -ErrorAction SilentlyContinue
          $p=Start-Process -FilePath $exe -WorkingDirectory $stableRoot -PassThru
          try{
            $deadline=(Get-Date).AddSeconds(75)
            while((Get-Date)-lt$deadline-and-not(Test-Path $ok)){
              $p.Refresh()
              if(Test-Path $diag){throw "Draft product smoke failed: $(Get-Content $diag -Raw)"}
              if($p.HasExited){throw "Draft EXE exited early: $($p.ExitCode)"}
              Start-Sleep -Milliseconds 250
            }
            if(-not(Test-Path $ok)){throw 'Draft product smoke timed out.'}
            $closed=$false
            for($i=0;$i-lt10;$i++){ $p.Refresh(); if($p.HasExited-or$p.CloseMainWindow()){$closed=$true;break}; Start-Sleep -Milliseconds 500 }
            if(-not$closed){throw 'Could not normally close draft EXE.'}
            $p.Refresh();if(-not$p.HasExited-and-not$p.WaitForExit(7000)){throw 'Draft EXE did not exit after normal close.'}
            if(Test-Path(Join-Path $stableRoot 'Logs')){throw 'Portable stable root was polluted.'}
          }finally{$p.Refresh();if(-not$p.HasExited){Stop-Process -Id $p.Id -Force}}

          "stable_hash=$stableHash" >> $env:GITHUB_OUTPUT
          "bridge_hash=$bridgeHash" >> $env:GITHUB_OUTPUT
          "stable_bytes=$stableBytes" >> $env:GITHUB_OUTPUT
          "bridge_bytes=$bridgeBytes" >> $env:GITHUB_OUTPUT
          Write-Host "Stable bytes: $stableBytes"
          Write-Host "Stable SHA-256: $stableHash"
          Write-Host "Bridge bytes: $bridgeBytes"
          Write-Host "Bridge SHA-256: $bridgeHash"
          Write-Host "ProductVersion: $pv"

      - name: Publish v1.6.0 stable latest
        shell: pwsh
        run: |
          gh release edit $env:TAG --repo $env:GITHUB_REPOSITORY --draft=false --prerelease=false --latest
          if($LASTEXITCODE-ne0){throw 'Could not publish v1.6.0 stable/latest.'}

  public_verify:
    needs: verify_and_publish
    runs-on: windows-latest
    timeout-minutes: 10
    env:
      SOURCE_SHA: e18c108380572913552030aa677bba06ebf49355
      VERSION: 1.6.0
      TAG: v1.6.0
      EXPECTED_STABLE_HASH: ${{ needs.verify_and_publish.outputs.stable_hash }}
      EXPECTED_BRIDGE_HASH: ${{ needs.verify_and_publish.outputs.bridge_hash }}
      EXPECTED_STABLE_BYTES: ${{ needs.verify_and_publish.outputs.stable_bytes }}
      EXPECTED_BRIDGE_BYTES: ${{ needs.verify_and_publish.outputs.bridge_bytes }}
      JUNHYUNHELPER_MAP_SMOKE: '1'

    steps:
      - name: Anonymous public metadata, bytes and product smoke
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $headers=@{'User-Agent'='JunhyunHelper-Public-Verifier';'Accept'='application/vnd.github+json'}
          $latest=Invoke-RestMethod 'https://api.github.com/repos/Propeex/JunhyunHelper/releases/latest' -Headers $headers
          if($latest.tag_name-ne$env:TAG-or$latest.draft-or$latest.prerelease){throw 'Public latest is not stable v1.6.0.'}
          $tag=Invoke-RestMethod "https://api.github.com/repos/Propeex/JunhyunHelper/git/ref/tags/$env:TAG" -Headers $headers
          if($tag.object.sha-ne$env:SOURCE_SHA){throw "Public tag source mismatch: $($tag.object.sha)"}
          $expected=@('Junhyun-Helper.zip',"Junhyun-Helper-v$env:VERSION-win-x64.zip",'SHA256SUMS.txt')
          if(@($latest.assets).Count-ne3){throw "Public asset count is $(@($latest.assets).Count), expected 3."}
          New-Item -ItemType Directory artifacts/public -Force|Out-Null
          foreach($name in $expected){
            $assets=@($latest.assets|Where-Object{$_.name-eq$name})
            if($assets.Count-ne1){throw "Public asset '$name' missing or duplicated."}
            $dest=Join-Path artifacts/public $name
            Invoke-WebRequest $assets[0].browser_download_url -OutFile $dest -Headers @{'User-Agent'='JunhyunHelper-Public-Verifier'}
          }

          $stable='artifacts/public/Junhyun-Helper.zip'
          $bridge="artifacts/public/Junhyun-Helper-v$env:VERSION-win-x64.zip"
          $sum='artifacts/public/SHA256SUMS.txt'
          $stableHash=(Get-FileHash $stable -Algorithm SHA256).Hash.ToLowerInvariant()
          $bridgeHash=(Get-FileHash $bridge -Algorithm SHA256).Hash.ToLowerInvariant()
          if($stableHash-ne$env:EXPECTED_STABLE_HASH){throw "Public stable hash mismatch: $stableHash"}
          if($bridgeHash-ne$env:EXPECTED_BRIDGE_HASH){throw "Public bridge hash mismatch: $bridgeHash"}
          if((Get-Item $stable).Length-ne[long]$env:EXPECTED_STABLE_BYTES){throw 'Public stable byte size mismatch.'}
          if((Get-Item $bridge).Length-ne[long]$env:EXPECTED_BRIDGE_BYTES){throw 'Public bridge byte size mismatch.'}

          $lines=@(Get-Content $sum|Where-Object{-not[string]::IsNullOrWhiteSpace($_)})
          foreach($entry in @(@('Junhyun-Helper.zip',$stableHash),@("Junhyun-Helper-v$env:VERSION-win-x64.zip",$bridgeHash))){
            $matches=@($lines|Where-Object{$_-match'^([0-9a-fA-F]{64})\s+(.+)$'-and$Matches[2]-eq$entry[0]})
            if($matches.Count-ne1-or$matches[0]-notmatch'^([0-9a-fA-F]{64})\s+(.+)$'-or$Matches[1].ToLowerInvariant()-ne$entry[1]){throw "Public checksum mismatch for $($entry[0])."}
          }

          Expand-Archive -LiteralPath $stable -DestinationPath artifacts/public-stable -Force
          $root=(Resolve-Path 'artifacts/public-stable/준현 헬퍼').Path
          foreach($rel in @('준현 헬퍼.exe','FIRST_RUN_KO.txt','Assets/tarkov_data.db')){if(-not(Test-Path(Join-Path $root $rel))){throw "Public stable ZIP missing $rel."}}
          $exe=(Resolve-Path(Join-Path $root '준현 헬퍼.exe')).Path
          $pv=(Get-Item $exe).VersionInfo.ProductVersion
          if($pv-ne"$env:VERSION+$env:SOURCE_SHA"){throw "Public ProductVersion mismatch: $pv"}
          if(Get-ChildItem $root -Recurse -File -Filter *.pdb){throw 'Public stable ZIP contains PDBs.'}

          $diag=Join-Path $env:TEMP 'junhyun-map-smoke-error.txt';$ok=Join-Path $env:TEMP 'junhyun-map-smoke-success.txt';Remove-Item $diag,$ok -Force -ErrorAction SilentlyContinue
          $p=Start-Process -FilePath $exe -WorkingDirectory $root -PassThru
          try{
            $deadline=(Get-Date).AddSeconds(75)
            while((Get-Date)-lt$deadline-and-not(Test-Path $ok)){$p.Refresh();if(Test-Path $diag){throw "Public product smoke failed: $(Get-Content $diag -Raw)"};if($p.HasExited){throw "Public EXE exited early: $($p.ExitCode)"};Start-Sleep -Milliseconds 250}
            if(-not(Test-Path $ok)){throw 'Public product smoke timed out.'}
            $closed=$false;for($i=0;$i-lt10;$i++){$p.Refresh();if($p.HasExited-or$p.CloseMainWindow()){$closed=$true;break};Start-Sleep -Milliseconds 500}
            if(-not$closed){throw 'Could not normally close public EXE.'}
            $p.Refresh();if(-not$p.HasExited-and-not$p.WaitForExit(7000)){throw 'Public EXE did not exit after normal close.'}
            if(Test-Path(Join-Path $root 'Logs')){throw 'Public portable root was polluted.'}
          }finally{$p.Refresh();if(-not$p.HasExited){Stop-Process -Id $p.Id -Force}}

          Write-Host "PUBLIC VERIFIED v$env:VERSION"
          Write-Host "Source: $env:SOURCE_SHA"
          Write-Host "Stable bytes: $env:EXPECTED_STABLE_BYTES"
          Write-Host "Stable SHA-256: $stableHash"
          Write-Host "Bridge bytes: $env:EXPECTED_BRIDGE_BYTES"
          Write-Host "Bridge SHA-256: $bridgeHash"
