name: Resume Release v1.1.1

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-v1.1.1-trigger.yml'

permissions:
  contents: write

jobs:
  resume:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      RELEASE_VERSION: '1.1.1'
      RELEASE_TAG: 'v1.1.1'
      RELEASE_SHA: '1316c25d4e90509bb9286064724b778510fa9301'
      ZIP_NAME: 'Junhyun-Helper-v1.1.1-win-x64.zip'

    steps:
      - name: Checkout main for verification record
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Verify existing draft metadata
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $release = gh release view $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --json tagName,isDraft,targetCommitish | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Could not read existing v1.1.1 draft.' }
          if ($release.tagName -ne $env:RELEASE_TAG) { throw "Draft tag mismatch: $($release.tagName)" }
          if (-not $release.isDraft) { throw 'v1.1.1 is not a draft; refusing duplicate resume.' }
          if ($release.targetCommitish -ne $env:RELEASE_SHA) { throw "Draft target mismatch: $($release.targetCommitish)" }
          $latest = gh release view --repo $env:GITHUB_REPOSITORY --json tagName --jq '.tagName'
          if ($latest -ne 'v1.1.0') { throw "Unexpected pre-publish latest stable: $latest" }
          Write-Host "DRAFT_RELEASE_SOURCE=$($release.targetCommitish)"

      - name: Download and verify exact draft assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force artifacts/draft-download | Out-Null
          gh release download $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --dir artifacts/draft-download --pattern $env:ZIP_NAME --pattern SHA256SUMS.txt
          if ($LASTEXITCODE -ne 0) { throw 'Could not download draft assets.' }
          $zip = Join-Path artifacts/draft-download $env:ZIP_NAME
          $checksum = Get-Content artifacts/draft-download/SHA256SUMS.txt | Where-Object { $_ -match [Regex]::Escape($env:ZIP_NAME) } | Select-Object -First 1
          if (-not $checksum) { throw 'Draft checksum entry missing.' }
          $expected = (($checksum -split '\s+')[0]).ToLowerInvariant()
          $actual = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw "Draft ZIP checksum mismatch: $actual != $expected" }
          Expand-Archive $zip artifacts/draft-extracted
          $rootFiles = @(Get-ChildItem artifacts/draft-extracted -File | Select-Object -ExpandProperty Name)
          if (@($rootFiles | Where-Object { $_ -notin @('준현 헬퍼.exe','FIRST_RUN_KO.txt') }).Count -gt 0) { throw 'Draft root contains unexpected files.' }
          $rootDirs = @(Get-ChildItem artifacts/draft-extracted -Directory | Select-Object -ExpandProperty Name)
          if ($rootDirs.Count -ne 1 -or $rootDirs[0] -ne 'Assets') { throw 'Draft root directory contract is invalid.' }
          if (-not (Test-Path 'artifacts/draft-extracted/Assets/tarkov_data.db')) { throw 'Draft package is missing tarkov_data.db.' }
          if (@(Get-ChildItem artifacts/draft-extracted -Recurse -File -Filter *.pdb).Count -gt 0) { throw 'Draft package contains PDB files.' }
          $productVersion = (Get-Item 'artifacts/draft-extracted/준현 헬퍼.exe').VersionInfo.ProductVersion
          if ($productVersion -notmatch '^1\.1\.1(?:$|[+-])') { throw "Draft ProductVersion mismatch: $productVersion" }
          $firstLine = Get-Content artifacts/draft-extracted/FIRST_RUN_KO.txt -TotalCount 1
          if ($firstLine -ne '준현 헬퍼 v1.1.1 — Windows x64') { throw "Draft FIRST_RUN mismatch: $firstLine" }
          Write-Host "DRAFT_ZIP_SHA256=$actual"
          Write-Host "DRAFT_ZIP_BYTES=$((Get-Item $zip).Length)"
          Write-Host "DRAFT_PRODUCT_VERSION=$productVersion"

      - name: Smoke draft-downloaded package
        shell: pwsh
        env:
          JUNHYUNHELPER_MAP_SMOKE: '1'
        run: |
          $workDir = (Resolve-Path artifacts/draft-extracted).Path
          $exe = Join-Path $workDir '준현 헬퍼.exe'
          $diagnostic = Join-Path $env:TEMP 'junhyun-map-smoke-error.txt'
          $success = Join-Path $env:TEMP 'junhyun-map-smoke-success.txt'
          Remove-Item $diagnostic,$success -Force -ErrorAction SilentlyContinue
          $p = Start-Process -FilePath $exe -WorkingDirectory $workDir -PassThru
          try {
            $deadline = (Get-Date).AddSeconds(75); $done = $false
            while ((Get-Date) -lt $deadline) {
              $p.Refresh()
              if (Test-Path $diagnostic) { Get-Content $diagnostic | ForEach-Object { Write-Host $_ }; throw 'Draft smoke failed.' }
              if (Test-Path $success) { $done = $true; break }
              if ($p.HasExited) { throw "Draft app exited early: $($p.ExitCode)" }
              Start-Sleep -Milliseconds 250
            }
            if (-not $done) { throw 'Draft smoke timed out.' }
            $requested = $false
            for ($i=0; $i -lt 10; $i++) { $p.Refresh(); if ($p.HasExited) { $requested=$true; break }; if ($p.CloseMainWindow()) { $requested=$true; break }; Start-Sleep -Milliseconds 500 }
            if (-not $requested) { throw 'Could not close draft app normally.' }
            $p.Refresh(); if (-not $p.HasExited -and -not $p.WaitForExit(7000)) { throw 'Draft app remained alive.' }
            if (Test-Path (Join-Path $workDir 'Logs')) { throw 'Draft smoke polluted portable root with Logs.' }
          }
          finally { $p.Refresh(); if (-not $p.HasExited) { Stop-Process -Id $p.Id -Force } }
          Write-Host 'Draft-downloaded v1.1.1 Product UI + Scanner activity + Main Map + Factory + MiniMap smoke passed.'

      - name: Publish verified release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release edit $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --draft=false --latest
          if ($LASTEXITCODE -ne 0) { throw 'Could not publish verified v1.1.1 release.' }

      - name: Re-download and verify public assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force artifacts/public-download | Out-Null
          gh release download $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --dir artifacts/public-download --pattern $env:ZIP_NAME --pattern SHA256SUMS.txt
          if ($LASTEXITCODE -ne 0) { throw 'Could not download public assets.' }
          $zip = Join-Path artifacts/public-download $env:ZIP_NAME
          $checksum = Get-Content artifacts/public-download/SHA256SUMS.txt | Where-Object { $_ -match [Regex]::Escape($env:ZIP_NAME) } | Select-Object -First 1
          if (-not $checksum) { throw 'Public checksum entry missing.' }
          $expected = (($checksum -split '\s+')[0]).ToLowerInvariant()
          $actual = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw "Public ZIP checksum mismatch: $actual != $expected" }
          Expand-Archive $zip artifacts/public-extracted
          $productVersion = (Get-Item 'artifacts/public-extracted/준현 헬퍼.exe').VersionInfo.ProductVersion
          if ($productVersion -notmatch '^1\.1\.1(?:$|[+-])') { throw "Public ProductVersion mismatch: $productVersion" }
          $firstLine = Get-Content artifacts/public-extracted/FIRST_RUN_KO.txt -TotalCount 1
          if ($firstLine -ne '준현 헬퍼 v1.1.1 — Windows x64') { throw "Public FIRST_RUN mismatch: $firstLine" }
          $latest = gh release view --repo $env:GITHUB_REPOSITORY --json tagName --jq '.tagName'
          if ($latest -ne $env:RELEASE_TAG) { throw "Latest stable mismatch: $latest" }
          $release = gh release view $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --json isDraft,targetCommitish | ConvertFrom-Json
          if ($release.isDraft) { throw 'v1.1.1 remained draft after publish.' }
          if ($release.targetCommitish -ne $env:RELEASE_SHA) { throw "Public target mismatch: $($release.targetCommitish)" }
          Write-Host "PUBLIC_ZIP_SHA256=$actual"
          Write-Host "PUBLIC_ZIP_BYTES=$((Get-Item $zip).Length)"
          Write-Host "PUBLIC_PRODUCT_VERSION=$productVersion"
          Write-Host "PUBLIC_RELEASE_SOURCE=$($release.targetCommitish)"

      - name: Smoke public-downloaded package
        shell: pwsh
        env:
          JUNHYUNHELPER_MAP_SMOKE: '1'
        run: |
          $workDir = (Resolve-Path artifacts/public-extracted).Path
          $exe = Join-Path $workDir '준현 헬퍼.exe'
          $diagnostic = Join-Path $env:TEMP 'junhyun-map-smoke-error.txt'
          $success = Join-Path $env:TEMP 'junhyun-map-smoke-success.txt'
          Remove-Item $diagnostic,$success -Force -ErrorAction SilentlyContinue
          $p = Start-Process -FilePath $exe -WorkingDirectory $workDir -PassThru
          try {
            $deadline = (Get-Date).AddSeconds(75); $done = $false
            while ((Get-Date) -lt $deadline) {
              $p.Refresh()
              if (Test-Path $diagnostic) { Get-Content $diagnostic | ForEach-Object { Write-Host $_ }; throw 'Public smoke failed.' }
              if (Test-Path $success) { $done = $true; break }
              if ($p.HasExited) { throw "Public app exited early: $($p.ExitCode)" }
              Start-Sleep -Milliseconds 250
            }
            if (-not $done) { throw 'Public smoke timed out.' }
            $requested = $false
            for ($i=0; $i -lt 10; $i++) { $p.Refresh(); if ($p.HasExited) { $requested=$true; break }; if ($p.CloseMainWindow()) { $requested=$true; break }; Start-Sleep -Milliseconds 500 }
            if (-not $requested) { throw 'Could not close public app normally.' }
            $p.Refresh(); if (-not $p.HasExited -and -not $p.WaitForExit(7000)) { throw 'Public app remained alive.' }
            if (Test-Path (Join-Path $workDir 'Logs')) { throw 'Public smoke polluted portable root with Logs.' }
          }
          finally { $p.Refresh(); if (-not $p.HasExited) { Stop-Process -Id $p.Id -Force } }
          Write-Host 'Public-downloaded v1.1.1 Product UI + Scanner activity + Main Map + Factory + MiniMap smoke passed.'

      - name: Upload release verification record
        uses: actions/upload-artifact@v4
        with:
          name: v1.1.1-release-verification
          path: |
            artifacts/public-download/${{ env.ZIP_NAME }}
            artifacts/public-download/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

      - name: Record successful public verification
        if: success()
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git pull --rebase origin main
          @"
          result=success
          run_id=${{ github.run_id }}
          release_target=$env:RELEASE_SHA
          is_draft=false
          latest_tag=$env:RELEASE_TAG
          "@ | Set-Content .github/release-v1.1.1-status.txt -Encoding ascii
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- .github/release-v1.1.1-status.txt
          git commit -m 'Record verified v1.1.1 public release'
          git push origin HEAD:main
