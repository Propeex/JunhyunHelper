name: Trigger Release v1.1.1

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-v1.1.1-trigger.yml'

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch exact main release workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run release-v1.1.1.yml --repo "$GITHUB_REPOSITORY" --ref main
