name: Apply Scanner v1.3.2 branch patch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-scanner-v1.3.2-patch.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Scanner branch
        uses: actions/checkout@v4
        with:
          ref: scanner/live-evidence-v1.3.2
          fetch-depth: 0

      - name: Apply patch script
        shell: pwsh
        run: |
          python tools/patch_scanner_v132_magnifier.py
          if ($LASTEXITCODE -ne 0) { throw 'v1.3.2 patch script failed.' }
          Remove-Item tools/patch_scanner_v132_magnifier.py -Force
          Remove-Item '.github/workflows/scanner-symbol-audit.yml' -Force -ErrorAction SilentlyContinue
          Remove-Item '.github/workflows/scanner-v132-live-evidence-patch.yml' -Force -ErrorAction SilentlyContinue
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          if ($LASTEXITCODE -ne 0) { throw 'git diff --check failed.' }
          git commit -m 'fix(scanner): harden live magnifier association'
          git push origin HEAD:scanner/live-evidence-v1.3.2
