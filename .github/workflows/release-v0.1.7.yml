name: Release v0.1.7

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-v0.1.7.yml'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 18
    env:
      RELEASE_TAG: v0.1.7
      RELEASE_SHA: 8cf2f76003bf2603b8c0f8c0a7d9297bfc62bd43
      RELEASE_ASSET: Junhyun-Helper-v0.1.7-win-x64.zip

    steps:
      - name: Checkout exact release code
        uses: actions/checkout@v4
        with:
          ref: 8cf2f76003bf2603b8c0f8c0a7d9297bfc62bd43
          submodules: recursive

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build desktop
        run: dotnet build src/JunhyunHelper.Desktop/JunhyunHelper.Desktop.csproj --configuration Release

      - name: Test all automated tests
        run: dotnet test tests/JunhyunHelper.Tests/JunhyunHelper.Tests.csproj --configuration Release

      - name: Publish and validate Windows x64 package
        shell: pwsh
        run: |
          dotnet publish src/JunhyunHelper.Desktop/JunhyunHelper.Desktop.csproj `
            --configuration Release `
            --runtime win-x64 `
            --self-contained true `
            --output artifacts/publish `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true `
            -p:PublishTrimmed=false `
            -p:PublishReadyToRun=false `
            -p:DebugType=None `
            -p:DebugSymbols=false

          Copy-Item packaging/FIRST_RUN_KO.txt artifacts/publish/FIRST_RUN_KO.txt

          $exe = 'artifacts/publish/준현 헬퍼.exe'
          foreach ($required in @($exe, 'artifacts/publish/FIRST_RUN_KO.txt', 'artifacts/publish/Assets/tarkov_data.db')) {
            if (-not (Test-Path $required)) { throw "Missing release file: $required" }
          }

          $productVersion = (Get-Item $exe).VersionInfo.ProductVersion
          Write-Host "ProductVersion=$productVersion"
          if (-not $productVersion.StartsWith('0.1.7', [StringComparison]::Ordinal)) {
            throw "Expected executable ProductVersion 0.1.7, got '$productVersion'."
          }

          $guide = Get-Content 'artifacts/publish/FIRST_RUN_KO.txt' -Raw
          if ($guide -notmatch '준현 헬퍼 v0\.1\.7') { throw 'FIRST_RUN_KO.txt does not identify v0.1.7.' }
          if ($guide -notmatch 'Content schema.*v7') { throw 'FIRST_RUN_KO.txt does not document Content schema v7.' }

          $rootFiles = @(Get-ChildItem artifacts/publish -File)
          $unexpectedFiles = @($rootFiles | Where-Object { $_.Name -notin @('준현 헬퍼.exe', 'FIRST_RUN_KO.txt') })
          if ($unexpectedFiles.Count -gt 0) { throw "Unexpected root files: $($unexpectedFiles.Name -join ', ')" }

          $rootDirs = @(Get-ChildItem artifacts/publish -Directory)
          $unexpectedDirs = @($rootDirs | Where-Object { $_.Name -ne 'Assets' })
          if ($unexpectedDirs.Count -gt 0) { throw "Unexpected root directories: $($unexpectedDirs.Name -join ', ')" }
          if (Get-ChildItem artifacts/publish -File -Filter *.dll) { throw 'Root DLL leaked into release.' }
          if (Get-ChildItem artifacts/publish -Recurse -File -Filter *.pdb) { throw 'PDB leaked into release.' }
          if (Get-ChildItem artifacts/publish -Recurse -File -Filter *.zip) { throw 'Nested ZIP leaked into release.' }
          if (Test-Path 'artifacts/publish/Logs') { throw 'Logs directory leaked into release package.' }

          foreach ($forbidden in @(
            'AutoUpdater.NET.dll',
            'Microsoft.Web.WebView2.Core.dll',
            'Microsoft.Web.WebView2.WinForms.dll',
            'Microsoft.Web.WebView2.Wpf.dll',
            'WebView2Loader.dll',
            'Westermo.GraphX.Controls.dll',
            'Westermo.GraphX.Common.dll',
            'QuikGraph.dll')) {
            if (Get-ChildItem artifacts/publish -Recurse -File -Filter $forbidden) {
              throw "Forbidden legacy dependency leaked into release: $forbidden"
            }
          }

      - name: Startup + Main Map + Factory + MiniMap + graceful shutdown smoke
        shell: pwsh
        env:
          JUNHYUNHELPER_MAP_SMOKE: '1'
        run: |
          $exe = (Resolve-Path 'artifacts/publish/준현 헬퍼.exe').Path
          $diagnostic = Join-Path $env:TEMP 'junhyun-map-smoke-error.txt'
          $success = Join-Path $env:TEMP 'junhyun-map-smoke-success.txt'
          Remove-Item $diagnostic -Force -ErrorAction SilentlyContinue
          Remove-Item $success -Force -ErrorAction SilentlyContinue

          $process = Start-Process -FilePath $exe -WorkingDirectory artifacts/publish -PassThru
          try {
            $deadline = (Get-Date).AddSeconds(75)
            $smokeCompleted = $false
            while ((Get-Date) -lt $deadline) {
              $process.Refresh()
              if (Test-Path $diagnostic) {
                Get-Content $diagnostic | ForEach-Object { Write-Host $_ }
                throw 'Published 준현 헬퍼 reported a Map smoke failure.'
              }
              if (Test-Path $success) {
                $smokeCompleted = $true
                break
              }
              if ($process.HasExited) {
                throw "Published 준현 헬퍼 exited before smoke completion with code $($process.ExitCode)."
              }
              Start-Sleep -Milliseconds 250
            }
            if (-not $smokeCompleted) { throw 'Full Main Map/Factory/MiniMap smoke timed out.' }

            $closeRequested = $false
            for ($attempt = 1; $attempt -le 10; $attempt++) {
              $process.Refresh()
              if ($process.HasExited) { $closeRequested = $true; break }
              if ($process.CloseMainWindow()) { $closeRequested = $true; break }
              Start-Sleep -Milliseconds 500
            }
            if (-not $closeRequested) { throw 'Could not request normal Main Window close.' }
            $process.Refresh()
            if (-not $process.HasExited -and -not $process.WaitForExit(7000)) {
              throw 'Process did not exit after Main Window close.'
            }
            if (Test-Path 'artifacts/publish/Logs') { throw 'Runtime Logs folder was created beside EXE.' }
          }
          finally {
            $process.Refresh()
            if (-not $process.HasExited) { Stop-Process -Id $process.Id -Force }
          }

      - name: Package public asset
        shell: pwsh
        run: |
          if (Test-Path $env:RELEASE_ASSET) { Remove-Item $env:RELEASE_ASSET -Force }
          Compress-Archive -Path 'artifacts/publish/*' -DestinationPath $env:RELEASE_ASSET -CompressionLevel Optimal
          $hash = (Get-FileHash $env:RELEASE_ASSET -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $($env:RELEASE_ASSET)" | Set-Content SHA256SUMS.txt -Encoding ascii
          "RELEASE_ASSET_SHA256=$hash" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Public release SHA-256: $hash"

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          @'
          # 준현 헬퍼 v0.1.7

          Quest 선행조건 판정을 한 단계 더 정확하게 만들고 MiniMap 층 전환 화면을 고정한 릴리즈입니다.

          ## Quest 선행조건
          - v0.1.6의 BTR Driver `A Helping Hand = Active`, Ref, Lightkeeper recoverable access 수정 포함
          - 서로 다른 `taskRequirements`는 AND, 한 requirement의 `status[]`는 OR
          - 별도 `수주 가능` 상태 없이 받을 수 있는 Quest는 즉시 수락한 것으로 간주
          - EFT profile-variable availability를 structured 조건으로 보존
          - exact profile variable 값이 있으면 정확히 판정
          - 프로그램이 현재 알 수 없는 variable/dialogue/time state는 추측하지 않고 `확인 필요`로 유지

          ## MiniMap
          - 같은 지도에서 층을 바꿀 때 live 확대율과 화면 X/Y 위치를 정확히 보존
          - 모든 층이 같은 canonical SVG canvas의 layer라는 구조에 맞춰 floor layer만 교체
          - PlayerTracking의 live 위치와 오래된 저장 offset이 달라도 층 변경으로 화면이 튀지 않음

          ## 데이터 / 호환성
          - Content schema v7, 기존 v3~v6 읽기 지원
          - user.db SQLite schema v1 유지
          - v0.1.6 → v0.1.7 필수 데이터 업데이트 없음
          - 기존 Profile / Quest / Inventory / Hideout / Map 설정 유지

          ## 검증
          - Windows Release build + 전체 자동 테스트
          - Windows x64 self-contained single-file publish
          - ProductVersion 0.1.7 및 Content schema v7 안내 검증
          - 실제 startup + Main Map + Factory + MiniMap runtime smoke
          - 정상 종료 및 release root 오염 검사
          - 공개 ZIP 재다운로드 후 SHA-256 재검증

          `Junhyun-Helper-v0.1.7-win-x64.zip`을 압축 해제하고 `준현 헬퍼.exe`를 실행하면 됩니다. 별도 .NET 설치는 필요하지 않습니다.

          코드 서명은 아직 적용하지 않아 Windows SmartScreen 경고가 표시될 수 있습니다.
          '@ | Set-Content release-notes.md -Encoding utf8

          gh release create $env:RELEASE_TAG $env:RELEASE_ASSET SHA256SUMS.txt `
            --target $env:RELEASE_SHA `
            --title '준현 헬퍼 v0.1.7' `
            --notes-file release-notes.md `
            --repo 'Propeex/JunhyunHelper'
          if ($LASTEXITCODE -ne 0) { throw 'Failed to create v0.1.7 release.' }

      - name: Verify live public release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $meta = gh release view $env:RELEASE_TAG --repo 'Propeex/JunhyunHelper' --json isDraft,isPrerelease,targetCommitish,assets | ConvertFrom-Json
          if ($meta.isDraft) { throw 'Release is still draft.' }
          if ($meta.isPrerelease) { throw 'Release is still prerelease.' }
          if ($meta.targetCommitish -ne $env:RELEASE_SHA) { throw "Unexpected release target: $($meta.targetCommitish)" }
          if (-not ($meta.assets | Where-Object { $_.name -eq $env:RELEASE_ASSET })) { throw 'Public ZIP asset missing.' }
          if (-not ($meta.assets | Where-Object { $_.name -eq 'SHA256SUMS.txt' })) { throw 'SHA256SUMS.txt asset missing.' }

          Remove-Item artifacts/verify -Recurse -Force -ErrorAction SilentlyContinue
          New-Item artifacts/verify -ItemType Directory | Out-Null
          gh release download $env:RELEASE_TAG --repo 'Propeex/JunhyunHelper' --pattern $env:RELEASE_ASSET --dir artifacts/verify
          if ($LASTEXITCODE -ne 0) { throw 'Failed to re-download public ZIP.' }
          $downloaded = Join-Path artifacts/verify $env:RELEASE_ASSET
          $publicHash = (Get-FileHash $downloaded -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($publicHash -ne $env:RELEASE_ASSET_SHA256) {
            throw "Public ZIP hash mismatch: local=$($env:RELEASE_ASSET_SHA256), public=$publicHash"
          }
          Write-Host "PUBLIC_RELEASE_VERIFIED=true"
          Write-Host "PUBLIC_SHA256=$publicHash"
