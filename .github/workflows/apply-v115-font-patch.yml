name: Apply v1.1.5 font-aware Scanner patch

on:
  push:
    branches:
      - scanner-v1.1.5-overlay-market-hardening
    paths:
      - .github/workflows/apply-v115-font-patch.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: scanner-v1.1.5-overlay-market-hardening
          fetch-depth: 0

      - name: Apply implementation
        shell: bash
        run: |
          echo ' ' | base64 -d > /tmp/apply_patch.py
          python /tmp/apply_patch.py
          git diff --check

      - name: Commit implementation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/JunhyunHelper.Desktop/Scanner docs/RELEASE_1.1.5.md docs/SCANNER.md
          git commit -m "Add Tarkov font-aware Scanner title recovery"
          git push origin HEAD:scanner-v1.1.5-overlay-market-hardening
