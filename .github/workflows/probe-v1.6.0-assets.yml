name: Probe v1.6.0 Draft Assets

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/probe-v1.6.0-assets.yml'

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Record authenticated draft release assets
        shell: pwsh
        run: |
          $repo=$env:GITHUB_REPOSITORY
          $all=@(gh api "repos/$repo/releases?per_page=100"|ConvertFrom-Json)
          $r=@($all|Where-Object{$_.tag_name -eq 'v1.6.0'})
          if($r.Count-ne1){throw "release count $($r.Count)"}
          $o=[ordered]@{id=$r[0].id;draft=$r[0].draft;tag=$r[0].tag_name;assets=@($r[0].assets|ForEach-Object{[ordered]@{id=$_.id;name=$_.name;size=$_.size;state=$_.state;url=$_.url;browser_download_url=$_.browser_download_url}})}
          $json=$o|ConvertTo-Json -Depth 5
          $b64=[Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes($json))
          $path="repos/$repo/contents/docs/.v1.6.0-draft-assets.json"
          $old=gh api $path 2>$null;$sha=$null;if($LASTEXITCODE-eq0){$sha=($old|ConvertFrom-Json).sha}
          $args=@('--method','PUT',$path,'-f','message=Record v1.6.0 draft asset names','-f',"content=$b64",'-f','branch=main');if($sha){$args+=@('-f',"sha=$sha")};gh api @args|Out-Null
