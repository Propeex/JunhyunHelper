name: Fix v0.1.7 smoke compile

on:
  push:
    branches:
      - agent/v0.1.7-minimap-floor-transform

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove obsolete smoke variable
        shell: bash
        run: |
          echo '' | base64 -d > /tmp/fix.py
          python /tmp/fix.py
      - name: Remove one-shot and commit
        shell: bash
        run: |
          rm .github/workflows/fix-v017-unused-smoke-var.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Remove obsolete MiniMap smoke direction state"
          git push
