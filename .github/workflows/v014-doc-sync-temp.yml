name: Sync v0.1.4 candidate docs

on:
  push:
    branches:
      - agent/main-map-floor-quest-availability-2026-08-15

permissions:
  contents: write

jobs:
  sync-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/main-map-floor-quest-availability-2026-08-15
          fetch-depth: 0

      - name: Patch authoritative docs
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          arch = Path('docs/ARCHITECTURE.md')
          text = arch.read_text(encoding='utf-8')
          text = text.replace('`CONFIRMED — v0.1.0 release candidate architecture`', '`CONFIRMED — current architecture through v0.1.4 candidate`')
          text = text.replace('현재 Content snapshot schema: **v4**.', '현재 Content snapshot schema: **v5**.')
          if '- v5: Quest availability semantics' not in text:
              text = text.replace(
                  '- v4: Quest `possibleLocations` / `zones` geometry를 canonical content에 저장\n',
                  '- v4: Quest `possibleLocations` / `zones` geometry를 canonical content에 저장\n- v5: Quest availability semantics — special-trader gate 보강, delay metadata, unsupported availability 조건 보존\n')
          old_policy = '''Application 제품 policy:

          ```text
          residual Indeterminate
          → Current for user-facing workflow
          → diagnostic reasons preserved
          ```

          확정 가능한 Locked/Unavailable은 승격하지 않습니다.'''
          new_policy = '''Application 제품 policy:

          ```text
          확정 가능한 조건 충족
          → Current (진행 중)

          residual Indeterminate
          → Indeterminate 유지
          → UI: 확인 필요
          → Current 수치/기본 필터/Map Current Quest에서 제외
          → diagnostic reasons preserved
          ```

          `globalVariable`, `dialogue`, 실제 게임 완료 시각이 필요한 availability delay처럼 현재 User Progress만으로 증명할 수 없는 조건을 Current 또는 Locked로 추측하지 않습니다. 사용자가 실제 게임 상태를 확인한 경우에는 `확인 필요` Quest를 수동 완료할 수 있고, 비재시작형 영구 실패 동기화가 필요한 경우 수동 실패도 허용합니다. Future Needed Items는 `IndeterminatePotential`을 보수적으로 보호합니다.

          확정 가능한 Locked/Unavailable/Completed는 그대로 유지합니다.'''
          old_policy = old_policy.replace('          ', '')
          new_policy = new_policy.replace('          ', '')
          if old_policy not in text:
              raise SystemExit('Expected old Quest availability architecture block was not found.')
          text = text.replace(old_policy, new_policy)
          arch.write_text(text, encoding='utf-8')

          state = Path('docs/STATE.md')
          text = state.read_text(encoding='utf-8')
          start = text.index('## 현재 상태')
          history = text.index('## v0.1.3 변경')
          current = '''## 현재 상태

          **v0.1.4 RELEASE CANDIDATE — Main Map floor/extract + Quest availability / Windows x64**

          현재 공개 릴리즈는 **v0.1.3**입니다. v0.1.4는 사용자 Factory 캡처로 확인된 Main Map floor/extract 표시와 Quest availability 과다 Current 문제를 수정하는 패치입니다.

          ```text
          feature PR: #80 OPEN
          branch: agent/main-map-floor-quest-availability-2026-08-15
          Desktop ProductVersion: 0.1.4
          Content schema: unchanged (v5)
          user.db schema: unchanged
          required data update from v0.1.3: none
          public v0.1.4 release: PENDING final whole-change review + CI + merge + exact-baseline release gate
          ```

          v0.1.4 후보 핵심:

          - Main Map에서 floor를 visibility filter로 사용하지 않음
          - current/above/below를 초록/빨강/파랑 compact ring으로 표현, known off-floor는 약 75% opacity
          - Factory `Gate 3` 같은 동일 물리 PMC/Scav extract 중복은 원본을 삭제하지 않고 활성 faction filter 기준 대표 visual 하나만 표시
          - `Office Window` 같은 Scav 회색 body는 faction 의미를 유지하고 floor ring과 분리
          - 큰 floor arrow badge 제거, 위/아래는 매우 작은 보조 glyph만 사용
          - Core Indeterminate Quest를 `진행 중`으로 강제하지 않고 UI `확인 필요`로 분리
          - `확인 필요`는 Current count/Map Current sidebar에서 제외하되 실제 게임 상태를 아는 사용자의 수동 완료/필요한 영구 실패 동기화는 허용
          - Future Needed Items의 `IndeterminatePotential` 보수 보호 유지

          현재 release gate는 최신 PR head의 Windows CI/runtime smoke와 최종 review를 다시 통과한 뒤 병합하고, **병합된 exact baseline**에서 공개 ZIP을 다시 빌드/검증하는 것입니다.

          '''.replace('          ', '')
          text = text[:start] + current + text[history:]
          text = text.replace('`globalVariable` / `dialogue` unresolved condition은 `판정 문제`에 보존', '`globalVariable` / `dialogue` unresolved condition은 `확인 필요`로 보존')
          text = text.replace('| Quest | 구현 완료 / v0.1.1 live prerequisite audit 유지 |', '| Quest | 구현 완료 / v0.1.4 `확인 필요` availability 분리 후보 |')
          text = text.replace('| Map + MiniMap | 구현 완료 / v0.1.3 RELEASED |', '| Map + MiniMap | 구현 완료 / v0.1.4 Main Map floor/extract 후보 검증 중 |')
          upgrade_anchor = '## 업그레이드 정책\n\n'
          if '**v0.1.3 → v0.1.4:**' not in text:
              text = text.replace(upgrade_anchor, upgrade_anchor + '- **v0.1.3 → v0.1.4:** 필수 `데이터 업데이트` 없음. Content schema v5 / `user.db` 그대로입니다.\n')
          state.write_text(text, encoding='utf-8')

          readme = Path('README.md')
          text = readme.read_text(encoding='utf-8')
          start = text.index('## 현재 상태')
          features = text.index('## 주요 기능')
          current = '''## 현재 상태

          **v0.1.4 RELEASE CANDIDATE — Windows x64**

          현재 공개 버전은 **v0.1.3**입니다.

          **현재 공개 다운로드:** https://github.com/Propeex/JunhyunHelper/releases/tag/v0.1.3

          v0.1.4는 Main Map의 타층 marker/extract 표시와 Factory 중복 extract를 수정하고, 프로그램만으로 해금 여부를 증명할 수 없는 Quest를 `진행 중`이 아닌 `확인 필요`로 분리하는 패치입니다.

          > **v0.1.3 → v0.1.4:** 필수 `데이터 업데이트`가 없습니다. Content schema v5와 `user.db`는 변경하지 않습니다.

          '''.replace('          ', '')
          text = text[:start] + current + text[features:]
          text = text.replace('  - 타층 marker 50% + 위층 `↑` / 아래층 `↓` 표시', '  - 타층 marker 유지 + 현재층 초록 / 위층 빨강 / 아래층 파랑 compact ring')
          text = text.replace('`globalVariable` / `dialogue`처럼 현재 User Progress만으로 확정할 수 없는 조건은 추측하지 않고 `판정 문제`에 표시', '`globalVariable` / `dialogue`처럼 현재 User Progress만으로 확정할 수 없는 조건은 추측하지 않고 `확인 필요`로 분리')
          readme.write_text(text, encoding='utf-8')
          PY

      - name: Commit doc synchronization and remove temporary workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/v014-doc-sync-temp.yml
          git add docs/ARCHITECTURE.md docs/STATE.md README.md
          git commit -m 'Align v0.1.4 candidate architecture and state'
          git push origin HEAD:agent/main-map-floor-quest-availability-2026-08-15
