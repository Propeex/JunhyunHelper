name: Verify Release v0.1.0

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-release-v0.1.0.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify-release:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Verify public release and record result
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set +e
          release_json="$(gh release view v0.1.0 --repo "$REPO" --json url,isDraft,isPrerelease,tagName,name,assets,publishedAt 2>&1)"
          release_exit=$?
          set -e

          status="FAILED"
          details=""
          release_url=""
          asset_hash="unknown"

          if [ "$release_exit" -ne 0 ]; then
            details="gh release view failed: $release_json"
          else
            release_url="$(printf '%s' "$release_json" | jq -r '.url // ""')"
            tag="$(printf '%s' "$release_json" | jq -r '.tagName // ""')"
            draft="$(printf '%s' "$release_json" | jq -r '.isDraft')"
            prerelease="$(printf '%s' "$release_json" | jq -r '.isPrerelease')"
            zip_count="$(printf '%s' "$release_json" | jq '[.assets[] | select(.name == "준현-헬퍼-v0.1.0-win-x64.zip")] | length')"
            sum_count="$(printf '%s' "$release_json" | jq '[.assets[] | select(.name == "SHA256SUMS.txt")] | length')"

            if [ "$tag" = "v0.1.0" ] && [ "$draft" = "false" ] && [ "$prerelease" = "false" ] && [ "$zip_count" = "1" ] && [ "$sum_count" = "1" ]; then
              status="PUBLISHED / VERIFIED"
              details="GitHub reports a public non-draft, non-prerelease v0.1.0 with both required assets."

              gh release download v0.1.0 --repo "$REPO" --pattern 'SHA256SUMS.txt' --dir release-check
              asset_hash="$(awk '{print $1}' release-check/SHA256SUMS.txt | head -n 1)"
            else
              details="tag=$tag draft=$draft prerelease=$prerelease zip_count=$zip_count sum_count=$sum_count"
            fi
          fi

          published_at=""
          release_name=""
          if [ "$release_exit" -eq 0 ]; then
            published_at="$(printf '%s' "$release_json" | jq -r '.publishedAt // ""')"
            release_name="$(printf '%s' "$release_json" | jq -r '.name // ""')"
          fi

          cat > /tmp/release-record.md <<EOF
          # GitHub Release — 준현 헬퍼 v0.1.0

          Status: $status

          - Tag: \`v0.1.0\`
          - Name: $release_name
          - Published: $published_at
          - Release URL: $release_url
          - Windows asset: \`준현-헬퍼-v0.1.0-win-x64.zip\`
          - SHA-256: \`$asset_hash\`
          - Verification: $details

          This file is generated by GitHub Actions from the live GitHub Release API state.
          EOF

          content_b64="$(base64 -w 0 /tmp/release-record.md)"
          gh api --method PUT "repos/$REPO/contents/docs/GITHUB_RELEASE_0.1.0.md" \
            -f message='Record live GitHub v0.1.0 release verification' \
            -f content="$content_b64" >/dev/null

          if [ "$status" != "PUBLISHED / VERIFIED" ]; then
            exit 1
          fi
