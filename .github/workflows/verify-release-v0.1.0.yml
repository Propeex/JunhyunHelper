name: Verify Release v0.1.0

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-release-v0.1.0.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify-release:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Remove malformed legacy asset and verify final release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          if gh release view v0.1.0 --repo "$REPO" --json assets --jq '.assets[].name' | grep -Fxq -- '-.-v0.1.0-win-x64.zip'; then
            gh release delete-asset v0.1.0 '-.-v0.1.0-win-x64.zip' --yes --repo "$REPO"
          fi

          release_json="$(gh release view v0.1.0 --repo "$REPO" --json url,isDraft,isPrerelease,tagName,name,assets,publishedAt)"
          tag="$(printf '%s' "$release_json" | jq -r '.tagName')"
          draft="$(printf '%s' "$release_json" | jq -r '.isDraft')"
          prerelease="$(printf '%s' "$release_json" | jq -r '.isPrerelease')"
          release_url="$(printf '%s' "$release_json" | jq -r '.url')"
          release_name="$(printf '%s' "$release_json" | jq -r '.name')"
          published_at="$(printf '%s' "$release_json" | jq -r '.publishedAt')"
          zip_count="$(printf '%s' "$release_json" | jq '[.assets[] | select(.name == "Junhyun-Helper-v0.1.0-win-x64.zip")] | length')"
          sum_count="$(printf '%s' "$release_json" | jq '[.assets[] | select(.name == "SHA256SUMS.txt")] | length')"
          asset_count="$(printf '%s' "$release_json" | jq '.assets | length')"
          asset_names="$(printf '%s' "$release_json" | jq -r '[.assets[].name] | join(", ")')"

          test "$tag" = 'v0.1.0'
          test "$draft" = 'false'
          test "$prerelease" = 'false'
          test "$zip_count" = '1'
          test "$sum_count" = '1'
          test "$asset_count" = '2'

          rm -rf release-check
          mkdir release-check
          gh release download v0.1.0 --repo "$REPO" --pattern 'SHA256SUMS.txt' --dir release-check
          asset_hash="$(awk '{print $1}' release-check/SHA256SUMS.txt | head -n 1)"

          cat > /tmp/release-record.md <<EOF
          # GitHub Release — 준현 헬퍼 v0.1.0

          Status: PUBLISHED / VERIFIED

          - Tag: \`v0.1.0\`
          - Name: $release_name
          - Published: $published_at
          - Release URL: $release_url
          - Public Windows asset: \`Junhyun-Helper-v0.1.0-win-x64.zip\`
          - SHA-256: \`$asset_hash\`
          - Draft: false
          - Prerelease: false
          - Live assets: $asset_names

          Verification source: live GitHub Release API plus re-downloaded \`SHA256SUMS.txt\`.
          EOF

          current_sha="$(gh api "repos/$REPO/contents/docs/GITHUB_RELEASE_0.1.0.md" --jq '.sha')"
          content_b64="$(base64 -w 0 /tmp/release-record.md)"
          gh api --method PUT "repos/$REPO/contents/docs/GITHUB_RELEASE_0.1.0.md" \
            -f message='Record final public v0.1.0 release verification' \
            -f content="$content_b64" \
            -f sha="$current_sha" >/dev/null
