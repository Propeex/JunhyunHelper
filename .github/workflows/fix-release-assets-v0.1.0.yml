name: Repair Release Assets v0.1.0

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-release-assets-v0.1.0.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  repair-release-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Download validated Windows artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p release-source
          gh run download 31356282143 --repo "$REPO" --name 'JunhyunHelper-win-x64' --dir release-source

          test -f 'release-source/준현 헬퍼.exe'
          test -f 'release-source/FIRST_RUN_KO.txt'
          test -f 'release-source/Assets/tarkov_data.db'

          root_files="$(find release-source -maxdepth 1 -type f -printf '%f\n' | sort)"
          expected_files=$'FIRST_RUN_KO.txt\n준현 헬퍼.exe'
          if [ "$root_files" != "$expected_files" ]; then
            echo 'Unexpected root files:'
            printf '%s\n' "$root_files"
            exit 1
          fi

          root_dirs="$(find release-source -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | sort)"
          if [ "$root_dirs" != 'Assets' ]; then
            echo 'Unexpected root directories:'
            printf '%s\n' "$root_dirs"
            exit 1
          fi

          if find release-source -type f -iname '*.pdb' | grep -q .; then
            echo 'PDB found in validated artifact.'
            exit 1
          fi

      - name: Package stable public asset
        shell: bash
        run: |
          set -euo pipefail
          asset='Junhyun-Helper-v0.1.0-win-x64.zip'
          (
            cd release-source
            zip -r -9 "../$asset" .
          )
          hash="$(sha256sum "$asset" | awk '{print $1}')"
          printf '%s  %s\n' "$hash" "$asset" > SHA256SUMS.txt
          echo "RELEASE_ASSET_SHA256=$hash" >> "$GITHUB_ENV"
          echo "Release asset SHA-256: $hash"

      - name: Upload repaired public assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh release upload v0.1.0 \
            'Junhyun-Helper-v0.1.0-win-x64.zip' \
            'SHA256SUMS.txt' \
            --clobber \
            --repo "$REPO"

      - name: Verify live GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          release_json="$(gh release view v0.1.0 --repo "$REPO" --json url,isDraft,isPrerelease,tagName,name,assets,publishedAt)"

          tag="$(printf '%s' "$release_json" | jq -r '.tagName')"
          draft="$(printf '%s' "$release_json" | jq -r '.isDraft')"
          prerelease="$(printf '%s' "$release_json" | jq -r '.isPrerelease')"
          zip_count="$(printf '%s' "$release_json" | jq '[.assets[] | select(.name == "Junhyun-Helper-v0.1.0-win-x64.zip")] | length')"
          sum_count="$(printf '%s' "$release_json" | jq '[.assets[] | select(.name == "SHA256SUMS.txt")] | length')"
          release_url="$(printf '%s' "$release_json" | jq -r '.url')"
          release_name="$(printf '%s' "$release_json" | jq -r '.name')"
          published_at="$(printf '%s' "$release_json" | jq -r '.publishedAt')"
          asset_names="$(printf '%s' "$release_json" | jq -r '[.assets[].name] | join(", ")')"

          test "$tag" = 'v0.1.0'
          test "$draft" = 'false'
          test "$prerelease" = 'false'
          test "$zip_count" = '1'
          test "$sum_count" = '1'

          rm -rf release-check
          mkdir release-check
          gh release download v0.1.0 --repo "$REPO" --pattern 'SHA256SUMS.txt' --dir release-check
          published_hash="$(awk '{print $1}' release-check/SHA256SUMS.txt | head -n 1)"
          test "$published_hash" = "$RELEASE_ASSET_SHA256"

          cat > /tmp/release-record.md <<EOF
          # GitHub Release — 준현 헬퍼 v0.1.0

          Status: PUBLISHED / VERIFIED

          - Tag: \`v0.1.0\`
          - Name: $release_name
          - Published: $published_at
          - Release URL: $release_url
          - Public Windows asset: \`Junhyun-Helper-v0.1.0-win-x64.zip\`
          - SHA-256: \`$published_hash\`
          - Draft: false
          - Prerelease: false
          - Live assets: $asset_names

          Verification source: live GitHub Release API plus re-downloaded \`SHA256SUMS.txt\`.
          EOF

          current_sha="$(gh api "repos/$REPO/contents/docs/GITHUB_RELEASE_0.1.0.md" --jq '.sha')"
          content_b64="$(base64 -w 0 /tmp/release-record.md)"
          gh api --method PUT "repos/$REPO/contents/docs/GITHUB_RELEASE_0.1.0.md" \
            -f message='Record verified public v0.1.0 release asset' \
            -f content="$content_b64" \
            -f sha="$current_sha" >/dev/null
