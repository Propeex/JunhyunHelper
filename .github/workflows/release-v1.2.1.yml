name: Release v1.2.1
# One-shot exact-source release controller. Remove after public verification.

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-v1.2.1.yml'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 35
    env:
      SOURCE_SHA: 8c0de649f18d7caa4f5669a06511c15e784dfd29
      RELEASE_VERSION: 1.2.1
      RELEASE_TAG: v1.2.1
      EXPECTED_TESTS: '255'
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      JUNHYUNHELPER_MAP_SMOKE: '1'

    steps:
      - name: Checkout exact release source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 1

      - name: Checkout pinned public Map donor
        shell: pwsh
        run: |
          git config --local --unset-all http.https://github.com/.extraheader
          if ($LASTEXITCODE -notin @(0, 5)) { throw 'Could not clear repository-scoped GitHub auth header.' }
          git submodule sync --recursive
          if ($LASTEXITCODE -ne 0) { throw 'Could not synchronize submodule metadata.' }
          git submodule update --init --force --depth=1 --recursive
          if ($LASTEXITCODE -ne 0) { throw 'Could not checkout pinned public Map donor.' }
          $donor = (git -C vendor/Tarkov-Helper rev-parse HEAD).Trim()
          if ($donor -ne 'd933792b6042a51cea38dc44b686a096fe30de67') { throw "Pinned Map donor drifted to $donor." }

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Verify exact source identity and release absence
        shell: pwsh
        run: |
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -ne $env:SOURCE_SHA) { throw "Release source drift: $actual" }

          [xml]$project = Get-Content 'src/JunhyunHelper.Desktop/JunhyunHelper.Desktop.csproj'
          $version = [string]($project.Project.PropertyGroup.Version | Select-Object -First 1)
          if ($version -ne $env:RELEASE_VERSION) { throw "Project version '$version' is not '$env:RELEASE_VERSION'." }

          $firstLine = Get-Content 'packaging/FIRST_RUN_KO.txt' -TotalCount 1
          $expected = "준현 헬퍼 v$env:RELEASE_VERSION — Windows x64"
          if (-not [string]::Equals($firstLine, $expected, [System.StringComparison]::Ordinal)) {
            throw "FIRST_RUN source identity mismatch: '$firstLine'"
          }

          gh release view $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) { throw "Release $env:RELEASE_TAG already exists." }
          $tagLine = git ls-remote --tags origin "refs/tags/$env:RELEASE_TAG"
          if (-not [string]::IsNullOrWhiteSpace($tagLine)) { throw "Tag $env:RELEASE_TAG already exists." }

      - name: Build exact source
        shell: pwsh
        run: |
          dotnet build src/JunhyunHelper.Desktop/JunhyunHelper.Desktop.csproj --configuration Release
          if ($LASTEXITCODE -ne 0) { throw 'Exact-source Release build failed.' }

      - name: Run exactly 255 automated tests
        shell: pwsh
        run: |
          $lines = @(dotnet test tests/JunhyunHelper.Tests/JunhyunHelper.Tests.csproj --configuration Release 2>&1)
          $exitCode = $LASTEXITCODE
          $lines | ForEach-Object { Write-Host $_ }
          if ($exitCode -ne 0) { throw 'Automated tests failed.' }
          $joined = $lines -join "`n"
          $pattern = "Failed:\s+0,\s+Passed:\s+$env:EXPECTED_TESTS,\s+Skipped:\s+0,\s+Total:\s+$env:EXPECTED_TESTS"
          if ($joined -notmatch $pattern) {
            throw "Automated test result is not exactly $env:EXPECTED_TESTS passed, 0 failed, 0 skipped."
          }

      - name: Publish and audit Windows x64 package root
        shell: pwsh
        run: |
          dotnet publish src/JunhyunHelper.Desktop/JunhyunHelper.Desktop.csproj `
            --configuration Release `
            --runtime win-x64 `
            --self-contained true `
            --output artifacts/publish `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true `
            -p:PublishTrimmed=false `
            -p:PublishReadyToRun=false `
            -p:DebugType=None `
            -p:DebugSymbols=false
          if ($LASTEXITCODE -ne 0) { throw 'win-x64 publish failed.' }

          Copy-Item packaging/FIRST_RUN_KO.txt artifacts/publish/FIRST_RUN_KO.txt
          foreach ($file in @('준현 헬퍼.exe', 'FIRST_RUN_KO.txt', 'Assets/tarkov_data.db')) {
            if (-not (Test-Path (Join-Path artifacts/publish $file))) { throw "Missing published file: $file" }
          }

          $exe = (Resolve-Path 'artifacts/publish/준현 헬퍼.exe').Path
          $productVersion = (Get-Item $exe).VersionInfo.ProductVersion
          $expectedProductVersion = "$env:RELEASE_VERSION+$env:SOURCE_SHA"
          if ($productVersion -ne $expectedProductVersion) {
            throw "ProductVersion '$productVersion' does not exactly match '$expectedProductVersion'."
          }

          $firstLine = Get-Content 'artifacts/publish/FIRST_RUN_KO.txt' -TotalCount 1
          if ($firstLine -ne "준현 헬퍼 v$env:RELEASE_VERSION — Windows x64") { throw 'Published FIRST_RUN identity mismatch.' }
          $rootNames = @(Get-ChildItem artifacts/publish | Select-Object -ExpandProperty Name | Sort-Object)
          $expectedRootNames = @('Assets','FIRST_RUN_KO.txt','준현 헬퍼.exe') | Sort-Object
          if (Compare-Object $rootNames $expectedRootNames) { throw 'Release root layout mismatch.' }
          if (@(Get-ChildItem artifacts/publish -Recurse -File -Filter *.pdb).Count -gt 0) { throw 'Release contains PDB files.' }
          if (@(Get-ChildItem artifacts/publish -Recurse -File | Where-Object { $_.Extension -in @('.zip','.7z','.rar') }).Count -gt 0) { throw 'Release contains nested archives.' }

          $forbidden = @(
            'AutoUpdater.NET.dll','Microsoft.Web.WebView2.Core.dll','Microsoft.Web.WebView2.WinForms.dll',
            'Microsoft.Web.WebView2.Wpf.dll','WebView2Loader.dll','Westermo.GraphX.Controls.dll',
            'Westermo.GraphX.Common.dll','QuikGraph.dll')
          foreach ($file in $forbidden) {
            if (Get-ChildItem artifacts/publish -Recurse -File -Filter $file) { throw "Unused dependency leaked into release: $file" }
          }

          Write-Host "EXACT_PRODUCT_VERSION=$productVersion"
          Write-Host "EXACT_EXE_BYTES=$((Get-Item $exe).Length)"

      - name: Smoke exact published EXE
        shell: pwsh
        run: |
          $exe = (Resolve-Path 'artifacts/publish/준현 헬퍼.exe').Path
          $diagnostic = Join-Path $env:TEMP 'junhyun-map-smoke-error.txt'
          $success = Join-Path $env:TEMP 'junhyun-map-smoke-success.txt'
          Remove-Item $diagnostic,$success -Force -ErrorAction SilentlyContinue
          $process = Start-Process -FilePath $exe -WorkingDirectory artifacts/publish -PassThru
          try {
            $deadline = (Get-Date).AddSeconds(75)
            while ((Get-Date) -lt $deadline) {
              $process.Refresh()
              if (Test-Path $diagnostic) { Get-Content $diagnostic | ForEach-Object { Write-Host $_ }; throw 'Exact-source EXE smoke failed.' }
              if (Test-Path $success) { break }
              if ($process.HasExited) { throw "EXE exited early: $($process.ExitCode)" }
              Start-Sleep -Milliseconds 250
            }
            if (-not (Test-Path $success)) { throw 'Exact-source EXE smoke did not complete.' }
            $closed = $false
            for ($attempt = 1; $attempt -le 10; $attempt++) {
              $process.Refresh(); if ($process.HasExited -or $process.CloseMainWindow()) { $closed = $true; break }; Start-Sleep -Milliseconds 500
            }
            if (-not $closed) { throw 'Could not request normal MainWindow close.' }
            $process.Refresh(); if (-not $process.HasExited -and -not $process.WaitForExit(7000)) { throw 'EXE did not exit normally.' }
            if (Test-Path 'artifacts/publish/Logs') { throw 'Portable root was polluted by Logs.' }
          }
          finally { $process.Refresh(); if (-not $process.HasExited) { Stop-Process -Id $process.Id -Force } }

      - name: Create release ZIP checksum and notes
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path artifacts/release -Force | Out-Null
          $zipName = "Junhyun-Helper-v$env:RELEASE_VERSION-win-x64.zip"
          $zipPath = Join-Path (Resolve-Path artifacts/release).Path $zipName
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          [System.IO.Compression.ZipFile]::CreateFromDirectory(
            (Resolve-Path artifacts/publish).Path,
            $zipPath,
            [System.IO.Compression.CompressionLevel]::Optimal,
            $false)

          $hash = (Get-FileHash $zipPath -Algorithm SHA256).Hash.ToLowerInvariant()
          $bytes = [string](Get-Item $zipPath).Length
          "$hash  $zipName" | Set-Content artifacts/release/SHA256SUMS.txt -Encoding utf8NoBOM
          "ZIP_BYTES=$bytes" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "ZIP_SHA256=$hash" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          @'
          # 준현 헬퍼 v1.2.1

          Scanner의 기존 인식 기준을 유지하면서 장시간 안정성, 자원 수명, 캐시 세대 일관성과 캡처 효율을 보강한 PATCH 릴리즈입니다.

          ## Scanner 안정성·정확성 하드닝
          - Tarkov resources.assets의 제목 폰트 탐색을 bounded streaming 방식으로 바꿔 대형 asset 전체를 한 번에 메모리에 올리지 않습니다.
          - 로컬 Bender/Noto 폰트 cache에 source manifest와 실제 폰트 바이너리 generation hash를 연결해 Tarkov 업데이트 후 오래된 렌더 템플릿 재사용을 방지합니다.
          - OCR-guided 및 full-catalog visual template cache를 generation-aware bounded cache로 제한해 장시간 실행 시 메모리 증가를 억제합니다.
          - Mini Scanner inventory/stash 판별 OCR을 동시에 하나만 실행하고 반복 요청은 최신 snapshot으로 합치며, 이전 item의 늦은 결과는 epoch 검증으로 폐기합니다.
          - one-shot 스캔과 profile/GameMode monitor를 직렬화하여 실행 중 설정이 바뀐 경우 이전 Scanner/Test mode나 오래된 context가 뒤늦게 되살아나지 않도록 했습니다.
          - 종료 중 진행 중인 font-aware recognition이 끝나기 전에 Skia/font resource가 Dispose되지 않도록 active-operation lifetime을 보강했습니다.
          - PrintWindow 유효성 검사의 sparse pixel sample을 locked bitmap에서 직접 읽어 1440p/4K 전체 frame의 불필요한 두 번째 managed copy를 제거했습니다.
          - title anchor 진단 점수는 anchor가 존재한다는 이유만으로 1.0으로 승격하지 않고 실제 detector evidence score를 보존합니다.

          ## 유지되는 인식 계약
          - 기존 Windows ko-KR OCR 성공 경로 우선
          - current official Korean item catalog가 identity 권위
          - confidence/top1-top2 margin 완화 없음
          - ambiguous/low-confidence 결과는 미표시
          - scan-time network 없음
          - game memory / DLL injection / packet interception 없음

          ## 호환성
          - Game Content schema v7 유지
          - readable Content schema v3-v7 유지
          - user.db schema v1 유지, migration 없음
          - Scanner 표시 설정 schema v3 유지
          - Scanner catalog cache v1/v2 readable, v2 written
          - v1.2.0에서 필수 Game Content 업데이트 없음

          ## 검증
          - 255/255 automated tests
          - win-x64 self-contained single-file publish
          - one-shot mode restoration 및 title-anchor/magnifier contract actual EXE smoke
          - Product UI / Scanner / Mini Scanner / Main Map / Factory / MiniMap smoke
          - Draft/Public 다운로드본 SHA-256, ProductVersion, FIRST_RUN, root layout, EXE smoke 재검증
          '@ | Set-Content artifacts/release/RELEASE_NOTES.md -Encoding utf8NoBOM

          Write-Host "ZIP_BYTES=$bytes"
          Write-Host "ZIP_SHA256=$hash"

      - name: Create Draft GitHub Release
        shell: pwsh
        run: |
          $zip = "artifacts/release/Junhyun-Helper-v$env:RELEASE_VERSION-win-x64.zip"
          gh release create $env:RELEASE_TAG `
            $zip `
            artifacts/release/SHA256SUMS.txt `
            --repo $env:GITHUB_REPOSITORY `
            --target $env:SOURCE_SHA `
            --title "준현 헬퍼 v$env:RELEASE_VERSION" `
            --notes-file artifacts/release/RELEASE_NOTES.md `
            --draft
          if ($LASTEXITCODE -ne 0) { throw 'Draft release creation failed.' }

      - name: Re-download and verify Draft assets
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path artifacts/draft-download -Force | Out-Null
          gh release download $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --dir artifacts/draft-download --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Draft download failed.' }

          $zipName = "Junhyun-Helper-v$env:RELEASE_VERSION-win-x64.zip"
          $zip = Join-Path artifacts/draft-download $zipName
          $sum = Join-Path artifacts/draft-download 'SHA256SUMS.txt'
          $actualBytes = [string](Get-Item $zip).Length
          $actualHash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualBytes -ne $env:ZIP_BYTES) { throw "Draft ZIP size drift: $actualBytes" }
          if ($actualHash -ne $env:ZIP_SHA256) { throw "Draft ZIP hash drift: $actualHash" }
          $expectedLine = Get-Content $sum | Where-Object { $_ -match [Regex]::Escape($zipName) } | Select-Object -First 1
          if ($expectedLine -notmatch '^([0-9a-fA-F]{64})\s{2,}(.+)$') { throw 'Draft checksum format invalid.' }
          if ($Matches[1].ToLowerInvariant() -ne $env:ZIP_SHA256) { throw 'Draft SHA256SUMS mismatch.' }

          Expand-Archive $zip artifacts/draft-extracted -Force
          $exe = (Resolve-Path 'artifacts/draft-extracted/준현 헬퍼.exe').Path
          $productVersion = (Get-Item $exe).VersionInfo.ProductVersion
          if ($productVersion -ne "$env:RELEASE_VERSION+$env:SOURCE_SHA") { throw "Draft ProductVersion mismatch: $productVersion" }
          $firstLine = Get-Content 'artifacts/draft-extracted/FIRST_RUN_KO.txt' -TotalCount 1
          if ($firstLine -ne "준현 헬퍼 v$env:RELEASE_VERSION — Windows x64") { throw 'Draft FIRST_RUN mismatch.' }
          $rootNames = @(Get-ChildItem artifacts/draft-extracted | Select-Object -ExpandProperty Name | Sort-Object)
          $expectedNames = @('Assets','FIRST_RUN_KO.txt','준현 헬퍼.exe') | Sort-Object
          if (Compare-Object $rootNames $expectedNames) { throw 'Draft root layout mismatch.' }

      - name: Smoke Draft-downloaded EXE
        shell: pwsh
        run: |
          $exe = (Resolve-Path 'artifacts/draft-extracted/준현 헬퍼.exe').Path
          $diagnostic = Join-Path $env:TEMP 'junhyun-map-smoke-error.txt'
          $success = Join-Path $env:TEMP 'junhyun-map-smoke-success.txt'
          Remove-Item $diagnostic,$success -Force -ErrorAction SilentlyContinue
          $process = Start-Process -FilePath $exe -WorkingDirectory artifacts/draft-extracted -PassThru
          try {
            $deadline = (Get-Date).AddSeconds(75)
            while ((Get-Date) -lt $deadline) {
              $process.Refresh()
              if (Test-Path $diagnostic) { Get-Content $diagnostic | ForEach-Object { Write-Host $_ }; throw 'Draft-downloaded EXE smoke failed.' }
              if (Test-Path $success) { break }
              if ($process.HasExited) { throw "Draft EXE exited early: $($process.ExitCode)" }
              Start-Sleep -Milliseconds 250
            }
            if (-not (Test-Path $success)) { throw 'Draft EXE smoke did not complete.' }
            $closed = $false
            for ($attempt = 1; $attempt -le 10; $attempt++) {
              $process.Refresh(); if ($process.HasExited -or $process.CloseMainWindow()) { $closed = $true; break }; Start-Sleep -Milliseconds 500
            }
            if (-not $closed) { throw 'Draft EXE normal close could not be requested.' }
            $process.Refresh(); if (-not $process.HasExited -and -not $process.WaitForExit(7000)) { throw 'Draft EXE did not exit normally.' }
          }
          finally { $process.Refresh(); if (-not $process.HasExited) { Stop-Process -Id $process.Id -Force } }

      - name: Publish release and verify public latest plus exact tag
        shell: pwsh
        run: |
          gh release edit $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --draft=false --latest
          if ($LASTEXITCODE -ne 0) { throw 'Could not publish release.' }

          $release = gh api "repos/$env:GITHUB_REPOSITORY/releases/tags/$env:RELEASE_TAG" | ConvertFrom-Json
          if ([bool]$release.draft -or [bool]$release.prerelease) { throw 'Release is still draft/prerelease.' }
          if ([string]$release.target_commitish -ne $env:SOURCE_SHA) { throw 'Public target_commitish drifted.' }
          $latestTag = (gh api "repos/$env:GITHUB_REPOSITORY/releases/latest" --jq '.tag_name').Trim()
          if ($latestTag -ne $env:RELEASE_TAG) { throw "Latest release is $latestTag." }

          $ref = gh api "repos/$env:GITHUB_REPOSITORY/git/ref/tags/$env:RELEASE_TAG" | ConvertFrom-Json
          $tagSha = [string]$ref.object.sha
          if ([string]$ref.object.type -eq 'tag') {
            $tagObject = gh api "repos/$env:GITHUB_REPOSITORY/git/tags/$tagSha" | ConvertFrom-Json
            $tagSha = [string]$tagObject.object.sha
          }
          if ($tagSha -ne $env:SOURCE_SHA) { throw "Public tag points to $tagSha." }
          Write-Host "PUBLIC_TAG_SHA=$tagSha"

      - name: Re-download and verify Public assets
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path artifacts/public-download -Force | Out-Null
          gh release download $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --dir artifacts/public-download --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Public release download failed.' }

          $zipName = "Junhyun-Helper-v$env:RELEASE_VERSION-win-x64.zip"
          $zip = Join-Path artifacts/public-download $zipName
          $sum = Join-Path artifacts/public-download 'SHA256SUMS.txt'
          $actualBytes = [string](Get-Item $zip).Length
          $actualHash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualBytes -ne $env:ZIP_BYTES) { throw "Public ZIP size drift: $actualBytes" }
          if ($actualHash -ne $env:ZIP_SHA256) { throw "Public ZIP hash drift: $actualHash" }
          $expectedLine = Get-Content $sum | Where-Object { $_ -match [Regex]::Escape($zipName) } | Select-Object -First 1
          if ($expectedLine -notmatch '^([0-9a-fA-F]{64})\s{2,}(.+)$') { throw 'Public checksum format invalid.' }
          if ($Matches[1].ToLowerInvariant() -ne $env:ZIP_SHA256) { throw 'Public SHA256SUMS mismatch.' }

          Expand-Archive $zip artifacts/public-extracted -Force
          $exe = (Resolve-Path 'artifacts/public-extracted/준현 헬퍼.exe').Path
          $productVersion = (Get-Item $exe).VersionInfo.ProductVersion
          if ($productVersion -ne "$env:RELEASE_VERSION+$env:SOURCE_SHA") { throw "Public ProductVersion mismatch: $productVersion" }
          $firstLine = Get-Content 'artifacts/public-extracted/FIRST_RUN_KO.txt' -TotalCount 1
          if ($firstLine -ne "준현 헬퍼 v$env:RELEASE_VERSION — Windows x64") { throw 'Public FIRST_RUN mismatch.' }
          $rootNames = @(Get-ChildItem artifacts/public-extracted | Select-Object -ExpandProperty Name | Sort-Object)
          $expectedNames = @('Assets','FIRST_RUN_KO.txt','준현 헬퍼.exe') | Sort-Object
          if (Compare-Object $rootNames $expectedNames) { throw 'Public root layout mismatch.' }
          Write-Host "PUBLIC_ZIP_BYTES=$actualBytes"
          Write-Host "PUBLIC_ZIP_SHA256=$actualHash"
          Write-Host "PUBLIC_PRODUCT_VERSION=$productVersion"

      - name: Smoke Public-downloaded EXE
        shell: pwsh
        run: |
          $exe = (Resolve-Path 'artifacts/public-extracted/준현 헬퍼.exe').Path
          $diagnostic = Join-Path $env:TEMP 'junhyun-map-smoke-error.txt'
          $success = Join-Path $env:TEMP 'junhyun-map-smoke-success.txt'
          Remove-Item $diagnostic,$success -Force -ErrorAction SilentlyContinue
          $process = Start-Process -FilePath $exe -WorkingDirectory artifacts/public-extracted -PassThru
          try {
            $deadline = (Get-Date).AddSeconds(75)
            while ((Get-Date) -lt $deadline) {
              $process.Refresh()
              if (Test-Path $diagnostic) { Get-Content $diagnostic | ForEach-Object { Write-Host $_ }; throw 'Public-downloaded EXE smoke failed.' }
              if (Test-Path $success) { break }
              if ($process.HasExited) { throw "Public EXE exited early: $($process.ExitCode)" }
              Start-Sleep -Milliseconds 250
            }
            if (-not (Test-Path $success)) { throw 'Public EXE smoke did not complete.' }
            $closed = $false
            for ($attempt = 1; $attempt -le 10; $attempt++) {
              $process.Refresh(); if ($process.HasExited -or $process.CloseMainWindow()) { $closed = $true; break }; Start-Sleep -Milliseconds 500
            }
            if (-not $closed) { throw 'Public EXE normal close could not be requested.' }
            $process.Refresh(); if (-not $process.HasExited -and -not $process.WaitForExit(7000)) { throw 'Public EXE did not exit normally.' }
          }
          finally { $process.Refresh(); if (-not $process.HasExited) { Stop-Process -Id $process.Id -Force } }

      - name: Upload release verification evidence
        uses: actions/upload-artifact@v4
        with:
          name: v1.2.1-release-verification
          path: |
            artifacts/release/SHA256SUMS.txt
            artifacts/release/RELEASE_NOTES.md
          if-no-files-found: error
          retention-days: 30

      - name: Publish workflow status to main
        if: always()
        shell: pwsh
        env:
          RELEASE_JOB_STATUS: ${{ job.status }}
        run: |
          $status = [ordered]@{
            version = $env:RELEASE_VERSION
            tag = $env:RELEASE_TAG
            sourceSha = $env:SOURCE_SHA
            workflowRunId = [string]$env:GITHUB_RUN_ID
            workflowStatus = $env:RELEASE_JOB_STATUS
            zipBytes = $env:ZIP_BYTES
            zipSha256 = $env:ZIP_SHA256
            updatedAtUtc = [DateTimeOffset]::UtcNow.ToString('O')
          } | ConvertTo-Json
          $encoded = [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes($status))
          $path = 'docs/.release-v1.2.1-status.json'
          $apiPath = "repos/$env:GITHUB_REPOSITORY/contents/$path"
          $existingSha = $null
          gh api $apiPath --jq '.sha' 2>$null | ForEach-Object { $existingSha = $_.Trim() }
          $args = @('-X','PUT',$apiPath,'-f','message=Record v1.2.1 release workflow result','-f',"content=$encoded",'-f','branch=main')
          if (-not [string]::IsNullOrWhiteSpace($existingSha)) { $args += @('-f',"sha=$existingSha") }
          & gh api @args
          if ($LASTEXITCODE -ne 0) { Write-Warning 'Could not publish release workflow status.' }
