name: Verify public v1.1.5

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-public-v1.1.5.yml'

permissions:
  contents: write

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 12
    env:
      SOURCE_SHA: 3541bab6536ff91a00f394c4f7b03d5cbf112746
      RELEASE_VERSION: 1.1.5
      RELEASE_TAG: v1.1.5
      EXPECTED_ZIP_BYTES: '80269429'
      EXPECTED_ZIP_SHA256: dc31177ae1bd4d152453a010dffe6cbb1e6c1d2a4a7e2eb82fb7444fa99c0748
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      JUNHYUNHELPER_MAP_SMOKE: '1'

    steps:
      - name: Checkout exact public source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 1

      - name: Verify public release metadata and exact tag
        shell: pwsh
        run: |
          if ((git rev-parse HEAD).Trim() -ne $env:SOURCE_SHA) { throw 'Exact public source checkout failed.' }

          $release = gh api "repos/$env:GITHUB_REPOSITORY/releases/tags/$env:RELEASE_TAG" | ConvertFrom-Json
          if ([bool]$release.draft -or [bool]$release.prerelease) { throw 'Public release is draft or prerelease.' }
          if ([string]$release.target_commitish -ne $env:SOURCE_SHA) { throw 'Public target_commitish mismatch.' }

          $latestTag = (gh api "repos/$env:GITHUB_REPOSITORY/releases/latest" --jq '.tag_name').Trim()
          if ($latestTag -ne $env:RELEASE_TAG) { throw "Latest release mismatch: $latestTag" }

          $ref = gh api "repos/$env:GITHUB_REPOSITORY/git/ref/tags/$env:RELEASE_TAG" | ConvertFrom-Json
          $tagSha = [string]$ref.object.sha
          if ([string]$ref.object.type -eq 'tag') {
            $tagObject = gh api "repos/$env:GITHUB_REPOSITORY/git/tags/$tagSha" | ConvertFrom-Json
            $tagSha = [string]$tagObject.object.sha
          }
          if ($tagSha -ne $env:SOURCE_SHA) { throw "Exact public tag mismatch: $tagSha" }

          Write-Host "VERIFY_RELEASE_ID=$($release.id)"
          Write-Host "VERIFY_PUBLISHED_AT=$($release.published_at)"
          Write-Host "VERIFY_TAG_SHA=$tagSha"

      - name: Download and independently verify public package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path artifacts/public -Force | Out-Null
          gh release download $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --dir artifacts/public --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Independent public download failed.' }

          $zipName = "Junhyun-Helper-v$env:RELEASE_VERSION-win-x64.zip"
          $zip = Join-Path artifacts/public $zipName
          $sum = Join-Path artifacts/public 'SHA256SUMS.txt'
          if (-not (Test-Path $zip) -or -not (Test-Path $sum)) { throw 'Public release assets are incomplete.' }

          $bytes = [string](Get-Item $zip).Length
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($bytes -ne $env:EXPECTED_ZIP_BYTES) { throw "ZIP byte mismatch: $bytes" }
          if ($hash -ne $env:EXPECTED_ZIP_SHA256) { throw "ZIP SHA mismatch: $hash" }

          $sumLine = Get-Content $sum | Where-Object { $_ -match [Regex]::Escape($zipName) } | Select-Object -First 1
          if ($sumLine -notmatch '^([0-9a-fA-F]{64})\s{2,}(.+)$') { throw 'SHA256SUMS format invalid.' }
          if ($Matches[1].ToLowerInvariant() -ne $hash) { throw 'SHA256SUMS does not match downloaded ZIP.' }

          Expand-Archive $zip artifacts/extracted -Force
          $rootNames = @(Get-ChildItem artifacts/extracted | Select-Object -ExpandProperty Name | Sort-Object)
          $expectedNames = @('Assets','FIRST_RUN_KO.txt','준현 헬퍼.exe') | Sort-Object
          if (Compare-Object $rootNames $expectedNames) { throw 'Public ZIP root layout mismatch.' }

          $exe = (Resolve-Path 'artifacts/extracted/준현 헬퍼.exe').Path
          $productVersion = (Get-Item $exe).VersionInfo.ProductVersion
          $expectedProductVersion = "$env:RELEASE_VERSION+$env:SOURCE_SHA"
          if ($productVersion -ne $expectedProductVersion) { throw "ProductVersion mismatch: $productVersion" }

          $firstLine = Get-Content 'artifacts/extracted/FIRST_RUN_KO.txt' -TotalCount 1
          $expectedFirstLine = "준현 헬퍼 v$env:RELEASE_VERSION — Windows x64"
          if (-not [string]::Equals($firstLine, $expectedFirstLine, [System.StringComparison]::Ordinal)) { throw 'FIRST_RUN identity mismatch.' }

          Write-Host "VERIFY_ZIP_BYTES=$bytes"
          Write-Host "VERIFY_ZIP_SHA256=$hash"
          Write-Host "VERIFY_PRODUCT_VERSION=$productVersion"

      - name: Smoke independently downloaded public EXE
        shell: pwsh
        run: |
          $exe = (Resolve-Path 'artifacts/extracted/준현 헬퍼.exe').Path
          $diagnostic = Join-Path $env:TEMP 'junhyun-map-smoke-error.txt'
          $success = Join-Path $env:TEMP 'junhyun-map-smoke-success.txt'
          Remove-Item $diagnostic,$success -Force -ErrorAction SilentlyContinue
          $process = Start-Process -FilePath $exe -WorkingDirectory artifacts/extracted -PassThru
          try {
            $deadline = (Get-Date).AddSeconds(75)
            while ((Get-Date) -lt $deadline) {
              $process.Refresh()
              if (Test-Path $diagnostic) { Get-Content $diagnostic | ForEach-Object { Write-Host $_ }; throw 'Independent public EXE smoke failed.' }
              if (Test-Path $success) { break }
              if ($process.HasExited) { throw "Public EXE exited early: $($process.ExitCode)" }
              Start-Sleep -Milliseconds 250
            }
            if (-not (Test-Path $success)) { throw 'Independent public EXE smoke did not complete.' }
            $closed = $false
            for ($attempt = 1; $attempt -le 10; $attempt++) {
              $process.Refresh(); if ($process.HasExited -or $process.CloseMainWindow()) { $closed = $true; break }; Start-Sleep -Milliseconds 500
            }
            if (-not $closed) { throw 'Independent public EXE normal close could not be requested.' }
            $process.Refresh(); if (-not $process.HasExited -and -not $process.WaitForExit(7000)) { throw 'Independent public EXE did not exit normally.' }
            if (Test-Path 'artifacts/extracted/Logs') { throw 'Independent public package root was polluted by logs.' }
          }
          finally { $process.Refresh(); if (-not $process.HasExited) { Stop-Process -Id $process.Id -Force } }

      - name: Publish independent verification status
        if: always()
        shell: pwsh
        env:
          VERIFY_JOB_STATUS: ${{ job.status }}
        run: |
          $status = [ordered]@{
            version = $env:RELEASE_VERSION
            tag = $env:RELEASE_TAG
            sourceSha = $env:SOURCE_SHA
            workflowRunId = [string]$env:GITHUB_RUN_ID
            workflowStatus = $env:VERIFY_JOB_STATUS
            zipBytes = $env:EXPECTED_ZIP_BYTES
            zipSha256 = $env:EXPECTED_ZIP_SHA256
            updatedAtUtc = [DateTimeOffset]::UtcNow.ToString('O')
          } | ConvertTo-Json
          $encoded = [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes($status))
          $path = 'docs/.verify-v1.1.5-status.json'
          $apiPath = "repos/$env:GITHUB_REPOSITORY/contents/$path"
          $existingSha = $null
          gh api $apiPath --jq '.sha' 2>$null | ForEach-Object { $existingSha = $_.Trim() }
          $args = @('-X','PUT',$apiPath,'-f',"message=Record independent v1.1.5 verification",'-f',"content=$encoded",'-f','branch=main')
          if (-not [string]::IsNullOrWhiteSpace($existingSha)) { $args += @('-f',"sha=$existingSha") }
          & gh api @args
          if ($LASTEXITCODE -ne 0) { Write-Warning 'Could not publish independent verification status.' }
