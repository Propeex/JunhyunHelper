name: Apply v1.3.4 Scanner hardening integration

on:
  push:
    branches: [feature/scanner-live-hardening-v1.3.4]
    paths:
      - '.github/workflows/apply-v1.3.4-scanner-hardening.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/scanner-live-hardening-v1.3.4
          fetch-depth: 0

      - name: Apply integration patches
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_exact(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'exact block not found: {path}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          def replace_between(path, start, end, replacement):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              a = text.find(start)
              b = text.find(end, a + len(start))
              if a < 0 or b < 0:
                  raise SystemExit(f'markers not found: {path}: {start!r} -> {end!r}')
              p.write_text(text[:a] + replacement + text[b:], encoding='utf-8')

          # Catalog: ordinary sanitation/matching first; if it fails, one unknown embedded
          # glyph may be resolved only by the strict whole-catalog wildcard path.
          replace_exact(
              'src/JunhyunHelper.Infrastructure/Scanner/ScannerCatalogService.cs',
              '''        lock (_dataGate)\n            return _matcher.Resolve(assessment.FilteredText);\n''',
              '''        lock (_dataGate)\n        {\n            var ordinary = _matcher.Resolve(assessment.FilteredText);\n            if (ordinary.Success || !assessment.HasSingleUnknownGlyphPattern)\n                return ordinary;\n\n            var unknownGlyph = _matcher.ResolveSingleUnknownGlyph(assessment.UnknownGlyphPatternText);\n            return unknownGlyph.Success ? unknownGlyph : ordinary;\n        }\n''')

          # Header close: real red-control template is now primary evidence, geometry is
          # corroboration. A generic red component cannot win on position alone.
          replace_between(
              'src/JunhyunHelper.Desktop/Scanner/ScannerInspectHeaderLock.cs',
              '    private static ScannerDetectedRegion FindRedClose(',
              '    private static HeaderFrame FindHeaderFrame(',
              '''    private static ScannerDetectedRegion FindRedClose(\n        ReadOnlySpan<byte> bgra,\n        int width,\n        int height,\n        int stride,\n        ScannerDetectedRegion panel)\n    {\n        var left = Math.Clamp(panel.X + (int)Math.Round(panel.Width * 0.72), 0, width - 1);\n        var top = Math.Clamp(panel.Y - Math.Max(10, panel.Height / 65), 0, height - 1);\n        var right = Math.Clamp(panel.X + panel.Width + Math.Max(8, panel.Width / 80), left, width - 1);\n        var bottom = Math.Clamp(panel.Y + Math.Max(28, (int)Math.Round(panel.Height * 0.10)), top, height - 1);\n        var visited = new HashSet<int>();\n        var best = default(ScannerDetectedRegion);\n        var bestScore = double.MinValue;\n\n        for (var y = top; y <= bottom; y++)\n        for (var x = left; x <= right; x++)\n        {\n            var key = y * width + x;\n            if (visited.Contains(key) || !IsRed(bgra, stride, x, y))\n                continue;\n\n            var component = FloodRed(\n                bgra, width, height, stride,\n                x, y, left, top, right, bottom, visited);\n            if (component.Area < 16 ||\n                component.Width is < 7 or > 55 ||\n                component.Height is < 5 or > 36)\n            {\n                continue;\n            }\n\n            var aspect = component.Width / (double)Math.Max(1, component.Height);\n            if (aspect is < 0.70 or > 2.25)\n                continue;\n\n            var template = ScannerHeaderIconTemplateMatcher.CloseScore(\n                bgra, stride, component.X, component.Y, component.Width, component.Height);\n            if (template < 0.46)\n                continue;\n\n            var expectedRight = panel.X + panel.Width;\n            var rightScore = Math.Max(\n                0,\n                1.0 - Math.Abs(expectedRight - (component.X + component.Width)) /\n                Math.Max(16.0, panel.Width * 0.08));\n            var topScore = Math.Max(\n                0,\n                1.0 - Math.Abs(component.Y - panel.Y) /\n                Math.Max(10.0, panel.Height * 0.065));\n            var compact = Math.Min(component.Width, component.Height) /\n                          (double)Math.Max(component.Width, component.Height);\n            var fill = Math.Clamp(\n                component.Area / (double)Math.Max(1, component.Width * component.Height),\n                0,\n                1);\n            var score =\n                template * 0.44 +\n                rightScore * 0.31 +\n                topScore * 0.17 +\n                compact * 0.04 +\n                fill * 0.04;\n            if (score <= bestScore)\n                continue;\n\n            bestScore = score;\n            best = new ScannerDetectedRegion(\n                component.X,\n                component.Y,\n                component.Width,\n                component.Height,\n                Math.Clamp(score, 0, 1));\n        }\n\n        return bestScore >= 0.60 ? best : default;\n    }\n\n''')

          # Magnifier: no connected-component competition with title glyphs. Search only
          # the measured icon lane and compare normalized patches against the procedural
          # magnifier template at a small scale/offset family.
          replace_between(
              'src/JunhyunHelper.Desktop/Scanner/ScannerInspectHeaderLock.cs',
              '    private static ScannerDetectedRegion FindMagnifierCore(',
              '    private static double MeasureDarkTitleField(',
              '''    private static ScannerDetectedRegion FindMagnifierCore(\n        ReadOnlySpan<byte> bgra,\n        int width,\n        int height,\n        int stride,\n        HeaderFrame frame,\n        ScannerDetectedRegion close)\n    {\n        var scale = Math.Clamp(close.Height / 17.0, 0.55, 1.85);\n        var expectedX = frame.Left + (int)Math.Round(12.0 * scale);\n        var expectedY = frame.Top + (int)Math.Round(7.0 * scale);\n        var expectedSize = Math.Clamp((int)Math.Round(13.0 * scale), 7, 24);\n        var offsetRadius = Math.Max(2, (int)Math.Ceiling(2.5 * scale));\n        var sizeRadius = Math.Max(1, (int)Math.Ceiling(1.5 * scale));\n\n        var best = default(ScannerDetectedRegion);\n        var bestScore = double.MinValue;\n        for (var size = Math.Max(7, expectedSize - sizeRadius);\n             size <= Math.Min(24, expectedSize + sizeRadius);\n             size++)\n        {\n            for (var dy = -offsetRadius; dy <= offsetRadius; dy++)\n            for (var dx = -offsetRadius; dx <= offsetRadius; dx++)\n            {\n                var x = expectedX + dx;\n                var y = expectedY + dy;\n                if (x < 0 || y < 0 || x + size > width || y + size > height)\n                    continue;\n\n                // Hard lane bound: no title glyph to the right is allowed to enter the\n                // magnifier candidate pool even if it looks ring-like.\n                var laneRight = frame.Left + (int)Math.Ceiling(29.0 * scale);\n                if (x < frame.Left + Math.Max(3, (int)Math.Floor(5.0 * scale)) ||\n                    x + size > laneRight)\n                {\n                    continue;\n                }\n\n                var template = ScannerHeaderIconTemplateMatcher.MagnifierScore(\n                    bgra, stride, x, y, size);\n                if (template < 0.54)\n                    continue;\n\n                var xScore = Math.Max(0, 1.0 - Math.Abs(x - expectedX) / Math.Max(3.0, 3.2 * scale));\n                var yScore = Math.Max(0, 1.0 - Math.Abs(y - expectedY) / Math.Max(3.0, 3.0 * scale));\n                var sizeScore = Math.Max(0, 1.0 - Math.Abs(size - expectedSize) / Math.Max(2.0, 2.5 * scale));\n                var location = xScore * 0.48 + yScore * 0.34 + sizeScore * 0.18;\n                var score = template * 0.72 + location * 0.28;\n                if (score <= bestScore)\n                    continue;\n\n                bestScore = score;\n                best = new ScannerDetectedRegion(x, y, size, size, Math.Clamp(score, 0, 1));\n            }\n        }\n\n        return bestScore >= 0.66 ? best : default;\n    }\n\n''')

          vision = 'src/JunhyunHelper.Desktop/Scanner/ScannerLab38WindowsVision.cs'
          # Only fully locked headers become OCR candidates. This also prevents a wrong
          # structural candidate from becoming the green diagnostic selection merely by
          # having a higher raw geometry score.
          replace_exact(
              vision,
              '''            var anchors = ScannerTitleAnchorRefiner.Refine(\n                data.Pixels, bitmap.Width, bitmap.Height, data.Stride, candidate);\n            var title = anchors.Title;\n''',
              '''            var anchors = ScannerTitleAnchorRefiner.Refine(\n                data.Pixels, bitmap.Width, bitmap.Height, data.Stride, candidate);\n            if (anchors.Reason != "HEADER_FRAME_LOCKED" ||\n                anchors.Score < 0.68 ||\n                anchors.Magnifier.Width <= 0 ||\n                anchors.CloseButton.Width <= 0)\n            {\n                continue;\n            }\n\n            var lockedWindow = RefineLockedWindow(\n                candidate.Window, anchors, bitmap.Width, bitmap.Height);\n            var title = anchors.Title;\n''')
          replace_exact(
              vision,
              '''            var geometrySignature = $"{sourceKey}:{Quantize(candidate.Window.X)}:{Quantize(candidate.Window.Y)}:{Quantize(candidate.Window.Width)}:{Quantize(candidate.Window.Height)}";\n            var titleSignature = $"{HashPixels(titlePixels):X16}";\n            var windowBounds = ToScreenRect(candidate.Window, screenLeft, screenTop);\n''',
              '''            var geometrySignature = $"{sourceKey}:{Quantize(lockedWindow.X)}:{Quantize(lockedWindow.Y)}:{Quantize(lockedWindow.Width)}:{Quantize(lockedWindow.Height)}";\n            var titleSignature = $"{HashPixels(titlePixels):X16}";\n            var windowBounds = ToScreenRect(lockedWindow, screenLeft, screenTop);\n''')

          insertion = '''    private static ScannerDetectedRegion RefineLockedWindow(\n        ScannerDetectedRegion structural,\n        ScannerTitleAnchorRefinement anchors,\n        int width,\n        int height)\n    {\n        var scale = Math.Clamp(anchors.CloseButton.Height / 17.0, 0.55, 1.85);\n        var left = anchors.Magnifier.X - (int)Math.Round(12.0 * scale);\n        var top = anchors.CloseButton.Y - (int)Math.Round(5.0 * scale);\n        var right = anchors.CloseButton.X + anchors.CloseButton.Width + (int)Math.Round(4.0 * scale);\n\n        left = Math.Clamp(left, 0, width - 2);\n        top = Math.Clamp(top, 0, height - 2);\n        right = Math.Clamp(right, left + 2, width);\n\n        // Header lock gives authoritative top/left/right. Preserve the structural bottom\n        // only because inspect-window height legitimately varies with item/stat panels.\n        var structuralBottom = Math.Clamp(structural.Y + structural.Height, top + 80, height);\n        return new ScannerDetectedRegion(\n            left,\n            top,\n            right - left,\n            structuralBottom - top,\n            structural.Score);\n    }\n\n'''
          p = Path(vision)
          text = p.read_text(encoding='utf-8')
          marker = '    private static void PublishDebugCaptureIfNeeded('
          if marker not in text:
              raise SystemExit('vision insertion marker not found')
          text = text.replace(marker, insertion + marker, 1)
          p.write_text(text, encoding='utf-8')

          # Product smoke: exported diagnostic bitmap must visibly contain all four
          # overlay categories. This verifies the same rendering helper used by Save.
          ui = 'src/JunhyunHelper.Desktop/MainWindow.ProductUiLayoutSmoke.cs'
          replace_exact(
              ui,
              '''        if (ScannerDiagnosticLog.GetRecentActivities().Count != 0 ||\n            File.Exists(ScannerDiagnosticLog.Path) ||\n            File.Exists(ScannerDiagnosticLog.Path + ".1"))\n        {\n            throw new InvalidOperationException("Scanner log clear button did not remove both activity history and log files.");\n        }\n    }\n\n''',
              '''        if (ScannerDiagnosticLog.GetRecentActivities().Count != 0 ||\n            File.Exists(ScannerDiagnosticLog.Path) ||\n            File.Exists(ScannerDiagnosticLog.Path + ".1"))\n        {\n            throw new InvalidOperationException("Scanner log clear button did not remove both activity history and log files.");\n        }\n\n        VerifyScannerDiagnosticExportOverlay();\n    }\n\n    private static void VerifyScannerDiagnosticExportOverlay()\n    {\n        const int width = 180;\n        const int height = 120;\n        const int stride = width * 4;\n        var raw = new byte[stride * height];\n        for (var offset = 3; offset < raw.Length; offset += 4)\n            raw[offset] = 255;\n        var image = System.Windows.Media.Imaging.BitmapSource.Create(\n            width, height, 96, 96, PixelFormats.Bgra32, null, raw, stride);\n        image.Freeze();\n\n        var frame = new ScannerRecognitionDebugFrame(\n            image, 0, 0, "ui-smoke",\n            new Rect(10, 10, 150, 90),\n            new Rect(35, 28, 95, 22),\n            new Rect(18, 28, 13, 13),\n            new Rect(138, 24, 20, 16),\n            0.9, "STRUCTURE_MATCH", 0.9, "HEADER_FRAME_LOCKED");\n        var rendered = ScannerRecognitionDebugWindow.RenderDiagnosticBitmap(frame);\n        var pixels = new byte[stride * height];\n        rendered.CopyPixels(pixels, stride, 0);\n\n        (byte B, byte G, byte R) Pixel(int x, int y)\n        {\n            var offset = y * stride + x * 4;\n            return (pixels[offset], pixels[offset + 1], pixels[offset + 2]);\n        }\n\n        var green = Pixel(40, 10);\n        var blue = Pixel(70, 28);\n        var gold = Pixel(24, 28);\n        var red = Pixel(148, 24);\n        if (!(green.G > green.R + 80 && green.G > green.B + 80) ||\n            !(blue.B > blue.R + 80) ||\n            !(gold.R > gold.B + 100 && gold.G > gold.B + 100) ||\n            !(red.R > red.G + 80 && red.R > red.B + 80))\n        {\n            throw new InvalidOperationException(\n                $"Scanner diagnostic PNG overlay colors were not rendered: " +\n                $"green={green}, blue={blue}, gold={gold}, red={red}.");\n        }\n    }\n\n''')
          PY

      - name: Commit integration
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/JunhyunHelper.Infrastructure/Scanner/ScannerCatalogService.cs \
                  src/JunhyunHelper.Desktop/Scanner/ScannerInspectHeaderLock.cs \
                  src/JunhyunHelper.Desktop/Scanner/ScannerLab38WindowsVision.cs \
                  src/JunhyunHelper.Desktop/MainWindow.ProductUiLayoutSmoke.cs
          git diff --cached --quiet && { echo 'No integration changes'; exit 1; }
          git commit -m 'fix(scanner): integrate template anchors and safe OCR recovery'
          git push origin HEAD:feature/scanner-live-hardening-v1.3.4
