name: Finalize v1.3.1 public verification

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/finalize-v1.3.1.yml'

permissions:
  contents: write

env:
  SOURCE_SHA: 028bfb600f4662962a0daac1dad04b570e018275
  RELEASE_VERSION: 1.3.1
  RELEASE_TAG: v1.3.1
  ASSET_NAME: Junhyun-Helper-v1.3.1-win-x64.zip
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  JUNHYUNHELPER_MAP_SMOKE: '1'

jobs:
  verify-public:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout main for evidence commit
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Verify public release latest and exact tag source
        shell: pwsh
        run: |
          $release = gh api "repos/$env:GITHUB_REPOSITORY/releases/tags/$env:RELEASE_TAG" | ConvertFrom-Json
          if ([bool]$release.draft -or [bool]$release.prerelease) { throw 'v1.3.1 is not a normal public release.' }
          if ([string]$release.target_commitish -ne $env:SOURCE_SHA) { throw "target_commitish drifted: $($release.target_commitish)" }
          $latest = (gh api "repos/$env:GITHUB_REPOSITORY/releases/latest" --jq '.tag_name').Trim()
          if ($latest -ne $env:RELEASE_TAG) { throw "Latest release is '$latest', not '$env:RELEASE_TAG'." }

          $ref = gh api "repos/$env:GITHUB_REPOSITORY/git/ref/tags/$env:RELEASE_TAG" | ConvertFrom-Json
          $tagSha = [string]$ref.object.sha
          if ([string]$ref.object.type -eq 'tag') {
            $tagObject = gh api "repos/$env:GITHUB_REPOSITORY/git/tags/$tagSha" | ConvertFrom-Json
            $tagSha = [string]$tagObject.object.sha
          }
          if ($tagSha -ne $env:SOURCE_SHA) { throw "Public tag points to '$tagSha'." }
          "TAG_SHA=$tagSha" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Download public release assets
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts/public | Out-Null
          gh release download $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --dir artifacts/public --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Could not download public v1.3.1 assets.' }
          foreach ($name in @($env:ASSET_NAME, 'SHA256SUMS.txt')) {
            if (-not (Test-Path (Join-Path artifacts/public $name))) { throw "Missing public asset: $name" }
          }

      - name: Verify checksum bytes package identity and layout
        shell: pwsh
        run: |
          $zip = Join-Path artifacts/public $env:ASSET_NAME
          $sum = Join-Path artifacts/public 'SHA256SUMS.txt'
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          $bytes = (Get-Item $zip).Length
          $line = Get-Content $sum | Where-Object { $_ -match [Regex]::Escape($env:ASSET_NAME) } | Select-Object -First 1
          if ($line -notmatch '^([0-9a-fA-F]{64})\s{2,}(.+)$') { throw "Invalid checksum line: $line" }
          if ($Matches[1].ToLowerInvariant() -ne $hash) { throw 'SHA256SUMS does not match public ZIP.' }

          New-Item -ItemType Directory -Force artifacts/extracted | Out-Null
          Expand-Archive $zip artifacts/extracted -Force
          $rootNames = @(Get-ChildItem artifacts/extracted | Select-Object -ExpandProperty Name | Sort-Object)
          $expected = @('Assets','FIRST_RUN_KO.txt','준현 헬퍼.exe') | Sort-Object
          if (Compare-Object $rootNames $expected) { throw "Public ZIP root layout mismatch: $($rootNames -join ', ')" }

          $exe = (Resolve-Path 'artifacts/extracted/준현 헬퍼.exe').Path
          $productVersion = (Get-Item $exe).VersionInfo.ProductVersion
          $expectedProduct = "$env:RELEASE_VERSION+$env:SOURCE_SHA"
          if ($productVersion -ne $expectedProduct) { throw "ProductVersion '$productVersion' != '$expectedProduct'." }
          $first = Get-Content 'artifacts/extracted/FIRST_RUN_KO.txt' -TotalCount 1
          if ($first -ne "준현 헬퍼 v$env:RELEASE_VERSION — Windows x64") { throw "FIRST_RUN identity mismatch: $first" }
          if (@(Get-ChildItem artifacts/extracted -Recurse -File -Filter *.pdb).Count -gt 0) { throw 'Public package contains PDB files.' }

          "ZIP_SHA256=$hash" | Out-File -FilePath $env:GITHUB_ENV -Append
          "ZIP_BYTES=$bytes" | Out-File -FilePath $env:GITHUB_ENV -Append
          "PRODUCT_VERSION=$productVersion" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Smoke public-downloaded executable
        shell: pwsh
        run: |
          $root = (Resolve-Path 'artifacts/extracted').Path
          $exe = (Resolve-Path (Join-Path $root '준현 헬퍼.exe')).Path
          $diagnostic = Join-Path $env:TEMP 'junhyun-map-smoke-error.txt'
          $success = Join-Path $env:TEMP 'junhyun-map-smoke-success.txt'
          $startupLog = Join-Path $env:LOCALAPPDATA 'JunhyunHelper/logs/startup.log'
          Remove-Item $diagnostic,$success,$startupLog -Force -ErrorAction SilentlyContinue
          $process = Start-Process -FilePath $exe -WorkingDirectory $root -PassThru
          try {
            $deadline = (Get-Date).AddSeconds(75)
            while ((Get-Date) -lt $deadline) {
              $process.Refresh()
              if (Test-Path $diagnostic) { Get-Content $diagnostic | Write-Host; throw 'Public-downloaded EXE product smoke failed.' }
              if (Test-Path $startupLog) { Get-Content $startupLog | Write-Host; throw 'Public-downloaded EXE startup failed.' }
              if (Test-Path $success) { break }
              if ($process.HasExited) { throw "Public EXE exited before smoke completion: $($process.ExitCode)" }
              Start-Sleep -Milliseconds 250
            }
            if (-not (Test-Path $success)) { throw 'Public-downloaded EXE smoke timed out.' }
            $closeRequested = $false
            for ($attempt=1; $attempt -le 10; $attempt++) {
              $process.Refresh()
              if ($process.HasExited) { $closeRequested=$true; break }
              if ($process.CloseMainWindow()) { $closeRequested=$true; break }
              Start-Sleep -Milliseconds 500
            }
            if (-not $closeRequested) { throw 'Could not request normal MainWindow close.' }
            $process.Refresh()
            if (-not $process.HasExited -and -not $process.WaitForExit(7000)) { throw 'Public EXE did not terminate after normal close.' }
            if (Test-Path (Join-Path $root 'Logs')) { throw 'Public smoke polluted portable package root.' }
          }
          finally {
            $process.Refresh()
            if (-not $process.HasExited) { Stop-Process -Id $process.Id -Force }
          }

      - name: Write official public verification evidence
        shell: pwsh
        run: |
          $status = [ordered]@{
            version = $env:RELEASE_TAG
            source_sha = $env:SOURCE_SHA
            tag_sha = $env:TAG_SHA
            asset = $env:ASSET_NAME
            bytes = [long]$env:ZIP_BYTES
            sha256 = $env:ZIP_SHA256
            product_version = $env:PRODUCT_VERSION
            tests = 256
            final_pr_ci = 32615869812
            public_latest_verified = $true
            exact_tag_source_verified = $true
            public_redownload_verified = $true
            public_exe_smoke = 'SUCCESS'
            verified_at_utc = (Get-Date).ToUniversalTime().ToString('o')
          }
          $status | ConvertTo-Json | Set-Content 'docs/.release-v1.3.1-status.json' -Encoding utf8NoBOM

          $md = @"
          # 준현 헬퍼 v1.3.1 공개 검증

          ## 릴리즈 식별자

          - 버전: **v1.3.1**
          - exact release source: ``$env:SOURCE_SHA``
          - public tag source: ``$env:TAG_SHA``
          - asset: ``$env:ASSET_NAME``
          - bytes: ``$env:ZIP_BYTES``
          - SHA-256: ``$env:ZIP_SHA256``
          - ProductVersion: ``$env:PRODUCT_VERSION``

          ## 검증

          - PR #143 final Windows CI ``32615869812``: SUCCESS
          - automated tests: **256 passed / 0 failed / 0 skipped**
          - exact public tag source: VERIFIED
          - public/latest: VERIFIED
          - public ZIP re-download: VERIFIED
          - public SHA256SUMS: VERIFIED
          - ZIP root ``준현 헬퍼.exe / FIRST_RUN_KO.txt / Assets``: VERIFIED
          - ProductVersion / FIRST_RUN identity: VERIFIED
          - public-downloaded Product UI / Scanner / Mini Scanner / Main Map / Factory / MiniMap smoke: SUCCESS
          - graceful shutdown / portable-root cleanliness: SUCCESS

          ## v1.3.1 범위

          - inspect-header를 title field + magnifier shape + first glyphs + red close/X 결합 구조로 인식
          - panel-left drift에서 첫 한글 글자를 magnifier로 오인하는 회귀 방지
          - Windows ko-KR OCR semantic success에 local Tarkov-font/current-catalog 시각 corroboration 추가
          - strict visual evidence가 명확한 경우에만 current official Item ID 안에서 OCR identity 교정
          - 상단 상태 텍스트 왼쪽에 실제 실행 EXE 버전 표시
          - 가격/플리/RequiredTotal, Content schema, user.db schema, Scanner settings schema 의미 변경 없음

          상세 recognition 계약은 ``docs/SCANNER_V1.3.1_RECOGNITION.md``를 참조합니다.
          "@
          $md | Set-Content 'docs/RELEASE_1.3.1.md' -Encoding utf8NoBOM

      - name: Commit verification evidence to main
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/.release-v1.3.1-status.json docs/RELEASE_1.3.1.md
          if (git diff --cached --quiet) { throw 'Verification produced no evidence changes.' }
          git commit -m 'docs: record v1.3.1 public verification'
          git push origin HEAD:main
