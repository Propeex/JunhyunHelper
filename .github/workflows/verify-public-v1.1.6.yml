name: Verify Public v1.1.6

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-public-v1.1.6.yml'

permissions:
  contents: write

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      SOURCE_SHA: 8efee02e5966adb9b67b47847f95a12dfc357d0a
      RELEASE_VERSION: 1.1.6
      RELEASE_TAG: v1.1.6
      EXPECTED_ZIP_BYTES: 80271024
      EXPECTED_ZIP_SHA256: 986d0d2855381060267f63d2902317eabedc5d5738448fbd6c2b09e764c3477e
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      JUNHYUNHELPER_MAP_SMOKE: '1'

    steps:
      - name: Checkout exact public source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 1

      - name: Verify public release metadata and exact tag
        shell: pwsh
        run: |
          if ((git rev-parse HEAD).Trim() -ne $env:SOURCE_SHA) { throw 'Exact source checkout drifted.' }
          $release = gh api "repos/$env:GITHUB_REPOSITORY/releases/tags/$env:RELEASE_TAG" | ConvertFrom-Json
          if ([bool]$release.draft -or [bool]$release.prerelease) { throw 'v1.1.6 is not a public stable release.' }
          if ([string]$release.target_commitish -ne $env:SOURCE_SHA) { throw 'Release target drifted.' }
          $latest = (gh api "repos/$env:GITHUB_REPOSITORY/releases/latest" --jq '.tag_name').Trim()
          if ($latest -ne $env:RELEASE_TAG) { throw "Latest release is $latest." }
          $ref = gh api "repos/$env:GITHUB_REPOSITORY/git/ref/tags/$env:RELEASE_TAG" | ConvertFrom-Json
          $tagSha = [string]$ref.object.sha
          if ([string]$ref.object.type -eq 'tag') {
            $tagObject = gh api "repos/$env:GITHUB_REPOSITORY/git/tags/$tagSha" | ConvertFrom-Json
            $tagSha = [string]$tagObject.object.sha
          }
          if ($tagSha -ne $env:SOURCE_SHA) { throw "Tag points to $tagSha." }

      - name: Download and independently verify public package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path artifacts/public -Force | Out-Null
          gh release download $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --dir artifacts/public --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Public download failed.' }
          $zipName = "Junhyun-Helper-v$env:RELEASE_VERSION-win-x64.zip"
          $zip = Join-Path artifacts/public $zipName
          $sum = Join-Path artifacts/public 'SHA256SUMS.txt'
          $bytes = [string](Get-Item $zip).Length
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($bytes -ne $env:EXPECTED_ZIP_BYTES) { throw "ZIP size mismatch: $bytes" }
          if ($hash -ne $env:EXPECTED_ZIP_SHA256) { throw "ZIP hash mismatch: $hash" }
          $line = Get-Content $sum | Where-Object { $_ -match [Regex]::Escape($zipName) } | Select-Object -First 1
          if ($line -notmatch '^([0-9a-fA-F]{64})\s{2,}(.+)$' -or $Matches[1].ToLowerInvariant() -ne $env:EXPECTED_ZIP_SHA256) {
            throw 'SHA256SUMS mismatch.'
          }
          Expand-Archive $zip artifacts/extracted -Force
          $exe = (Resolve-Path 'artifacts/extracted/준현 헬퍼.exe').Path
          $productVersion = (Get-Item $exe).VersionInfo.ProductVersion
          if ($productVersion -ne "$env:RELEASE_VERSION+$env:SOURCE_SHA") { throw "ProductVersion mismatch: $productVersion" }
          $firstLine = Get-Content 'artifacts/extracted/FIRST_RUN_KO.txt' -TotalCount 1
          if ($firstLine -ne "준현 헬퍼 v$env:RELEASE_VERSION — Windows x64") { throw 'FIRST_RUN mismatch.' }
          $rootNames = @(Get-ChildItem artifacts/extracted | Select-Object -ExpandProperty Name | Sort-Object)
          $expectedNames = @('Assets','FIRST_RUN_KO.txt','준현 헬퍼.exe') | Sort-Object
          if (Compare-Object $rootNames $expectedNames) { throw 'ZIP root mismatch.' }
          Write-Host "PUBLIC_ZIP_BYTES=$bytes"
          Write-Host "PUBLIC_ZIP_SHA256=$hash"
          Write-Host "PUBLIC_PRODUCT_VERSION=$productVersion"

      - name: Smoke independently downloaded public EXE
        shell: pwsh
        run: |
          $exe = (Resolve-Path 'artifacts/extracted/준현 헬퍼.exe').Path
          $diagnostic = Join-Path $env:TEMP 'junhyun-map-smoke-error.txt'
          $success = Join-Path $env:TEMP 'junhyun-map-smoke-success.txt'
          Remove-Item $diagnostic,$success -Force -ErrorAction SilentlyContinue
          $process = Start-Process -FilePath $exe -WorkingDirectory artifacts/extracted -PassThru
          try {
            $deadline = (Get-Date).AddSeconds(75)
            while ((Get-Date) -lt $deadline) {
              $process.Refresh()
              if (Test-Path $diagnostic) { Get-Content $diagnostic | ForEach-Object { Write-Host $_ }; throw 'Public EXE smoke failed.' }
              if (Test-Path $success) { break }
              if ($process.HasExited) { throw "Public EXE exited early: $($process.ExitCode)" }
              Start-Sleep -Milliseconds 250
            }
            if (-not (Test-Path $success)) { throw 'Public EXE smoke did not complete.' }
            $closed = $false
            for ($attempt = 1; $attempt -le 10; $attempt++) {
              $process.Refresh(); if ($process.HasExited -or $process.CloseMainWindow()) { $closed = $true; break }; Start-Sleep -Milliseconds 500
            }
            if (-not $closed) { throw 'Could not request normal close.' }
            $process.Refresh(); if (-not $process.HasExited -and -not $process.WaitForExit(7000)) { throw 'Public EXE did not exit normally.' }
          }
          finally { $process.Refresh(); if (-not $process.HasExited) { Stop-Process -Id $process.Id -Force } }

      - name: Publish independent verification status
        if: always()
        shell: pwsh
        env:
          VERIFY_JOB_STATUS: ${{ job.status }}
        run: |
          $status = [ordered]@{
            version = $env:RELEASE_VERSION
            tag = $env:RELEASE_TAG
            sourceSha = $env:SOURCE_SHA
            workflowRunId = [string]$env:GITHUB_RUN_ID
            workflowStatus = $env:VERIFY_JOB_STATUS
            zipBytes = $env:EXPECTED_ZIP_BYTES
            zipSha256 = $env:EXPECTED_ZIP_SHA256
            updatedAtUtc = [DateTimeOffset]::UtcNow.ToString('O')
          } | ConvertTo-Json
          $encoded = [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes($status))
          $path = 'docs/.verify-v1.1.6-status.json'
          $apiPath = "repos/$env:GITHUB_REPOSITORY/contents/$path"
          $existingSha = $null
          gh api $apiPath --jq '.sha' 2>$null | ForEach-Object { $existingSha = $_.Trim() }
          $args = @('-X','PUT',$apiPath,'-f','message=Record independent v1.1.6 verification','-f',"content=$encoded",'-f','branch=main')
          if (-not [string]::IsNullOrWhiteSpace($existingSha)) { $args += @('-f',"sha=$existingSha") }
          & gh api @args
          if ($LASTEXITCODE -ne 0) { Write-Warning 'Could not publish verification status.' }
