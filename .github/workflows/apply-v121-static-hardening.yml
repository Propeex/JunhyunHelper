name: Apply v1.2.1 static hardening

on:
  pull_request:
    types: [synchronize, reopened]

permissions:
  contents: write
  pull-requests: read

jobs:
  patch:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'v1.2.1-stability-accuracy-hardening'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Apply verified static hardening replacements
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def patch(path, old, new, marker):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if marker in text:
                  print(f'{path}: already patched')
                  return
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one replacement target, found {count}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')
              print(f'{path}: patched')

          patch(
              'src/JunhyunHelper.Desktop/Scanner/TarkovTitleFontProvider.cs',
              '''    private static bool SourceIsNewerThanCache(
                  SourceStamp source,
                  string regularPath,
                  string boldPath,
                  string koreanPath)
              {
                  var benderPath = File.Exists(regularPath) ? regularPath : boldPath;
                  if (!File.Exists(benderPath) || !File.Exists(koreanPath))
                      return true;
                  var cacheStamp = new[] { benderPath, koreanPath }
                      .Select(File.GetLastWriteTimeUtc)
                      .Min();
                  return source.LastWriteUtcTicks > cacheStamp.Ticks;
              }
          ''',
              '''    private static bool SourceIsNewerThanCache(
                  SourceStamp source,
                  string regularPath,
                  string boldPath,
                  string koreanPath)
              {
                  var cachedFonts = new List<string>(3);
                  if (File.Exists(regularPath))
                      cachedFonts.Add(regularPath);
                  if (File.Exists(boldPath))
                      cachedFonts.Add(boldPath);
                  if (!File.Exists(koreanPath) || cachedFonts.Count == 0)
                      return true;

                  cachedFonts.Add(koreanPath);
                  var oldestCacheStamp = cachedFonts
                      .Select(File.GetLastWriteTimeUtc)
                      .Min();
                  return source.LastWriteUtcTicks > oldestCacheStamp.Ticks;
              }
          ''',
              'var cachedFonts = new List<string>(3);')

          patch(
              'src/JunhyunHelper.Desktop/Scanner/ScannerTitleAnchorRefiner.cs',
              '''        refined = Clamp(refined, width, height);
                  var closeScore = close.Width > 0 ? 1.0 : 0.0;
                  var magnifierScore = magnifier.Width > 0 ? 1.0 : 0.0;
                  var anchorScore = closeScore * 0.38 + magnifierScore * 0.37 + fieldScore * 0.25;
          ''',
              '''        refined = Clamp(refined, width, height);
                  // Preserve the detector's actual evidence quality in diagnostics instead
                  // of upgrading every merely-present anchor to perfect confidence.
                  var closeScore = close.Width > 0 ? Math.Clamp(close.Score, 0, 1) : 0.0;
                  var magnifierScore = magnifier.Width > 0 ? Math.Clamp(magnifier.Score, 0, 1) : 0.0;
                  var anchorScore = closeScore * 0.38 + magnifierScore * 0.37 + fieldScore * 0.25;
          ''',
              "instead of upgrading every merely-present anchor")

          patch(
              'src/JunhyunHelper.Desktop/Scanner/ScannerLab38WindowsVision.cs',
              '''    private static bool HasVisualContent(Bitmap bitmap)
              {
                  var data = ReadBgra(bitmap);
                  var stepX = Math.Max(1, bitmap.Width / 16);
                  var stepY = Math.Max(1, bitmap.Height / 10);
                  var min = 255;
                  var max = 0;
                  var nonBlack = 0;
                  var count = 0;
                  for (var y = 0; y < bitmap.Height; y += stepY)
                  {
                      for (var x = 0; x < bitmap.Width; x += stepX)
                      {
                          var offset = y * data.Stride + x * 4;
                          var value = (data.Pixels[offset] + data.Pixels[offset + 1] + data.Pixels[offset + 2]) / 3;
                          min = Math.Min(min, value);
                          max = Math.Max(max, value);
                          if (value > 5)
                              nonBlack++;
                          count++;
                      }
                  }
                  return count > 0 && nonBlack >= count / 12 && max - min >= 10;
              }
          ''',
              '''    private static bool HasVisualContent(Bitmap bitmap)
              {
                  // PrintWindow validation needs only a sparse sample. Read those pixels
                  // directly from the locked bitmap instead of allocating/copying an entire
                  // 1440p/4K framebuffer before DetectCandidates copies it once for real use.
                  var rectangle = new Rectangle(0, 0, bitmap.Width, bitmap.Height);
                  var locked = bitmap.LockBits(
                      rectangle,
                      ImageLockMode.ReadOnly,
                      System.Drawing.Imaging.PixelFormat.Format32bppPArgb);
                  try
                  {
                      var sourceStride = Math.Abs(locked.Stride);
                      var stepX = Math.Max(1, bitmap.Width / 16);
                      var stepY = Math.Max(1, bitmap.Height / 10);
                      var min = 255;
                      var max = 0;
                      var nonBlack = 0;
                      var count = 0;

                      for (var y = 0; y < bitmap.Height; y += stepY)
                      {
                          var sourceRow = locked.Stride > 0 ? y : bitmap.Height - 1 - y;
                          var row = IntPtr.Add(locked.Scan0, sourceRow * sourceStride);
                          for (var x = 0; x < bitmap.Width; x += stepX)
                          {
                              var pixel = IntPtr.Add(row, x * 4);
                              var b = Marshal.ReadByte(pixel);
                              var g = Marshal.ReadByte(pixel, 1);
                              var r = Marshal.ReadByte(pixel, 2);
                              var value = (b + g + r) / 3;
                              min = Math.Min(min, value);
                              max = Math.Max(max, value);
                              if (value > 5)
                                  nonBlack++;
                              count++;
                          }
                      }

                      return count > 0 && nonBlack >= count / 12 && max - min >= 10;
                  }
                  finally
                  {
                      bitmap.UnlockBits(locked);
                  }
              }
          ''',
              'PrintWindow validation needs only a sparse sample.')
          PY

      - name: Commit patch if needed
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No patch changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/JunhyunHelper.Desktop/Scanner/TarkovTitleFontProvider.cs \
                  src/JunhyunHelper.Desktop/Scanner/ScannerTitleAnchorRefiner.cs \
                  src/JunhyunHelper.Desktop/Scanner/ScannerLab38WindowsVision.cs
          git commit -m "Harden Scanner capture and diagnostics"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
