name: Finalize v1.2.1 release records
# One-shot post-release finalizer. Deletes itself after successful completion.

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/finalize-v1.2.1.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Finalize public release documentation and cleanup
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          SOURCE = '8c0de649f18d7caa4f5669a06511c15e784dfd29'
          RUN = '32542259521'
          PR_RUN = '32540688111'
          ZIP = 'Junhyun-Helper-v1.2.1-win-x64.zip'
          BYTES = '80,306,749'
          HASH = '48a8b54fcdc3346a092ef3da2744f2d4ca7e27d99da5b52e3ebee7b55fa0affa'
          PRODUCT = f'1.2.1+{SOURCE}'

          def read(path): return Path(path).read_text(encoding='utf-8')
          def write(path, text): Path(path).write_text(text, encoding='utf-8')
          def replace_required(text, old, new, label):
              if new in text:
                  return text
              if old not in text:
                  raise SystemExit(f'{label}: required marker not found')
              return text.replace(old, new, 1)

          p = 'docs/RELEASE_1.2.1.md'
          t = read(p)
          t = replace_required(t, 'Status: **RELEASE CANDIDATE — public release not yet published**', 'Status: **PUBLIC / VERIFIED**', p)
          t = replace_required(t, 'Prepared: 2026-08-22 KST', 'Released: 2026-08-22 KST', p)
          t = t.replace('The version/documentation commit must pass the same gate before merge.', f'The final PR candidate CI run `{PR_RUN}` passed the same Windows Release build, 255/255 tests, win-x64 publish, actual published EXE product smoke, graceful shutdown and clean portable-root gate before merge.')
          public_marker = '## Public verification\n\nThis section is completed only after the exact merged release source is built, a Draft asset is re-downloaded and verified, the release becomes public/latest, and the public asset is independently re-downloaded and smoke-tested.'
          public_final = f'''## Public verification\n\n```text\nversion: v1.2.1 PUBLIC RELEASE / VERIFIED\nrelease source: {SOURCE}\nfinal PR CI: {PR_RUN} — SUCCESS\nexact-source release run: {RUN} — SUCCESS\nautomated tests: 255 passed / 0 failed / 0 skipped\nasset: {ZIP}\nbytes: {BYTES}\nSHA-256: {HASH}\nProductVersion: {PRODUCT}\nDraft-downloaded EXE smoke: SUCCESS\npublic/latest: VERIFIED\nexact public tag source: VERIFIED\npublic-downloaded EXE smoke: SUCCESS\n```\n\nExact-source release run `{RUN}` checked out `{SOURCE}` directly, rebuilt and retested it, audited the Windows x64 portable package, smoke-tested the exact published EXE, created a Draft release, re-downloaded and verified the Draft ZIP/checksum/root/ProductVersion/FIRST_RUN, smoke-tested the Draft-downloaded EXE, published v1.2.1 as latest, verified the public tag resolves to the exact release source, re-downloaded the public assets, and smoke-tested the public-downloaded EXE.\n\nPublic release: `https://github.com/Propeex/JunhyunHelper/releases/tag/v1.2.1`.'''
          t = replace_required(t, public_marker, public_final, p)
          write(p, t)

          release_block_120 = '''현재 public stable은 **v1.2.0**입니다.\n\n```text\nversion: v1.2.0 PUBLIC RELEASE / VERIFIED\nrelease source: a7601f8498e8d75e832962fb9dd60f4112d28dc6\nexact-source release run: 32514322439 — SUCCESS\nautomated tests: 255 passed / 0 failed / 0 skipped\nasset: Junhyun-Helper-v1.2.0-win-x64.zip\nbytes: 80,298,514\nSHA-256: ab5e9ef35b300268d16a1c5eece86cd8c6e57c91c83364caf4b7d02cde1d27d1\nDraft-downloaded EXE smoke: SUCCESS\npublic/latest: VERIFIED\nexact tag source: VERIFIED\npublic-downloaded EXE smoke: SUCCESS\n```'''
          release_block_121 = f'''현재 public stable은 **v1.2.1**입니다.\n\n```text\nversion: v1.2.1 PUBLIC RELEASE / VERIFIED\nrelease source: {SOURCE}\nfinal PR CI: {PR_RUN} — SUCCESS\nexact-source release run: {RUN} — SUCCESS\nautomated tests: 255 passed / 0 failed / 0 skipped\nasset: {ZIP}\nbytes: {BYTES}\nSHA-256: {HASH}\nDraft-downloaded EXE smoke: SUCCESS\npublic/latest: VERIFIED\nexact tag source: VERIFIED\npublic-downloaded EXE smoke: SUCCESS\n```'''
          compat_120_state = '''```text\nDesktop Version: 1.2.0\nContent schema: v7\nReadable Content schemas: v3~v7\nuser.db schema: v1\nScanner display settings schema: v3\nScanner catalog cache schema: v1/v2 readable, v2 written\nv1.1.6 → v1.2.0 mandatory Game Content update: none\nv1.1.6 → v1.2.0 user.db migration: none\n```'''
          compat_121_state = '''```text\nDesktop Version: 1.2.1\nContent schema: v7\nReadable Content schemas: v3~v7\nuser.db schema: v1\nScanner display settings schema: v3\nScanner catalog cache schema: v1/v2 readable, v2 written\nv1.2.0 → v1.2.1 mandatory Game Content update: none\nv1.2.0 → v1.2.1 user.db migration: none\n```'''

          p = 'docs/STATE.md'; t = read(p)
          t = replace_required(t, release_block_120, release_block_121, p)
          t = replace_required(t, compat_120_state, compat_121_state, p)
          t = t.replace('상세 검증 기록은 `docs/RELEASE_1.2.0.md`에 있습니다.', '상세 검증 기록은 `docs/RELEASE_1.2.1.md`에 있습니다.', 1)
          t = t.replace('## 4. Scanner v1.2.0 recognition 구조', '## 4. Scanner recognition 구조 / v1.2.1 hardening', 1)
          hardening = '''\n### v1.2.1 deterministic hardening\n\n- Tarkov `resources.assets` font discovery는 bounded streaming scan을 사용합니다.\n- Bender/Noto cache는 source manifest와 실제 font-binary generation hash로 세대를 구분합니다.\n- OCR-guided/full-catalog visual template cache는 generation-aware bounded cache입니다.\n- Mini Scanner inventory/stash OCR은 동시에 최대 1개이며 최신 요청으로 coalesce하고 stale epoch 결과를 폐기합니다.\n- one-shot과 profile/GameMode monitor는 shared runtime state를 직렬화하며 최신 mode/context만 복구합니다.\n- font-aware OCR은 active-operation lifetime으로 종료 중 resource disposal race를 막습니다.\n- PrintWindow sparse validation은 전체 frame의 두 번째 managed copy 없이 locked bitmap에서 직접 sample합니다.\n- title anchor diagnostics는 실제 detector evidence score를 보존합니다.\n- confidence/top1-top2 margin과 fail-closed identity 기준은 v1.2.0에서 완화하지 않았습니다.\n'''
          marker = '## 5. 1회 고정밀 스캔 / 단축키'
          if hardening.strip() not in t:
              if marker not in t: raise SystemExit(f'{p}: section 5 marker missing')
              t = t.replace(marker, hardening + '\n' + marker, 1)
          start = t.find('## 13. v1.2.0 검증 결과')
          end = t.find('## 14. 실제 Tarkov 후속 검증')
          if start < 0 or end < 0 or end <= start: raise SystemExit(f'{p}: verification section markers missing')
          verification = f'''## 13. v1.2.1 검증 결과\n\nFinal PR CI `{PR_RUN}`와 exact-source release run `{RUN}`에서 다음을 모두 통과했습니다.\n\n- exact release source `{SOURCE}`\n- Windows Release build\n- **255 automated tests / 0 failure / 0 skipped**\n- win-x64 self-contained single-file publish\n- exact ProductVersion/FIRST_RUN verification\n- package root / dependency / PDB / nested archive audit\n- exact published EXE Product UI / Scanner / Mini Scanner / Main Map / Factory / MiniMap smoke\n- one-shot mode restoration + title-anchor/magnifier product smoke\n- graceful shutdown / clean portable root\n- Draft package re-download checksum/root/ProductVersion/FIRST_RUN verification\n- Draft-downloaded EXE smoke\n- public/latest transition\n- exact tag source verification\n- public package re-download verification\n- public-downloaded EXE smoke\n\nPublic asset:\n\n```text\n{ZIP}\n{BYTES} bytes\nSHA-256 {HASH}\nProductVersion {PRODUCT}\n```\n\n'''
          t = t[:start] + verification + t[end:]
          t = t.replace('| Program Update | 구현 완료 / v1.2.0 public package verified |', '| Program Update | 구현 완료 / v1.2.1 public package verified |')
          t = t.replace('| Scanner + Mini Scanner | **v1.2.0 public baseline / live Tarkov validation 및 후속 수정 진행 대상** |', '| Scanner + Mini Scanner | **v1.2.1 public verified / live Tarkov calibration 및 후속 evidence-based 수정 진행 대상** |')
          write(p, t)

          p = 'docs/CURRENT_STATE.md'; t = read(p)
          t = t.replace('상태: **`v1.2.0 PUBLIC RELEASE / VERIFIED — Scanner title recognition overhaul`**', '상태: **`v1.2.1 PUBLIC RELEASE / VERIFIED — Scanner stability and accuracy hardening`**', 1)
          s = t.find('## 현재 공개 기준선'); e = t.find('## Scanner 현재 계약')
          if s < 0 or e < 0: raise SystemExit(f'{p}: baseline markers missing')
          baseline = f'''## 현재 공개 기준선\n\n```text\nversion: v1.2.1\nrelease source: {SOURCE}\nfinal PR CI: {PR_RUN} — SUCCESS\nexact-source release run: {RUN} — SUCCESS\nautomated tests: 255 passed / 0 failed / 0 skipped\nasset: {ZIP}\nbytes: {BYTES}\nSHA-256: {HASH}\nDraft-downloaded EXE smoke: SUCCESS\npublic/latest: VERIFIED\nexact tag source: VERIFIED\npublic-downloaded EXE smoke: SUCCESS\n```\n\n```text\nDesktop Version: 1.2.1\nContent schema: v7\nReadable Content schemas: v3~v7\nuser.db schema: v1\nScanner display settings schema: v3\nScanner cache schema: v1/v2 readable, v2 written\nv1.2.0 → v1.2.1 mandatory Game Content update: none\nv1.2.0 → v1.2.1 user.db migration: none\n```\n\n'''
          t = t[:s] + baseline + t[e:]
          s = t.find('## v1.2.0 핵심 변경'); e = t.find('## Mini Scanner / data baseline')
          if s < 0 or e < 0: raise SystemExit(f'{p}: change-section markers missing')
          changes = '''## v1.2.1 핵심 변경\n\n- `resources.assets` title-font discovery bounded streaming scan\n- Tarkov source manifest + actual font-binary generation hash\n- generation-aware bounded visual template caches\n- Mini Scanner inventory/stash OCR single-probe coalescing + stale-result rejection\n- one-shot/profile/GameMode lifecycle serialization and latest-mode restore rule\n- shutdown-safe font-aware OCR active-operation lifetime\n- PrintWindow sparse validation의 redundant full-frame managed copy 제거\n- title-anchor diagnostic score에 실제 detector evidence 보존\n- recognition confidence/top1-top2 margin 완화 없음\n- v1.2.0의 `인식 이미지`, `1회 고정밀 스캔`, title-anchor/Tarkov-font recovery 기능 유지\n\n상세: `docs/RELEASE_1.2.1.md`, `docs/SCANNER.md`, `docs/SCANNER_TEST_PLAN.md`.\n\n'''
          t = t[:s] + changes + t[e:]
          t = t.replace('| Program Update | 구현 완료 / v1.2.0 public package verified |', '| Program Update | 구현 완료 / v1.2.1 public package verified |')
          t = t.replace('| Scanner + Mini Scanner | **v1.2.0 public baseline / live Tarkov validation and follow-up fixes ongoing** |', '| Scanner + Mini Scanner | **v1.2.1 public verified / live Tarkov calibration and evidence-based follow-up ongoing** |')
          write(p, t)

          p = 'README.md'; t = read(p)
          t = replace_required(t, release_block_120, release_block_121, p)
          old_compat = '''```text\nContent schema: v7\nReadable schemas: v3~v7\nuser.db schema: v1\nScanner display settings schema: v3\nScanner cache schema: v1/v2 readable, v2 written\nv1.1.6 → v1.2.0 mandatory Game Content update: none\nv1.1.6 → v1.2.0 user.db migration: none\n```'''
          new_compat = '''```text\nContent schema: v7\nReadable schemas: v3~v7\nuser.db schema: v1\nScanner display settings schema: v3\nScanner cache schema: v1/v2 readable, v2 written\nv1.2.0 → v1.2.1 mandatory Game Content update: none\nv1.2.0 → v1.2.1 user.db migration: none\n```'''
          t = replace_required(t, old_compat, new_compat, p)
          t = t.replace('상세 릴리즈 기록은 `docs/RELEASE_1.2.0.md`에 있습니다.', '상세 릴리즈 기록은 `docs/RELEASE_1.2.1.md`에 있습니다.', 1)
          marker = 'v1.2.0 Scanner 보강:\n'
          section = '''v1.2.1 Scanner 하드닝:\n\n- Tarkov title-font discovery bounded streaming scan\n- source manifest + font generation hash로 stale visual template 방지\n- visual template cache bounded/generation-aware\n- Mini Scanner inventory OCR 단일 probe + latest-request coalescing + stale result 폐기\n- one-shot/profile/GameMode lifecycle 직렬화\n- shutdown 중 font-aware OCR resource disposal race 방지\n- PrintWindow validation의 redundant full-frame managed copy 제거\n- 실제 anchor detector score를 진단에 보존\n- 인식 confidence/margin 및 fail-closed 정책은 완화하지 않음\n\n'''
          if section.strip() not in t:
              if marker not in t: raise SystemExit(f'{p}: v1.2.0 scanner marker missing')
              t = t.replace(marker, section + marker, 1)
          t = t.replace('상세: `docs/SCANNER.md`, `docs/SCANNER_TEST_PLAN.md`, `docs/RELEASE_1.2.0.md`.', '상세: `docs/SCANNER.md`, `docs/SCANNER_TEST_PLAN.md`, `docs/RELEASE_1.2.1.md`.', 1)
          t = t.replace('v1.2.0은 Scanner 진단 이미지와 1회 고정밀 스캔이라는 사용자 기능을 추가하고 제목 인식 구조를 보강한 MINOR 릴리즈입니다.', 'v1.2.0은 Scanner 진단 이미지와 1회 고정밀 스캔이라는 사용자 기능을 추가한 MINOR 릴리즈이며, v1.2.1은 그 기능의 lifecycle/cache/capture/resource 안정성을 보강한 PATCH 릴리즈입니다.', 1)
          t = t.replace('- `docs/RELEASE_1.2.0.md` — v1.2.0 public release record', '- `docs/RELEASE_1.2.1.md` — current public release record\n- `docs/RELEASE_1.2.0.md` — v1.2.0 release history', 1)
          write(p, t)

          p = 'docs/SCANNER.md'; t = read(p)
          t = t.replace('상태: **`v1.2.0 PUBLIC BASELINE / v1.2.1 RELEASE CANDIDATE / SCANNER LAB v3.8 CONTRACT PRESERVED / LIVE TARKOV E2E ONGOING`**', '상태: **`v1.2.1 PUBLIC RELEASE / VERIFIED / SCANNER LAB v3.8 CONTRACT PRESERVED / LIVE TARKOV E2E ONGOING`**', 1)
          if '## v1.2.1 Public verification' not in t:
              t += f'''\n\n## v1.2.1 Public verification\n\n```text\nrelease source: {SOURCE}\nfinal PR CI: {PR_RUN} — SUCCESS\nexact-source release run: {RUN} — SUCCESS\nautomated tests: 255 passed / 0 failed / 0 skipped\nasset: {ZIP}\nbytes: {BYTES}\nSHA-256: {HASH}\nProductVersion: {PRODUCT}\nDraft-downloaded EXE smoke: SUCCESS\npublic/latest + exact tag: VERIFIED\npublic-downloaded EXE smoke: SUCCESS\n```\n\n실제 최신 Tarkov Borderless E2E calibration은 별도 evidence 기반 후속 검증으로 계속 진행합니다. live 근거 없이 recognition threshold를 낮추지 않습니다.\n'''
          write(p, t)

          p = 'docs/SCANNER_TEST_PLAN.md'; t = read(p)
          t = t.replace('상태: **`v1.2.0 PUBLIC VERIFIED / v1.2.1 RELEASE CANDIDATE / LIVE TARKOV CALIBRATION DEFERRED`**', '상태: **`v1.2.1 PUBLIC RELEASE GATE PASSED / PUBLIC VERIFIED / LIVE TARKOV CALIBRATION DEFERRED`**', 1)
          t = t.replace('## 1. v1.2.1 Release blocking gate', '## 1. v1.2.1 Release blocking gate — 완료', 1)
          if '## v1.2.1 Public release verification — 완료' not in t:
              t += f'''\n\n## v1.2.1 Public release verification — 완료\n\n```text\nrelease source: {SOURCE}\nfinal PR CI: {PR_RUN} — SUCCESS\nexact-source release run: {RUN} — SUCCESS\n255 passed / 0 failed / 0 skipped\nasset: {ZIP}\nbytes: {BYTES}\nSHA-256: {HASH}\nProductVersion: {PRODUCT}\nDraft asset verification + EXE smoke: SUCCESS\npublic/latest + exact tag verification: SUCCESS\nPublic asset verification + EXE smoke: SUCCESS\n```\n'''
          write(p, t)

          p = 'docs/ARCHITECTURE.md'; t = read(p)
          old = '현재 공개 기준선은 **`v1.2.0 PUBLIC RELEASE / VERIFIED`**이며, **v1.2.1은 Scanner deterministic 안정성·정확성 하드닝 release candidate**입니다. v1.2.1은 live Tarkov 데이터가 필요한 recognition threshold를 추측해서 변경하지 않습니다.'
          new = f'현재 공개 기준선은 **`v1.2.1 PUBLIC RELEASE / VERIFIED`**입니다. release source는 `{SOURCE}`이며 exact-source release run `{RUN}`에서 Draft/Public 재다운로드와 실제 EXE smoke까지 검증했습니다. v1.2.1은 live Tarkov 데이터가 필요한 recognition threshold를 추측해서 변경하지 않은 deterministic Scanner 하드닝 PATCH입니다.'
          t = replace_required(t, old, new, p)
          write(p, t)
          PY

          git rm -f .github/workflows/release-v1.2.1.yml docs/.release-v1.2.1-status.json .github/workflows/finalize-v1.2.1.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md docs/RELEASE_1.2.1.md docs/STATE.md docs/CURRENT_STATE.md docs/SCANNER.md docs/SCANNER_TEST_PLAN.md docs/ARCHITECTURE.md
          git commit -m "Finalize v1.2.1 public release records"
          git push origin HEAD:main
