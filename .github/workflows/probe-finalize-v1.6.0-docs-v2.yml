name: Probe v1.6.0 Docs Finalizer v2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/probe-finalize-v1.6.0-docs-v2.yml'

permissions:
  contents: write
  actions: read

jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - shell: pwsh
        run: |
          $repo=$env:GITHUB_REPOSITORY
          Start-Sleep -Seconds 8
          $runs=gh api "repos/$repo/actions/workflows/finalize-v1.6.0-public-docs-v2.yml/runs?per_page=5"|ConvertFrom-Json
          $r=@($runs.workflow_runs|Sort-Object created_at -Descending|Select-Object -First 1)[0]
          $o=[ordered]@{observed_at_utc=[DateTime]::UtcNow.ToString('o');run_id=if($r){[long]$r.id}else{$null};status=if($r){[string]$r.status}else{$null};conclusion=if($r){[string]$r.conclusion}else{$null};head_sha=if($r){[string]$r.head_sha}else{$null}}
          $json=$o|ConvertTo-Json;$b64=[Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes($json));$path="repos/$repo/contents/docs/.v1.6.0-doc-finalizer-v2-probe.json";$old=gh api $path 2>$null;$sha=$null;if($LASTEXITCODE-eq0){$sha=($old|ConvertFrom-Json).sha};$a=@('--method','PUT',$path,'-f','message=Record v1.6.0 docs finalizer v2 state','-f',"content=$b64",'-f','branch=main');if($sha){$a+=@('-f',"sha=$sha")};gh api @a|Out-Null
