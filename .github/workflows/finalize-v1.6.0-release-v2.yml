name: Finalize v1.6.0 Release v2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/finalize-v1.6.0-release-v2.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-latest
    timeout-minutes: 10
    env:
      SOURCE_SHA: c58b5cd3b3128ff6dce5a2221a453bc56aa41c37
      VERSION: 1.6.0
      TAG: v1.6.0
      STABLE_SHA: bb4ba7c8e95eb3b7838348b5f0c3fa19b2d9816e1f8e92e1d8b7ad155e1dda76
      BRIDGE_SHA: a0d249e8cbfc989674824b33e57fc80e5adc4c3208503053376a41528a100896
      GH_TOKEN: ${{ github.token }}
      JUNHYUNHELPER_MAP_SMOKE: '1'

    steps:
      - name: Resolve exact draft from release list
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $repo = $env:GITHUB_REPOSITORY
          $tag = gh api "repos/$repo/git/ref/tags/$env:TAG" | ConvertFrom-Json
          if ($tag.object.sha -ne $env:SOURCE_SHA) { throw "Tag source mismatch: $($tag.object.sha)" }

          $all = @(gh api "repos/$repo/releases?per_page=100" | ConvertFrom-Json)
          $matches = @($all | Where-Object { $_.tag_name -eq $env:TAG })
          if ($matches.Count -ne 1) { throw "Expected one v1.6.0 release in authenticated release list; found $($matches.Count)." }
          $release = $matches[0]
          if (-not $release.draft -or $release.prerelease) { throw "Expected recoverable draft; draft=$($release.draft) prerelease=$($release.prerelease)" }

          $expectedNames = @('준현 헬퍼.zip', "Junhyun-Helper-v$env:VERSION-win-x64.zip", 'SHA256SUMS.txt')
          $download = 'artifacts/draft'
          New-Item -ItemType Directory -Path $download -Force | Out-Null
          foreach ($name in $expectedNames) {
            $assets = @($release.assets | Where-Object { $_.name -eq $name })
            if ($assets.Count -ne 1) { throw "Draft asset '$name' missing or duplicated." }
            $dest = Join-Path $download $name
            curl.exe --fail --location --silent --show-error `
              -H "Accept: application/octet-stream" `
              -H "Authorization: Bearer $env:GH_TOKEN" `
              -H "X-GitHub-Api-Version: 2022-11-28" `
              $assets[0].url --output $dest
            if ($LASTEXITCODE -ne 0 -or -not (Test-Path $dest)) { throw "Asset-ID download failed for '$name'." }
          }

      - name: Verify exact draft payload
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = 'artifacts/draft'
          $stable = Join-Path $root '준현 헬퍼.zip'
          $bridge = Join-Path $root "Junhyun-Helper-v$env:VERSION-win-x64.zip"
          $checksum = Join-Path $root 'SHA256SUMS.txt'
          $stableHash = (Get-FileHash $stable -Algorithm SHA256).Hash.ToLowerInvariant()
          $bridgeHash = (Get-FileHash $bridge -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($stableHash -ne $env:STABLE_SHA) { throw "Stable hash mismatch: $stableHash" }
          if ($bridgeHash -ne $env:BRIDGE_SHA) { throw "Bridge hash mismatch: $bridgeHash" }

          $lines = @(Get-Content $checksum | Where-Object { -not [string]::IsNullOrWhiteSpace($_) })
          foreach ($e in @(@('준현 헬퍼.zip',$env:STABLE_SHA), @("Junhyun-Helper-v$env:VERSION-win-x64.zip",$env:BRIDGE_SHA))) {
            $m = @($lines | Where-Object { $_ -match '^([0-9a-fA-F]{64})\s+(.+)$' -and $Matches[2] -eq $e[0] })
            if ($m.Count -ne 1 -or $m[0] -notmatch '^([0-9a-fA-F]{64})\s+(.+)$' -or $Matches[1].ToLowerInvariant() -ne $e[1]) { throw "Checksum mismatch for $($e[0])." }
          }

          Expand-Archive -LiteralPath $stable -DestinationPath artifacts/stable -Force
          Expand-Archive -LiteralPath $bridge -DestinationPath artifacts/bridge -Force
          $stableRoot = 'artifacts/stable/준현 헬퍼'
          foreach ($relative in @('준현 헬퍼.exe','FIRST_RUN_KO.txt','Assets/tarkov_data.db')) {
            if (-not (Test-Path (Join-Path $stableRoot $relative))) { throw "Stable ZIP missing $relative." }
            if (-not (Test-Path (Join-Path 'artifacts/bridge' $relative))) { throw "Bridge ZIP missing $relative." }
          }
          function Manifest([string]$r) {
            @(Get-ChildItem $r -Recurse -File | ForEach-Object {
              $p=$_.FullName.Substring($r.Length).TrimStart('\\','/').Replace('\\','/')
              [pscustomobject]@{P=$p;L=$_.Length;H=(Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()}
            } | Sort-Object P)
          }
          if (((Manifest $stableRoot)|ConvertTo-Json -Compress) -ne ((Manifest 'artifacts/bridge')|ConvertTo-Json -Compress)) { throw 'Stable/bridge payload mismatch.' }

          $exe = (Resolve-Path (Join-Path $stableRoot '준현 헬퍼.exe')).Path
          $pv = (Get-Item $exe).VersionInfo.ProductVersion
          if ($pv -ne "$env:VERSION+$env:SOURCE_SHA") { throw "ProductVersion mismatch: $pv" }
          if ((Get-Content (Join-Path $stableRoot 'FIRST_RUN_KO.txt') -TotalCount 1) -ne "준현 헬퍼 v$env:VERSION — Windows x64") { throw 'FIRST_RUN mismatch.' }
          if (Get-ChildItem $stableRoot -Recurse -File -Filter *.pdb) { throw 'PDB found.' }

          $diag=Join-Path $env:TEMP 'junhyun-map-smoke-error.txt'; $ok=Join-Path $env:TEMP 'junhyun-map-smoke-success.txt'
          Remove-Item $diag,$ok -Force -ErrorAction SilentlyContinue
          $p=Start-Process -FilePath $exe -WorkingDirectory $stableRoot -PassThru
          try {
            $deadline=(Get-Date).AddSeconds(75)
            while((Get-Date)-lt $deadline -and -not(Test-Path $ok)) { $p.Refresh(); if(Test-Path $diag){throw (Get-Content $diag -Raw)}; if($p.HasExited){throw "EXE exited $($p.ExitCode)"}; Start-Sleep -Milliseconds 250 }
            if(-not(Test-Path $ok)){throw 'Smoke timeout.'}; if(-not $p.CloseMainWindow()){throw 'Close failed.'}; if(-not $p.WaitForExit(7000)){throw 'Exit timeout.'}
          } finally { $p.Refresh(); if(-not $p.HasExited){Stop-Process -Id $p.Id -Force} }

          Write-Host "Draft stable bytes: $((Get-Item $stable).Length)"
          Write-Host "Draft stable SHA-256: $stableHash"
          Write-Host "Draft bridge bytes: $((Get-Item $bridge).Length)"
          Write-Host "Draft bridge SHA-256: $bridgeHash"
          Write-Host "ProductVersion: $pv"

      - name: Publish stable latest
        shell: pwsh
        run: |
          gh release edit $env:TAG --repo $env:GITHUB_REPOSITORY --draft=false --prerelease=false --latest
          if ($LASTEXITCODE -ne 0) { throw 'Failed to publish stable/latest.' }

  verify_public:
    needs: publish
    runs-on: windows-latest
    timeout-minutes: 10
    env:
      SOURCE_SHA: c58b5cd3b3128ff6dce5a2221a453bc56aa41c37
      VERSION: 1.6.0
      TAG: v1.6.0
      STABLE_SHA: bb4ba7c8e95eb3b7838348b5f0c3fa19b2d9816e1f8e92e1d8b7ad155e1dda76
      BRIDGE_SHA: a0d249e8cbfc989674824b33e57fc80e5adc4c3208503053376a41528a100896
      GH_TOKEN: ${{ github.token }}
      JUNHYUNHELPER_MAP_SMOKE: '1'

    steps:
      - name: Anonymous public latest and downloads
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $headers=@{'User-Agent'='JunhyunHelper-Public-Verifier';'Accept'='application/vnd.github+json'}
          $latest=Invoke-RestMethod 'https://api.github.com/repos/Propeex/JunhyunHelper/releases/latest' -Headers $headers
          if($latest.tag_name -ne $env:TAG -or $latest.draft -or $latest.prerelease){throw 'Public latest mismatch.'}
          $tag=Invoke-RestMethod "https://api.github.com/repos/Propeex/JunhyunHelper/git/ref/tags/$env:TAG" -Headers $headers
          if($tag.object.sha -ne $env:SOURCE_SHA){throw 'Public tag source mismatch.'}
          New-Item -ItemType Directory artifacts/public -Force | Out-Null
          foreach($name in @('준현 헬퍼.zip',"Junhyun-Helper-v$env:VERSION-win-x64.zip",'SHA256SUMS.txt')){
            $a=@($latest.assets|Where-Object{$_.name -eq $name}); if($a.Count-ne 1){throw "Public asset missing: $name"}
            curl.exe --fail --location --silent --show-error $a[0].browser_download_url --output (Join-Path artifacts/public $name)
            if($LASTEXITCODE-ne 0){throw "Public download failed: $name"}
          }

      - name: Verify public hashes identity and smoke
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $stable='artifacts/public/준현 헬퍼.zip'; $bridge="artifacts/public/Junhyun-Helper-v$env:VERSION-win-x64.zip"; $sum='artifacts/public/SHA256SUMS.txt'
          $sh=(Get-FileHash $stable -Algorithm SHA256).Hash.ToLowerInvariant(); $bh=(Get-FileHash $bridge -Algorithm SHA256).Hash.ToLowerInvariant()
          if($sh-ne$env:STABLE_SHA){throw "Public stable hash mismatch: $sh"}; if($bh-ne$env:BRIDGE_SHA){throw "Public bridge hash mismatch: $bh"}
          $lines=@(Get-Content $sum|Where-Object{-not[string]::IsNullOrWhiteSpace($_)})
          foreach($e in @(@('준현 헬퍼.zip',$env:STABLE_SHA),@("Junhyun-Helper-v$env:VERSION-win-x64.zip",$env:BRIDGE_SHA))){$m=@($lines|Where-Object{$_-match'^([0-9a-fA-F]{64})\s+(.+)$'-and$Matches[2]-eq$e[0]});if($m.Count-ne1-or$m[0]-notmatch'^([0-9a-fA-F]{64})\s+(.+)$'-or$Matches[1].ToLowerInvariant()-ne$e[1]){throw "Public checksum mismatch: $($e[0])"}}
          Expand-Archive -LiteralPath $stable -DestinationPath artifacts/public-extract -Force
          $r='artifacts/public-extract/준현 헬퍼'; foreach($x in @('준현 헬퍼.exe','FIRST_RUN_KO.txt','Assets/tarkov_data.db')){if(-not(Test-Path(Join-Path $r $x))){throw "Public package missing $x"}}
          $exe=(Resolve-Path(Join-Path $r '준현 헬퍼.exe')).Path; $pv=(Get-Item $exe).VersionInfo.ProductVersion; if($pv-ne"$env:VERSION+$env:SOURCE_SHA"){throw "Public ProductVersion mismatch: $pv"}
          if(Get-ChildItem $r -Recurse -File -Filter *.pdb){throw 'Public PDB found.'}
          $diag=Join-Path $env:TEMP 'junhyun-map-smoke-error.txt';$ok=Join-Path $env:TEMP 'junhyun-map-smoke-success.txt';Remove-Item $diag,$ok -Force -ErrorAction SilentlyContinue
          $p=Start-Process -FilePath $exe -WorkingDirectory $r -PassThru;try{$d=(Get-Date).AddSeconds(75);while((Get-Date)-lt$d-and-not(Test-Path$ok)){$p.Refresh();if(Test-Path$diag){throw(Get-Content$diag-Raw)};if($p.HasExited){throw"Public EXE exited $($p.ExitCode)"};Start-Sleep -Milliseconds 250};if(-not(Test-Path$ok)){throw'Smoke timeout.'};if(-not$p.CloseMainWindow()){throw'Close failed.'};if(-not$p.WaitForExit(7000)){throw'Exit timeout.'}}finally{$p.Refresh();if(-not$p.HasExited){Stop-Process -Id $p.Id -Force}}

          $status=[ordered]@{version='v1.6.0';source_sha=$env:SOURCE_SHA;finalizer_run_id=[long]$env:GITHUB_RUN_ID;stable_asset='준현 헬퍼.zip';stable_bytes=(Get-Item $stable).Length;stable_sha256=$sh;bridge_asset="Junhyun-Helper-v$env:VERSION-win-x64.zip";bridge_bytes=(Get-Item $bridge).Length;bridge_sha256=$bh;product_version=$pv;automated_tests='299 passed / 0 failed / 0 skipped';public_latest='VERIFIED';exact_public_tag_source='VERIFIED';public_redownload='VERIFIED';public_exe_smoke='SUCCESS';verified_at_utc=[DateTime]::UtcNow.ToString('o')}
          $status|ConvertTo-Json|Set-Content release-status.json -Encoding utf8; $status|Format-List

      - name: Persist verified release status
        shell: pwsh
        run: |
          $repo=$env:GITHUB_REPOSITORY;$path='docs/.release-v1.6.0-status.json';$b64=[Convert]::ToBase64String([IO.File]::ReadAllBytes('release-status.json'))
          $existing=gh api "repos/$repo/contents/$path?ref=main" 2>$null;$sha=$null;if($LASTEXITCODE-eq0){$sha=($existing|ConvertFrom-Json).sha}
          $args=@('--method','PUT',"repos/$repo/contents/$path",'-f','message=Record verified v1.6.0 public release','-f',"content=$b64",'-f','branch=main');if($sha){$args+=@('-f',"sha=$sha")};gh api @args|Out-Null;if($LASTEXITCODE-ne0){throw'Could not persist release status.'}
