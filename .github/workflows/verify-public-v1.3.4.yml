name: Verify public v1.3.4

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-public-v1.3.4.yml'

permissions:
  contents: write
  actions: read

env:
  SOURCE_SHA: a78ddbc649747f1320236556f17e6b908304674a
  CONTROLLER_COMMIT: 44b68c45f5d4708d62c766ef5664994de841b9e2
  RELEASE_VERSION: 1.3.4
  RELEASE_TAG: v1.3.4
  ASSET_NAME: Junhyun-Helper-v1.3.4-win-x64.zip
  EXPECTED_TESTS: '267'
  FINAL_PR_CI: '32636665202'
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  JUNHYUNHELPER_MAP_SMOKE: '1'

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Wait for exact-source release controller and verify public artifact
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          function Assert-Package([string]$Root) {
            foreach ($file in @('준현 헬퍼.exe','FIRST_RUN_KO.txt','Assets/tarkov_data.db')) {
              if (-not (Test-Path (Join-Path $Root $file))) { throw "Missing package file: $file" }
            }
            $rootNames = @(Get-ChildItem $Root | Select-Object -ExpandProperty Name | Sort-Object)
            $expectedRoot = @('Assets','FIRST_RUN_KO.txt','준현 헬퍼.exe') | Sort-Object
            if (Compare-Object $rootNames $expectedRoot) { throw "Package root mismatch: $($rootNames -join ', ')" }
            if (@(Get-ChildItem $Root -Recurse -File -Filter *.pdb).Count -gt 0) { throw 'Package contains PDB files.' }
            if (@(Get-ChildItem $Root -Recurse -File | Where-Object { $_.Extension -in @('.zip','.7z','.rar') }).Count -gt 0) { throw 'Package contains nested archives.' }
            $exe = Get-Item (Join-Path $Root '준현 헬퍼.exe')
            $expectedProduct = "$env:RELEASE_VERSION+$env:SOURCE_SHA"
            if ($exe.VersionInfo.ProductVersion -ne $expectedProduct) {
              throw "ProductVersion '$($exe.VersionInfo.ProductVersion)' != '$expectedProduct'."
            }
            $first = Get-Content (Join-Path $Root 'FIRST_RUN_KO.txt') -TotalCount 1
            if ($first -ne "준현 헬퍼 v$env:RELEASE_VERSION — Windows x64") { throw "FIRST_RUN identity mismatch: $first" }
          }

          function Invoke-ProductSmoke([string]$Root) {
            $exe = (Resolve-Path (Join-Path $Root '준현 헬퍼.exe')).Path
            $diagnostic = Join-Path $env:TEMP 'junhyun-map-smoke-error.txt'
            $success = Join-Path $env:TEMP 'junhyun-map-smoke-success.txt'
            $startupLog = Join-Path $env:LOCALAPPDATA 'JunhyunHelper/logs/startup.log'
            Remove-Item $diagnostic,$success,$startupLog -Force -ErrorAction SilentlyContinue
            $process = Start-Process -FilePath $exe -WorkingDirectory $Root -PassThru
            try {
              $deadline = (Get-Date).AddSeconds(75)
              while ((Get-Date) -lt $deadline) {
                $process.Refresh()
                if (Test-Path $diagnostic) { Get-Content $diagnostic | Write-Host; throw 'Public EXE smoke diagnostic failure.' }
                if (Test-Path $startupLog) { Get-Content $startupLog | Write-Host; throw 'Public EXE startup failure.' }
                if (Test-Path $success) { break }
                if ($process.HasExited) { throw "Public EXE exited before smoke completion: $($process.ExitCode)" }
                Start-Sleep -Milliseconds 250
              }
              if (-not (Test-Path $success)) { throw 'Public EXE smoke timed out.' }
              $closeRequested = $false
              for ($i = 0; $i -lt 10; $i++) {
                $process.Refresh()
                if ($process.HasExited -or $process.CloseMainWindow()) { $closeRequested = $true; break }
                Start-Sleep -Milliseconds 500
              }
              if (-not $closeRequested) { throw 'Could not request normal MainWindow close.' }
              $process.Refresh()
              if (-not $process.HasExited -and -not $process.WaitForExit(7000)) { throw 'Public EXE did not terminate after normal close.' }
              if (Test-Path (Join-Path $Root 'Logs')) { throw 'Public EXE polluted portable package root.' }
            }
            finally {
              $process.Refresh()
              if (-not $process.HasExited) { Stop-Process -Id $process.Id -Force }
            }
          }

          $controller = $null
          for ($attempt = 0; $attempt -lt 180; $attempt++) {
            $runsJson = gh run list --repo $env:GITHUB_REPOSITORY --workflow 'Release v1.3.4' --limit 10 --json databaseId,status,conclusion,headSha,createdAt
            if ($LASTEXITCODE -ne 0) { throw 'Could not list release-controller runs.' }
            $runs = @($runsJson | ConvertFrom-Json)
            $controller = $runs | Where-Object { $_.headSha -eq $env:CONTROLLER_COMMIT } | Select-Object -First 1
            if ($null -ne $controller -and $controller.status -eq 'completed') { break }
            Start-Sleep -Seconds 5
          }
          if ($null -eq $controller) { throw 'Exact-source release-controller run was not found.' }
          if ($controller.status -ne 'completed') { throw 'Exact-source release-controller did not complete before verifier timeout.' }
          if ($controller.conclusion -ne 'success') { throw "Exact-source release-controller failed: $($controller.conclusion)" }
          $controllerRun = [long]$controller.databaseId

          $release = gh release view $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --json isDraft,tagName
          if ($LASTEXITCODE -ne 0) { throw 'Could not read v1.3.4 release.' }
          $releaseInfo = $release | ConvertFrom-Json
          if ($releaseInfo.isDraft) { throw 'v1.3.4 is still Draft after controller success.' }

          $ref = gh api "repos/$env:GITHUB_REPOSITORY/git/ref/tags/$env:RELEASE_TAG" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Could not read v1.3.4 tag.' }
          $tagSha = [string]$ref.object.sha
          if ([string]$ref.object.type -eq 'tag') {
            $tagObject = gh api "repos/$env:GITHUB_REPOSITORY/git/tags/$tagSha" | ConvertFrom-Json
            if ($LASTEXITCODE -ne 0) { throw 'Could not dereference v1.3.4 annotated tag.' }
            $tagSha = [string]$tagObject.object.sha
          }
          if ($tagSha -ne $env:SOURCE_SHA) { throw "Public tag points to '$tagSha', not '$env:SOURCE_SHA'." }

          $latest = (gh api "repos/$env:GITHUB_REPOSITORY/releases/latest" --jq '.tag_name').Trim()
          if ($LASTEXITCODE -ne 0 -or $latest -ne $env:RELEASE_TAG) { throw "Latest public release is '$latest'." }

          Remove-Item artifacts/public-independent -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force artifacts/public-independent | Out-Null
          gh release download $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --dir artifacts/public-independent --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Independent public release download failed.' }

          $zip = Join-Path artifacts/public-independent $env:ASSET_NAME
          $sumPath = Join-Path artifacts/public-independent 'SHA256SUMS.txt'
          if (-not (Test-Path $zip) -or -not (Test-Path $sumPath)) { throw 'Public release assets are incomplete.' }
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          $bytes = [long](Get-Item $zip).Length
          $sumLine = Get-Content $sumPath | Where-Object { $_ -match [Regex]::Escape($env:ASSET_NAME) } | Select-Object -First 1
          if ($sumLine -notmatch '^([0-9a-fA-F]{64})\s{2,}(.+)$' -or $Matches[1].ToLowerInvariant() -ne $hash) {
            throw 'Public SHA256SUMS does not match independently downloaded ZIP.'
          }

          New-Item -ItemType Directory -Force artifacts/public-extracted | Out-Null
          Expand-Archive $zip artifacts/public-extracted -Force
          Assert-Package (Resolve-Path artifacts/public-extracted).Path
          Invoke-ProductSmoke (Resolve-Path artifacts/public-extracted).Path

          $status = [ordered]@{
            version = $env:RELEASE_TAG
            source_sha = $env:SOURCE_SHA
            tag_sha = $tagSha
            asset = $env:ASSET_NAME
            bytes = $bytes
            sha256 = $hash
            product_version = "$env:RELEASE_VERSION+$env:SOURCE_SHA"
            tests = [int]$env:EXPECTED_TESTS
            final_pr_ci = [long]$env:FINAL_PR_CI
            release_run = $controllerRun
            public_verifier_run = [long]$env:GITHUB_RUN_ID
            draft_redownload_verified = $true
            draft_exe_smoke = 'SUCCESS'
            public_latest_verified = $true
            exact_tag_source_verified = $true
            public_redownload_verified = $true
            public_exe_smoke = 'SUCCESS'
            independent_public_verifier = $true
          }
          $status | ConvertTo-Json | Set-Content -Encoding utf8NoBOM docs/.release-v1.3.4-status.json
          Write-Host "INDEPENDENT_PUBLIC_VERIFIED $($status | ConvertTo-Json -Compress)"

      - name: Record evidence and remove one-shot workflows
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/release-v1.3.4.yml
          git rm .github/workflows/verify-public-v1.3.4.yml
          git add docs/.release-v1.3.4-status.json
          git commit -m 'release: record verified v1.3.4 public artifact'
          git push origin HEAD:main
