name: Apply v1.2.1 version and docs

on:
  pull_request:
    types: [synchronize, reopened]

permissions:
  contents: write
  pull-requests: read

jobs:
  patch:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'v1.2.1-stability-accuracy-hardening'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Apply verified version and documentation updates
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if new in text:
                  print(f'{path}: already updated')
                  return
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one target, found {count}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')
              print(f'{path}: updated')

          replace_once(
              'src/JunhyunHelper.Desktop/JunhyunHelper.Desktop.csproj',
              '<Version>1.2.0</Version>',
              '<Version>1.2.1</Version>')

          first = Path('packaging/FIRST_RUN_KO.txt')
          text = first.read_text(encoding='utf-8')
          text = text.replace('준현 헬퍼 v1.2.0 — Windows x64', '준현 헬퍼 v1.2.1 — Windows x64', 1)
          marker = 'v1.2.0 주요 변경 — Scanner 제목 인식 구조 전면 보강\n'
          section = '''v1.2.1 주요 변경 — Scanner 안정성·정확성 하드닝
          - 실사용 데이터가 필요한 인식 임계값 튜닝은 하지 않고, 코드와 자동 검증만으로 확정할 수 있는 안정성·정확성 문제를 보완했습니다.
          - Tarkov `resources.assets`에서 제목 폰트를 찾을 때 전체 파일을 한 번에 메모리에 올리지 않고 bounded streaming scan을 사용합니다.
          - Bender/Noto 로컬 폰트 캐시를 Tarkov 원본 파일의 세대와 묶고, 실제 폰트 바이너리 해시를 시각 템플릿 세대에 연결해 게임 업데이트 뒤 오래된 글자 템플릿을 재사용하지 않습니다.
          - OCR/전체 카탈로그 시각 대조 템플릿 캐시에 상한을 두어 장시간 Scanner 사용 시 메모리가 계속 증가하지 않도록 했습니다.
          - Mini Scanner의 인벤토리/창고 판별 OCR은 동시에 하나만 수행합니다. 반복 표시 요청은 최신 요청으로 합쳐지고, 이전 아이템의 늦은 OCR 결과는 화면에 적용되지 않습니다.
          - 1회 고정밀 스캔 도중 Scanner/Test 상태나 프로필/GameMode가 바뀌어도 이전 상태가 뒤늦게 되살아나지 않도록 lifecycle을 직렬화했습니다.
          - 종료 중 진행 중이던 font-aware recognition과 Skia/font 자원 Dispose가 겹치지 않도록 active-operation 수명을 보강했습니다.
          - PrintWindow 유효성 검사는 소수 픽셀을 직접 샘플링해 1440p/4K 전체 프레임의 불필요한 두 번째 managed 복사를 제거했습니다.
          - 제목 anchor 진단 점수는 anchor가 존재한다는 이유만으로 100%로 표시하지 않고 실제 검출 점수를 보존합니다.
          - 기존 OCR 우선, 보수적 confidence/top1-top2 margin, 애매하면 미표시, scan-time network 금지, 게임 메모리/DLL injection/패킷 가로채기 금지 계약은 그대로 유지합니다.
          - Content schema, user.db schema, Scanner 표시 설정 schema는 변경하지 않습니다.

          '''
          if section not in text:
              if text.count(marker) != 1:
                  raise SystemExit('FIRST_RUN_KO.txt: v1.2.0 marker mismatch')
              text = text.replace(marker, section + marker, 1)
          first.write_text(text, encoding='utf-8')

          arch = Path('docs/ARCHITECTURE.md')
          text = arch.read_text(encoding='utf-8')
          text = text.replace('기준일: 2026-08-21', '기준일: 2026-08-22', 1)
          old_baseline = '현재 기준선: **`v1.1.4 PUBLIC RELEASE / VERIFIED`**. release source는 `833ac66c522632a695d106bd7ca9b1d6bfc030dc`이며 공개 ZIP 재다운로드와 실제 EXE smoke까지 검증했습니다.'
          new_baseline = '현재 공개 기준선은 **`v1.2.0 PUBLIC RELEASE / VERIFIED`**이며, v1.2.1은 Scanner의 deterministic 안정성·정확성 하드닝 release candidate입니다. v1.2.1은 live Tarkov 데이터가 필요한 confidence/geometry 임계값을 추측해서 변경하지 않습니다.'
          if old_baseline in text:
              text = text.replace(old_baseline, new_baseline, 1)
          elif new_baseline not in text:
              raise SystemExit('ARCHITECTURE.md: baseline marker mismatch')

          start = text.index('## 8. Scanner subsystem')
          end = text.index('## 9. Program update')
          scanner_section = '''## 8. Scanner subsystem

Scanner는 화면 픽셀을 current official Korean item catalog의 Item ID에 연결하는 독립 subsystem입니다. Scanner Lab v3.8 structural candidate architecture는 계속 geometry 기준으로 유지하고, v1.2.0의 title-anchor/character-policy/Tarkov-font recovery 위에 v1.2.1 lifecycle/cache hardening을 적용합니다.

### 8.1 구성

```text
ScannerPage / MiniScannerWindow
        │
        ▼
ScannerCoordinator
        ├─ ScannerSettingsService
        ├─ ScannerCatalogService
        ├─ ScannerRuntimeService
        ├─ ScannerItemPresentationService
        └─ MiniScannerOverlayService
              └─ ScannerInventoryContextDetector

ScannerRuntimeService
        ├─ ScannerLab38InspectDetector
        │    ├─ structural candidate detector
        │    └─ ScannerTitleAnchorRefiner
        ├─ FontAwareScannerOcrEngine
        │    ├─ SerializedScannerOcrEngine
        │    │    └─ Windows ko-KR OCR
        │    ├─ TarkovTitleFontProvider
        │    ├─ ScannerTitleFontVerifier
        │    └─ ScannerFullCatalogVisualMatcher
        ├─ ScannerCatalogService
        ├─ ScannerItemPresentationService
        └─ MiniScannerOverlayService
```

Title OCR과 inventory-context OCR은 하나의 `SerializedScannerOcrEngine`을 공유합니다. inventory-context detector에는 font-aware recovery를 연결하지 않아 UI anchor 판별이 official item-name visual recovery와 섞이지 않습니다.

### 8.2 Recognition data flow

```text
Tarkov client / display pixels
→ Scanner Lab v3.8 detail structural candidates
→ close + magnifier + title-field anchor refinement
→ magnifier-free title ROI (불확실하면 검증된 geometry ROI fallback)
→ Windows ko-KR OCR
→ current-catalog character policy
→ official-name semantic resolver
   ├─ 성공: 기존 OCR 결과 우선
   └─ 실패/손상: current official catalog 안에서만 Tarkov-font visual recovery
→ confidence + top1/top2 margin
→ Item ID or fail closed
→ local presentation snapshot
→ Mini Scanner
```

Structural score, anchor score, icon 또는 visual score 하나만으로 Item identity를 확정하지 않습니다. current official Item ID/name catalog가 identity 권위이며 ambiguous/low-confidence 결과는 미표시합니다.

### 8.3 Tarkov title-font ownership / generation

게임 폰트 바이너리는 제품에 번들하지 않습니다.

```text
running EscapeFromTarkov
→ EscapeFromTarkov_Data/resources.assets (read-only)
→ bounded streaming SFNT discovery
→ Bender regular/bold + Noto Sans CJK KR local Scanner cache
→ source manifest + font-binary generation hash
→ visual template generation
```

- `resources.assets` 전체를 한 managed byte array로 읽지 않습니다.
- cache manifest는 source path/length/last-write를 기록합니다.
- Bender/Noto 실제 cache 파일들의 SHA-256 조합이 visual generation key입니다.
- source generation 또는 font generation이 달라지면 기존 loaded typeface/rendered mask를 재사용하지 않습니다.
- 부분 추출/손상 cache는 fail-soft로 visual recovery를 사용하지 않으며 기존 OCR path를 손상시키지 않습니다.
- OCR-guided template, full-catalog mask/aspect cache는 bounded입니다.

### 8.4 Runtime stability

Continuous Scanner는 semantic OCR 전에 동일 quantized geometry의 연속 관측을 요구합니다. verified bounds + title signature가 유지되면 OCR 반복을 억제하고 presentation만 주기적으로 갱신합니다.

v1.2.1 추가 lifecycle 계약:

- Mini Scanner inventory/stash OCR probe는 동시에 최대 1개입니다.
- 반복 `Show` 요청은 latest snapshot으로 coalesce합니다.
- item/visibility epoch가 바뀌면 old probe 결과는 적용하지 않습니다.
- one-shot은 continuous loop의 실제 종료를 기다린 뒤 shared runtime state를 사용합니다.
- one-shot 종료 시 최신 사용자 상태가 아직 같은 mode를 요청할 때만 이전 mode를 복구합니다.
- profile/GameMode monitor는 one-shot gate를 획득한 뒤 최신 context를 다시 읽습니다.
- font-aware OCR은 active-operation lease로 이미 실행 중인 recovery가 끝난 뒤 Skia/font resource를 해제합니다.

### 8.5 Capture allocation

`PrintWindow`가 유효한 화면을 반환했는지 확인하는 sparse validation은 locked bitmap에서 직접 소수 픽셀만 읽습니다. 이 사전 검사 때문에 1440p/4K 전체 프레임을 별도 managed array로 복사하지 않습니다. 실제 detector가 필요로 하는 한 번의 normalized BGRA copy는 유지합니다.

### 8.6 Item data bridge

```text
Item ID
→ Scanner catalog: official name / market / dimensions / icon URL
→ GameContentCatalog: canonical item
→ ItemsWorkspace: RequiredTotal
→ ScannerItemSnapshot
→ Mini Scanner
```

가격 계약:

- 최고 상점가 = fleaMarket을 제외한 유효 trader sell price 최댓값
- 플리 평균가 = positive `avg24hPrice`
- 슬롯 = positive `width * height`
- price/slot은 둘 다 유효할 때만 계산

현재 필요한 수량 = `RequiredTotal`; Inventory를 차감한 부족량이 아닙니다.

### 8.7 Diagnostics

`ScannerDiagnosticLog`는 capture/candidate/OCR/match/selected/runtime metadata를 bounded log로 남기며 screenshot/raw pixel buffer를 디스크에 저장하지 않습니다.

```text
%LocalAppData%/JunhyunHelper/logs/scanner.log(.1)
```

최신 `인식 이미지` 한 장은 process memory에만 존재합니다. title-anchor score는 실제 detected component evidence를 보존하며, 단순히 anchor가 존재한다는 이유만으로 100%로 승격하지 않습니다.

### 8.8 Scanner 금지 경계

- game memory read
- DLL injection
- packet interception
- process-internal data read
- scan-time HTTP
- icon 단독 identity
- live 근거 없이 confidence/margin 완화

'''
          text = text[:start] + scanner_section + text[end:]
          arch.write_text(text, encoding='utf-8')

          scanner = Path('docs/SCANNER.md')
          text = scanner.read_text(encoding='utf-8')
          old_status = '상태: **`v1.2.0 PUBLIC RELEASE / VERIFIED / SCANNER LAB v3.8 CONTRACT PRESERVED / LIVE TARKOV E2E ONGOING`**'
          new_status = '상태: **`v1.2.0 PUBLIC BASELINE / v1.2.1 RELEASE CANDIDATE / SCANNER LAB v3.8 CONTRACT PRESERVED / LIVE TARKOV E2E ONGOING`**'
          if old_status in text:
              text = text.replace(old_status, new_status, 1)
          elif new_status not in text:
              raise SystemExit('SCANNER.md: status marker mismatch')
          marker = '## 2. Capture mode\n'
          section = '''## 1.1 v1.2.1 deterministic hardening

v1.2.1은 live Tarkov 캡처가 필요한 recognition threshold 튜닝을 하지 않는 PATCH입니다. v1.2.0의 인식 의미를 유지하면서 실행 수명과 cache generation을 보강합니다.

- `resources.assets` font discovery: whole-file allocation → bounded streaming scan
- font cache: source manifest + actual font-binary generation hash
- visual template caches: generation-aware + bounded
- Mini Scanner inventory/stash OCR: single active probe + latest-request coalescing + stale epoch rejection
- one-shot/profile monitor: shared state 직렬화 + current-mode/current-context 재확인
- shutdown: active font-recovery operation 종료 뒤 Skia/font resource disposal
- `PrintWindow` pre-validation: whole-frame duplicate copy 제거, sparse locked-pixel sampling
- title-anchor diagnostic score: actual component score 보존

변경하지 않는 것:

- Scanner Lab v3.8 structural floor
- OCR semantic matcher confidence threshold
- visual recovery acceptance threshold
- top1/top2 margin
- current official catalog identity contract
- two-anchor inventory/stash fail-closed gate
- scan-time network / game-memory / injection / packet 금지 경계

실제 플레이에서 수집되는 miss/false-positive evidence는 `scanner.log`와 `인식 이미지`를 기준으로 별도 후속 calibration에 사용합니다.

'''
          if section not in text:
              if text.count(marker) != 1:
                  raise SystemExit('SCANNER.md: section marker mismatch')
              text = text.replace(marker, section + marker, 1)
          scanner.write_text(text, encoding='utf-8')
          PY

      - name: Commit updates if needed
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No version/doc changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/JunhyunHelper.Desktop/JunhyunHelper.Desktop.csproj \
                  packaging/FIRST_RUN_KO.txt \
                  docs/ARCHITECTURE.md \
                  docs/SCANNER.md
          git commit -m "Prepare v1.2.1 release identity and architecture"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
