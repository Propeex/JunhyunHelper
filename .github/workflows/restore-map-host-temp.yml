name: Restore Map host smoke signal

on:
  push:
    branches:
      - agent/main-map-floor-quest-availability-2026-08-15

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/main-map-floor-quest-availability-2026-08-15
          fetch-depth: 0

      - name: Restore last good host and add success signal only
        shell: bash
        run: |
          git show 8037db8cee15cfb43402023543ed2bace59a1de9:src/JunhyunHelper.Desktop/MainWindow.LegacyMapHost.cs > /tmp/MapHost.good.cs
          cp /tmp/MapHost.good.cs src/JunhyunHelper.Desktop/MainWindow.LegacyMapHost.cs
          python - <<'PY'
          from pathlib import Path
          path = Path('src/JunhyunHelper.Desktop/MainWindow.LegacyMapHost.cs')
          text = path.read_text(encoding='utf-8')
          old = '    private const string MapSmokeDiagnosticFileName = "junhyun-map-smoke-error.txt";\n'
          new = old + '    private const string MapSmokeSuccessFileName = "junhyun-map-smoke-success.txt";\n'
          if old not in text:
              raise SystemExit('Map smoke diagnostic constant anchor not found')
          text = text.replace(old, new, 1)

          old = '            await VerifyMiniMapProductAsync();\n'
          new = '            await VerifyMiniMapProductAsync();\n            WriteMapSmokeSuccess();\n'
          if old not in text:
              raise SystemExit('MiniMap completion anchor not found')
          text = text.replace(old, new, 1)

          anchor = '    private static void WriteMapSmokeDiagnostic(Exception exception)\n'
          success_method = '''    private static void WriteMapSmokeSuccess()\n    {\n        try\n        {\n            var path = System.IO.Path.Combine(\n                System.IO.Path.GetTempPath(),\n                MapSmokeSuccessFileName);\n            System.IO.File.WriteAllText(path, "OK");\n        }\n        catch\n        {\n        }\n    }\n\n'''
          if anchor not in text:
              raise SystemExit('Map smoke diagnostic method anchor not found')
          text = text.replace(anchor, success_method + anchor, 1)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit restored host and remove temporary workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/restore-map-host-temp.yml
          git add src/JunhyunHelper.Desktop/MainWindow.LegacyMapHost.cs
          git commit -m 'Restore Map host and emit explicit smoke success'
          git push origin HEAD:agent/main-map-floor-quest-availability-2026-08-15
