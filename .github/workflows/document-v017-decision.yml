name: Document v0.1.7 decision

on:
  push:
    branches:
      - agent/v0.1.7-minimap-floor-transform

permissions:
  contents: write

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Append DEC-045
        shell: bash
        run: |
          if ! grep -q '## DEC-045 ' docs/DECISIONS.md; then
            echo '' | base64 -d >> docs/DECISIONS.md
          fi
      - name: Remove one-shot workflow and commit
        shell: bash
        run: |
          rm .github/workflows/document-v017-decision.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Record exact MiniMap floor transform decision"
          git push
