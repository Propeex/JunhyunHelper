name: Temporary LL1 task-pool audit
on:
  push:
    branches: [fix/v0.1.9-feedback-round2]
    paths: ['.github/workflows/ll1-audit-temp.yml']
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect live task structure and LL1 candidates
        shell: python
        run: |
          import json, urllib.request
          url='https://json.tarkov.dev/regular/tasks'
          req=urllib.request.Request(url,headers={'User-Agent':'JunhyunHelper/0.1.9 (+https://github.com/Propeex/JunhyunHelper)','Accept':'application/json'})
          with urllib.request.urlopen(req, timeout=30) as r:
              data=json.load(r)
          tasks=list(data.values()) if isinstance(data,dict) else data
          print('TASKS',len(tasks))
          print('SAMPLE_KEYS',sorted(tasks[0].keys()))
          ids=['6a20540cf1b67a977cc5a088','6a4e4ab3ecd1145894d00990','6a59f3ba06c8949abad30871','6a5ba40fe5c4eaef5610f232','6a3171c927ca9591bf4db1c4','6a4b339f18db62e03b4f7ded','6a43a01ccc83aceedd35f09c']
          for vid in ids:
              gated=[t for t in tasks if vid in json.dumps(t,ensure_ascii=False)]
              print('\nVAR',vid,'GATED',len(gated))
              if not gated: continue
              sample=gated[0]
              tr=(sample.get('trader') or {}).get('id') if isinstance(sample.get('trader'),dict) else sample.get('traderId')
              print('TRADER',tr,'SAMPLE_NAME',sample.get('name'))
              print('SAMPLE_REQS',json.dumps(sample.get('requirements') or sample.get('taskRequirements') or [],ensure_ascii=False)[:4000])
              roots=[]
              for t in tasks:
                  ttr=(t.get('trader') or {}).get('id') if isinstance(t.get('trader'),dict) else t.get('traderId')
                  if ttr != tr: continue
                  reqs=t.get('requirements') or t.get('taskRequirements') or []
                  reqtext=json.dumps(reqs,ensure_ascii=False).lower()
                  if 'globalvariable' in reqtext or 'task' in reqtext or 'traderloyalty' in reqtext: continue
                  roots.append((t.get('id'),t.get('name'),t.get('minPlayerLevel'),reqs))
              print('ROOT_CANDIDATES',len(roots))
              for x in roots: print('ROOT',json.dumps(x,ensure_ascii=False)[:1600])
