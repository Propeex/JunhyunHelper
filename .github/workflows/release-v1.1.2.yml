name: Release v1.1.2

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/release-v1.1.2.yml'

permissions:
  contents: write

jobs:
  release:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, 'Trigger v1.1.2 release')
    runs-on: windows-latest
    timeout-minutes: 35

    steps:
      - name: Resolve exact release source
        shell: pwsh
        run: |
          if ('${{ github.event_name }}' -eq 'push') {
            $releaseSha = '${{ github.event.before }}'
          }
          else {
            $releaseSha = '${{ github.sha }}'
          }
          if ([string]::IsNullOrWhiteSpace($releaseSha) -or $releaseSha -match '^0+$') {
            throw 'Could not resolve exact v1.1.2 release source SHA.'
          }
          "RELEASE_SHA=$releaseSha" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          'RELEASE_VERSION=1.1.2' | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          'RELEASE_TAG=v1.1.2' | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          'ZIP_NAME=Junhyun-Helper-v1.1.2-win-x64.zip' | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Exact release source: $releaseSha"

      - name: Checkout exact release source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_SHA }}
          fetch-depth: 1

      - name: Verify exact release commit and clean tag namespace
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -ne $env:RELEASE_SHA) {
            throw "Release checkout mismatch: expected $env:RELEASE_SHA, got $actual"
          }

          gh release view $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            throw "Release $env:RELEASE_TAG already exists."
          }

          git ls-remote --exit-code --tags origin "refs/tags/$env:RELEASE_TAG" *> $null
          if ($LASTEXITCODE -eq 0) {
            throw "Tag $env:RELEASE_TAG already exists."
          }

          Write-Host 'Release/tag namespace is clean.'
          exit 0

      - name: Checkout pinned public Map donor
        shell: pwsh
        run: |
          git config --local --unset-all http.https://github.com/.extraheader
          if ($LASTEXITCODE -notin @(0, 5)) { throw "Could not clear GitHub auth header (exit $LASTEXITCODE)." }
          git submodule sync --recursive
          if ($LASTEXITCODE -ne 0) { throw 'Could not synchronize submodule metadata.' }
          git submodule update --init --force --depth=1 --recursive
          if ($LASTEXITCODE -ne 0) { throw 'Could not checkout pinned Map donor.' }
          $actualDonor = (git -C vendor/Tarkov-Helper rev-parse HEAD).Trim()
          $expectedDonor = 'd933792b6042a51cea38dc44b686a096fe30de67'
          if ($actualDonor -ne $expectedDonor) { throw "Map donor mismatch: $actualDonor" }

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build and test exact baseline
        shell: pwsh
        run: |
          dotnet build src/JunhyunHelper.Desktop/JunhyunHelper.Desktop.csproj --configuration Release
          if ($LASTEXITCODE -ne 0) { throw 'Release build failed.' }
          dotnet test tests/JunhyunHelper.Tests/JunhyunHelper.Tests.csproj --configuration Release
          if ($LASTEXITCODE -ne 0) { throw 'Automated tests failed.' }

      - name: Publish and audit portable package
        shell: pwsh
        run: |
          dotnet publish src/JunhyunHelper.Desktop/JunhyunHelper.Desktop.csproj `
            --configuration Release `
            --runtime win-x64 `
            --self-contained true `
            --output artifacts/publish `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true `
            -p:PublishTrimmed=false `
            -p:PublishReadyToRun=false `
            -p:DebugType=None `
            -p:DebugSymbols=false
          if ($LASTEXITCODE -ne 0) { throw 'Release publish failed.' }

          Copy-Item packaging/FIRST_RUN_KO.txt artifacts/publish/FIRST_RUN_KO.txt

          foreach ($file in @('준현 헬퍼.exe', 'FIRST_RUN_KO.txt', 'Assets/tarkov_data.db')) {
            if (-not (Test-Path (Join-Path artifacts/publish $file))) { throw "Missing release file: $file" }
          }

          [xml]$project = Get-Content 'src/JunhyunHelper.Desktop/JunhyunHelper.Desktop.csproj'
          $projectVersion = [string]($project.Project.PropertyGroup.Version | Select-Object -First 1)
          if ($projectVersion -ne $env:RELEASE_VERSION) { throw "Project version mismatch: $projectVersion" }

          $exePath = (Resolve-Path 'artifacts/publish/준현 헬퍼.exe').Path
          $productVersion = (Get-Item $exePath).VersionInfo.ProductVersion
          $escapedVersion = [Regex]::Escape($env:RELEASE_VERSION)
          if ($productVersion -notmatch "^$escapedVersion(?:$|[+-])") { throw "ProductVersion mismatch: $productVersion" }

          $firstLine = Get-Content 'artifacts/publish/FIRST_RUN_KO.txt' -TotalCount 1
          if ($firstLine -ne "준현 헬퍼 v$env:RELEASE_VERSION — Windows x64") { throw "FIRST_RUN mismatch: $firstLine" }

          $rootFiles = @(Get-ChildItem artifacts/publish -File | Select-Object -ExpandProperty Name)
          if (@($rootFiles | Where-Object { $_ -notin @('준현 헬퍼.exe', 'FIRST_RUN_KO.txt') }).Count -gt 0) {
            throw 'Portable root contains unexpected files.'
          }
          $rootDirs = @(Get-ChildItem artifacts/publish -Directory | Select-Object -ExpandProperty Name)
          if ($rootDirs.Count -ne 1 -or $rootDirs[0] -ne 'Assets') { throw 'Portable root directory contract is invalid.' }
          if (@(Get-ChildItem artifacts/publish -Recurse -File -Filter *.pdb).Count -gt 0) { throw 'Publish contains PDB files.' }
          foreach ($file in @('AutoUpdater.NET.dll','Microsoft.Web.WebView2.Core.dll','Microsoft.Web.WebView2.WinForms.dll','Microsoft.Web.WebView2.Wpf.dll','WebView2Loader.dll','Westermo.GraphX.Controls.dll','Westermo.GraphX.Common.dll','QuikGraph.dll')) {
            if (Get-ChildItem artifacts/publish -Recurse -File -Filter $file) { throw "Forbidden legacy dependency: $file" }
          }

          Write-Host "RELEASE_PRODUCT_VERSION=$productVersion"
          Write-Host "RELEASE_EXE_BYTES=$((Get-Item $exePath).Length)"

      - name: Smoke exact published executable
        shell: pwsh
        env:
          JUNHYUNHELPER_MAP_SMOKE: '1'
        run: |
          $workDir = (Resolve-Path 'artifacts/publish').Path
          $exe = Join-Path $workDir '준현 헬퍼.exe'
          $diagnostic = Join-Path $env:TEMP 'junhyun-map-smoke-error.txt'
          $success = Join-Path $env:TEMP 'junhyun-map-smoke-success.txt'
          Remove-Item $diagnostic,$success -Force -ErrorAction SilentlyContinue
          $p = Start-Process -FilePath $exe -WorkingDirectory $workDir -PassThru
          try {
            $deadline = (Get-Date).AddSeconds(75)
            $done = $false
            while ((Get-Date) -lt $deadline) {
              $p.Refresh()
              if (Test-Path $diagnostic) { Get-Content $diagnostic | ForEach-Object { Write-Host $_ }; throw 'Exact package smoke failed.' }
              if (Test-Path $success) { $done = $true; break }
              if ($p.HasExited) { throw "App exited early: $($p.ExitCode)" }
              Start-Sleep -Milliseconds 250
            }
            if (-not $done) { throw 'Exact package smoke timed out.' }
            $requested = $false
            for ($i=0; $i -lt 10; $i++) {
              $p.Refresh()
              if ($p.HasExited) { $requested=$true; break }
              if ($p.CloseMainWindow()) { $requested=$true; break }
              Start-Sleep -Milliseconds 500
            }
            if (-not $requested) { throw 'Could not request normal Main Window close.' }
            $p.Refresh()
            if (-not $p.HasExited -and -not $p.WaitForExit(7000)) { throw 'App did not exit normally.' }
            if (Test-Path (Join-Path $workDir 'Logs')) { throw 'Portable root was polluted with Logs.' }
          }
          finally {
            $p.Refresh()
            if (-not $p.HasExited) { Stop-Process -Id $p.Id -Force }
          }
          Write-Host 'Exact v1.1.2 Product UI + Scanner + Main Map + Factory + MiniMap smoke passed.'

      - name: Package release and checksum
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts/release | Out-Null
          $zip = Join-Path artifacts/release $env:ZIP_NAME
          Compress-Archive -Path 'artifacts/publish/*' -DestinationPath $zip -CompressionLevel Optimal
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $env:ZIP_NAME" | Set-Content artifacts/release/SHA256SUMS.txt -Encoding ascii
          @"
          # 준현 헬퍼 v1.1.2 — Scanner 제목 인식 회귀 수정

          v1.1.1에서 실제 Tarkov 상세창의 아이템 제목 대신 내부 영역/분류 행을 OCR할 수 있던 Scanner geometry/title-ROI 회귀를 수정한 PATCH 릴리즈입니다.

          ## 수정
          - 현재 관측 상세창 비율에 맞게 detail geometry 보정
          - 상/하/좌/우 외곽 프레임과 우상단 close-control을 함께 요구
          - 내부의 작은 고대비 사각형보다 외곽 상세창 우선
          - 제목 OCR ROI를 상세창 최상단 제목 한 줄로 축소해 분류/breadcrumb 행 제외
          - 엄격한 구조 조건에서도 프레임을 놓치지 않도록 탐색 정밀도 개선
          - early reject로 상세창 후보 탐색 비용 완화
          - matcher confidence/margin 및 fail-closed 정책은 변경하지 않음

          ## 검증
          - 244 automated tests
          - strong-inner-rectangle regression
          - title ROI category-row exclusion regression
          - Windows Release build / self-contained publish / actual EXE Product UI + Scanner + Map smoke

          Content schema v7 / user.db schema v1이며 migration은 없습니다.
          "@ | Set-Content artifacts/release/RELEASE_NOTES.md -Encoding utf8
          Write-Host "RELEASE_ZIP_SHA256=$hash"
          Write-Host "RELEASE_ZIP_BYTES=$((Get-Item $zip).Length)"

      - name: Create draft release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create $env:RELEASE_TAG `
            --repo $env:GITHUB_REPOSITORY `
            --target $env:RELEASE_SHA `
            --draft `
            --title '준현 헬퍼 v1.1.2 — Scanner 제목 인식 회귀 수정' `
            --notes-file artifacts/release/RELEASE_NOTES.md `
            "artifacts/release/$env:ZIP_NAME" `
            artifacts/release/SHA256SUMS.txt
          if ($LASTEXITCODE -ne 0) { throw 'Could not create draft v1.1.2 release.' }

          git fetch --force origin "refs/tags/$env:RELEASE_TAG:refs/tags/$env:RELEASE_TAG"
          if ($LASTEXITCODE -ne 0) { throw 'Could not fetch draft release tag.' }
          $tagSha = (git rev-list -n 1 $env:RELEASE_TAG).Trim()
          if ($tagSha -ne $env:RELEASE_SHA) { throw "Draft tag target mismatch: $tagSha" }
          Write-Host "DRAFT_TAG_TARGET=$tagSha"

      - name: Verify and smoke draft-downloaded package
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          JUNHYUNHELPER_MAP_SMOKE: '1'
        run: |
          New-Item -ItemType Directory -Force artifacts/draft-download | Out-Null
          gh release download $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --dir artifacts/draft-download --pattern $env:ZIP_NAME --pattern SHA256SUMS.txt
          if ($LASTEXITCODE -ne 0) { throw 'Could not download draft assets.' }

          $zip = Join-Path artifacts/draft-download $env:ZIP_NAME
          $checksum = Get-Content artifacts/draft-download/SHA256SUMS.txt | Where-Object { $_ -match [Regex]::Escape($env:ZIP_NAME) } | Select-Object -First 1
          if (-not $checksum) { throw 'Draft checksum entry missing.' }
          $expected = (($checksum -split '\s+')[0]).ToLowerInvariant()
          $actual = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw 'Draft ZIP checksum mismatch.' }

          Expand-Archive $zip artifacts/draft-extracted
          $productVersion = (Get-Item 'artifacts/draft-extracted/준현 헬퍼.exe').VersionInfo.ProductVersion
          if ($productVersion -notmatch '^1\.1\.2(?:$|[+-])') { throw "Draft ProductVersion mismatch: $productVersion" }
          $firstLine = Get-Content artifacts/draft-extracted/FIRST_RUN_KO.txt -TotalCount 1
          if ($firstLine -ne '준현 헬퍼 v1.1.2 — Windows x64') { throw "Draft FIRST_RUN mismatch: $firstLine" }

          $workDir = (Resolve-Path artifacts/draft-extracted).Path
          $exe = Join-Path $workDir '준현 헬퍼.exe'
          $diagnostic = Join-Path $env:TEMP 'junhyun-map-smoke-error.txt'
          $success = Join-Path $env:TEMP 'junhyun-map-smoke-success.txt'
          Remove-Item $diagnostic,$success -Force -ErrorAction SilentlyContinue
          $p = Start-Process -FilePath $exe -WorkingDirectory $workDir -PassThru
          try {
            $deadline = (Get-Date).AddSeconds(75); $done = $false
            while ((Get-Date) -lt $deadline) {
              $p.Refresh()
              if (Test-Path $diagnostic) { Get-Content $diagnostic | ForEach-Object { Write-Host $_ }; throw 'Draft smoke failed.' }
              if (Test-Path $success) { $done = $true; break }
              if ($p.HasExited) { throw "Draft app exited early: $($p.ExitCode)" }
              Start-Sleep -Milliseconds 250
            }
            if (-not $done) { throw 'Draft smoke timed out.' }
            $requested = $false
            for ($i=0; $i -lt 10; $i++) { $p.Refresh(); if ($p.HasExited) { $requested=$true; break }; if ($p.CloseMainWindow()) { $requested=$true; break }; Start-Sleep -Milliseconds 500 }
            if (-not $requested) { throw 'Could not close draft app normally.' }
            $p.Refresh(); if (-not $p.HasExited -and -not $p.WaitForExit(7000)) { throw 'Draft app remained alive.' }
          }
          finally { $p.Refresh(); if (-not $p.HasExited) { Stop-Process -Id $p.Id -Force } }

          Write-Host "DRAFT_ZIP_SHA256=$actual"
          Write-Host "DRAFT_ZIP_BYTES=$((Get-Item $zip).Length)"
          Write-Host 'Draft-downloaded v1.1.2 smoke passed.'

      - name: Publish verified release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release edit $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --draft=false --latest
          if ($LASTEXITCODE -ne 0) { throw 'Could not publish verified v1.1.2 release.' }
          $latest = gh api "repos/$env:GITHUB_REPOSITORY/releases/latest" --jq '.tag_name'
          if ($latest -ne $env:RELEASE_TAG) { throw "Latest release mismatch: $latest" }

      - name: Verify and smoke public-downloaded package
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          JUNHYUNHELPER_MAP_SMOKE: '1'
        run: |
          New-Item -ItemType Directory -Force artifacts/public-download | Out-Null
          gh release download $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --dir artifacts/public-download --pattern $env:ZIP_NAME --pattern SHA256SUMS.txt
          if ($LASTEXITCODE -ne 0) { throw 'Could not download public assets.' }

          $zip = Join-Path artifacts/public-download $env:ZIP_NAME
          $checksum = Get-Content artifacts/public-download/SHA256SUMS.txt | Where-Object { $_ -match [Regex]::Escape($env:ZIP_NAME) } | Select-Object -First 1
          if (-not $checksum) { throw 'Public checksum entry missing.' }
          $expected = (($checksum -split '\s+')[0]).ToLowerInvariant()
          $actual = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw 'Public ZIP checksum mismatch.' }

          Expand-Archive $zip artifacts/public-extracted
          $productVersion = (Get-Item 'artifacts/public-extracted/준현 헬퍼.exe').VersionInfo.ProductVersion
          if ($productVersion -notmatch '^1\.1\.2(?:$|[+-])') { throw "Public ProductVersion mismatch: $productVersion" }
          $firstLine = Get-Content artifacts/public-extracted/FIRST_RUN_KO.txt -TotalCount 1
          if ($firstLine -ne '준현 헬퍼 v1.1.2 — Windows x64') { throw "Public FIRST_RUN mismatch: $firstLine" }

          $workDir = (Resolve-Path artifacts/public-extracted).Path
          $exe = Join-Path $workDir '준현 헬퍼.exe'
          $diagnostic = Join-Path $env:TEMP 'junhyun-map-smoke-error.txt'
          $success = Join-Path $env:TEMP 'junhyun-map-smoke-success.txt'
          Remove-Item $diagnostic,$success -Force -ErrorAction SilentlyContinue
          $p = Start-Process -FilePath $exe -WorkingDirectory $workDir -PassThru
          try {
            $deadline = (Get-Date).AddSeconds(75); $done = $false
            while ((Get-Date) -lt $deadline) {
              $p.Refresh()
              if (Test-Path $diagnostic) { Get-Content $diagnostic | ForEach-Object { Write-Host $_ }; throw 'Public smoke failed.' }
              if (Test-Path $success) { $done = $true; break }
              if ($p.HasExited) { throw "Public app exited early: $($p.ExitCode)" }
              Start-Sleep -Milliseconds 250
            }
            if (-not $done) { throw 'Public smoke timed out.' }
            $requested = $false
            for ($i=0; $i -lt 10; $i++) { $p.Refresh(); if ($p.HasExited) { $requested=$true; break }; if ($p.CloseMainWindow()) { $requested=$true; break }; Start-Sleep -Milliseconds 500 }
            if (-not $requested) { throw 'Could not close public app normally.' }
            $p.Refresh(); if (-not $p.HasExited -and -not $p.WaitForExit(7000)) { throw 'Public app remained alive.' }
          }
          finally { $p.Refresh(); if (-not $p.HasExited) { Stop-Process -Id $p.Id -Force } }

          Write-Host "PUBLIC_ZIP_SHA256=$actual"
          Write-Host "PUBLIC_ZIP_BYTES=$((Get-Item $zip).Length)"
          Write-Host "PUBLIC_PRODUCT_VERSION=$productVersion"
          Write-Host "PUBLIC_RELEASE_SOURCE=$env:RELEASE_SHA"
          Write-Host 'Public-downloaded v1.1.2 smoke passed.'
