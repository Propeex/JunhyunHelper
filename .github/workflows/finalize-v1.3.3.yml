name: Finalize v1.3.3 public verification

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/finalize-v1.3.3.yml'

permissions:
  contents: write

env:
  SOURCE_SHA: 41bf5b8374ba774866aab4b60a25376d9b5548c2
  CONTROLLER_SHA: c17859b58774c3b8bf2f86b615a376539db75670
  RELEASE_VERSION: 1.3.3
  RELEASE_TAG: v1.3.3
  EXPECTED_TESTS: '263'
  FINAL_PR_CI: '32625223009'
  ASSET_NAME: Junhyun-Helper-v1.3.3-win-x64.zip
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  JUNHYUNHELPER_MAP_SMOKE: '1'

jobs:
  verify-public:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Verify public release independently
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          function Assert-Exit([string]$Message) {
            if ($LASTEXITCODE -ne 0) { throw "$Message (exit $LASTEXITCODE)." }
          }

          function Assert-Package([string]$Root) {
            foreach ($file in @('준현 헬퍼.exe','FIRST_RUN_KO.txt','Assets/tarkov_data.db')) {
              if (-not (Test-Path (Join-Path $Root $file))) { throw "Missing package file: $file" }
            }
            $rootNames = @(Get-ChildItem $Root | Select-Object -ExpandProperty Name | Sort-Object)
            $expectedRoot = @('Assets','FIRST_RUN_KO.txt','준현 헬퍼.exe') | Sort-Object
            if (Compare-Object $rootNames $expectedRoot) { throw "Package root mismatch: $($rootNames -join ', ')" }
            if (@(Get-ChildItem $Root -Recurse -File -Filter *.pdb).Count -gt 0) { throw 'Package contains PDB files.' }
            if (@(Get-ChildItem $Root -Recurse -File | Where-Object { $_.Extension -in @('.zip','.7z','.rar') }).Count -gt 0) { throw 'Package contains nested archives.' }
            $exe = Get-Item (Join-Path $Root '준현 헬퍼.exe')
            $expectedProduct = "$env:RELEASE_VERSION+$env:SOURCE_SHA"
            if ($exe.VersionInfo.ProductVersion -ne $expectedProduct) { throw "ProductVersion '$($exe.VersionInfo.ProductVersion)' != '$expectedProduct'." }
            $first = Get-Content (Join-Path $Root 'FIRST_RUN_KO.txt') -TotalCount 1
            if ($first -ne "준현 헬퍼 v$env:RELEASE_VERSION — Windows x64") { throw "FIRST_RUN identity mismatch: $first" }
          }

          function Invoke-ProductSmoke([string]$Root) {
            $exe = (Resolve-Path (Join-Path $Root '준현 헬퍼.exe')).Path
            $diagnostic = Join-Path $env:TEMP 'junhyun-map-smoke-error.txt'
            $success = Join-Path $env:TEMP 'junhyun-map-smoke-success.txt'
            $startupLog = Join-Path $env:LOCALAPPDATA 'JunhyunHelper/logs/startup.log'
            Remove-Item $diagnostic,$success,$startupLog -Force -ErrorAction SilentlyContinue
            $process = Start-Process -FilePath $exe -WorkingDirectory $Root -PassThru
            try {
              $deadline = (Get-Date).AddSeconds(75)
              while ((Get-Date) -lt $deadline) {
                $process.Refresh()
                if (Test-Path $diagnostic) { Get-Content $diagnostic | Write-Host; throw 'Public-downloaded EXE smoke diagnostic failure.' }
                if (Test-Path $startupLog) { Get-Content $startupLog | Write-Host; throw 'Public-downloaded EXE startup failure.' }
                if (Test-Path $success) { break }
                if ($process.HasExited) { throw "Public-downloaded EXE exited before smoke completion: $($process.ExitCode)" }
                Start-Sleep -Milliseconds 250
              }
              if (-not (Test-Path $success)) { throw 'Public-downloaded EXE smoke timed out.' }
              $closeRequested = $false
              for ($i=0; $i -lt 10; $i++) {
                $process.Refresh()
                if ($process.HasExited -or $process.CloseMainWindow()) { $closeRequested = $true; break }
                Start-Sleep -Milliseconds 500
              }
              if (-not $closeRequested) { throw 'Could not request normal MainWindow close.' }
              $process.Refresh()
              if (-not $process.HasExited -and -not $process.WaitForExit(7000)) { throw 'Public-downloaded EXE did not terminate after normal close.' }
              if (Test-Path (Join-Path $Root 'Logs')) { throw 'Public-downloaded EXE polluted the portable package root.' }
            }
            finally {
              $process.Refresh()
              if (-not $process.HasExited) { Stop-Process -Id $process.Id -Force }
            }
          }

          $releaseRun = $null
          for ($attempt=0; $attempt -lt 40; $attempt++) {
            $runs = gh api "repos/$env:GITHUB_REPOSITORY/actions/workflows/release-v1.3.3.yml/runs?event=push&branch=main&per_page=20" | ConvertFrom-Json
            Assert-Exit 'Could not query v1.3.3 release workflow runs'
            $releaseRun = @($runs.workflow_runs | Where-Object { $_.head_sha -eq $env:CONTROLLER_SHA } | Select-Object -First 1)
            if ($releaseRun.Count -gt 0 -and $releaseRun[0].status -eq 'completed') { $releaseRun = $releaseRun[0]; break }
            Start-Sleep -Seconds 15
          }
          if ($null -eq $releaseRun -or $releaseRun.status -ne 'completed') { throw 'Timed out waiting for the exact v1.3.3 release workflow.' }
          if ($releaseRun.conclusion -ne 'success') { throw "v1.3.3 release workflow conclusion is '$($releaseRun.conclusion)'." }
          $releaseRunId = [long]$releaseRun.id

          $release = gh api "repos/$env:GITHUB_REPOSITORY/releases/tags/$env:RELEASE_TAG" | ConvertFrom-Json
          Assert-Exit 'Could not read v1.3.3 public release'
          if ($release.draft -or $release.prerelease) { throw 'v1.3.3 is not a normal public stable release.' }
          if ($release.tag_name -ne $env:RELEASE_TAG) { throw "Release tag mismatch: $($release.tag_name)" }
          $assetNames = @($release.assets | Select-Object -ExpandProperty name | Sort-Object)
          $expectedAssets = @($env:ASSET_NAME,'SHA256SUMS.txt') | Sort-Object
          if (Compare-Object $assetNames $expectedAssets) { throw "Public release assets mismatch: $($assetNames -join ', ')" }

          $latest = gh api "repos/$env:GITHUB_REPOSITORY/releases/latest" | ConvertFrom-Json
          Assert-Exit 'Could not read latest public release'
          if ($latest.tag_name -ne $env:RELEASE_TAG) { throw "Latest public release is '$($latest.tag_name)', not '$env:RELEASE_TAG'." }

          $ref = gh api "repos/$env:GITHUB_REPOSITORY/git/ref/tags/$env:RELEASE_TAG" | ConvertFrom-Json
          Assert-Exit 'Could not read v1.3.3 tag ref'
          $tagSha = [string]$ref.object.sha
          if ([string]$ref.object.type -eq 'tag') {
            $tagObject = gh api "repos/$env:GITHUB_REPOSITORY/git/tags/$tagSha" | ConvertFrom-Json
            Assert-Exit 'Could not dereference annotated v1.3.3 tag'
            $tagSha = [string]$tagObject.object.sha
          }
          if ($tagSha -ne $env:SOURCE_SHA) { throw "Public tag points to '$tagSha', not '$env:SOURCE_SHA'." }

          Remove-Item artifacts/public-final -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force artifacts/public-final | Out-Null
          gh release download $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --dir artifacts/public-final --clobber
          Assert-Exit 'Could not independently download public v1.3.3 assets'
          $zip = Join-Path artifacts/public-final $env:ASSET_NAME
          $sumFile = Join-Path artifacts/public-final 'SHA256SUMS.txt'
          if (-not (Test-Path $zip) -or -not (Test-Path $sumFile)) { throw 'Public v1.3.3 assets are incomplete.' }
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          $bytes = [long](Get-Item $zip).Length
          $sumLine = Get-Content $sumFile | Where-Object { $_ -match [Regex]::Escape($env:ASSET_NAME) } | Select-Object -First 1
          if ($sumLine -notmatch '^([0-9a-fA-F]{64})\s{2,}(.+)$' -or $Matches[1].ToLowerInvariant() -ne $hash -or $Matches[2] -ne $env:ASSET_NAME) {
            throw 'Public SHA256SUMS.txt does not match the downloaded ZIP.'
          }

          $extracted = Join-Path artifacts 'public-final-extracted'
          Remove-Item $extracted -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force $extracted | Out-Null
          Expand-Archive $zip $extracted -Force
          Assert-Package (Resolve-Path $extracted).Path
          Invoke-ProductSmoke (Resolve-Path $extracted).Path

          $verifiedUtc = (Get-Date).ToUniversalTime().ToString('o')
          $record = [ordered]@{
            version = $env:RELEASE_TAG
            source_sha = $env:SOURCE_SHA
            tag_sha = $tagSha
            asset = $env:ASSET_NAME
            bytes = $bytes
            sha256 = $hash
            product_version = "$env:RELEASE_VERSION+$env:SOURCE_SHA"
            tests = [int]$env:EXPECTED_TESTS
            final_pr_ci = [long]$env:FINAL_PR_CI
            release_run = $releaseRunId
            release_workflow_success = $true
            public_latest_verified = $true
            exact_tag_source_verified = $true
            public_redownload_verified = $true
            public_exe_smoke = 'SUCCESS'
            verified_utc = $verifiedUtc
          }
          $record | ConvertTo-Json | Set-Content -Encoding utf8NoBOM docs/.release-v1.3.3-status.json

          $releaseDoc = @"
          # 준현 헬퍼 v1.3.3 공개 검증

          ## 릴리즈 식별자

          - 버전: **v1.3.3**
          - exact release source: `$env:SOURCE_SHA`
          - public tag source: `$tagSha`
          - asset: `$env:ASSET_NAME`
          - bytes: `$bytes`
          - SHA-256: `$hash`
          - ProductVersion: `$env:RELEASE_VERSION+$env:SOURCE_SHA`

          ## 검증

          - PR #145 final Windows CI `$env:FINAL_PR_CI`: SUCCESS
          - automated tests: **$env:EXPECTED_TESTS passed / 0 failed / 0 skipped**
          - exact-source release workflow: `$releaseRunId` — SUCCESS
          - public/latest: VERIFIED
          - exact public tag source: VERIFIED
          - independent public ZIP re-download + SHA256SUMS/layout/ProductVersion/FIRST_RUN: VERIFIED
          - public-downloaded Product UI + Scanner + Mini Scanner + Main Map + Factory + MiniMap smoke: SUCCESS

          ## Scanner v1.3.3

          - 실제 Tarkov 2048x1280 상세창 12개에서 측정한 long neutral top frame, red close/X, bounded left search-icon lane, 13×13 magnifier bright core를 title ROI의 authoritative 구조로 사용합니다.
          - first title glyph connected component는 더 이상 title ROI left edge를 결정하지 않습니다.
          - `HEADER_FRAME_LOCKED`와 68% 이상의 anchor score가 없으면 OCR identity path로 진행하지 않습니다.
          - raw Windows OCR과 current-catalog sanitation 후 matcher input을 진단에서 분리합니다.
          - normal confidence/top1-top2 margin 및 bounded unique one-edit safety는 완화하지 않았습니다.
          - 최고 상점가, flea avg24hPrice, RequiredTotal 및 사용자/content/settings schema 의미는 변경하지 않았습니다.

          검증 시각(UTC): `$verifiedUtc`
          "@
          [IO.File]::WriteAllText('docs/RELEASE_1.3.3.md', $releaseDoc.TrimStart(), [Text.UTF8Encoding]::new($false))

      - name: Commit public verification record
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/.release-v1.3.3-status.json docs/RELEASE_1.3.3.md
          git diff --cached --quiet && throw 'Public verification produced no repository changes.'
          git commit -m 'docs(release): finalize v1.3.3 public verification'
          git push origin HEAD:main
