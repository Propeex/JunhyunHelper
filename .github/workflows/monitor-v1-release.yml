name: Monitor final v1.0.0 release

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/monitor-v1-release.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RELEASE_RUN_ID: '32219746319'
      EXPECTED_RELEASE_WORKFLOW_HEAD: '312ef59a0f50bf3df43c9ebbc79e8a965d35d688'
      EXACT_RELEASE_SOURCE_SHA: '3147ad1b48c3d30df529d95b148c5c444a77d649'
      RELEASE_TAG: 'v1.0.0'
      ZIP_NAME: 'Junhyun-Helper-v1.0.0-win-x64.zip'

    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Record authoritative release result
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $repo = $env:GITHUB_REPOSITORY
          $runId = [int64]$env:RELEASE_RUN_ID

          $run = gh run view $runId --repo $repo --json databaseId,status,conclusion,headSha,createdAt,updatedAt,url | ConvertFrom-Json
          if ($run.status -ne 'completed' -or $run.conclusion -ne 'success') {
            throw "Release workflow is not successful: status=$($run.status), conclusion=$($run.conclusion)."
          }
          if ($run.headSha -ne $env:EXPECTED_RELEASE_WORKFLOW_HEAD) {
            throw "Release workflow head '$($run.headSha)' does not match '$env:EXPECTED_RELEASE_WORKFLOW_HEAD'."
          }

          $releaseInfo = gh release view $env:RELEASE_TAG `
            --repo $repo `
            --json tagName,name,isDraft,isPrerelease,targetCommitish,publishedAt,url,assets | ConvertFrom-Json
          if ($releaseInfo.tagName -ne $env:RELEASE_TAG) { throw 'v1.0.0 release tag could not be resolved.' }
          if ($releaseInfo.isDraft) { throw 'v1.0.0 is still a draft.' }
          if ($releaseInfo.isPrerelease) { throw 'v1.0.0 is unexpectedly a prerelease.' }

          $latestTag = gh api "repos/$repo/releases/latest" --jq '.tag_name'
          if ($latestTag -ne $env:RELEASE_TAG) {
            throw "Latest stable release is '$latestTag', expected '$env:RELEASE_TAG'."
          }

          $zipAsset = $releaseInfo.assets | Where-Object { $_.name -eq $env:ZIP_NAME } | Select-Object -First 1
          $checksumAsset = $releaseInfo.assets | Where-Object { $_.name -eq 'SHA256SUMS.txt' } | Select-Object -First 1
          if ($null -eq $zipAsset -or $null -eq $checksumAsset) {
            throw 'Required public release assets are missing.'
          }

          New-Item -ItemType Directory -Force release-download | Out-Null
          gh release download $env:RELEASE_TAG `
            --repo $repo `
            --dir release-download `
            --pattern $env:ZIP_NAME `
            --pattern 'SHA256SUMS.txt'
          if ($LASTEXITCODE -ne 0) { throw 'Could not download public v1.0.0 assets.' }

          $zipPath = Join-Path release-download $env:ZIP_NAME
          $actualHash = (Get-FileHash $zipPath -Algorithm SHA256).Hash.ToLowerInvariant()
          $actualSize = (Get-Item $zipPath).Length
          $checksumLine = Get-Content 'release-download/SHA256SUMS.txt' | Where-Object { $_ -match [Regex]::Escape($env:ZIP_NAME) } | Select-Object -First 1
          if ([string]::IsNullOrWhiteSpace($checksumLine)) { throw 'Public SHA256SUMS.txt is missing the ZIP entry.' }
          $expectedHash = (($checksumLine -split '\s+')[0]).ToLowerInvariant()
          if ($actualHash -ne $expectedHash) { throw "Public ZIP hash mismatch: $actualHash != $expectedHash" }
          if ([int64]$zipAsset.size -ne $actualSize) { throw "Release asset size mismatch: $($zipAsset.size) != $actualSize" }

          $releaseList = gh release list --repo $repo --limit 100 --json tagName,isDraft,isPrerelease | ConvertFrom-Json
          $v0Remaining = @($releaseList | Where-Object { $_.tagName -match '^v0\.' } | Select-Object -ExpandProperty tagName)
          if ($v0Remaining.Count -gt 0) { throw "v0.x releases remain: $($v0Remaining -join ', ')" }

          $runLog = gh run view $runId --repo $repo --log | Out-String
          $removedCount = $null
          $removedMatch = [Regex]::Match($runLog, 'Removed\s+(\d+)\s+v0\.x GitHub release\(s\)\. Latest stable remains v1\.0\.0\.')
          if ($removedMatch.Success) { $removedCount = [int]$removedMatch.Groups[1].Value }

          $publicProductVersion = $null
          $versionMatch = [Regex]::Match($runLog, 'PUBLIC_PRODUCT_VERSION=([^\r\n]+)')
          if ($versionMatch.Success) { $publicProductVersion = $versionMatch.Groups[1].Value.Trim() }

          $publicSmokePassed = $runLog.Contains('Public-downloaded v1.0.0 Product UI + Main Map + Factory + MiniMap + graceful shutdown smoke passed.')
          if (-not $publicSmokePassed) { throw 'Could not confirm the public-downloaded executable smoke success line.' }

          $record = [ordered]@{
            observedAtUtc = [DateTimeOffset]::UtcNow.ToString('O')
            releaseWorkflowRunId = $runId
            releaseWorkflowUrl = [string]$run.url
            releaseWorkflowHeadSha = [string]$run.headSha
            releaseWorkflowConclusion = [string]$run.conclusion
            exactReleaseSourceSha = $env:EXACT_RELEASE_SOURCE_SHA
            releaseTagExists = $true
            releaseTag = [string]$releaseInfo.tagName
            releaseName = [string]$releaseInfo.name
            releaseIsDraft = [bool]$releaseInfo.isDraft
            releaseIsPrerelease = [bool]$releaseInfo.isPrerelease
            releaseIsLatestStable = ($latestTag -eq $env:RELEASE_TAG)
            releaseTargetCommitish = [string]$releaseInfo.targetCommitish
            releasePublishedAt = [string]$releaseInfo.publishedAt
            releaseUrl = [string]$releaseInfo.url
            zipAssetName = [string]$zipAsset.name
            zipAssetSize = [int64]$zipAsset.size
            zipAssetDigest = [string]$zipAsset.digest
            downloadedZipSize = $actualSize
            downloadedZipSha256 = $actualHash
            checksumLine = [string]$checksumLine
            checksumAssetName = [string]$checksumAsset.name
            publicProductVersion = $publicProductVersion
            publicDownloadedExecutableSmokePassed = $publicSmokePassed
            removedV0ReleaseCount = $removedCount
            v0ReleaseTagsRemaining = $v0Remaining
          }

          $record | ConvertTo-Json -Depth 8 | Set-Content '.release-v1-monitor.json' -Encoding utf8

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .release-v1-monitor.json
          git commit -m 'Record authoritative v1.0.0 public release details'
          git push origin HEAD:main
