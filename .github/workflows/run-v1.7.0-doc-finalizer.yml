name: Run v1.7.0 documentation finalizer

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/run-v1.7.0-doc-finalizer.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply documentation finalization
        shell: pwsh
        run: |
          python scripts/finalize_v170_docs.py
          if ($LASTEXITCODE -ne 0) { throw 'v1.7.0 documentation finalizer failed.' }
          git diff --check
          if ($LASTEXITCODE -ne 0) { throw 'Documentation finalizer introduced whitespace errors.' }

      - name: Commit final documentation and remove temporary machinery
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git rm --ignore-unmatch `
            .github/workflows/release-v1.7.0.yml `
            .github/workflows/release-v1.7.0-public-proof.yml `
            .github/workflows/finalize-v1.7.0-docs.yml `
            .github/workflows/finalize-v1.7.0-docs-v2.yml `
            .github/workflows/run-v1.7.0-doc-finalizer.yml `
            scripts/finalize_v170_docs.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md docs
          git diff --cached --check
          if ($LASTEXITCODE -ne 0) { throw 'Final staged documentation has whitespace errors.' }
          git commit -m 'Finalize v1.7.0 public release documentation'
          if ($LASTEXITCODE -ne 0) { throw 'Could not create final documentation commit.' }
          git push origin HEAD:main
          if ($LASTEXITCODE -ne 0) { throw 'Could not push final documentation commit.' }
