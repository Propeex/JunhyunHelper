name: Release v0.1.6

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-v0.1.6.yml'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 18
    env:
      RELEASE_TAG: v0.1.6
      RELEASE_SHA: 0e4683409b62fd326c5605f1485be896e2216836
      RELEASE_ASSET: Junhyun-Helper-v0.1.6-win-x64.zip

    steps:
      - name: Checkout exact release code
        uses: actions/checkout@v4
        with:
          ref: 0e4683409b62fd326c5605f1485be896e2216836
          submodules: recursive

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build desktop
        run: dotnet build src/JunhyunHelper.Desktop/JunhyunHelper.Desktop.csproj --configuration Release

      - name: Test core
        shell: pwsh
        run: |
          $output = dotnet test tests/JunhyunHelper.Tests/JunhyunHelper.Tests.csproj --configuration Release 2>&1
          $output | ForEach-Object { Write-Host $_ }
          if ($LASTEXITCODE -ne 0) { throw 'Automated tests failed.' }
          if (($output -join "`n") -notmatch 'Passed:\s+190') {
            throw 'Expected 190 passing tests in the v0.1.6 release gate.'
          }
          if (($output -join "`n") -match 'Failed:\s+[1-9]') {
            throw 'At least one automated test failed.'
          }
          if (($output -join "`n") -match 'Skipped:\s+[1-9]') {
            throw 'At least one automated test was skipped.'
          }

      - name: Publish and validate Windows x64 package
        shell: pwsh
        run: |
          dotnet publish src/JunhyunHelper.Desktop/JunhyunHelper.Desktop.csproj `
            --configuration Release `
            --runtime win-x64 `
            --self-contained true `
            --output artifacts/publish `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true `
            -p:PublishTrimmed=false `
            -p:PublishReadyToRun=false `
            -p:DebugType=None `
            -p:DebugSymbols=false

          Copy-Item packaging/FIRST_RUN_KO.txt artifacts/publish/FIRST_RUN_KO.txt

          $exe = 'artifacts/publish/준현 헬퍼.exe'
          foreach ($required in @($exe, 'artifacts/publish/FIRST_RUN_KO.txt', 'artifacts/publish/Assets/tarkov_data.db')) {
            if (-not (Test-Path $required)) { throw "Missing release file: $required" }
          }

          $productVersion = (Get-Item $exe).VersionInfo.ProductVersion
          Write-Host "ProductVersion=$productVersion"
          if (-not $productVersion.StartsWith('0.1.6', [StringComparison]::Ordinal)) {
            throw "Expected executable ProductVersion 0.1.6, got '$productVersion'."
          }

          $guide = Get-Content 'artifacts/publish/FIRST_RUN_KO.txt' -Raw
          if ($guide -notmatch '준현 헬퍼 v0\.1\.6') { throw 'FIRST_RUN_KO.txt does not identify v0.1.6.' }
          if ($guide -notmatch 'Content schema.*v6') { throw 'FIRST_RUN_KO.txt does not document Content schema v6.' }

          $rootFiles = @(Get-ChildItem artifacts/publish -File)
          $unexpectedFiles = @($rootFiles | Where-Object { $_.Name -notin @('준현 헬퍼.exe', 'FIRST_RUN_KO.txt') })
          if ($unexpectedFiles.Count -gt 0) { throw "Unexpected root files: $($unexpectedFiles.Name -join ', ')" }

          $rootDirs = @(Get-ChildItem artifacts/publish -Directory)
          $unexpectedDirs = @($rootDirs | Where-Object { $_.Name -ne 'Assets' })
          if ($unexpectedDirs.Count -gt 0) { throw "Unexpected root directories: $($unexpectedDirs.Name -join ', ')" }

          $rootDlls = @(Get-ChildItem artifacts/publish -File -Filter *.dll)
          if ($rootDlls.Count -gt 0) { throw "Root DLLs leaked into release: $($rootDlls.Name -join ', ')" }
          if (Get-ChildItem artifacts/publish -Recurse -File -Filter *.pdb) { throw 'PDB leaked into release.' }
          if (Get-ChildItem artifacts/publish -Recurse -File -Filter *.zip) { throw 'Nested ZIP leaked into release.' }
          if (Test-Path 'artifacts/publish/Logs') { throw 'Logs directory leaked into release package.' }

          foreach ($forbidden in @(
            'AutoUpdater.NET.dll',
            'Microsoft.Web.WebView2.Core.dll',
            'Microsoft.Web.WebView2.WinForms.dll',
            'Microsoft.Web.WebView2.Wpf.dll',
            'WebView2Loader.dll',
            'Westermo.GraphX.Controls.dll',
            'Westermo.GraphX.Common.dll',
            'QuikGraph.dll')) {
            if (Get-ChildItem artifacts/publish -Recurse -File -Filter $forbidden) {
              throw "Forbidden legacy dependency leaked into release: $forbidden"
            }
          }

          Write-Host 'Validated release root:'
          Get-ChildItem artifacts/publish | Sort-Object Name | Select-Object Name,Length,PSIsContainer | Format-Table -AutoSize
          Write-Host "Total files: $(@(Get-ChildItem artifacts/publish -Recurse -File).Count)"

      - name: Startup + Main Map + Factory + MiniMap + graceful shutdown smoke
        shell: pwsh
        env:
          JUNHYUNHELPER_MAP_SMOKE: '1'
        run: |
          $exe = (Resolve-Path 'artifacts/publish/준현 헬퍼.exe').Path
          $diagnostic = Join-Path $env:TEMP 'junhyun-map-smoke-error.txt'
          $success = Join-Path $env:TEMP 'junhyun-map-smoke-success.txt'
          Remove-Item $diagnostic -Force -ErrorAction SilentlyContinue
          Remove-Item $success -Force -ErrorAction SilentlyContinue

          $process = Start-Process -FilePath $exe -WorkingDirectory artifacts/publish -PassThru
          try {
            $deadline = (Get-Date).AddSeconds(75)
            $smokeCompleted = $false
            while ((Get-Date) -lt $deadline) {
              $process.Refresh()

              if (Test-Path $diagnostic) {
                Write-Host 'Map smoke diagnostic:'
                Get-Content $diagnostic | ForEach-Object { Write-Host $_ }
                throw 'Published 준현 헬퍼 reported a Map smoke failure.'
              }

              if (Test-Path $success) {
                $smokeCompleted = $true
                break
              }

              if ($process.HasExited) {
                throw "Published 준현 헬퍼 exited before Map smoke completion with code $($process.ExitCode)."
              }

              Start-Sleep -Milliseconds 250
            }

            if (-not $smokeCompleted) {
              if (Test-Path $diagnostic) {
                Get-Content $diagnostic | ForEach-Object { Write-Host $_ }
              }
              throw 'Full Main Map/Factory/MiniMap smoke did not publish its success signal within 75 seconds.'
            }

            Write-Host 'FULL_MAP_FACTORY_MINIMAP_SMOKE=SUCCESS'

            $closeRequested = $false
            for ($attempt = 1; $attempt -le 10; $attempt++) {
              $process.Refresh()
              if ($process.HasExited) {
                $closeRequested = $true
                break
              }
              if ($process.CloseMainWindow()) {
                $closeRequested = $true
                break
              }
              Start-Sleep -Milliseconds 500
            }
            if (-not $closeRequested) { throw 'Could not request normal Main Window close.' }

            $process.Refresh()
            if (-not $process.HasExited -and -not $process.WaitForExit(7000)) {
              throw 'Process did not exit after Main Window close.'
            }
            if (Test-Path 'artifacts/publish/Logs') { throw 'Runtime Logs folder was created beside EXE.' }
            Write-Host 'GRACEFUL_SHUTDOWN=SUCCESS'
          }
          finally {
            $process.Refresh()
            if (-not $process.HasExited) { Stop-Process -Id $process.Id -Force }
          }

      - name: Package public asset
        shell: pwsh
        run: |
          if (Test-Path $env:RELEASE_ASSET) { Remove-Item $env:RELEASE_ASSET -Force }
          Compress-Archive -Path 'artifacts/publish/*' -DestinationPath $env:RELEASE_ASSET -CompressionLevel Optimal
          $hash = (Get-FileHash $env:RELEASE_ASSET -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $($env:RELEASE_ASSET)" | Set-Content SHA256SUMS.txt -Encoding ascii
          "RELEASE_ASSET_SHA256=$hash" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Public release SHA-256: $hash"

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          @'
          # 준현 헬퍼 v0.1.6

          Quest 선행조건과 특수 상인 접근 판정의 의미를 정정하고 데이터 업데이트 방어 검증을 강화한 정확도 패치입니다.

          ## Quest 선행조건
          - 서로 다른 `taskRequirements`는 AND, 한 requirement의 `status[]`는 OR로 유지
          - upstream이 이미 제공한 prerequisite 상태를 compatibility overlay가 덮어쓰지 않도록 수정
          - BTR Driver는 `A Helping Hand = Active` 의미를 보존하고, 누락된 후속 Quest에만 Active gate 보강
          - Ref는 GameMode별 검증된 unlock Quest의 Complete 의미를 보존하며 source gate가 있으면 그대로 사용
          - 기존 자동 수락 원칙 유지: 받을 수 있는 Quest는 Helper에서 즉시 수락한 것으로 간주

          ## Lightkeeper
          - `Getting Acquainted = Complete`를 모든 후속 Quest의 영구 ordinary prerequisite로 강제하지 않음
          - 최초 해금 후 접근 상실/Make Amends 복구가 가능한 실제 구조를 별도 special trader access로 모델링
          - 평상시 별도 설정 없이 자동 판정
          - 실제 접근 상실/복구가 발생한 경우에만 Quest 상세 화면에서 상태 동기화 가능
          - recoverable 접근 상실은 영구 불가능이 아니라 Locked로 처리

          ## 데이터 호환성과 검증
          - Content schema v6
          - v3~v5 content.db도 그대로 읽고 legacy BTR/Lightkeeper gate를 메모리에서 자동 정규화
          - user.db SQLite schema v1 유지, 기존 사용자 진행 보존
          - prerequisite self-reference / duplicate / missing quest / cycle 및 잘못된 special trader gate를 candidate activation 전에 차단
          - `globalVariable`, `dialogue`, 실제 완료 시각 기반 delay는 계속 `확인 필요`로 보존

          ## 검증
          - 190 automated tests passed / 0 failed / 0 skipped
          - Windows x64 self-contained single-file publish
          - ProductVersion 0.1.6 확인
          - startup + Main Map + Factory + MiniMap runtime smoke
          - 정상 Main Window close / process exit
          - 배포 루트 / PDB / root DLL / nested ZIP / runtime Logs 오염 검사
          - 공개 ZIP 재다운로드 후 SHA-256 재검증

          ## 데이터 업데이트
          - **v0.1.5 → v0.1.6:** 필수 데이터 업데이트 없음
          - 다음 정상 데이터 업데이트 성공 시 v6 content snapshot으로 저장
          - 기존 Profile / Quest 진행 / Inventory / Hideout / Map 설정 유지

          ## 실행
          `Junhyun-Helper-v0.1.6-win-x64.zip`을 압축 해제하고 `준현 헬퍼.exe`를 실행하세요. 별도 .NET 설치는 필요하지 않습니다.

          코드 서명은 아직 적용하지 않아 Windows SmartScreen 경고가 표시될 수 있습니다.
          '@ | Set-Content release-notes.md -Encoding utf8

          gh release view $env:RELEASE_TAG --repo 'Propeex/JunhyunHelper' *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:RELEASE_TAG $env:RELEASE_ASSET SHA256SUMS.txt --clobber --repo 'Propeex/JunhyunHelper'
            if ($LASTEXITCODE -ne 0) { throw 'Failed to upload v0.1.6 assets.' }
            gh release edit $env:RELEASE_TAG --target $env:RELEASE_SHA --title '준현 헬퍼 v0.1.6' --notes-file release-notes.md --repo 'Propeex/JunhyunHelper'
            if ($LASTEXITCODE -ne 0) { throw 'Failed to update v0.1.6 release.' }
          } else {
            gh release create $env:RELEASE_TAG $env:RELEASE_ASSET SHA256SUMS.txt `
              --target $env:RELEASE_SHA `
              --title '준현 헬퍼 v0.1.6' `
              --notes-file release-notes.md `
              --repo 'Propeex/JunhyunHelper'
            if ($LASTEXITCODE -ne 0) { throw 'Failed to create v0.1.6 release.' }
          }

      - name: Verify live public release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $releaseJson = gh release view $env:RELEASE_TAG --repo 'Propeex/JunhyunHelper' --json url,isDraft,isPrerelease,tagName,name,assets,publishedAt,targetCommitish
          if ($LASTEXITCODE -ne 0) { throw 'Could not read v0.1.6 release.' }
          $release = $releaseJson | ConvertFrom-Json
          if ($release.isDraft -or $release.isPrerelease) { throw 'v0.1.6 is not a final public release.' }
          if ($release.tagName -ne $env:RELEASE_TAG) { throw "Unexpected tag $($release.tagName)" }

          $names = @($release.assets | ForEach-Object { $_.name })
          if ($names.Count -ne 2) { throw "Expected exactly two release assets, got $($names.Count): $($names -join ', ')" }
          foreach ($required in @($env:RELEASE_ASSET, 'SHA256SUMS.txt')) {
            if ($required -notin $names) { throw "Missing public release asset: $required" }
          }

          New-Item -ItemType Directory release-check -Force | Out-Null
          gh release download $env:RELEASE_TAG --repo 'Propeex/JunhyunHelper' --pattern 'SHA256SUMS.txt' --dir release-check
          if ($LASTEXITCODE -ne 0) { throw 'Could not re-download SHA256SUMS.txt.' }
          gh release download $env:RELEASE_TAG --repo 'Propeex/JunhyunHelper' --pattern $env:RELEASE_ASSET --dir release-check
          if ($LASTEXITCODE -ne 0) { throw 'Could not re-download public Windows ZIP.' }

          $publishedHash = ((Get-Content release-check/SHA256SUMS.txt -Raw).Trim() -split '\s+')[0]
          $downloadedHash = (Get-FileHash (Join-Path release-check $env:RELEASE_ASSET) -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($publishedHash -ne $env:RELEASE_ASSET_SHA256 -or $downloadedHash -ne $env:RELEASE_ASSET_SHA256) {
            throw "Published checksum mismatch: manifest=$publishedHash downloaded=$downloadedHash expected=$($env:RELEASE_ASSET_SHA256)"
          }

          Write-Host "VERIFIED_RELEASE_URL=$($release.url)"
          Write-Host "VERIFIED_RELEASE_SHA256=$downloadedHash"
