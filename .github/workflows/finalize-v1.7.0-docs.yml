          - reviewed Ground Truth 없이 Scanner live recognition threshold/candidate cap은 변경하지 않음

          상세: `docs/RELEASE_NOTES_V1.7.0.md`
          '@.Replace('          ', '')
          Replace-RegexOnce 'README.md' '## v1\.6\.0 주요 변경\n.*?(?=## Scanner)' $readmeChanges
