name: Apply v1.2.1 release prep

on:
  push:
    branches:
      - v1.2.1-stability-accuracy-hardening

permissions:
  contents: write

jobs:
  patch:
    if: github.ref_name == 'v1.2.1-stability-accuracy-hardening'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v1.2.1-stability-accuracy-hardening
          fetch-depth: 0

      - name: Apply release identity and canonical docs
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if new in text:
                  return
              if text.count(old) != 1:
                  raise SystemExit(f'{path}: replacement precondition failed')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          replace_once('src/JunhyunHelper.Desktop/JunhyunHelper.Desktop.csproj', '<Version>1.2.0</Version>', '<Version>1.2.1</Version>')

          p = Path('packaging/FIRST_RUN_KO.txt')
          text = p.read_text(encoding='utf-8')
          if text.startswith('준현 헬퍼 v1.2.0 — Windows x64'):
              text = text.replace('준현 헬퍼 v1.2.0 — Windows x64', '준현 헬퍼 v1.2.1 — Windows x64', 1)
          elif not text.startswith('준현 헬퍼 v1.2.1 — Windows x64'):
              raise SystemExit('FIRST_RUN_KO version header mismatch')
          marker = 'v1.2.0 주요 변경 — Scanner 제목 인식 구조 전면 보강\n'
          section = '''v1.2.1 주요 변경 — Scanner 안정성·정확성 하드닝
- 실사용 데이터가 필요한 인식 임계값 튜닝은 하지 않고 코드/자동 검증으로 확정할 수 있는 안정성·정확성 문제를 보완했습니다.
- Tarkov resources.assets 제목 폰트 탐색을 bounded streaming scan으로 바꿔 전체 asset의 대형 임시 메모리 적재를 제거했습니다.
- Bender/Noto 로컬 폰트 캐시를 Tarkov 원본 세대와 묶고 실제 폰트 바이너리 해시를 시각 템플릿 세대에 연결합니다.
- 시각 대조 템플릿 캐시에 상한을 두고 폰트 세대가 바뀌면 과거 템플릿을 폐기합니다.
- Mini Scanner 인벤토리/창고 OCR은 동시에 하나만 수행하며 반복 요청을 최신 요청으로 합치고 오래된 결과를 거부합니다.
- 1회 고정밀 스캔과 프로필/GameMode 감시를 직렬화해 이전 mode/context가 뒤늦게 되살아나지 않게 했습니다.
- 종료 시 진행 중인 font-aware recognition이 끝난 뒤 Skia/font 자원을 해제합니다.
- PrintWindow 유효성 검사에서 1440p/4K 전체 프레임의 불필요한 두 번째 managed 복사를 제거했습니다.
- 제목 anchor 진단 점수는 존재 여부가 아니라 실제 검출 점수를 보존합니다.
- 기존 OCR 우선, 보수적 confidence/top1-top2 margin, 애매하면 미표시, scan-time network 및 game-memory/injection/packet 금지 계약은 유지합니다.
- Content schema, user.db schema, Scanner 표시 설정 schema는 변경하지 않습니다.

'''
          if section not in text:
              if text.count(marker) != 1:
                  raise SystemExit('FIRST_RUN_KO release section marker mismatch')
              text = text.replace(marker, section + marker, 1)
          p.write_text(text, encoding='utf-8')

          p = Path('docs/ARCHITECTURE.md')
          text = p.read_text(encoding='utf-8')
          text = text.replace('기준일: 2026-08-21', '기준일: 2026-08-22', 1)
          old = '현재 기준선: **`v1.1.4 PUBLIC RELEASE / VERIFIED`**. release source는 `833ac66c522632a695d106bd7ca9b1d6bfc030dc`이며 공개 ZIP 재다운로드와 실제 EXE smoke까지 검증했습니다.'
          new = '현재 공개 기준선은 **`v1.2.0 PUBLIC RELEASE / VERIFIED`**이며, v1.2.1은 Scanner deterministic 안정성·정확성 하드닝 release candidate입니다. live Tarkov 데이터가 필요한 confidence/geometry 임계값은 추측해서 변경하지 않습니다.'
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit('ARCHITECTURE baseline mismatch')
          start = text.index('## 8. Scanner subsystem')
          end = text.index('## 9. Program update')
          section = '''## 8. Scanner subsystem

Scanner는 화면 픽셀을 current official Korean item catalog의 Item ID에 연결합니다. Scanner Lab v3.8 structural candidate architecture를 geometry 기준으로 유지하고, v1.2.0 title-anchor/character-policy/Tarkov-font recovery 위에 v1.2.1 lifecycle/cache hardening을 적용합니다.

### 8.1 구성

```text
ScannerCoordinator
├─ ScannerSettingsService
├─ ScannerCatalogService
├─ ScannerRuntimeService
│  ├─ ScannerLab38InspectDetector → ScannerTitleAnchorRefiner
│  ├─ FontAwareScannerOcrEngine
│  │  ├─ SerializedScannerOcrEngine → Windows ko-KR OCR
│  │  ├─ TarkovTitleFontProvider
│  │  ├─ ScannerTitleFontVerifier
│  │  └─ ScannerFullCatalogVisualMatcher
│  └─ ScannerItemPresentationService
└─ MiniScannerOverlayService → ScannerInventoryContextDetector
```

Title OCR과 inventory-context OCR은 하나의 serialized WinRT OCR 경계를 공유하지만 inventory-context detector에는 item-name font recovery를 연결하지 않습니다.

### 8.2 Recognition data flow

```text
Tarkov/display pixels
→ Scanner Lab v3.8 structural candidates
→ close + magnifier + title-field refinement
→ magnifier-free title ROI (불확실하면 geometry fallback)
→ Windows ko-KR OCR + current-catalog character policy
→ official-name semantic resolver
   OR 실패/손상 시 current official catalog 안에서만 Tarkov-font visual recovery
→ confidence + top1/top2 margin
→ Item ID or fail closed
→ local presentation
→ Mini Scanner
```

Structural/anchor/icon/visual score 하나만으로 Item identity를 확정하지 않습니다. current official Item ID/name catalog가 identity 권위입니다.

### 8.3 Tarkov title-font generation

게임 폰트 바이너리는 제품에 번들하지 않습니다.

```text
EscapeFromTarkov_Data/resources.assets (read-only)
→ bounded streaming SFNT discovery
→ local Bender regular/bold + Noto Sans CJK KR cache
→ source manifest + font SHA-256 generation key
→ bounded generation-aware visual template caches
```

source/font generation이 달라지면 loaded typeface와 rendered masks를 재사용하지 않습니다. 부분 추출/손상 cache는 visual recovery만 fail-soft로 건너뛰며 primary OCR을 손상시키지 않습니다.

### 8.4 Runtime/lifecycle

- continuous path는 동일 quantized geometry의 안정 관측 후 semantic recognition을 수행합니다.
- verified bounds/title signature가 유지되면 OCR 반복을 억제하고 presentation만 갱신합니다.
- Mini Scanner inventory/stash OCR probe는 동시에 최대 1개이며 최신 요청으로 coalesce합니다.
- item/visibility epoch가 바뀐 old probe 결과는 적용하지 않습니다.
- one-shot은 continuous loop 실제 종료 뒤 shared state를 사용하고 최신 설정이 같은 mode를 요청할 때만 복구합니다.
- profile/GameMode monitor는 one-shot gate 뒤 최신 context를 다시 읽습니다.
- font-aware OCR은 active-operation lease로 진행 중 recovery 종료 뒤 Skia/font resource를 해제합니다.

### 8.5 Capture allocation

`PrintWindow` 사전 유효성 검사는 locked bitmap의 sparse pixels를 직접 읽습니다. 1440p/4K 전체 프레임의 별도 managed copy를 만들지 않으며 detector에 필요한 실제 normalized BGRA copy만 유지합니다.

### 8.6 Item data bridge

```text
Item ID
→ Scanner catalog: official name / market / dimensions / icon URL
→ GameContentCatalog + ItemsWorkspace.RequiredTotal
→ ScannerItemSnapshot
→ Mini Scanner
```

최고 상점가/플리 평균가/slot/price-per-slot은 각각 유효한 field만 표시하며 현재 필요한 수량은 `RequiredTotal`입니다.

### 8.7 Diagnostics / 금지 경계

`ScannerDiagnosticLog`는 bounded metadata log이고 최신 `인식 이미지` 한 장은 process memory에만 존재합니다. title-anchor diagnostics는 actual component score를 보존합니다.

금지: game memory read, DLL injection, packet interception, process-internal data read, scan-time HTTP, icon 단독 identity, live 근거 없는 confidence/margin 완화.

'''
          p.write_text(text[:start] + section + text[end:], encoding='utf-8')

          p = Path('docs/SCANNER.md')
          text = p.read_text(encoding='utf-8')
          old = '상태: **`v1.2.0 PUBLIC RELEASE / VERIFIED / SCANNER LAB v3.8 CONTRACT PRESERVED / LIVE TARKOV E2E ONGOING`**'
          new = '상태: **`v1.2.0 PUBLIC BASELINE / v1.2.1 RELEASE CANDIDATE / SCANNER LAB v3.8 CONTRACT PRESERVED / LIVE TARKOV E2E ONGOING`**'
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit('SCANNER status mismatch')
          marker = '## 2. Capture mode\n'
          section = '''## 1.1 v1.2.1 deterministic hardening

v1.2.1은 live Tarkov evidence가 필요한 recognition threshold를 추측해서 조정하지 않는 PATCH입니다. v1.2.0의 인식 의미를 유지하면서 font generation/cache, Mini Scanner OCR coalescing, one-shot/context lifecycle, shutdown resource lifetime, PrintWindow allocation, anchor diagnostics를 보강합니다.

변경하지 않는 것: Scanner Lab v3.8 structural floor, OCR/visual confidence, top1/top2 margin, current official catalog identity, two-anchor inventory gate, scan-time network/game-memory/injection/packet 금지 경계.

실제 플레이 miss/false-positive evidence는 `scanner.log`와 `인식 이미지`를 근거로 별도 후속 calibration에 사용합니다.

'''
          if section not in text:
              if text.count(marker) != 1:
                  raise SystemExit('SCANNER section marker mismatch')
              text = text.replace(marker, section + marker, 1)
          p.write_text(text, encoding='utf-8')
          PY

      - name: Commit release prep
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Release prep already applied."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/JunhyunHelper.Desktop/JunhyunHelper.Desktop.csproj packaging/FIRST_RUN_KO.txt docs/ARCHITECTURE.md docs/SCANNER.md
          git commit -m "Prepare v1.2.1 release identity and architecture"
          git push origin HEAD:v1.2.1-stability-accuracy-hardening
