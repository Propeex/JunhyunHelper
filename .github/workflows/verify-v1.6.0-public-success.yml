name: Verify v1.6.0 Public Success

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-v1.6.0-public-success.yml'

permissions:
  contents: write

jobs:
  verify-public:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      VERSION: 1.6.0
      TAG: v1.6.0
      SOURCE_SHA: c58b5cd3b3128ff6dce5a2221a453bc56aa41c37
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Wait for and verify anonymous public release
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $repo = $env:GITHUB_REPOSITORY
          $headers = @{
            'User-Agent' = 'JunhyunHelper-Public-Verifier'
            'Accept' = 'application/vnd.github+json'
            'X-GitHub-Api-Version' = '2022-11-28'
          }

          $latestUri = "https://api.github.com/repos/$repo/releases/latest"
          $release = $null
          $deadline = (Get-Date).AddMinutes(7)
          while ((Get-Date) -lt $deadline) {
            try {
              $candidate = Invoke-RestMethod -Uri $latestUri -Headers $headers -Method Get
              if ($candidate.tag_name -eq $env:TAG -and -not $candidate.draft -and -not $candidate.prerelease) {
                $release = $candidate
                break
              }
              Write-Host "Public latest is '$($candidate.tag_name)'; waiting for $env:TAG..."
            }
            catch {
              Write-Host "Public latest check not ready: $($_.Exception.Message)"
            }
            Start-Sleep -Seconds 20
          }
          if ($null -eq $release) {
            throw "Public stable/latest did not become $env:TAG within the verifier window."
          }

          $expectedAssets = @(
            '준현 헬퍼.zip',
            "Junhyun-Helper-v$env:VERSION-win-x64.zip",
            'SHA256SUMS.txt'
          )
          foreach ($assetName in $expectedAssets) {
            $matches = @($release.assets | Where-Object { $_.name -eq $assetName })
            if ($matches.Count -ne 1) {
              throw "Public release does not contain exactly one '$assetName' asset."
            }
            $uri = [Uri]$matches[0].browser_download_url
            if ($uri.Scheme -ne 'https' -or $uri.Host -ne 'github.com' -or
                -not $uri.AbsolutePath.StartsWith('/Propeex/JunhyunHelper/releases/download/', [System.StringComparison]::OrdinalIgnoreCase)) {
              throw "Unexpected public asset URL for '$assetName': $uri"
            }
          }

          New-Item -ItemType Directory -Path artifacts/public -Force | Out-Null
          foreach ($assetName in $expectedAssets) {
            $asset = @($release.assets | Where-Object { $_.name -eq $assetName })[0]
            $destination = Join-Path artifacts/public $assetName
            Invoke-WebRequest -Uri $asset.browser_download_url -Headers $headers -OutFile $destination
            if (-not (Test-Path $destination) -or (Get-Item $destination).Length -le 0) {
              throw "Anonymous public download failed for '$assetName'."
            }
          }

          $tagLine = (git ls-remote https://github.com/Propeex/JunhyunHelper.git "refs/tags/$env:TAG")
          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($tagLine)) {
            throw "Could not resolve public tag $env:TAG."
          }
          $tagSha = ($tagLine -split '\s+')[0]
          if (-not [string]::Equals($tagSha, $env:SOURCE_SHA, [System.StringComparison]::OrdinalIgnoreCase)) {
            throw "Public tag $env:TAG points to $tagSha, expected $env:SOURCE_SHA."
          }

          $release | ConvertTo-Json -Depth 8 | Set-Content artifacts/public/latest-release.json -Encoding utf8
          Write-Host "Anonymous public latest verified: $($release.tag_name)"
          Write-Host "Public tag source verified: $tagSha"

      - name: Verify public checksums and package layouts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $stableName = '준현 헬퍼.zip'
          $bridgeName = "Junhyun-Helper-v$env:VERSION-win-x64.zip"
          $stablePath = Join-Path artifacts/public $stableName
          $bridgePath = Join-Path artifacts/public $bridgeName
          $checksumPath = 'artifacts/public/SHA256SUMS.txt'
          $checksumLines = @(Get-Content $checksumPath | Where-Object { -not [string]::IsNullOrWhiteSpace($_) })

          foreach ($packageName in @($stableName, $bridgeName)) {
            $packagePath = Join-Path artifacts/public $packageName
            $actualHash = (Get-FileHash $packagePath -Algorithm SHA256).Hash.ToLowerInvariant()
            $matches = @($checksumLines | Where-Object {
              $_ -match '^([0-9a-fA-F]{64})\s+(.+)$' -and
              [string]::Equals($Matches[2], $packageName, [System.StringComparison]::Ordinal)
            })
            if ($matches.Count -ne 1) {
              throw "Public SHA256SUMS does not contain exactly one entry for '$packageName'."
            }
            if ($matches[0] -notmatch '^([0-9a-fA-F]{64})\s+(.+)$') {
              throw "Malformed public checksum entry for '$packageName'."
            }
            if ($Matches[1].ToLowerInvariant() -ne $actualHash) {
              throw "Public checksum mismatch for '$packageName'."
            }
            Write-Host "$packageName / bytes=$((Get-Item $packagePath).Length) / sha256=$actualHash"
          }

          $stableExtract = 'artifacts/public-stable'
          $bridgeExtract = 'artifacts/public-bridge'
          Expand-Archive -LiteralPath $stablePath -DestinationPath $stableExtract -Force
          Expand-Archive -LiteralPath $bridgePath -DestinationPath $bridgeExtract -Force

          $stableTop = @(Get-ChildItem $stableExtract -Force)
          if ($stableTop.Count -ne 1 -or -not $stableTop[0].PSIsContainer -or $stableTop[0].Name -ne '준현 헬퍼') {
            throw 'Public stable ZIP does not contain exactly one top-level 준현 헬퍼/ directory.'
          }
          $stableRoot = Join-Path $stableExtract '준현 헬퍼'

          $bridgeTop = @(Get-ChildItem $bridgeExtract -Force)
          $unexpectedBridgeTop = @($bridgeTop | Where-Object { $_.Name -notin @('준현 헬퍼.exe','FIRST_RUN_KO.txt','Assets') })
          if ($unexpectedBridgeTop.Count -gt 0) {
            throw "Public bridge ZIP contains unexpected root entries: $($unexpectedBridgeTop.Name -join ', ')"
          }

          foreach ($relative in @('준현 헬퍼.exe','FIRST_RUN_KO.txt','Assets/tarkov_data.db')) {
            if (-not (Test-Path (Join-Path $stableRoot $relative))) { throw "Public stable ZIP missing '$relative'." }
            if (-not (Test-Path (Join-Path $bridgeExtract $relative))) { throw "Public bridge ZIP missing '$relative'." }
          }

          foreach ($root in @($stableRoot, $bridgeExtract)) {
            if (Get-ChildItem $root -Recurse -File -Filter *.pdb) { throw "Public package contains PDB files: $root" }
            $nested = @(Get-ChildItem $root -Recurse -File | Where-Object { $_.Extension -in @('.zip','.7z','.rar') })
            if ($nested.Count -gt 0) { throw "Public package contains a nested archive: $root" }
          }

          function Get-PayloadManifest([string]$Root) {
            @(Get-ChildItem $Root -Recurse -File | ForEach-Object {
              $relative = $_.FullName.Substring($Root.Length).TrimStart('\\','/').Replace('\\','/')
              [pscustomobject]@{
                Path = $relative
                Length = $_.Length
                Hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
              }
            } | Sort-Object Path)
          }
          $stableManifest = Get-PayloadManifest $stableRoot
          $bridgeManifest = Get-PayloadManifest $bridgeExtract
          if (($stableManifest | ConvertTo-Json -Compress) -ne ($bridgeManifest | ConvertTo-Json -Compress)) {
            throw 'Public stable and v1.5 bridge ZIPs do not contain identical product payloads.'
          }

          $exe = Join-Path $stableRoot '준현 헬퍼.exe'
          $productVersion = (Get-Item $exe).VersionInfo.ProductVersion
          $expectedProductVersion = "$env:VERSION+$env:SOURCE_SHA"
          if (-not [string]::Equals($productVersion, $expectedProductVersion, [System.StringComparison]::Ordinal)) {
            throw "Public ProductVersion '$productVersion' does not match '$expectedProductVersion'."
          }
          $firstLine = Get-Content (Join-Path $stableRoot 'FIRST_RUN_KO.txt') -TotalCount 1
          if ($firstLine -ne "준현 헬퍼 v$env:VERSION — Windows x64") {
            throw "Public FIRST_RUN identity mismatch: '$firstLine'."
          }

      - name: Smoke public-downloaded stable executable
        shell: pwsh
        env:
          JUNHYUNHELPER_MAP_SMOKE: '1'
        run: |
          $ErrorActionPreference = 'Stop'
          $root = (Resolve-Path 'artifacts/public-stable/준현 헬퍼').Path
          $exe = Join-Path $root '준현 헬퍼.exe'
          $diagnostic = Join-Path $env:TEMP 'junhyun-map-smoke-error.txt'
          $success = Join-Path $env:TEMP 'junhyun-map-smoke-success.txt'
          $startupLog = Join-Path $env:LOCALAPPDATA 'JunhyunHelper/logs/startup.log'
          Remove-Item $diagnostic,$success,$startupLog -Force -ErrorAction SilentlyContinue

          $process = Start-Process -FilePath $exe -WorkingDirectory $root -PassThru
          try {
            $deadline = (Get-Date).AddSeconds(75)
            while ((Get-Date) -lt $deadline -and -not (Test-Path $success)) {
              $process.Refresh()
              if (Test-Path $diagnostic) { throw "Public-downloaded EXE smoke failed: $(Get-Content $diagnostic -Raw)" }
              if ($process.HasExited) { throw "Public-downloaded EXE exited early: $($process.ExitCode)" }
              Start-Sleep -Milliseconds 250
            }
            if (-not (Test-Path $success)) { throw 'Public-downloaded EXE smoke timed out.' }
            if (-not $process.CloseMainWindow()) { throw 'Could not normally close public-downloaded EXE.' }
            if (-not $process.WaitForExit(7000)) { throw 'Public-downloaded EXE did not terminate after close.' }
            if (Test-Path (Join-Path $root 'Logs')) { throw 'Public portable root was polluted by Logs.' }
          }
          finally {
            $process.Refresh()
            if (-not $process.HasExited) { Stop-Process -Id $process.Id -Force }
          }

      - name: Record independent public verification
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $repo = $env:GITHUB_REPOSITORY
          $release = Get-Content artifacts/public/latest-release.json -Raw | ConvertFrom-Json
          $stablePath = 'artifacts/public/준현 헬퍼.zip'
          $bridgePath = "artifacts/public/Junhyun-Helper-v$env:VERSION-win-x64.zip"
          $productVersion = (Get-Item 'artifacts/public-stable/준현 헬퍼/준현 헬퍼.exe').VersionInfo.ProductVersion

          $controllerRunId = $null
          $controllerDeadline = (Get-Date).AddMinutes(3)
          while ((Get-Date) -lt $controllerDeadline -and $null -eq $controllerRunId) {
            $runs = gh api "repos/$repo/actions/workflows/release-v1.6.0.yml/runs?event=push&per_page=10" | ConvertFrom-Json
            $successful = @($runs.workflow_runs | Where-Object { $_.conclusion -eq 'success' } | Sort-Object created_at -Descending)
            if ($successful.Count -gt 0) {
              $controllerRunId = [long]$successful[0].id
              break
            }
            Start-Sleep -Seconds 10
          }
          if ($null -eq $controllerRunId) {
            throw 'Could not confirm a successful v1.6.0 release-controller run.'
          }

          $status = [ordered]@{
            version = $env:VERSION
            source_sha = $env:SOURCE_SHA
            release_controller_run_id = $controllerRunId
            independent_public_verifier_run_id = [long]$env:GITHUB_RUN_ID
            stable_asset = '준현 헬퍼.zip'
            stable_bytes = (Get-Item $stablePath).Length
            stable_sha256 = (Get-FileHash $stablePath -Algorithm SHA256).Hash.ToLowerInvariant()
            bridge_asset = "Junhyun-Helper-v$env:VERSION-win-x64.zip"
            bridge_bytes = (Get-Item $bridgePath).Length
            bridge_sha256 = (Get-FileHash $bridgePath -Algorithm SHA256).Hash.ToLowerInvariant()
            checksum_asset = 'SHA256SUMS.txt'
            product_version = $productVersion
            published_at_utc = [string]$release.published_at
            verified_at_utc = [DateTime]::UtcNow.ToString('o')
            public_latest_verified = $true
            exact_public_tag_source_verified = $true
            public_redownload_verified = $true
            public_checksums_verified = $true
            stable_layout_verified = $true
            bridge_layout_verified = $true
            stable_bridge_payload_equal = $true
            public_exe_smoke = 'SUCCESS'
            graceful_shutdown = 'SUCCESS'
          }
          $json = $status | ConvertTo-Json
          [System.IO.File]::WriteAllText((Resolve-Path artifacts).Path + '\v1.6.0-public-status.json', $json, [System.Text.UTF8Encoding]::new($false))

          $encoded = [Convert]::ToBase64String([System.Text.Encoding]::UTF8.GetBytes($json))
          $apiPath = "repos/$repo/contents/docs/.release-v1.6.0-status.json"
          $existingJson = gh api $apiPath 2>$null
          $existingSha = $null
          if ($LASTEXITCODE -eq 0) { $existingSha = ($existingJson | ConvertFrom-Json).sha }
          $args = @('--method','PUT',$apiPath,'-f','message=Record verified public v1.6.0 release','-f',"content=$encoded",'-f','branch=main')
          if (-not [string]::IsNullOrWhiteSpace($existingSha)) { $args += @('-f',"sha=$existingSha") }
          gh api @args | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'Could not persist public release status.' }

          $status | Format-List

      - name: Upload independent verifier status
        uses: actions/upload-artifact@v4
        with:
          name: v1.6.0-public-verifier-status
          path: artifacts/v1.6.0-public-status.json
          if-no-files-found: error
          retention-days: 14
