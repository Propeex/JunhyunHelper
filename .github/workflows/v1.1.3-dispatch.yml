name: Dispatch v1.1.3 Release

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/release-v1.1.3.dispatch'

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Dispatch and watch v1.1.3 release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail

          if [[ ! "$SOURCE_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "Invalid exact main source SHA: $SOURCE_SHA" >&2
            exit 1
          fi

          before_ids="$(gh run list \
            --repo "$GITHUB_REPOSITORY" \
            --workflow release-v1.1.3-v3.yml \
            --limit 20 \
            --json databaseId \
            --jq '.[].databaseId' || true)"

          echo "Dispatching release-v1.1.3-v3.yml for exact main SHA: $SOURCE_SHA"
          gh workflow run release-v1.1.3-v3.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f source_sha="$SOURCE_SHA"

          run_id=""
          for _ in $(seq 1 60); do
            candidates="$(gh run list \
              --repo "$GITHUB_REPOSITORY" \
              --workflow release-v1.1.3-v3.yml \
              --limit 20 \
              --json databaseId,event \
              --jq '.[] | select(.event == "workflow_dispatch") | .databaseId' || true)"
            for candidate in $candidates; do
              if ! grep -qx "$candidate" <<< "$before_ids"; then
                run_id="$candidate"
                break 2
              fi
            done
            sleep 2
          done

          if [[ -z "$run_id" ]]; then
            echo 'Could not discover dispatched release run.' >&2
            exit 1
          fi

          echo "RELEASE_RUN_ID=$run_id"
          gh run watch "$run_id" --repo "$GITHUB_REPOSITORY" --exit-status

          conclusion="$(gh run view "$run_id" \
            --repo "$GITHUB_REPOSITORY" \
            --json conclusion \
            --jq '.conclusion')"
          echo "RELEASE_RUN_CONCLUSION=$conclusion"
          echo "RELEASE_SOURCE_SHA=$SOURCE_SHA"

          if [[ "$conclusion" != "success" ]]; then
            exit 1
          fi
