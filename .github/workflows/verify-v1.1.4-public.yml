name: Verify public v1.1.4

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-v1.1.4-public.yml'

permissions:
  contents: write

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 12
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RELEASE_TAG: v1.1.4
      RELEASE_VERSION: 1.1.4
      SOURCE_SHA: 833ac66c522632a695d106bd7ca9b1d6bfc030dc
      JUNHYUNHELPER_MAP_SMOKE: '1'

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Verify public release end-to-end
        id: public_verify
        continue-on-error: true
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $result = [ordered]@{
            release = $env:RELEASE_TAG
            source_sha = $env:SOURCE_SHA
            verification_run_id = '${{ github.run_id }}'
            verification_run_url = "https://github.com/$env:GITHUB_REPOSITORY/actions/runs/${{ github.run_id }}"
            conclusion = 'failure'
            recorded_at_utc = [DateTimeOffset]::UtcNow.ToString('O')
          }

          try {
            $release = gh release view $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --json url,isDraft,tagName,publishedAt | ConvertFrom-Json
            if ($LASTEXITCODE -ne 0) { throw 'Could not read v1.1.4 release.' }
            if ($release.isDraft) { throw 'v1.1.4 is still a Draft release.' }
            if ($release.tagName -ne $env:RELEASE_TAG) { throw 'Release tag name mismatch.' }

            $latestTag = (gh api "repos/$env:GITHUB_REPOSITORY/releases/latest" --jq '.tag_name').Trim()
            if ($LASTEXITCODE -ne 0) { throw 'Could not read latest public release.' }
            if ($latestTag -ne $env:RELEASE_TAG) {
              throw "Latest public release is '$latestTag', expected '$env:RELEASE_TAG'."
            }

            # Avoid the PowerShell env-var/refspec ambiguity that caused the first
            # release workflow to report failure after publication.
            git fetch origin --tags --force
            if ($LASTEXITCODE -ne 0) { throw 'Could not fetch repository tags.' }
            $tagCommit = (git rev-list -n 1 $env:RELEASE_TAG).Trim()
            if ($tagCommit -ne $env:SOURCE_SHA) {
              throw "v1.1.4 resolves to $tagCommit instead of $env:SOURCE_SHA."
            }

            New-Item -ItemType Directory -Path artifacts/public -Force | Out-Null
            gh release download $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --dir artifacts/public --clobber
            if ($LASTEXITCODE -ne 0) { throw 'Could not download public release assets.' }

            $zipName = "Junhyun-Helper-v$env:RELEASE_VERSION-win-x64.zip"
            $zip = Join-Path artifacts/public $zipName
            $sum = Join-Path artifacts/public 'SHA256SUMS.txt'
            if (-not (Test-Path $zip) -or -not (Test-Path $sum)) { throw 'Public release assets are incomplete.' }

            $checksumLine = Get-Content $sum | Where-Object { $_ -match [Regex]::Escape($zipName) } | Select-Object -First 1
            if ($checksumLine -notmatch '^([0-9a-fA-F]{64})\s{2,}(.+)$') { throw 'SHA256SUMS entry is invalid.' }
            $declaredHash = $Matches[1].ToLowerInvariant()
            $actualHash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actualHash -ne $declaredHash) { throw 'Public ZIP SHA-256 mismatch.' }

            Expand-Archive $zip artifacts/public-extracted -Force
            $rootNames = @(Get-ChildItem artifacts/public-extracted | Select-Object -ExpandProperty Name | Sort-Object)
            $expectedRootNames = @('Assets','FIRST_RUN_KO.txt','준현 헬퍼.exe') | Sort-Object
            if (Compare-Object $rootNames $expectedRootNames) { throw 'Public ZIP root layout mismatch.' }

            $exe = (Resolve-Path 'artifacts/public-extracted/준현 헬퍼.exe').Path
            $productVersion = (Get-Item $exe).VersionInfo.ProductVersion
            $expectedProductVersion = "$env:RELEASE_VERSION+$env:SOURCE_SHA"
            if ($productVersion -ne $expectedProductVersion) { throw "ProductVersion mismatch: $productVersion" }

            $firstLine = Get-Content 'artifacts/public-extracted/FIRST_RUN_KO.txt' -TotalCount 1
            $expectedFirstLine = "준현 헬퍼 v$env:RELEASE_VERSION — Windows x64"
            if (-not [string]::Equals($firstLine, $expectedFirstLine, [System.StringComparison]::Ordinal)) {
              throw "FIRST_RUN_KO mismatch: $firstLine"
            }

            $diagnostic = Join-Path $env:TEMP 'junhyun-map-smoke-error.txt'
            $success = Join-Path $env:TEMP 'junhyun-map-smoke-success.txt'
            Remove-Item $diagnostic,$success -Force -ErrorAction SilentlyContinue
            $process = Start-Process -FilePath $exe -WorkingDirectory artifacts/public-extracted -PassThru
            try {
              $deadline = (Get-Date).AddSeconds(75)
              while ((Get-Date) -lt $deadline) {
                $process.Refresh()
                if (Test-Path $diagnostic) {
                  Get-Content $diagnostic | ForEach-Object { Write-Host $_ }
                  throw 'Public-downloaded EXE reported a smoke failure.'
                }
                if (Test-Path $success) { break }
                if ($process.HasExited) { throw "Public EXE exited early: $($process.ExitCode)" }
                Start-Sleep -Milliseconds 250
              }
              if (-not (Test-Path $success)) { throw 'Public-downloaded EXE smoke did not complete.' }

              $closeRequested = $false
              for ($attempt = 1; $attempt -le 10; $attempt++) {
                $process.Refresh()
                if ($process.HasExited -or $process.CloseMainWindow()) { $closeRequested = $true; break }
                Start-Sleep -Milliseconds 500
              }
              if (-not $closeRequested) { throw 'Could not request normal MainWindow close.' }
              $process.Refresh()
              if (-not $process.HasExited -and -not $process.WaitForExit(7000)) { throw 'Public EXE did not exit normally.' }
              if (Test-Path 'artifacts/public-extracted/Logs') { throw 'Public package root was polluted by runtime logs.' }
            }
            finally {
              $process.Refresh()
              if (-not $process.HasExited) { Stop-Process -Id $process.Id -Force }
            }

            $result.conclusion = 'success'
            $result.public_release_url = $release.url
            $result.public_is_latest = $true
            $result.published_at = $release.publishedAt
            $result.tag_commit = $tagCommit
            $result.zip_name = $zipName
            $result.zip_bytes = (Get-Item $zip).Length
            $result.zip_sha256 = $actualHash
            $result.product_version = $productVersion
            $result.public_downloaded_exe_smoke = 'SUCCESS'
          }
          catch {
            $result.error = $_.Exception.Message
            Write-Host "Verification failure: $($_.Exception.Message)"
          }
          finally {
            $result | ConvertTo-Json -Depth 5 | Set-Content 'docs/RELEASE_1.1.4_STATUS.json' -Encoding utf8NoBOM
          }

          if ($result.conclusion -ne 'success') { exit 1 }

      - name: Commit verification result
        if: always()
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- docs/RELEASE_1.1.4_STATUS.json
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) {
            Write-Host 'Release status file already matches verification result.'
            exit 0
          }
          git commit -m 'Record public v1.1.4 verification result'
          if ($LASTEXITCODE -ne 0) { throw 'Could not commit public verification result.' }
          git push origin HEAD:main
          if ($LASTEXITCODE -ne 0) { throw 'Could not push public verification result.' }

      - name: Enforce public verification success
        if: always()
        shell: pwsh
        run: |
          if ('${{ steps.public_verify.outcome }}' -ne 'success') {
            throw 'Public v1.1.4 verification did not pass.'
          }
