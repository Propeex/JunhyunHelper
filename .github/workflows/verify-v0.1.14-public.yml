name: Verify public v0.1.14

on:
  pull_request:
    paths:
      - '.github/workflows/verify-v0.1.14-public.yml'

permissions:
  contents: read

jobs:
  verify-public-release:
    runs-on: windows-latest
    timeout-minutes: 10
    env:
      RELEASE_TAG: v0.1.14
      RELEASE_SHA: bb0611e9263c24018825a87a58aba2c5474b6cc4
      RELEASE_ASSET: Junhyun-Helper-v0.1.14-win-x64.zip

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify public release metadata and exact tag
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $meta = gh release view $env:RELEASE_TAG --repo 'Propeex/JunhyunHelper' --json isDraft,isPrerelease,targetCommitish,assets | ConvertFrom-Json
          if ($meta.isDraft) { throw 'v0.1.14 is still draft.' }
          if ($meta.isPrerelease) { throw 'v0.1.14 is prerelease.' }
          if ($meta.targetCommitish -ne $env:RELEASE_SHA) { throw "Unexpected release target: $($meta.targetCommitish)" }
          if (-not ($meta.assets | Where-Object { $_.name -eq $env:RELEASE_ASSET })) { throw 'Public ZIP asset missing.' }
          if (-not ($meta.assets | Where-Object { $_.name -eq 'SHA256SUMS.txt' })) { throw 'Public SHA256SUMS.txt missing.' }

          git fetch origin "refs/tags/$($env:RELEASE_TAG):refs/tags/$($env:RELEASE_TAG)" --force
          $tagSha = (git rev-parse "$($env:RELEASE_TAG)^{commit}").Trim()
          if ($tagSha -ne $env:RELEASE_SHA) { throw "Public tag points to $tagSha, expected $($env:RELEASE_SHA)." }
          Write-Host "PUBLIC_TAG_SHA=$tagSha"

      - name: Download and verify public release assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          Remove-Item artifacts/public -Recurse -Force -ErrorAction SilentlyContinue
          New-Item artifacts/public -ItemType Directory | Out-Null
          gh release download $env:RELEASE_TAG --repo 'Propeex/JunhyunHelper' --pattern $env:RELEASE_ASSET --pattern 'SHA256SUMS.txt' --dir artifacts/public
          if ($LASTEXITCODE -ne 0) { throw 'Failed to download public v0.1.14 assets.' }

          $zip = Join-Path artifacts/public $env:RELEASE_ASSET
          if (-not (Test-Path $zip)) { throw 'Downloaded public ZIP is missing.' }
          $size = (Get-Item $zip).Length
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()

          $sumLine = Get-Content (Join-Path artifacts/public 'SHA256SUMS.txt') | Where-Object { $_ -match [regex]::Escape($env:RELEASE_ASSET) } | Select-Object -First 1
          if (-not $sumLine) { throw 'SHA256SUMS.txt lacks exact v0.1.14 ZIP entry.' }
          $publishedHash = ($sumLine -split '\s+')[0].ToLowerInvariant()
          if ($publishedHash -ne $hash) { throw "Published checksum mismatch: sums=$publishedHash, actual=$hash" }

          Remove-Item artifacts/expanded -Recurse -Force -ErrorAction SilentlyContinue
          Expand-Archive $zip artifacts/expanded

          $rootFiles = @(Get-ChildItem artifacts/expanded -File)
          $unexpectedFiles = @($rootFiles | Where-Object { $_.Name -notin @('준현 헬퍼.exe', 'FIRST_RUN_KO.txt') })
          if ($unexpectedFiles.Count -gt 0) { throw "Unexpected public root files: $($unexpectedFiles.Name -join ', ')" }
          $rootDirs = @(Get-ChildItem artifacts/expanded -Directory)
          $unexpectedDirs = @($rootDirs | Where-Object { $_.Name -ne 'Assets' })
          if ($unexpectedDirs.Count -gt 0) { throw "Unexpected public root directories: $($unexpectedDirs.Name -join ', ')" }

          $exe = 'artifacts/expanded/준현 헬퍼.exe'
          if (-not (Test-Path $exe)) { throw 'Public 준현 헬퍼.exe missing.' }
          if (-not (Test-Path 'artifacts/expanded/FIRST_RUN_KO.txt')) { throw 'Public FIRST_RUN_KO.txt missing.' }
          if (-not (Test-Path 'artifacts/expanded/Assets/tarkov_data.db')) { throw 'Public Assets/tarkov_data.db missing.' }
          if (Get-ChildItem artifacts/expanded -Recurse -File -Filter *.pdb) { throw 'Public ZIP contains PDB.' }

          $productVersion = (Get-Item $exe).VersionInfo.ProductVersion
          if (-not $productVersion.StartsWith('0.1.14', [StringComparison]::Ordinal)) { throw "Unexpected public ProductVersion: $productVersion" }

          $guide = Get-Content 'artifacts/expanded/FIRST_RUN_KO.txt' -Raw
          if ($guide -notmatch '준현 헬퍼 v0\.1\.14') { throw 'Public FIRST_RUN does not identify v0.1.14.' }
          if ($guide -notmatch 'v0\.1\.13 → v0\.1\.14 필수 데이터 업데이트:\s*없음') { throw 'Public FIRST_RUN upgrade contract mismatch.' }
          if ($guide -notmatch '프로그램을 실행할 때 최신 정식 GitHub Release를 확인') { throw 'Public FIRST_RUN lacks program-update contract.' }
          if ($guide -notmatch "스캐너 탭은 현재 '준비 중' placeholder") { throw 'Public FIRST_RUN Scanner contract mismatch.' }

          "PUBLIC_SIZE=$size" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "PUBLIC_SHA256=$hash" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "PUBLIC_PRODUCT_VERSION=$productVersion" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Run public executable rendered UI and Map smoke
        shell: pwsh
        env:
          JUNHYUNHELPER_MAP_SMOKE: '1'
        run: |
          $exe = (Resolve-Path 'artifacts/expanded/준현 헬퍼.exe').Path
          $diagnostic = Join-Path $env:TEMP 'junhyun-map-smoke-error.txt'
          $success = Join-Path $env:TEMP 'junhyun-map-smoke-success.txt'
          Remove-Item $diagnostic -Force -ErrorAction SilentlyContinue
          Remove-Item $success -Force -ErrorAction SilentlyContinue

          $process = Start-Process -FilePath $exe -WorkingDirectory artifacts/expanded -PassThru
          try {
            $deadline = (Get-Date).AddSeconds(90)
            $smokeCompleted = $false
            while ((Get-Date) -lt $deadline) {
              $process.Refresh()
              if (Test-Path $diagnostic) {
                Get-Content $diagnostic | ForEach-Object { Write-Host $_ }
                throw 'Public executable reported a rendered UI/Map smoke failure.'
              }
              if (Test-Path $success) { $smokeCompleted = $true; break }
              if ($process.HasExited) { throw "Public executable exited before smoke completion with code $($process.ExitCode)." }
              Start-Sleep -Milliseconds 250
            }
            if (-not $smokeCompleted) { throw 'Public executable smoke timed out.' }

            $closeRequested = $false
            for ($attempt = 1; $attempt -le 10; $attempt++) {
              $process.Refresh()
              if ($process.HasExited) { $closeRequested = $true; break }
              if ($process.CloseMainWindow()) { $closeRequested = $true; break }
              Start-Sleep -Milliseconds 500
            }
            if (-not $closeRequested) { throw 'Could not request public executable Main Window close.' }
            $process.Refresh()
            if (-not $process.HasExited -and -not $process.WaitForExit(7000)) { throw 'Public executable did not exit after normal close.' }
          }
          finally {
            $process.Refresh()
            if (-not $process.HasExited) { Stop-Process -Id $process.Id -Force }
          }

          Write-Host 'PUBLIC_RELEASE_VERIFIED=true'
          Write-Host "PUBLIC_SIZE=$env:PUBLIC_SIZE"
          Write-Host "PUBLIC_SHA256=$env:PUBLIC_SHA256"
          Write-Host "PUBLIC_PRODUCT_VERSION=$env:PUBLIC_PRODUCT_VERSION"
