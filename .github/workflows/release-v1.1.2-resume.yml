name: Resume Release v1.1.2

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write

jobs:
  resume:
    if: github.head_ref == 'release/v1.1.2-resume'
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      RELEASE_VERSION: '1.1.2'
      RELEASE_TAG: 'v1.1.2'
      RELEASE_SHA: 'f19d0f6993693aba4eaa26a4bde203c5731f0aad'
      ZIP_NAME: 'Junhyun-Helper-v1.1.2-win-x64.zip'
      EXPECTED_ZIP_SHA256: '8a9613b0b2b06a731a7c6d607f0ed8c9b2991dd73a4789a1058242bb181d87f9'
      EXPECTED_ZIP_BYTES: '80238099'

    steps:
      - name: Locate and verify existing draft metadata
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $json = gh api "repos/$env:GITHUB_REPOSITORY/releases?per_page=100"
          if ($LASTEXITCODE -ne 0) { throw 'Could not enumerate releases.' }
          $releases = @($json | ConvertFrom-Json)
          $drafts = @($releases | Where-Object { $_.tag_name -eq $env:RELEASE_TAG -and $_.draft -eq $true })
          if ($drafts.Count -ne 1) { throw "Expected exactly one draft $env:RELEASE_TAG, found $($drafts.Count)." }

          $release = $drafts[0]
          $releaseId = [string]$release.id
          $target = [string]$release.target_commitish
          $tag = [string]$release.tag_name
          if ($tag -ne $env:RELEASE_TAG) { throw "Draft tag mismatch: $tag" }
          if ($target -ne $env:RELEASE_SHA) { throw "Draft target mismatch: $target" }

          "RELEASE_ID=$releaseId" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "DRAFT_RELEASE_ID=$releaseId"
          Write-Host "DRAFT_TARGET=$target"

      - name: Download and verify draft assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force artifacts/draft-download | Out-Null
          gh release download $env:RELEASE_TAG `
            --repo $env:GITHUB_REPOSITORY `
            --dir artifacts/draft-download `
            --pattern $env:ZIP_NAME `
            --pattern SHA256SUMS.txt
          if ($LASTEXITCODE -ne 0) { throw 'Could not download draft assets.' }

          $zip = Join-Path artifacts/draft-download $env:ZIP_NAME
          if (-not (Test-Path $zip)) { throw 'Draft ZIP is missing.' }
          if ((Get-Item $zip).Length -ne [long]$env:EXPECTED_ZIP_BYTES) {
            throw "Draft ZIP size mismatch: $((Get-Item $zip).Length)"
          }

          $actual = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $env:EXPECTED_ZIP_SHA256) { throw "Draft ZIP hash mismatch: $actual" }

          $checksum = Get-Content artifacts/draft-download/SHA256SUMS.txt | Where-Object { $_ -match [Regex]::Escape($env:ZIP_NAME) } | Select-Object -First 1
          if (-not $checksum) { throw 'Draft checksum entry missing.' }
          $published = (($checksum -split '\s+')[0]).ToLowerInvariant()
          if ($published -ne $actual) { throw "Published checksum mismatch: $published" }

          Expand-Archive $zip artifacts/draft-extracted
          $rootFiles = @(Get-ChildItem artifacts/draft-extracted -File | Select-Object -ExpandProperty Name)
          if (@($rootFiles | Where-Object { $_ -notin @('준현 헬퍼.exe', 'FIRST_RUN_KO.txt') }).Count -gt 0) { throw 'Draft portable root contains unexpected files.' }
          $rootDirs = @(Get-ChildItem artifacts/draft-extracted -Directory | Select-Object -ExpandProperty Name)
          if ($rootDirs.Count -ne 1 -or $rootDirs[0] -ne 'Assets') { throw 'Draft portable root directory contract is invalid.' }

          $exe = 'artifacts/draft-extracted/준현 헬퍼.exe'
          $productVersion = (Get-Item $exe).VersionInfo.ProductVersion
          if ($productVersion -ne "1.1.2+$env:RELEASE_SHA") { throw "Draft ProductVersion mismatch: $productVersion" }
          $firstLine = Get-Content artifacts/draft-extracted/FIRST_RUN_KO.txt -TotalCount 1
          if ($firstLine -ne '준현 헬퍼 v1.1.2 — Windows x64') { throw "Draft FIRST_RUN mismatch: $firstLine" }

          Write-Host "DRAFT_ZIP_SHA256=$actual"
          Write-Host "DRAFT_ZIP_BYTES=$((Get-Item $zip).Length)"
          Write-Host "DRAFT_PRODUCT_VERSION=$productVersion"

      - name: Smoke draft-downloaded executable
        shell: pwsh
        env:
          JUNHYUNHELPER_MAP_SMOKE: '1'
        run: |
          $workDir = (Resolve-Path artifacts/draft-extracted).Path
          $exe = Join-Path $workDir '준현 헬퍼.exe'
          $diagnostic = Join-Path $env:TEMP 'junhyun-map-smoke-error.txt'
          $success = Join-Path $env:TEMP 'junhyun-map-smoke-success.txt'
          Remove-Item $diagnostic,$success -Force -ErrorAction SilentlyContinue
          $p = Start-Process -FilePath $exe -WorkingDirectory $workDir -PassThru
          try {
            $deadline = (Get-Date).AddSeconds(75); $done = $false
            while ((Get-Date) -lt $deadline) {
              $p.Refresh()
              if (Test-Path $diagnostic) { Get-Content $diagnostic | ForEach-Object { Write-Host $_ }; throw 'Draft smoke failed.' }
              if (Test-Path $success) { $done = $true; break }
              if ($p.HasExited) { throw "Draft app exited early: $($p.ExitCode)" }
              Start-Sleep -Milliseconds 250
            }
            if (-not $done) { throw 'Draft smoke timed out.' }
            $requested = $false
            for ($i=0; $i -lt 10; $i++) { $p.Refresh(); if ($p.HasExited) { $requested=$true; break }; if ($p.CloseMainWindow()) { $requested=$true; break }; Start-Sleep -Milliseconds 500 }
            if (-not $requested) { throw 'Could not close draft app normally.' }
            $p.Refresh(); if (-not $p.HasExited -and -not $p.WaitForExit(7000)) { throw 'Draft app remained alive.' }
          }
          finally { $p.Refresh(); if (-not $p.HasExited) { Stop-Process -Id $p.Id -Force } }
          Write-Host 'Draft-downloaded v1.1.2 EXE smoke passed.'

      - name: Publish verified release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release edit $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --draft=false --latest
          if ($LASTEXITCODE -ne 0) { throw 'Could not publish verified v1.1.2 release.' }

          $latestJson = gh api "repos/$env:GITHUB_REPOSITORY/releases/latest"
          if ($LASTEXITCODE -ne 0) { throw 'Could not read latest release.' }
          $latest = [string](($latestJson | ConvertFrom-Json).tag_name)
          if ($latest -ne $env:RELEASE_TAG) { throw "Latest release mismatch: $latest" }

          git init artifacts/tag-check | Out-Null
          Push-Location artifacts/tag-check
          git remote add origin "https://github.com/$env:GITHUB_REPOSITORY.git"
          $refspec = '+refs/tags/' + $env:RELEASE_TAG + ':refs/tags/' + $env:RELEASE_TAG
          git fetch --depth=1 origin $refspec
          if ($LASTEXITCODE -ne 0) { throw 'Could not fetch public release tag.' }
          $tagSha = (git rev-list -n 1 $env:RELEASE_TAG).Trim()
          Pop-Location
          if ($tagSha -ne $env:RELEASE_SHA) { throw "Public tag target mismatch: $tagSha" }
          Write-Host "PUBLIC_TAG_TARGET=$tagSha"

      - name: Download and verify public assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force artifacts/public-download | Out-Null
          gh release download $env:RELEASE_TAG `
            --repo $env:GITHUB_REPOSITORY `
            --dir artifacts/public-download `
            --pattern $env:ZIP_NAME `
            --pattern SHA256SUMS.txt
          if ($LASTEXITCODE -ne 0) { throw 'Could not download public assets.' }

          $zip = Join-Path artifacts/public-download $env:ZIP_NAME
          if ((Get-Item $zip).Length -ne [long]$env:EXPECTED_ZIP_BYTES) { throw "Public ZIP size mismatch: $((Get-Item $zip).Length)" }
          $actual = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $env:EXPECTED_ZIP_SHA256) { throw "Public ZIP hash mismatch: $actual" }
          $checksum = Get-Content artifacts/public-download/SHA256SUMS.txt | Where-Object { $_ -match [Regex]::Escape($env:ZIP_NAME) } | Select-Object -First 1
          if (-not $checksum) { throw 'Public checksum entry missing.' }
          $published = (($checksum -split '\s+')[0]).ToLowerInvariant()
          if ($published -ne $actual) { throw 'Public published checksum mismatch.' }

          Expand-Archive $zip artifacts/public-extracted
          $productVersion = (Get-Item 'artifacts/public-extracted/준현 헬퍼.exe').VersionInfo.ProductVersion
          if ($productVersion -ne "1.1.2+$env:RELEASE_SHA") { throw "Public ProductVersion mismatch: $productVersion" }
          $firstLine = Get-Content artifacts/public-extracted/FIRST_RUN_KO.txt -TotalCount 1
          if ($firstLine -ne '준현 헬퍼 v1.1.2 — Windows x64') { throw "Public FIRST_RUN mismatch: $firstLine" }

          Write-Host "PUBLIC_ZIP_SHA256=$actual"
          Write-Host "PUBLIC_ZIP_BYTES=$((Get-Item $zip).Length)"
          Write-Host "PUBLIC_PRODUCT_VERSION=$productVersion"

      - name: Smoke public-downloaded executable
        shell: pwsh
        env:
          JUNHYUNHELPER_MAP_SMOKE: '1'
        run: |
          $workDir = (Resolve-Path artifacts/public-extracted).Path
          $exe = Join-Path $workDir '준현 헬퍼.exe'
          $diagnostic = Join-Path $env:TEMP 'junhyun-map-smoke-error.txt'
          $success = Join-Path $env:TEMP 'junhyun-map-smoke-success.txt'
          Remove-Item $diagnostic,$success -Force -ErrorAction SilentlyContinue
          $p = Start-Process -FilePath $exe -WorkingDirectory $workDir -PassThru
          try {
            $deadline = (Get-Date).AddSeconds(75); $done = $false
            while ((Get-Date) -lt $deadline) {
              $p.Refresh()
              if (Test-Path $diagnostic) { Get-Content $diagnostic | ForEach-Object { Write-Host $_ }; throw 'Public smoke failed.' }
              if (Test-Path $success) { $done = $true; break }
              if ($p.HasExited) { throw "Public app exited early: $($p.ExitCode)" }
              Start-Sleep -Milliseconds 250
            }
            if (-not $done) { throw 'Public smoke timed out.' }
            $requested = $false
            for ($i=0; $i -lt 10; $i++) { $p.Refresh(); if ($p.HasExited) { $requested=$true; break }; if ($p.CloseMainWindow()) { $requested=$true; break }; Start-Sleep -Milliseconds 500 }
            if (-not $requested) { throw 'Could not close public app normally.' }
            $p.Refresh(); if (-not $p.HasExited -and -not $p.WaitForExit(7000)) { throw 'Public app remained alive.' }
          }
          finally { $p.Refresh(); if (-not $p.HasExited) { Stop-Process -Id $p.Id -Force } }
          Write-Host 'Public-downloaded v1.1.2 EXE smoke passed.'

      - name: Record result on trigger PR
        if: always()
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if (-not [string]::IsNullOrWhiteSpace($env:PR_NUMBER)) {
            gh pr comment $env:PR_NUMBER --repo $env:GITHUB_REPOSITORY --body "v1.1.2 draft recovery run: $env:GITHUB_RUN_ID · source: $env:RELEASE_SHA · expected ZIP: $env:EXPECTED_ZIP_SHA256"
          }
