name: Global variable audit v2

on:
  push:
    branches: [agent/global-variable-audit-v2-2026-08-17]
    paths:
      - '.github/workflows/global-variable-audit-v2.yml'

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Verify trader-owned seed batches
        shell: python
        run: |
          import json, urllib.request
          url='https://json.tarkov.dev/regular/tasks'
          req=urllib.request.Request(url,headers={'User-Agent':'JunhyunHelper/0.1.9 (+https://github.com/Propeex/JunhyunHelper)','Accept':'application/json'})
          with urllib.request.urlopen(req, timeout=60) as r: doc=json.load(r)
          data=doc.get('data',doc) if isinstance(doc,dict) else doc
          tasks=data.get('tasks',data) if isinstance(data,dict) else data
          if isinstance(tasks,dict): tasks=list(tasks.values())
          def rid(v):
              if isinstance(v,str): return v
              if isinstance(v,dict): return v.get('id') or v.get('_id')
          traders={
            'Prapor':'54cb50c76803fa8b248b4571','Therapist':'54cb57776803fa99248b456e',
            'Skier':'58330581ace78e27b8b10cee','Peacekeeper':'5935c25fb3acc3127c3d8cd9',
            'Mechanic':'5a7c2eca46aef81a7ca2145d','Ragman':'5ac3b934156ae10c4430e83c',
            'Jaeger':'5c0647fdd443bc2504c2d371'}
          for name,tid in traders.items():
              print('\nTRADER',name,tid)
              for ll in (2,3,4):
                  matches=[]
                  for t in tasks:
                      if rid(t.get('trader'))!=tid: continue
                      if any(r.get('type')=='globalVariable' for r in (t.get('otherRequirements') or [])): continue
                      ok=False
                      for r in (t.get('traderRequirements') or []):
                          if str(r.get('requirementType','')).lower()!='level': continue
                          rtid=rid(r.get('trader')) or tid
                          if rtid==tid and int(r.get('value',0))==ll: ok=True
                      if ok: matches.append((t.get('id'),len(t.get('taskRequirements') or [])))
                  print(' OWN_SEED_LL',ll,'count',len(matches),'ids',','.join(x[0] for x in matches),'taskReqCounts',','.join(str(x[1]) for x in matches))
