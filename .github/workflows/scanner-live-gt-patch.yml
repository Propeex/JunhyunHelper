name: Apply Scanner Live Ground Truth Fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/scanner-live-gt-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: scanner-live-header-ground-truth-fix
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Sync main and apply evidence-backed Scanner fix
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git merge origin/main --no-edit

          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one patch anchor, found {count}')
              p.write_text(text.replace(old, new), encoding='utf-8', newline='\n')

          # Keep the proven v1.4.0 lock first; only invoke the live Ground Truth fallback
          # when the primary path fails closed.
          replace_once(
              'src/JunhyunHelper.Desktop/Scanner/ScannerTitleAnchorRefiner.cs',
              '''        // The runtime's existing trusted-anchor floor is 0.48. Every partial/failed
                  // frame lock is deliberately kept below it so OCR cannot run merely because
                  // some subset of close/icon/field evidence happened to score well.
                  return string.Equals(result.Reason, "HEADER_FRAME_LOCKED", StringComparison.Ordinal)
                      ? result
                      : result with { Score = Math.Min(result.Score, 0.47) };
          ''',
              '''        if (string.Equals(result.Reason, "HEADER_FRAME_LOCKED", StringComparison.Ordinal))
                      return result;

                  var recovered = ScannerLiveHeaderGroundTruthRefiner.TryRefine(
                      bgra,
                      width,
                      height,
                      stride,
                      candidate);
                  if (recovered is { } liveGroundTruthLock)
                      return liveGroundTruthLock;

                  // Every partial/failed lock remains below the trusted-anchor floor so OCR
                  // still fails closed when neither the original nor evidence-backed path locks.
                  return result with { Score = Math.Min(result.Score, 0.47) };
          ''')

          # Preserve overlapping candidates when they originate from materially different
          # red close controls. The first reviewed live case lost its correct IoU~0.995 panel
          # before header validation because the old dedupe used window IoU alone.
          replace_once(
              'src/JunhyunHelper.Core/Scanner/ScannerDetailGeometryDetector.cs',
              '''            if (result.Any(existing => IntersectionOverUnion(existing.Window, candidate.Window) >= 0.72))
                          continue;
          ''',
              '''            if (result.Any(existing => AreDuplicateCandidates(existing, candidate)))
                          continue;
          ''')
          replace_once(
              'src/JunhyunHelper.Core/Scanner/ScannerDetailGeometryDetector.cs',
              '    private static double IntersectionOverUnion(ScannerDetectedRegion a, ScannerDetectedRegion b)\n',
              '''    private static bool AreDuplicateCandidates(
                  ScannerDetectedCandidate left,
                  ScannerDetectedCandidate right)
              {
                  if (IntersectionOverUnion(left.Window, right.Window) < 0.72)
                      return false;

                  if (left.CloseButton.Width > 0 && left.CloseButton.Height > 0 &&
                      right.CloseButton.Width > 0 && right.CloseButton.Height > 0)
                  {
                      var leftCenterX = left.CloseButton.X + left.CloseButton.Width / 2.0;
                      var leftCenterY = left.CloseButton.Y + left.CloseButton.Height / 2.0;
                      var rightCenterX = right.CloseButton.X + right.CloseButton.Width / 2.0;
                      var rightCenterY = right.CloseButton.Y + right.CloseButton.Height / 2.0;
                      var dx = leftCenterX - rightCenterX;
                      var dy = leftCenterY - rightCenterY;
                      var sameCloseTolerance = Math.Max(
                          6.0,
                          Math.Min(left.CloseButton.Height, right.CloseButton.Height) * 0.75);
                      if (Math.Sqrt(dx * dx + dy * dy) > sameCloseTolerance)
                          return false;
                  }

                  return true;
              }

              private static double IntersectionOverUnion(ScannerDetectedRegion a, ScannerDetectedRegion b)
          ''')

          # One-shot precision scans are allowed to inspect all 12 detector candidates.
          # Continuous scanning retains the existing 8-candidate CPU budget.
          replace_once(
              'src/JunhyunHelper.Desktop/Scanner/ScannerRuntimeService.cs',
              '''    private const int CandidateLimit = 8;
                  private const int DeepOcrCandidateLimit = 3;
          ''',
              '''    private const int CandidateLimit = 8;
                  private const int OneShotCandidateLimit = 12;
                  private const int DeepOcrCandidateLimit = 3;
          ''')
          replace_once(
              'src/JunhyunHelper.Desktop/Scanner/ScannerRuntimeService.OneShot.cs',
              '        var limit = Math.Min(CandidateLimit, candidates.Count);',
              '        var limit = Math.Min(OneShotCandidateLimit, candidates.Count);')

          # Header-lock failures must not be mislabeled as OCR/preprocessing failures.
          replace_once(
              'src/JunhyunHelper.Desktop/Scanner/ScannerDiagnosticDataset.cs',
              '''        if (string.Equals(frame.RecognitionReason, "TITLE_ANCHOR_NOT_LOCKED", StringComparison.Ordinal))
                      return "DETAIL_HEADER_LOCK_FAILED";
          ''',
              '''        if (string.Equals(frame.RecognitionReason, "TITLE_ANCHOR_NOT_LOCKED", StringComparison.Ordinal) ||
                      string.Equals(frame.RecognitionReason, "TITLE_ANCHOR_INCOMPLETE", StringComparison.Ordinal))
                  {
                      return "DETAIL_HEADER_LOCK_FAILED";
                  }
          ''')

          # Product smoke regression: emulate the measured 1920x1080 header traits and a
          # coarse candidate whose top is displaced downward, forcing the fallback path.
          smoke = 'src/JunhyunHelper.Desktop/Scanner/ScannerInspectHeaderLockSmoke.cs'
          replace_once(
              smoke,
              '        VerifyMissingMagnifierFailsClosed();',
              '''        VerifyLiveGroundTruthFallback();
                  VerifyMissingMagnifierFailsClosed();''')
          replace_once(
              smoke,
              '    private static void VerifyMissingMagnifierFailsClosed()\n',
              '''    private static void VerifyLiveGroundTruthFallback()
              {
                  const int width = 1920;
                  const int height = 1080;
                  const int stride = width * 4;
                  var pixels = NewFrame(width, height, stride);

                  const int headerLeft = 560;
                  const int headerTop = 255;
                  const int headerWidth = 800;
                  const int closeWidth = 25;
                  const int closeHeight = 16;
                  var headerRight = headerLeft + headerWidth - 1;
                  var closeX = headerRight - closeWidth - 4;
                  var closeY = headerTop + 5;
                  var magnifierX = headerLeft + 11;
                  var magnifierY = headerTop + 7;
                  var titleX = magnifierX + 13 + 6;

                  Fill(pixels, stride, headerLeft, headerTop, headerWidth, 1, 38, 38, 38);
                  Fill(pixels, stride, headerLeft, headerTop + 1, headerWidth, 24, 30, 30, 30);
                  Fill(pixels, stride, closeX, closeY, closeWidth, closeHeight, 12, 12, 65);
                  const byte closeStroke = 158;
                  for (var step = 4; step < Math.Min(closeWidth - 4, closeHeight - 2); step++)
                  {
                      SetPixel(pixels, stride, closeX + step, closeY + step - 2, closeStroke, closeStroke, closeStroke);
                      SetPixel(pixels, stride, closeX + closeWidth - 1 - step, closeY + step - 2, closeStroke, closeStroke, closeStroke);
                  }

                  const byte icon = 176;
                  const int iconSize = 13;
                  const double centerX = 7.1;
                  const double centerY = 4.1;
                  for (var yy = 0; yy < iconSize; yy++)
                  for (var xx = 0; xx < iconSize; xx++)
                  {
                      var dx = xx - centerX;
                      var dy = yy - centerY;
                      var distance = Math.Sqrt(dx * dx + dy * dy);
                      if (distance is >= 3.6 and <= 5.1)
                          SetPixel(pixels, stride, magnifierX + xx, magnifierY + yy, icon, icon, icon);
                  }
                  for (var step = 0; step < 6; step++)
                  {
                      var px = 5 - step;
                      var py = 7 + step;
                      SetPixel(pixels, stride, magnifierX + px, magnifierY + py, icon, icon, icon);
                      if (px + 1 < iconSize)
                          SetPixel(pixels, stride, magnifierX + px + 1, magnifierY + py, icon, icon, icon);
                  }
                  DrawTitleGlyphs(pixels, stride, titleX, headerTop + 5, 12, fragmentedFirst: true);

                  // Deliberately start the coarse panel 80 px below the true header. The
                  // v1.4.0 primary close search cannot see this header; the fallback must.
                  var panel = new ScannerDetectedRegion(headerLeft, headerTop + 80, headerWidth, 450, 0.91);
                  var candidate = new ScannerDetectedCandidate(
                      panel,
                      ScannerDetailGeometryDetector.GetTitleRegion(panel),
                      default,
                      "RECTANGLE_CANDIDATE");
                  var result = ScannerTitleAnchorRefiner.Refine(
                      pixels,
                      width,
                      height,
                      stride,
                      candidate);

                  if (result.Reason != "HEADER_FRAME_LOCKED" ||
                      result.Score < 0.68 ||
                      Math.Abs(result.CloseButton.X - closeX) > 4 ||
                      Math.Abs(result.CloseButton.Y - closeY) > 4 ||
                      result.CloseButton.Y >= panel.Y - 40 ||
                      result.Magnifier.Width is < 9 or > 18 ||
                      result.Title.X <= result.Magnifier.X + result.Magnifier.Width)
                  {
                      throw new InvalidOperationException(
                          $"Scanner live Ground Truth fallback regression failed: panel={panel}, " +
                          $"magnifier={result.Magnifier}, title={result.Title}, close={result.CloseButton}, " +
                          $"score={result.Score:F3}, reason={result.Reason}.");
                  }
              }

              private static void VerifyMissingMagnifierFailsClosed()
          ''')
          PY

          git diff --check
          test -n "$(git status --porcelain)"
          git rm .github/workflows/scanner-live-gt-patch.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/JunhyunHelper.Core/Scanner/ScannerDetailGeometryDetector.cs \
                  src/JunhyunHelper.Desktop/Scanner/ScannerTitleAnchorRefiner.cs \
                  src/JunhyunHelper.Desktop/Scanner/ScannerRuntimeService.cs \
                  src/JunhyunHelper.Desktop/Scanner/ScannerRuntimeService.OneShot.cs \
                  src/JunhyunHelper.Desktop/Scanner/ScannerDiagnosticDataset.cs \
                  src/JunhyunHelper.Desktop/Scanner/ScannerInspectHeaderLockSmoke.cs \
                  src/JunhyunHelper.Desktop/Scanner/ScannerLiveHeaderGroundTruthRefiner.cs
          git commit -m 'fix: recover live Tarkov inspect headers from Ground Truth'
          git push origin HEAD:scanner-live-header-ground-truth-fix
