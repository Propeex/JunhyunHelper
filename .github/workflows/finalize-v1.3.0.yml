name: Finalize v1.3.0
# Independent public-release verifier. Remove after status evidence is committed.

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/finalize-v1.3.0.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      SOURCE_SHA: f03441672d39165678fa53f57af46f103070d50e
      RELEASE_VERSION: 1.3.0
      RELEASE_TAG: v1.3.0
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      JUNHYUNHELPER_MAP_SMOKE: '1'

    steps:
      - name: Checkout main for status commit
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Wait for public release and verify release identity
        shell: pwsh
        run: |
          $deadline = (Get-Date).AddMinutes(20)
          $release = $null
          while ((Get-Date) -lt $deadline) {
            $json = gh api "repos/$env:GITHUB_REPOSITORY/releases/tags/$env:RELEASE_TAG" 2>$null
            if ($LASTEXITCODE -eq 0 -and -not [string]::IsNullOrWhiteSpace($json)) {
              $candidate = $json | ConvertFrom-Json
              if (-not [bool]$candidate.draft -and -not [bool]$candidate.prerelease) {
                $release = $candidate
                break
              }
            }
            Start-Sleep -Seconds 15
          }
          if ($null -eq $release) { throw 'v1.3.0 did not become a public release within the verification window.' }
          if ([string]$release.target_commitish -ne $env:SOURCE_SHA) {
            throw "Public release target '$($release.target_commitish)' is not exact source '$env:SOURCE_SHA'."
          }

          $latestTag = (gh api "repos/$env:GITHUB_REPOSITORY/releases/latest" --jq '.tag_name').Trim()
          if ($latestTag -ne $env:RELEASE_TAG) { throw "Latest public release is '$latestTag'." }

          $ref = gh api "repos/$env:GITHUB_REPOSITORY/git/ref/tags/$env:RELEASE_TAG" | ConvertFrom-Json
          $tagSha = [string]$ref.object.sha
          if ([string]$ref.object.type -eq 'tag') {
            $tagObject = gh api "repos/$env:GITHUB_REPOSITORY/git/tags/$tagSha" | ConvertFrom-Json
            $tagSha = [string]$tagObject.object.sha
          }
          if ($tagSha -ne $env:SOURCE_SHA) { throw "Public tag points to '$tagSha'." }
          "RELEASE_ID=$($release.id)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "TAG_SHA=$tagSha" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Download and verify public assets
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path artifacts/public-download -Force | Out-Null
          gh release download $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --dir artifacts/public-download --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Public release download failed.' }

          $zipName = "Junhyun-Helper-v$env:RELEASE_VERSION-win-x64.zip"
          $zip = Join-Path artifacts/public-download $zipName
          $sum = Join-Path artifacts/public-download 'SHA256SUMS.txt'
          if (-not (Test-Path $zip) -or -not (Test-Path $sum)) { throw 'Required public assets are missing.' }

          $bytes = [string](Get-Item $zip).Length
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          $expectedLine = Get-Content $sum | Where-Object { $_ -match [Regex]::Escape($zipName) } | Select-Object -First 1
          if ($expectedLine -notmatch '^([0-9a-fA-F]{64})\s{2,}(.+)$') { throw 'Public checksum format invalid.' }
          if ($Matches[1].ToLowerInvariant() -ne $hash) { throw 'Public ZIP does not match SHA256SUMS.txt.' }

          Expand-Archive $zip artifacts/public-extracted -Force
          $rootNames = @(Get-ChildItem artifacts/public-extracted | Select-Object -ExpandProperty Name | Sort-Object)
          $expectedNames = @('Assets','FIRST_RUN_KO.txt','준현 헬퍼.exe') | Sort-Object
          if (Compare-Object $rootNames $expectedNames) { throw 'Public root layout mismatch.' }
          if (@(Get-ChildItem artifacts/public-extracted -Recurse -File -Filter *.pdb).Count -gt 0) { throw 'Public package contains PDB files.' }
          if (@(Get-ChildItem artifacts/public-extracted -Recurse -File | Where-Object { $_.Extension -in @('.zip','.7z','.rar') }).Count -gt 0) { throw 'Public package contains a nested archive.' }

          $exe = (Resolve-Path 'artifacts/public-extracted/준현 헬퍼.exe').Path
          $productVersion = (Get-Item $exe).VersionInfo.ProductVersion
          $expectedProductVersion = "$env:RELEASE_VERSION+$env:SOURCE_SHA"
          if ($productVersion -ne $expectedProductVersion) { throw "Public ProductVersion mismatch: '$productVersion'." }
          $firstLine = Get-Content 'artifacts/public-extracted/FIRST_RUN_KO.txt' -TotalCount 1
          if ($firstLine -ne "준현 헬퍼 v$env:RELEASE_VERSION — Windows x64") { throw 'Public FIRST_RUN identity mismatch.' }

          "ZIP_BYTES=$bytes" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "ZIP_SHA256=$hash" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "PRODUCT_VERSION=$productVersion" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "PUBLIC_ZIP_BYTES=$bytes"
          Write-Host "PUBLIC_ZIP_SHA256=$hash"
          Write-Host "PUBLIC_PRODUCT_VERSION=$productVersion"

      - name: Smoke public-downloaded EXE
        shell: pwsh
        run: |
          $exe = (Resolve-Path 'artifacts/public-extracted/준현 헬퍼.exe').Path
          $diagnostic = Join-Path $env:TEMP 'junhyun-map-smoke-error.txt'
          $success = Join-Path $env:TEMP 'junhyun-map-smoke-success.txt'
          $startupLog = Join-Path $env:LOCALAPPDATA 'JunhyunHelper/logs/startup.log'
          Remove-Item $diagnostic,$success,$startupLog -Force -ErrorAction SilentlyContinue
          $process = Start-Process -FilePath $exe -WorkingDirectory artifacts/public-extracted -PassThru
          try {
            $deadline = (Get-Date).AddSeconds(75)
            while ((Get-Date) -lt $deadline) {
              $process.Refresh()
              if (Test-Path $diagnostic) { Get-Content $diagnostic | ForEach-Object { Write-Host $_ }; throw 'Public EXE product smoke failed.' }
              if (Test-Path $startupLog) { Get-Content $startupLog | ForEach-Object { Write-Host $_ }; throw 'Public EXE startup failed.' }
              if (Test-Path $success) { break }
              if ($process.HasExited) { throw "Public EXE exited early: $($process.ExitCode)" }
              Start-Sleep -Milliseconds 250
            }
            if (-not (Test-Path $success)) { throw 'Public EXE product smoke did not complete.' }
            $closed = $false
            for ($attempt = 1; $attempt -le 10; $attempt++) {
              $process.Refresh()
              if ($process.HasExited) { $closed = $true; break }
              if ($process.CloseMainWindow()) { $closed = $true; break }
              Start-Sleep -Milliseconds 500
            }
            if (-not $closed) { throw 'Public EXE normal close could not be requested.' }
            $process.Refresh()
            if (-not $process.HasExited -and -not $process.WaitForExit(7000)) { throw 'Public EXE did not exit normally.' }
            if (Test-Path 'artifacts/public-extracted/Logs') { throw 'Public extracted root was polluted by Logs.' }
          }
          finally {
            $process.Refresh()
            if (-not $process.HasExited) { Stop-Process -Id $process.Id -Force }
          }

      - name: Commit public verification status
        shell: pwsh
        run: |
          git fetch origin main
          git checkout -B main origin/main
          New-Item -ItemType Directory -Path docs -Force | Out-Null
          $status = [ordered]@{
            version = "v$env:RELEASE_VERSION"
            status = 'PUBLIC_RELEASE_VERIFIED'
            releaseSource = $env:SOURCE_SHA
            releaseId = [long]$env:RELEASE_ID
            tagSha = $env:TAG_SHA
            asset = "Junhyun-Helper-v$env:RELEASE_VERSION-win-x64.zip"
            bytes = [long]$env:ZIP_BYTES
            sha256 = $env:ZIP_SHA256
            productVersion = $env:PRODUCT_VERSION
            latest = $true
            publicDownloadedExeSmoke = 'SUCCESS'
            verifiedAtUtc = [DateTimeOffset]::UtcNow.ToString('O')
          }
          $status | ConvertTo-Json | Set-Content 'docs/.release-v1.3.0-status.json' -Encoding utf8NoBOM

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/.release-v1.3.0-status.json
          if (git diff --cached --quiet) { throw 'Release status evidence produced no repository change.' }
          git commit -m 'docs: record v1.3.0 public verification'
          git push origin HEAD:main
