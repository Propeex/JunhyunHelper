name: Prepare v1.3.5 exact source

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/prepare-v1.3.5.yml'

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Fix release identity and remove one-shot preparer
        shell: python
        run: |
          from pathlib import Path

          project = Path('src/JunhyunHelper.Desktop/JunhyunHelper.Desktop.csproj')
          text = project.read_text(encoding='utf-8')
          old = '<Version>1.3.4</Version>'
          if old not in text:
              raise SystemExit('Expected v1.3.4 project version not found')
          project.write_text(text.replace(old, '<Version>1.3.5</Version>', 1), encoding='utf-8')

          first = Path('packaging/FIRST_RUN_KO.txt')
          text = first.read_text(encoding='utf-8')
          old_header = '준현 헬퍼 v1.3.4 — Windows x64'
          if not text.startswith(old_header):
              raise SystemExit('Expected v1.3.4 FIRST_RUN identity not found')
          text = '준현 헬퍼 v1.3.5 — Windows x64' + text[len(old_header):]
          marker = '\nv1.3.4 주요 변경 — Scanner 실전 인식 결합 하드닝\n'
          section = '''
v1.3.5 주요 변경 — Scanner 상세창 추적 회귀 수정
- v1.3.4에서 strict HEADER_FRAME_LOCKED 실패 후보를 detector 단계에서 완전히 버리면서 실제 상세창 구조를 찾고도 추적·로그·진단 이미지가 끊기는 회귀를 수정했습니다.
- 구조 상세창 후보는 header lock 실패 시에도 diagnostic-only 후보로 유지하여 구조 점수, anchor 점수/이유, 가능한 부분 좌표를 로그와 인식 이미지에서 확인할 수 있습니다.
- diagnostic-only 후보의 TitleImage는 null로 유지하므로 OCR과 Item ID 확정에는 절대 사용되지 않습니다.
- fully locked 후보는 diagnostic-only 후보보다 항상 우선하며, OCR identity gate는 HEADER_FRAME_LOCKED + anchor score 0.68 이상으로 detector/runtime 모두 동일하게 고정했습니다.
- continuous Scanner에서 anchor-rejected 로그에 구조/anchor evidence와 돋보기/X 존재 여부를 기록합니다.
- 1회 스캔에서 구조 후보가 아예 0개인 경우에도 one-shot-no-structural-candidate 로그를 남깁니다.
- 기존 confidence, top1/top2 margin, 현재 공식 한국어 아이템 카탈로그 권위, 가격/필요 개수 의미, 모든 schema는 변경하지 않았습니다.

'''
          if marker not in text:
              raise SystemExit('v1.3.4 section marker not found')
          text = text.replace(marker, '\n' + section + 'v1.3.4 주요 변경 — Scanner 실전 인식 결합 하드닝\n', 1)
          first.write_text(text, encoding='utf-8')

      - name: Commit exact source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/prepare-v1.3.5.yml
          git add src/JunhyunHelper.Desktop/JunhyunHelper.Desktop.csproj packaging/FIRST_RUN_KO.txt
          git diff --cached --check
          git commit -m 'release: prepare Scanner v1.3.5 candidate'
          git push origin HEAD:main
