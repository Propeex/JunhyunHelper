name: Diagnose v1.1.3 Release

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/release-v1.1.3.diagnose'

permissions:
  actions: read
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Show v1.1.3 release state
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          echo '=== release workflow runs ==='
          gh run list \
            --repo "$GITHUB_REPOSITORY" \
            --workflow release-v1.1.3.yml \
            --limit 10 \
            --json databaseId,status,conclusion,event,createdAt,headSha,displayTitle,url

          echo '=== trigger workflow runs ==='
          gh run list \
            --repo "$GITHUB_REPOSITORY" \
            --workflow release-v1.1.3-trigger.yml \
            --limit 10 \
            --json databaseId,status,conclusion,event,createdAt,headSha,displayTitle,url

          echo '=== v1.1.3 release metadata ==='
          gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq '[.[] | select(.tag_name == "v1.1.3") | {id,tag_name,draft,prerelease,target_commitish,published_at,html_url}]'
