name: Apply Scanner v1.3.2 live-evidence patch

on:
  push:
    branches: [scanner/live-evidence-v1.3.2]
    paths:
      - '.github/workflows/scanner-v132-live-evidence-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: scanner/live-evidence-v1.3.2
          fetch-depth: 0

      - name: Patch magnifier association and smoke regression
        shell: pwsh
        run: |
          @'
          from pathlib import Path

          path = Path('src/JunhyunHelper.Desktop/Scanner/ScannerTitleAnchorRefiner.cs')
          text = path.read_text(encoding='utf-8')

          old = '''        var fieldHeight = titleField.Height > 0 ? titleField.Height : fallbackTitle.Height;
                  var left = Math.Clamp(
                      panel.X - Math.Max(8, (int)Math.Round(panel.Width * 0.04)),
                      0,
                      width - 1);
                  var topBase = titleField.Height > 0 ? titleField.Y : fallbackTitle.Y;
                  var bottomBase = titleField.Height > 0
                      ? titleField.Y + titleField.Height
                      : fallbackTitle.Y + fallbackTitle.Height;
                  var top = Math.Clamp(topBase - Math.Max(4, (int)Math.Round(fieldHeight * 0.55)), 0, height - 1);
                  var right = Math.Clamp(
                      fallbackTitle.X + Math.Max(36, (int)Math.Round(panel.Width * 0.085)),
                      left,
                      width - 1);
                  var bottom = Math.Clamp(bottomBase + Math.Max(4, (int)Math.Round(fieldHeight * 0.45)), top, height - 1);'''
          new = '''        var fieldHeight = titleField.Height > 0 ? titleField.Height : fallbackTitle.Height;
                  var left = Math.Clamp(
                      panel.X - Math.Max(8, (int)Math.Round(panel.Width * 0.04)),
                      0,
                      width - 1);

                  // Live v1.3.1 evidence shows that the actual ~21 px Tarkov magnifier can
                  // be present and segmented correctly while an imperfect title-strip band
                  // shifts the vertical association far enough to discard it. Search the
                  // union of structural panel-top, fallback title and refined title-field
                  // bands. Morphology/left-position scoring below decides identity.
                  var topBase = Math.Min(
                      Math.Min(panel.Y, fallbackTitle.Y),
                      titleField.Height > 0 ? titleField.Y : fallbackTitle.Y);
                  var bottomBase = Math.Max(
                      fallbackTitle.Y + fallbackTitle.Height,
                      titleField.Height > 0
                          ? titleField.Y + titleField.Height
                          : fallbackTitle.Y + fallbackTitle.Height);
                  bottomBase = Math.Max(
                      bottomBase,
                      panel.Y + Math.Max(18, (int)Math.Round(panel.Height * 0.065)));
                  var top = Math.Clamp(topBase - Math.Max(5, (int)Math.Round(fieldHeight * 0.40)), 0, height - 1);
                  var right = Math.Clamp(
                      fallbackTitle.X + Math.Max(36, (int)Math.Round(panel.Width * 0.085)),
                      left,
                      width - 1);
                  var bottom = Math.Clamp(bottomBase + Math.Max(4, (int)Math.Round(fieldHeight * 0.35)), top, height - 1);'''
          if old not in text:
              raise SystemExit('magnifier search-band source block not found')
          text = text.replace(old, new, 1)

          old = '''            var textFollowers = components
                          .Skip(index + 1)
                          .Where(value =>
                              value.X > component.X + component.Width &&
                              value.X - (component.X + component.Width) <= Math.Max(20, (int)Math.Round(fieldHeight * 1.4)) &&
                              IsTextLike(value, fieldHeight))
                          .Take(4)
                          .ToArray();
                      if (textFollowers.Length == 0)
                          continue;

                      var followerHeight = Median(textFollowers.Select(value => value.Height));
                      var followerWidth = Median(textFollowers.Select(value => value.Width));
                      var dominance = Math.Max(
                          component.Height / Math.Max(1.0, followerHeight),
                          component.Width / Math.Max(1.0, followerWidth));'''
          new = '''            var textFollowers = components
                          .Where(value =>
                              value.X > component.X + component.Width &&
                              value.X - (component.X + component.Width) <= Math.Max(20, (int)Math.Round(fieldHeight * 1.4)) &&
                              IsTextLike(value, fieldHeight))
                          .OrderBy(value => value.X)
                          .Take(4)
                          .ToArray();

                      var hasFollowers = textFollowers.Length > 0;
                      var followerHeight = hasFollowers
                          ? Median(textFollowers.Select(value => value.Height))
                          : 0;
                      var followerWidth = hasFollowers
                          ? Median(textFollowers.Select(value => value.Width))
                          : 0;
                      var dominance = hasFollowers
                          ? Math.Max(
                              component.Height / Math.Max(1.0, followerHeight),
                              component.Width / Math.Max(1.0, followerWidth))
                          : 0.0;'''
          if old not in text:
              raise SystemExit('magnifier follower source block not found')
          text = text.replace(old, new, 1)

          old = '''            var leftOrder = components.Count <= 1
                          ? 1.0
                          : 1.0 - Math.Min(1.0, index / (double)Math.Min(5, components.Count - 1));
                      var morphology = MagnifierMorphologyScore(bgra, stride, component);
                      var followerScore = Math.Clamp((dominance - 0.92) / 0.35, 0, 1);

                      // A real Tarkov magnifier is visibly larger than the following glyphs at
                      // the same UI scale and has ring/handle morphology. A first Korean glyph
                      // can be square and bright, but normally fails both of these safeguards.
                      if (dominance < 1.08 && morphology < 0.68)
                          continue;

                      var score =
                          leftOrder * 0.20 +
                          scale * 0.18 +
                          square * 0.10 +
                          vertical * 0.12 +
                          morphology * 0.28 +
                          followerScore * 0.12;'''
          new = '''            var expectedLeft = panel.X;
                      var leftPosition = Math.Max(
                          0,
                          1.0 - Math.Abs(component.X - expectedLeft) /
                          Math.Max(10.0, panel.Width * 0.06));
                      var morphology = MagnifierMorphologyScore(bgra, stride, component);
                      var followerScore = hasFollowers
                          ? Math.Clamp((dominance - 0.92) / 0.35, 0, 1)
                          : 0.0;

                      // Following text is corroboration, not a prerequisite. Real screenshots
                      // can segment the anti-aliased glyphs differently even when the magnifier
                      // itself is a clean ring/handle component. Without followers we require
                      // stronger magnifier morphology plus the expected left-header position.
                      if (hasFollowers)
                      {
                          if (dominance < 1.08 && morphology < 0.68)
                              continue;
                      }
                      else if (morphology < 0.70 || leftPosition < 0.55)
                      {
                          continue;
                      }

                      var score =
                          leftPosition * 0.24 +
                          scale * 0.14 +
                          square * 0.08 +
                          vertical * 0.12 +
                          morphology * 0.34 +
                          followerScore * 0.08;'''
          if old not in text:
              raise SystemExit('magnifier scoring source block not found')
          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')

          smoke = Path('src/JunhyunHelper.Desktop/Scanner/ScannerPage.MiniScannerSmoke.cs')
          s = smoke.read_text(encoding='utf-8')
          marker = '''        if (refinement.Magnifier.Width < 20 ||
                      refinement.Magnifier.X > magnifierX + 4 ||
                      refinement.CloseButton.Width <= 0 ||
                      refinement.Title.X <= magnifierRight ||
                      refinement.Title.X > firstGlyphX ||
                      titleRight < firstGlyphX + 17 ||
                      refinement.Title.Width < 120 ||
                      refinement.Score < 0.68 ||
                      refinement.Reason != "TITLE_HEADER_TEXT_REFINED")
                  {
                      throw new InvalidOperationException(
                          $"Scanner inspect-header regression failed: magnifier={refinement.Magnifier}, " +
                          $"title={refinement.Title}, close={refinement.CloseButton}, " +
                          $"score={refinement.Score:F3}, reason={refinement.Reason}.");
                  }
          '''
          replacement = marker + '''
                  // Live v1.3.1 evidence: a real anti-aliased magnifier may be isolated
                  // cleanly while nearby title glyph components are too fragmented/sparse to
                  // satisfy the old mandatory follower relation. Morphology + left-header
                  // position must still identify the icon and exclude it from title OCR.
                  var sparsePixels = (byte[])pixels.Clone();
                  Fill(sparsePixels, stride, firstGlyphX, glyphY - 3, 88, 28, 30, 30, 30);
                  DrawGlyph(sparsePixels, stride, firstGlyphX + 64, glyphY);
                  var sparseRefinement = ScannerTitleAnchorRefiner.Refine(
                      sparsePixels,
                      width,
                      height,
                      stride,
                      candidate);
                  var sparseMagnifierRight = sparseRefinement.Magnifier.X + sparseRefinement.Magnifier.Width;
                  if (sparseRefinement.Magnifier.Width < 20 ||
                      sparseRefinement.Magnifier.X > magnifierX + 4 ||
                      sparseRefinement.Title.X <= sparseMagnifierRight)
                  {
                      throw new InvalidOperationException(
                          $"Scanner sparse-glyph magnifier regression failed: magnifier={sparseRefinement.Magnifier}, " +
                          $"title={sparseRefinement.Title}, score={sparseRefinement.Score:F3}, " +
                          $"reason={sparseRefinement.Reason}.");
                  }
          '''
          if marker not in s:
              raise SystemExit('scanner smoke insertion marker not found')
          smoke.write_text(s.replace(marker, replacement, 1), encoding='utf-8')
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw 'Patch script failed.' }

      - name: Remove temporary branch workflows
        shell: pwsh
        run: |
          Remove-Item '.github/workflows/scanner-symbol-audit.yml' -Force -ErrorAction SilentlyContinue
          Remove-Item '.github/workflows/scanner-v132-live-evidence-patch.yml' -Force

      - name: Commit patched source
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          if ($LASTEXITCODE -ne 0) { throw 'git diff --check failed.' }
          git commit -m 'fix(scanner): harden live magnifier association'
          git push origin HEAD:scanner/live-evidence-v1.3.2
