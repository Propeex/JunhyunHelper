name: Prepare v0.1.7 MiniMap

on:
  push:
    branches:
      - agent/v0.1.7-minimap-floor-transform

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Strengthen MiniMap transform smoke and bump version
        shell: bash
        run: |
          echo '' | base64 -d > /tmp/prepare_v017.py
          python /tmp/prepare_v017.py
      - name: Remove one-shot workflow and commit
        shell: bash
        run: |
          rm .github/workflows/prepare-v017-minimap.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Validate exact MiniMap floor transform"
          git push
