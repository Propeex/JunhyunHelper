name: Temporary dialogue gate audit

on:
  push:
    branches:
      - fix/2026-08-17-usability-stability-pass

jobs:
  dialogue-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trace dialogue gate identifiers through live task data
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($mode in @('regular', 'pve', 'pvp-season')) {
            Write-Host "=== MODE $mode ==="
            $feed = Invoke-RestMethod -Uri "https://json.tarkov.dev/$mode/tasks"
            $english = Invoke-RestMethod -Uri "https://json.tarkov.dev/$mode/tasks_en"
            $collection = $feed.data.tasks
            $tasks = if ($collection -is [System.Array]) {
              @($collection)
            } else {
              @($collection.PSObject.Properties | ForEach-Object { $_.Value })
            }

            $gated = @()
            foreach ($task in $tasks) {
              foreach ($req in @($task.otherRequirements | Where-Object { $_.type -eq 'dialogue' })) {
                $gated += [pscustomobject]@{ task = $task; requirement = $req }
              }
            }

            foreach ($entry in $gated) {
              $task = $entry.task
              $req = $entry.requirement
              $gateId = [string]$req.id
              $nameKey = [string]$task.name
              $nameProperty = $english.data.PSObject.Properties[$nameKey]
              $name = if ($nameProperty) { $nameProperty.Value } else { $nameKey }
              Write-Host "GATE task=$($task.id) name='$name' gate=$gateId"

              $references = @()
              foreach ($candidate in $tasks) {
                $json = $candidate | ConvertTo-Json -Depth 50 -Compress
                if ($json -notmatch [regex]::Escape($gateId)) { continue }
                $candidateNameKey = [string]$candidate.name
                $candidateNameProperty = $english.data.PSObject.Properties[$candidateNameKey]
                $candidateName = if ($candidateNameProperty) { $candidateNameProperty.Value } else { $candidateNameKey }
                $references += [pscustomobject]@{
                  id = $candidate.id
                  name = $candidateName
                  isGatedQuest = ($candidate.id -eq $task.id)
                  taskRequirements = @($candidate.taskRequirements)
                  otherRequirements = @($candidate.otherRequirements)
                  startRewards = @($candidate.startRewards)
                  finishRewards = @($candidate.finishRewards)
                  failConditions = @($candidate.failConditions)
                }
              }
              Write-Host "references=$($references.Count)"
              $references | ConvertTo-Json -Depth 30 -Compress | Write-Host
            }
          }
