name: Temporary dialogue gate audit

on:
  push:
    branches:
      - fix/2026-08-17-usability-stability-pass

jobs:
  dialogue-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Audit current additional quest requirements
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($mode in @('regular', 'pve', 'pvp-season')) {
            Write-Host "=== MODE $mode ==="
            $feed = Invoke-RestMethod -Uri "https://json.tarkov.dev/$mode/tasks"
            $tasks = @($feed.data.tasks)

            $allRequirements = @($tasks | ForEach-Object { @($_.otherRequirements) })
            $types = @($allRequirements | Where-Object { $_ -ne $null } | Group-Object type | Sort-Object Name)
            Write-Host "task count=$($tasks.Count); other requirement count=$($allRequirements.Count)"
            foreach ($type in $types) {
              Write-Host "TYPE '$($type.Name)' count=$($type.Count)"
            }

            $dialogueLike = @()
            foreach ($task in $tasks) {
              $matches = @($task.otherRequirements | Where-Object {
                $_.type -match 'dialog' -or (($_ | ConvertTo-Json -Depth 10 -Compress) -match 'dialog')
              })
              if ($matches.Count -eq 0) { continue }
              $dialogueLike += [pscustomobject]@{
                id = $task.id
                name = $task.name
                trader = $task.trader
                minPlayerLevel = $task.minPlayerLevel
                taskRequirements = @($task.taskRequirements)
                traderRequirements = @($task.traderRequirements)
                matchingRequirements = $matches
                otherRequirements = @($task.otherRequirements)
              }
            }
            Write-Host "dialog-like quest count=$($dialogueLike.Count)"
            $dialogueLike | ConvertTo-Json -Depth 20 -Compress | Write-Host
          }
