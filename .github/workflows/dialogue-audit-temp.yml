name: Temporary dialogue gate audit

on:
  push:
    branches:
      - fix/2026-08-17-usability-stability-pass

jobs:
  dialogue-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Resolve audited prerequisite quest IDs
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $wanted = @(
            'Shortage',
            'Pharmacist',
            'Burning Rubber',
            'Saving the Mole',
            'Only Business',
            'Big Sale',
            'Make ULTRA Great Again',
            'Gratitude',
            'Farming - Part 2',
            'Gunsmith - MP-133',
            'Gunsmith - Part 1'
          )
          foreach ($mode in @('regular', 'pve', 'pvp-season')) {
            Write-Host "=== MODE $mode ==="
            $feed = Invoke-RestMethod -Uri "https://json.tarkov.dev/$mode/tasks"
            $english = Invoke-RestMethod -Uri "https://json.tarkov.dev/$mode/tasks_en"
            $collection = $feed.data.tasks
            $tasks = if ($collection -is [System.Array]) {
              @($collection)
            } else {
              @($collection.PSObject.Properties | ForEach-Object { $_.Value })
            }

            $resolved = @()
            foreach ($task in $tasks) {
              $nameKey = [string]$task.name
              $property = $english.data.PSObject.Properties[$nameKey]
              $name = if ($property) { [string]$property.Value } else { $nameKey }
              if ($wanted -contains $name) {
                $resolved += [pscustomobject]@{ id = $task.id; name = $name }
              }
            }
            $resolved | Sort-Object name | ConvertTo-Json -Compress | Write-Host
          }
