name: Temporary dialogue gate audit

on:
  push:
    branches:
      - fix/2026-08-17-usability-stability-pass

jobs:
  dialogue-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Audit current dialogue quest requirements
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($mode in @('regular', 'pve', 'pvp-season')) {
            Write-Host "=== MODE $mode ==="
            $feed = Invoke-RestMethod -Uri "https://json.tarkov.dev/$mode/tasks"
            $english = Invoke-RestMethod -Uri "https://json.tarkov.dev/$mode/tasks_en"
            $collection = $feed.data.tasks
            $tasks = if ($collection -is [System.Array]) {
              @($collection)
            } else {
              @($collection.PSObject.Properties | ForEach-Object { $_.Value })
            }

            $dialogueLike = @()
            foreach ($task in $tasks) {
              $matches = @($task.otherRequirements | Where-Object { $_.type -eq 'dialogue' })
              if ($matches.Count -eq 0) { continue }
              $nameKey = [string]$task.name
              $descriptionKey = [string]$task.description
              $nameProperty = $english.data.PSObject.Properties[$nameKey]
              $descriptionProperty = $english.data.PSObject.Properties[$descriptionKey]
              $dialogueLike += [pscustomobject]@{
                id = $task.id
                name = if ($nameProperty) { $nameProperty.Value } else { $nameKey }
                description = if ($descriptionProperty) { $descriptionProperty.Value } else { $descriptionKey }
                trader = $task.trader
                minPlayerLevel = $task.minPlayerLevel
                taskRequirements = @($task.taskRequirements)
                traderRequirements = @($task.traderRequirements)
                dialogueRequirements = $matches
              }
            }
            Write-Host "dialogue quest count=$($dialogueLike.Count)"
            $dialogueLike | ConvertTo-Json -Depth 20 -Compress | Write-Host
          }
